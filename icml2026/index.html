      if (topic.startsWith('LLM')) return 'llm';
      return 'robot';
    };
    const typeLabel = row => {
      if (row.presentation_type === 'position') return row.is_oral ? 'position+oral' : 'position';
      if (row.is_oral) return row.is_spotlight ? 'oral+spotlight' : 'oral';
      if (row.is_spotlight) return 'spotlight';
      return 'poster';
    };
    const allRows = data.sessions.flatMap(s => s.rows).concat(data.noTime || []);
    const topics = ['All topics', ...Array.from(new Set(allRows.map(r => r.primary_topic))).sort()];
    const types = ['All types', ...Array.from(new Set(allRows.map(typeLabel))).sort()];
    topicFilter.innerHTML = topics.map(t => `<option value="${t}">${t}</option>`).join('');
    typeFilter.innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join('');

    sessionNav.innerHTML = data.sessions.map((s, i) => `<button data-target="session-${i}">${s.label} · ${s.count}</button>`).join('');
    sessionNav.addEventListener('click', event => {
      const button = event.target.closest('button[data-target]');
      if (!button) return;
      document.getElementById(button.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    const rowMatches = row => {
      const q = searchInput.value.trim().toLowerCase();
      const topic = topicFilter.value;
      const type = typeFilter.value;
      if (topic !== 'All topics' && row.primary_topic !== topic) return false;
      if (type !== 'All types' && typeLabel(row) !== type) return false;
      if (!q) return true;
      const hay = [row.title, row.authors, row.primary_topic, row.abstract, row.award, row.location, row.matched_terms].join(' ').toLowerCase();
      return hay.includes(q);
    };

    const paperHTML = row => {
      const type = typeLabel(row);
      const poster = row.poster_number >= 99999 ? '-' : `#${row.poster_number}`;
      const award = row.award ? `<span class="badge award">${row.award}</span>` : '';
      const typeBadge = `<span class="badge ${type.includes('oral') ? 'oral' : ''}">${type}</span>`;
      const topicBadge = `<span class="badge ${topicClass(row.primary_topic)}">${row.primary_topic}</span>`;
      const score = `<span class="badge">score ${row.selection_score}</span>`;
      return `<article class="paper" data-topic="${row.primary_topic}" data-type="${type}">
        <div class="paper-line">
          <div class="poster-no">${poster}</div>
          <div>
            <div class="title"><a href="${row.icml_url}" target="_blank" rel="noopener">${row.title}</a></div>
            <div class="authors">${row.authors}</div>
            <div class="badges">${typeBadge}${award}${topicBadge}${score}</div>
            <details><summary>Abstract</summary><p>${row.abstract || ''}</p><p>${row.matched_terms ? 'Matched: ' + row.matched_terms : ''}</p></details>
          </div>
        </div>
      </article>`;
    };

    const render = () => {
      app.innerHTML = '';
      let visibleTotal = 0;
      data.sessions.forEach((session, index) => {
        const visible = session.rows.filter(rowMatches);
        if (!visible.length) return;
        visibleTotal += visible.length;
        const byBand = new Map();
        visible.forEach(row => {
          if (!byBand.has(row.poster_band)) byBand.set(row.poster_band, []);
          byBand.get(row.poster_band).push(row);
        });
        const bands = Array.from(byBand.entries()).map(([band, rows]) => `<section class="band"><h3>${band}</h3>${rows.map(paperHTML).join('')}</section>`).join('');
        app.insertAdjacentHTML('beforeend', `<section class="session" id="session-${index}">
          <div class="session-head"><h2>${session.label}</h2><div class="session-meta">${session.icmlTime} · ${visible.length} papers</div></div>
          ${bands}
        </section>`);
      });
      const noTime = (data.noTime || []).filter(rowMatches);
      if (noTime.length) {
        visibleTotal += noTime.length;
        app.insertAdjacentHTML('beforeend', `<section class="session" id="no-time">
          <div class="session-head"><h2>No poster time listed</h2><div class="session-meta">${noTime.length} papers</div></div>
          ${noTime.map(paperHTML).join('')}
        </section>`);
      }
      const missing = data.namedChecks.filter(item => (item.status || '').startsWith('not found'));
      if (missing.length && !searchInput.value && topicFilter.value === 'All topics' && typeFilter.value === 'All types') {
        app.insertAdjacentHTML('beforeend', `<section class="session"><div class="session-head"><h2>Named papers without ICML poster match</h2><div class="session-meta">${missing.length} checks</div></div>
          ${missing.map(item => `<article class="paper"><div class="title">${item.requested_title}</div><div class="authors">${item.status}</div><div class="badges">${item.source_url ? `<span class="badge"><a href="${item.source_url}" target="_blank" rel="noopener">source</a></span>` : ''}</div></article>`).join('')}
        </section>`);
      }
      if (!visibleTotal) app.innerHTML = '<div class="empty">No matching papers.</div>';
    };
    searchInput.addEventListener('input', render);
    topicFilter.addEventListener('change', render);
    typeFilter.addEventListener('change', render);
    render();
  </script>
