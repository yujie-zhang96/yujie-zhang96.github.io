 $10$ robotic control tasks demonstrate the generality of the proposed approach. R$^2$VPO achieves substantial performance gains on mathematical reasoning benchmarks, with particularly pronounced improvements on smaller models, while significantly improving sample efficiency. Furthermore, it consistently outperforms PPO baselines in continuous control domains, particularly in sparse-reward and dynamic environments. Together, these findings establish ratio-variance regularization as a principled foundation for stable and data-efficient policy optimization.", "authors": "Yu Luo, Shuo Han, Yihan Hu, Lei Lv, Huaping Liu, Fuchun Sun, Jianye Hao, Dong Li", "icml_url": "https://icml.cc/virtual/2026/poster/64454", "is_oral": false, "is_spotlight": true, "poster_id": "64454", "presentation_type": "spotlight", "related_events": "", "title": "Ratio-Variance Regularized Policy Optimization", "sequence": 3978, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 194, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 62, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 88}, "raw_topic_score": 194, "selection_score": 239, "matched_terms": "reinforcement learning, policy optimization, continuous control, control", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4015", "poster_number": 4015, "poster_band": "#4000-#4999"}, {"abstract": "Learning and planning in imagination using world models provides an effective paradigm for training agents for decision-making. However, existing approaches often rely on high-dimensional latent spaces or generic visual embeddings that retain many factors irrelevant to control, limiting efficiency and generalization across tasks.  To this end, we study how agents can learn world models with representations that are task-specific, minimal, and sufficient for decision making. We achieve this via a closed-loop synergy between the agent and the world model, in which structured world-model learning distills task-sufficient representations from informative interaction data. On the agent side, agents perform active probing of the environment to collect informative trajectories that expose task-relevant latent factors, guided by an adaptive curriculum. On the world-model side, we learn structured representations over observations to distill compact, task-sufficient latent states from the collected interaction data. This synergy enables the recovery of task-sufficient latent representations that capture all control-relevant factors empirically. Leveraging these representations, the resulting policies achieve improved sample efficiency and systematic generalization, including generalization across skills, object–skill compositions, and previously unseen tasks on standard continuous control and robotic manipulation benchmarks.", "authors": "Fan Feng, Yujia Zheng, Minghao Fu, Yongqiang Chen, Guangyi Chen, Kevin Murphy, Biwei Huang, Kun Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/64209", "is_oral": false, "is_spotlight": false, "poster_id": "64209", "presentation_type": "regular", "related_events": "", "title": "Learning Task-Sufficient World Models by Synergizing Agentic Exploration and Structured Modeling", "sequence": 3734, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 116, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 134, "LLM adaptation & fine-tuning": 122, "Robotics, VLA & diffusion policy": 262}, "raw_topic_score": 262, "selection_score": 262, "matched_terms": "robot, robotic, manipulation, world model, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4016", "poster_number": 4016, "poster_band": "#4000-#4999"}, {"abstract": "Large language models have shown strong reasoning abilities and are increasingly explored as high-level coordinators for multi-agent systems. However, directly deploying LLMs for coordination remains challenging, as effective policies often fail to reliably emerge at the low-level control level, and inference costs limit scalability.  We propose SynCoord (Synthetic Coordination Distillation), a self-supervised pipeline that distills task-level decision-making for cooperation from high-capacity reasoning models into lightweight agent policies. Our approach does not rely on explicit supervision or handcrafted coordination rules. Instead, we define a set of task-level tool interfaces that constrain LLM interaction and enable the collection of interaction trajectories, which are then used to train compact coordinated policies. This distillation process transfers coordination behaviors that are difficult to elicit through prompting alone, while substantially reducing inference overhead at execution time.  We evaluate our method in the multi-agent cooperation benchmark Overcooked-AI with varying team sizes and environment layouts. Experimental results show that the distilled policies achieve success rates and efficiency comparable to reinforcement learning–based methods, while exhibiting fewer erroneous or redundant actions and generalizing across team sizes without retraining.", "authors": "Zimo Zhai, Manjie Xu, Wei Liang", "icml_url": "https://icml.cc/virtual/2026/poster/66438", "is_oral": false, "is_spotlight": false, "poster_id": "66438", "presentation_type": "regular", "related_events": "", "title": "Distilling Task-Level Coordination Policies for Generalizable Multi-Agent Cooperation", "sequence": 5958, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 44, "Multi-agent RL, games & coordination": 420, "LLM post-training, RLHF & agents": 162, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 420, "selection_score": 420, "matched_terms": "multi-agent, coordination", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4113", "poster_number": 4113, "poster_band": "#4000-#4999"}, {"abstract": "Low-Rank Adaptation (LoRA) enables efficient federated fine-tuning of segmentation foundation models for medical imaging. However, most federated LoRA methods adopt a uniform aggregation rule, which breaks under the encoder–decoder asymmetry in medical segmentation: the encoder is dominated by appearance shifts, while the decoder is dominated by supervision variations. This mismatch entangles shared anatomy with site-specific biases and harms generalization. To address this, we propose Inverse Asymmetric Tuning (IAT). IAT aligns adaptation with heterogeneity sources by selectively personalizing module-specific adaptation components in the encoder to absorb acquisition-driven appearance shifts and in the decoder to accommodate site-dependent supervision, while retaining a shared pathway for transferable consensus. However, structural separation alone is insufficient under LoRA’s bilinear parameterization, where multiplicative coupling can still cause site-specific updates to leak into the shared update direction. We therefore introduce a Subspace Orthogonality Regularizer that penalizes shared–local collinearity in the effective update space, mitigating leakage without increasing communication. Extensive experiments demonstrate consistent improvements over strong federated LoRA and parameter-efficient FL baselines.", "authors": "Xingyue Zhao, Wenke Huang, Linghao Zhuang, Haoran Wu, Anwen Jiang, Zhifeng Wang, Wenwen He, Ming Feng, Mang Ye, Bo XU", "icml_url": "https://icml.cc/virtual/2026/poster/66734", "is_oral": false, "is_spotlight": false, "poster_id": "66734", "presentation_type": "regular", "related_events": "", "title": "Shift-Dependent Asymmetry: Orthogonal Inverse Low-Rank Adaptation for Federated Medical Segmentation", "sequence": 6252, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 526, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 526, "selection_score": 526, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, federated fine-tuning, adapt", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4402", "poster_number": 4402, "poster_band": "#4000-#4999"}, {"abstract": "Estimating causal structure in the presence of latent variables is an important yet challenging problem. Recent works have shown that distributional constraints, such as rank deficiency constraints of the covariance matrices, can be exploited to recover the underlying causal structure involving latent variables. However, real-world data often exhibit heterogeneity/nonstationarity, which pose challenges to existing methods. In this work, we develop a principled approach for identifying the structure of partially observed linear causal models from heterogenous/nonstationary data. We first formulate a class of heterogenous/nonstationary, partially observed linear causal models and prove that their distributional constraints are equivalent to those in the homogeneous case. Building on this, we propose a novel rank deficiency test that can efficiently handle heterogenous/nonstationary data, and further establish identifiability results for recovering the causal structure involving latent variables. We also provide a method to identify which variables exhibit distribution shifts, i.e., whose causal mechanisms vary across domains. Experiments on simulated and real-world data validate our theoretical findings and the effectiveness of our method.", "authors": "Xinshuai Dong, Haoyue Dai, Ignavier Ng, Peter Spirtes, Kun Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/64751", "is_oral": false, "is_spotlight": false, "poster_id": "64751", "presentation_type": "regular", "related_events": "", "title": "Identifying Partially Observed Causal Models from Heterogeneous/Nonstationary Data", "sequence": 4275, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 208, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 208, "selection_score": 208, "matched_terms": "nonstationary, distribution shift", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4409", "poster_number": 4409, "poster_band": "#4000-#4999"}, {"abstract": "We present the first high-probability optimal regret bound for a policy optimization technique applied to the problem of stochastic contextual multi-armed bandit (CMAB) with general offline function approximation. Our algorithm is both efficient and achieves an optimal regret bound of $\\widetilde{O}(\\sqrt{ K|\\mathcal{A}|\\log|\\mathcal{F}|})$, where $K$ is the number of rounds, $\\mathcal{A}$ is the set of arms, and $\\mathcal{F}$ is the function class used to approximate the losses. Our results bridge the gap between theory and practice, demonstrating that the widely used policy optimization methods for the contextual bandit problem can achieve a rigorously-proved optimal regret bound.  We support our theoretical results with an empirical evaluation of our algorithm.", "authors": "Orin Levy, Yishay Mansour", "icml_url": "https://icml.cc/virtual/2026/poster/65543", "is_oral": false, "is_spotlight": false, "poster_id": "65543", "presentation_type": "regular", "related_events": "", "title": "Optimal Regret for Policy Optimization in Contextual Bandits", "sequence": 5066, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 448, "RL & control": 158, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 448, "selection_score": 448, "matched_terms": "bandit, bandits, contextual bandit, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4500", "poster_number": 4500, "poster_band": "#4000-#4999"}, {"abstract": "Stability is a property of fundamental importance in real-world systems. Although it has been widely studied and well understood in control theory (CT) for deterministic systems, it is largely overlooked in stochastic systems such as Markov decision processes (MDPs). In this paper, we aim to translate the steady-state control problem, well established in CT, where the goal is to synthesize a controller with prescribed asymptotic stability properties, into the MDP framework.     To this end, we propose the novel fast-mixing steady-state (FMSS) problem. Given an ergodic MDP and a target steady-state distribution, the objective is to synthesize a Markovian policy that induces this distribution with the fastest possible convergence rate. Addressing this problem requires controlling the spectral properties of the induced Markov chain (MC) transition matrix, which generally leads to non-convex programs. Thus, we derive a tractable surrogate objective that leads to a convex program, whose properties we study in terms of approximation quality, feasibility, and computational complexity.     We then move to the learning setting and propose an \"offline\" sample-based algorithm for FMSS (FMSS-SV), designed for tabular MDPs, in which the environment’s transition model is estimated from data. We quantify the impact of transition model estimation errors on both the objective value and the learned policy, and provide a finite-sample complexity analysis.", "authors": "Federico Corso, Marco Mussi, Alberto Maria Metelli", "icml_url": "https://icml.cc/virtual/2026/poster/62860", "is_oral": false, "is_spotlight": false, "poster_id": "62860", "presentation_type": "regular", "related_events": "", "title": "Fast Mixing Steady-State Control in Markov Decision Processes", "sequence": 2386, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 338, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 84}, "raw_topic_score": 338, "selection_score": 338, "matched_terms": "markov decision, mdp, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4501", "poster_number": 4501, "poster_band": "#4000-#4999"}, {"abstract": "Most existing vision-language manipulation research targets rigid robotic arms, whose fixed morphology limits adaptability in cluttered or confined spaces.  Soft robotic arms offer an appealing alternative due to their deformability, but confront challenges such as unreliable proprioception and distributed low-level actuation. To investigate these challenges, we introduce ManiSoft, a benchmark for vision-language manipulation with soft arms.  \\ManiSoft{} features a tailored simulator that couples realistic soft-body dynamics with contact-rich interactions via an elastic force constraint. On this basis, ManiSoft defines four tasks, each highlighting distinct aspects of deformable control, from basic end-effector coordination to obstacle avoidance. To support policy training and evaluation, ManiSoft includes an automated pipeline that generates $6{,}300$ diverse scenes and corresponding expert trajectories. To produce high-quality trajectories at scale, we first employ a high-level planner to decompose each task into a sequence of waypoints, followed by a low-level reinforcement learning policy that generates torque commands to track waypoints. Benchmarking three representative policy models shows relatively promising results in clean scenes but substantial performance drop under randomization.  Visualization analysis indicates that failures stem primarily from inaccurate visual estimation of proprioceptive state and limited exploitation of deformability for adaptive obstacle avoiding. We anticipate ManiSoft to serve as a valuable testbed, bridging the gap between rigid and soft arms in the context of vision-language manipulation.", "authors": "Ziyu Wei, Luting Wang, Chen GAO, Li Wen, Si Liu", "icml_url": "https://icml.cc/virtual/2026/poster/63416", "is_oral": false, "is_spotlight": false, "poster_id": "63416", "presentation_type": "regular", "related_events": "", "title": "ManiSoft: Towards Vision-Language Manipulation for Soft Robotics", "sequence": 2941, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 44, "Multi-agent RL, games & coordination": 30, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 614}, "raw_topic_score": 614, "selection_score": 614, "matched_terms": "robot, robotic, robotics, manipulation, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #4602", "poster_number": 4602, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-06T22:00:00-07:00", "label": "Tue, Jul 7, 2026 14:00 KST", "icmlTime": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "count": 40, "rows": [{"abstract": "Recent advances in reinforcement learning (RL) have achieved great successes by leveraging the multimodality and exploration capability of diffusion policies. Among these approaches, one representative branch focuses on the weighted-based policy optimization. This design enables better exploration capability of diffusion model, particularly at the beginning of training, but suffer from the low exploitation in Q-value information, resulting in a slow policy convergence. Another branch pay attention to gradient-based policy optimization, which sufficiently exploit the gradient of Q function yet tend to collapse into a unimodal policy with low diversity. To address this issue, we propose CGPO, \\textbf{C}ritic-\\textbf{G}uided diffusion \\textbf{P}olicy \\textbf{O}ptimization, which effectively balances exploration and exploitation with the training-free guidance technique integrated into the denoising process of diffusion policy. Concretely, CGPO steers action generation toward high-value regions defined by the critic network and uses the guided actions as regression objectives. In this manner, CGPO reduces the time required to obtain high-quality actions and improves final performance with better balance between exploration-exploitation tradeoff. We validate the effectiveness of CGPO on 5 MuJoCo locomotion tasks, and CGPO achieves state-of-the-art performance compared with existing diffusion-based RL methods. Notably, CGPO is the first success to incorporate diffusion policy into real-world RL, with its superior performance on Franka robot arm grasping tasks.", "authors": "Shutong Ding, Zejia Zhong, Zhongyi Wang, Ke Hu, Bikang Pan, Jingya Wang, Ye Shi", "icml_url": "https://icml.cc/virtual/2026/poster/66308", "is_oral": false, "is_spotlight": false, "poster_id": "66308", "presentation_type": "regular", "related_events": "", "title": "Sample-Efficient Diffusion-based Reinforcement Learning with Critic Guidance", "sequence": 5829, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 212, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 152, "Robotics, VLA & diffusion policy": 366}, "raw_topic_score": 366, "selection_score": 366, "matched_terms": "diffusion policy, diffusion policies, diffusion-based reinforcement, robot, diffusion", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #114", "poster_number": 114, "poster_band": "#0000-#0999"}, {"abstract": "Diffusion and flow policies are gaining prominence in online reinforcement learning (RL) due to their expressive power, yet training them efficiently remains a critical challenge. A fundamental difficulty that distinguishes online RL from standard generative modeling is the lack of direct samples from the target Boltzmann distribution defined by the Q-function. To address this, two seemingly distinct families of methods have been proposed for diffusion policies: a noise-expectation family, which uses a weighted average of noise as the training target, and a gradient-expectation family, which employs a weighted average of Q-function gradients. However, it remains unclear how these objectives are formally related, or whether they can be synthesized into a more general formulation. In this paper, we propose a unified framework, reverse flow matching (RFM), which rigorously addresses the problem of training diffusion and flow models without direct target samples. By adopting a reverse inferential perspective, we formulate the training target as a posterior mean estimation problem given an intermediate noisy sample. Crucially, we introduce Langevin Stein operators to construct zero-mean control variates, deriving a general class of estimators that share the same expectation. We show that existing noise-expectation and gradient-expectation methods are simply two specific instances within this broader class. This unified view yields two key advancements: it extends the capability of targeting Boltzmann distributions from diffusion to flow policies, and it enables the principled combination of Q-value and Q-gradient information to form an effective estimator, thereby improving training efficiency and stability. We instantiate RFM to train a flow policy in online RL and demonstrate improved performance on continuous-control benchmarks compared to diffusion policy baselines.", "authors": "Zeyang Li, Sunbochen Tang, Navid Azizan", "icml_url": "https://icml.cc/virtual/2026/poster/60898", "is_oral": false, "is_spotlight": true, "poster_id": "60898", "presentation_type": "spotlight", "related_events": "", "title": "Reverse Flow Matching: A Unified Framework for Online Reinforcement Learning with Diffusion and Flow Policies", "sequence": 427, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 204, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 200}, "raw_topic_score": 204, "selection_score": 489, "matched_terms": "reinforcement learning, online rl, control", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #115", "poster_number": 115, "poster_band": "#0000-#0999"}, {"abstract": "The Policy-Space Response Oracles (PSRO) framework scales equilibrium computation to large zero-sum games by iteratively expanding a restricted strategy set using deep reinforcement learning (DRL). A central challenge is to construct, under limited computational budgets, a small strategy population whose induced game well approximates the full game. Existing PSRO variants typically expand the population using best responses to meta-strategies computed from restricted-game payoffs, which can lead to inefficient expansions that provide limited global improvement. We propose to guide population expansion by directly evaluating the post-expansion population quality. Specifically, we adopt Population Exploitability (PE) to measure how well a restricted strategy set represents the full game, and introduce a two-phase exploration--selection framework that explicitly minimizes PE during expansion. We instantiate this framework as Global PSRO, a practical DRL-based algorithm that efficiently generates candidate responses and estimates PE via parameter-sharing conditional neural networks. Experiments across multiple two-player zero-sum games show that Global PSRO achieves lower exploitability and approximates Nash equilibria with significantly fewer policy iterations than prior PSRO methods.", "authors": "Junyu Zhang, Feihong Yang, Jian Wang, Chao Wang, Xudong Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/65471", "is_oral": false, "is_spotlight": false, "poster_id": "65471", "presentation_type": "regular", "related_events": "", "title": "Global Policy-Space Response Oracles for Two-Player Zero-Sum Games", "sequence": 4995, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 42, "Multi-agent RL, games & coordination": 368, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 368, "selection_score": 368, "matched_terms": "game, games, nash, equilibrium", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #118", "poster_number": 118, "poster_band": "#0000-#0999"}, {"abstract": "Building scalable and reusable multi-agent decision policies from offline datasets remains a challenge in offline multi-agent reinforcement learning (MARL), as existing methods often rely on fixed observation formats and action spaces that limit generalization. In contrast, large language models (LLMs) offer a flexible modeling interface that can naturally accommodate heterogeneous observations and actions. Motivated by this, we propose the Decision Language Model (DLM), which formulates multi-agent decision making as a dialogue-style sequence prediction problem under the centralized training with decentralized execution paradigm. DLM is trained in two stages: a supervised fine-tuning phase, which leverages dialogue-style datasets for centralized training with inter-agent context and generates executable actions from offline trajectories, followed by a group relative policy optimization phase to enhance robustness to out-of-distribution actions through lightweight reward functions. Experiments on multiple benchmarks show that a unified DLM outperforms strong offline MARL baselines and LLM-based conversational decision-making methods, while demonstrating strong zero-shot generalization to unseen scenarios across tasks.", "authors": "Zhuohui Zhang, Bin Cheng, Bin He", "icml_url": "https://icml.cc/virtual/2026/poster/61365", "is_oral": false, "is_spotlight": true, "poster_id": "61365", "presentation_type": "spotlight", "related_events": "", "title": "DLM: Unified Decision Language Models for Offline Multi-Agent Sequential Decision Making", "sequence": 893, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 52, "Multi-agent RL, games & coordination": 468, "LLM post-training, RLHF & agents": 244, "LLM adaptation & fine-tuning": 138, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 468, "selection_score": 513, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, decentralized", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #120", "poster_number": 120, "poster_band": "#0000-#0999"}, {"abstract": "LLM agents operate in two distinct regimes: open-weight agents amenable to reinforcement learning (RL) and black-box agents whose behaviour must be controlled purely at test time. Although black-box agents are often backed by state-of-the-art proprietary LLMs, API-only access precludes parameter-level optimization, rendering most RL methods inapplicable. To address this limitation, we turn to a known equivalence between RL and Bayesian inference. We propose Agentic Monte Carlo (AMC) to directly sample from the optimal policy of a black-box agent rather than training it through RL. The optimal policy is a posterior over trajectories whose prior we define as the fixed black-box LLM agent. We employ Sequential Monte Carlo to sample from this posterior by learning a value function to steer the agent while leaving the underlying black-box model unchanged. We validate AMC on three diverse environments from the AgentGym benchmark, demonstrating significant improvements over prompting baselines and even outperforming Group Relative Policy Optimization (GRPO) as we scale the test-time compute of our method. AMC demonstrates the feasibility of performing principled RL-style optimization of black-box LLM agents.", "authors": "Daeyon Hwang, Raunaq Suri, Valentin Villecroze, Anthony Caterini, Jesse Cresswell, Noël Vouitsis, Brendan Ross", "icml_url": "https://icml.cc/virtual/2026/poster/62740", "is_oral": false, "is_spotlight": false, "poster_id": "62740", "presentation_type": "regular", "related_events": "", "title": "Agentic Monte Carlo: Reinforcement Learning for Black-Box LLM Agents", "sequence": 2266, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 156, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 364, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 364, "selection_score": 364, "matched_terms": "grpo, llm, agent, agents", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #121", "poster_number": 121, "poster_band": "#0000-#0999"}, {"abstract": "Scaling network remains a bottleneck in deep reinforcement learning (RL): simply enlarging actor–critic networks destabilizes training and soon saturates performance. Although recent monolithic architectures such as SimBa and BRC have shown that carefully designed inductive biases can enable positive scaling up to a certain size, their improvements plateau soon as model parameters grow further. This work introduces ScaleMoE, a scalable RL architecture that integrates Mixture-of-Experts (MoE) modules into both the actor and critic of modern continuous control algorithms.  Two complementary gating schemes are studied: output-level aggregation of per-expert policies and Q-functions, and feature-level fusion of expert representations before a shared head. We instantiate ScaleMoE on two representative monolithic RL baselines: the single-task method SimBa and the multi-task method BRC. Experiments across the DeepMind Control Suite, MetaWorld, and HumanoidBench show that progressively increasing the number of experts (up to 64) yields substantial improvements in returns, significantly outperforming monolithic networks of comparable or even greater parameter counts. Results demonstrate that ScaleMoE provides an   efficient and effective scaling axis for deep RL in continuous control.", "authors": "Yi Ma, Chenjun Xiao, Hongyao Tang, Yaodong Yang, Jinyi Liu, Jing Liang, Jiye Liang", "icml_url": "https://icml.cc/virtual/2026/poster/61609", "is_oral": false, "is_spotlight": true, "poster_id": "61609", "presentation_type": "spotlight", "related_events": "", "title": "ScaleMoE: Mixture-of-Experts for Scalable Continuous Control in Actor-Critic Reinforcement Learning", "sequence": 1137, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 394, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 72}, "raw_topic_score": 394, "selection_score": 439, "matched_terms": "reinforcement learning, actor-critic, continuous control, control", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #203", "poster_number": 203, "poster_band": "#0000-#0999"}, {"abstract": "Existing reinforcement learning approaches for Large Language Models typically perform policy optimization at the granularity of individual tokens or entire response sequences. However, such formulations often misalign with the natural step-wise structure of reasoning processes, leading to suboptimal credit assignment and unstable training in multi-modal reasoning tasks. To bridge this gap, we propose Segment-Aligned Policy Optimization (SAPO), a novel reinforcement learning paradigm that treats coherent reasoning steps, rather than tokens or full sequences as fundamental units of policy update. SAPO introduces a step-wise Markov decision process abstraction over reasoning segments, accompanied by segment-level value estimation, advantage computation, and importance sampling mechanisms that are semantically aligned with reasoning boundaries. Experiments on representative reasoning benchmarks demonstrate that SAPO consistently outperforms token-level and sequence-level policy optimization methods, achieving significant accuracy improvements while exhibiting better training stability and value estimation consistency. Our work underscores the importance of aligning reinforcement learning updates with the intrinsic structure of reasoning, paving the way for more efficient and semantically grounded policy optimization in complex reasoning tasks. Codes and models will be released to ensure full reproducibility.", "authors": "Lei Gao, Zhuoming Li, Mengxi Jia, Jiakang Yuan, Hongbo Sun, Hao Sun, Xuelong Li", "icml_url": "https://icml.cc/virtual/2026/poster/66325", "is_oral": false, "is_spotlight": false, "poster_id": "66325", "presentation_type": "regular", "related_events": "", "title": "Segment-Aligned Policy Optimization for Multi-Modal Reasoning", "sequence": 5845, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 274, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 140, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 274, "selection_score": 274, "matched_terms": "reinforcement learning, markov decision, policy optimization", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #204", "poster_number": 204, "poster_band": "#0000-#0999"}, {"abstract": "Agentic reinforcement learning (ARL) has rapidly gained attention as a promising paradigm for training agents to solve complex, multi-step interactive tasks.  In this paper, we first propose $\\textbf{ARLArena}$, a fair and systematic analysis framework that encompasses a broad spectrum of ARL algorithms and decomposes policy optimization (PO) through multiple policy gradient dimensions.  Through this fine-grained analysis, we distill a unified perspective on ARL and, guided by the identified governing factors, propose $\\textbf{SAMPO}$, a stable agentic PO method designed to mitigate the dominant sources of instability in ARL. Empirically, SAMPO achieves consistently stable training and strong performance across diverse agentic tasks. Overall, this study provides a unifying policy gradient perspective for ARL and offers practical guidance for building stable and reproducible LLM-based agent training pipelines. Our codebase is open-sourced at https://anonymous.4open.science/r/SAMPO-02B3.", "authors": "Xiaoxuan Wang, Han Zhang, Haixin Wang, Yidan Shi, Ruoyan Li, Kaiqiao Han, Chenyi Tong, Haoran Deng, Alexander Taylor, Renliang Sun, Yanqiao Zhu, Jason Cong, Yizhou Sun, Wei Wang", "icml_url": "https://icml.cc/virtual/2026/poster/65909", "is_oral": false, "is_spotlight": false, "poster_id": "65909", "presentation_type": "regular", "related_events": "", "title": "ARLArena: Demystifying Policy Gradient Stability in Agentic Reinforcement Learning", "sequence": 5432, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 242, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 204, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 242, "selection_score": 242, "matched_terms": "reinforcement learning, policy optimization, policy gradient", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #210", "poster_number": 210, "poster_band": "#0000-#0999"}, {"abstract": "Direct preference optimization (DPO) has emerged as a promising approach for aligning large language models (LLMs) with human preferences. However, the widespread reliance on the response-level Bradley-Terry (BT) model may limit its full potential, as the reference and learnable models are assumed to be autoregressive only after deriving the objective function. Motivated by this limitation, we revisit the theoretical foundations of DPO and propose a novel formulation that explicitly introduces the autoregressive assumption prior to applying the BT model. By reformulating and extending DPO, we derive a novel variant, termed \\textbf{Autoregressive DPO (ADPO)}, that explicitly integrates autoregressive modeling into the preference optimization framework. Without violating the theoretical foundations, the derived loss takes an elegant form: it shifts the summation operation in the DPO objective outside the log-sigmoid function. Furthermore, through theoretical analysis of ADPO, we show that there exist two length measures to be considered when designing DPO-based algorithms: the token length $\\mu$ and the feedback length $\\mu'$. To the best of our knowledge, we are the first to explicitly distinguish these two measures and analyze their implications for preference optimization in LLMs.", "authors": "Masanari Oi, Mahiro Ukai, Masahiro Kaneko, Naoaki Okazaki, Nakamasa Inoue", "icml_url": "https://icml.cc/virtual/2026/poster/65423", "is_oral": false, "is_spotlight": false, "poster_id": "65423", "presentation_type": "regular", "related_events": "", "title": "Autoregressive Direct Preference Optimization", "sequence": 4947, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 438, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 438, "selection_score": 438, "matched_terms": "preference optimization, dpo, large language model, llm, language model", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #316", "poster_number": 316, "poster_band": "#0000-#0999"}, {"abstract": "While Vision-Language-Action models (VLAs) are rapidly advancing toward generalist robot policies, quantitatively characterizing their capability boundaries and failure modes remains challenging. To address this, we introduce VLA-Arena , a comprehensive benchmark. It features a novel structured task design framework to quantify difficulty across three orthogonal axes: (1) Task Structure , (2) Language Command , and (3) Visual Observation . This allows us to systematically design tasks with fine-grained difficulty levels, enabling a precise measurement of model capability frontiers. For task structure, VLA-Arena comprises 11 task suites organized into four dimensions: Safety , Distractor , Extrapolation , and Long Horizon , totaling 170 tasks. Each suite spans three difficulty levels (L0–L2), with fine-tuning restricted to L0 to rigorously assess generalization. Orthogonal to this, language (W0-W4) and visual (V0-V4) perturbations can be applied to any task as diagnostic probes to distinguish robust grounding from superficial pattern matching. Our extensive evaluation of state-of-the-art VLAs reveals critical limitations: memorization over generalization, superficial visual perception, and a neglect of safety constraints. Additionally, model rank reversals across L0–L2 validate that each level provides non-redundant insights. To foster research addressing these model limitations and ensure reproducibility, we provide the complete VLA-Arena framework, including an end-to-end toolchain from task definition to automated evaluation and the VLA-Arena-S/M/L datasets for fine-tuning. Our benchmark, datasets, models, and leaderboard will be open-sourced.", "authors": "Borong Zhang, Jiahao Li, Jiachen Shen, Yishuai Cai, Yuhao Zhang, Yuanpei Chen, Juntao Dai, Jiaming Ji, Yaodong Yang", "icml_url": "https://icml.cc/virtual/2026/poster/61388", "is_oral": false, "is_spotlight": false, "poster_id": "61388", "presentation_type": "regular", "related_events": "", "title": "VLA-Arena: An Open-Source Framework for Benchmarking Vision-Language-Action Models", "sequence": 916, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 68, "Robotics, VLA & diffusion policy": 582}, "raw_topic_score": 582, "selection_score": 582, "matched_terms": "vision-language-action, vla, robot, robot policies", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #505", "poster_number": 505, "poster_band": "#0000-#0999"}, {"abstract": "Cross-task generalization is a core challenge in open-world robotic manipulation, and the key lies in extracting transferable manipulation knowledge from seen tasks. Recent in-context learning approaches leverage seen task demonstrations to generate actions for unseen tasks without parameter updates. However, existing methods provide only low-level continuous action sequences as context, failing to capture composable skill knowledge and causing models to degenerate into superficial trajectory imitation. We propose Decompose and Recompose, a skill reasoning framework using atomic skill-action pairs as intermediate representations. Our approach decomposes seen demonstrations into interpretable skill--action alignments, enabling the model to recompose these skills for unseen tasks through compositional reasoning. Specifically, we construct a task-adaptive dynamic demonstration library via visual-semantic retrieval combined with skill sequences from a planning agent, complemented by a coverage-aware static library to fill missing skill patterns. Together, these yield skill-comprehensive demonstrations that explicitly elicit compositional reasoning for skill composition and execution ordering. Experiments on the AGNOSTOS benchmark and real-world environments validate our method's zero-shot cross-task generalization capability.", "authors": "Xitie Zhang, Aming WU, Yahong Han", "icml_url": "https://icml.cc/virtual/2026/poster/63250", "is_oral": false, "is_spotlight": false, "poster_id": "63250", "presentation_type": "regular", "related_events": "", "title": "Decompose and Recompose: Reasoning New Skills from Existing Abilities for Cross-Task Robotic Manipulation", "sequence": 2775, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 12, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 90, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 422}, "raw_topic_score": 422, "selection_score": 422, "matched_terms": "robot, robotic, manipulation, trajectory", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #507", "poster_number": 507, "poster_band": "#0000-#0999"}, {"abstract": "Researchers have shown that neural similarity among humans predicts social closeness and cooperative success, whereas innovation often emerges from interactions among dissimilar individuals. We investigate whether these principles extend to artificial intelligence by examining interactions between large language models. In our experiments, 276 model pairs interact across eight games spanning both cooperation and novelty. We find that pairs with more similar representation spaces achieve significantly higher cooperation but exhibit reduced novelty and creativity. The effects of representational similarity on cooperation and novelty remain robust even after isolating other factors such as performance disparity and model size. We also find that similarity in the early layers consistently exhibits the strongest effect across games, compared to the middle and later layers. This suggests that a central factor underlying the observed trend is the extent to which the two models share lexical and semantic grounding. These findings suggest that representational similarity can be an important consideration in multi-agent system design.", "authors": "Yujin Potter, Seun Eisape, Shiyang Lai, Alexander Huth, James Evans, Been Kim, Jacob Eisenstein, Dawn Song, Alane Suhr", "icml_url": "https://icml.cc/virtual/2026/poster/60905", "is_oral": false, "is_spotlight": false, "poster_id": "60905", "presentation_type": "regular", "related_events": "", "title": "Representational Similarity and Model Behavior in Multi-Agent Interaction", "sequence": 434, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 280, "LLM post-training, RLHF & agents": 70, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 280, "selection_score": 280, "matched_terms": "multi-agent, cooperative, game, games", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #510", "poster_number": 510, "poster_band": "#0000-#0999"}, {"abstract": "Spiking Neural Networks (SNNs) can achieve competitive performance by converting already existing well-trained Artificial Neural Networks (ANNs), avoiding further costly training. This property is particularly attractive in Reinforcement Learning (RL), where training through environment interaction is expensive and potentially unsafe. However, existing conversion methods perform poorly in continuous control, where suitable baselines are largely absent. We identify error amplification as the key cause: small action approximation errors become temporally correlated across decision steps, inducing cumulative state distribution shift and severe performance degradation. To address this issue, we propose Cross-Step Residual Potential Initialization (CRPI), a lightweight training-free mechanism that carries over residual membrane potentials across decision steps to suppress temporally correlated errors. Experiments on continuous control benchmarks with both vector and visual observations demonstrate that CRPI can be integrated into existing conversion pipelines and substantially recovers lost performance. Our results highlight continuous control as a critical and challenging benchmark for ANN-to-SNN conversion, where small errors can be strongly amplified and impact performance.", "authors": "Zijie Xu, Zihan Huang, Yiting Dong, Kang Chen, Wenxuan Liu, Zhaofei Yu", "icml_url": "https://icml.cc/virtual/2026/poster/62414", "is_oral": false, "is_spotlight": false, "poster_id": "62414", "presentation_type": "regular", "related_events": "", "title": "Error Amplification Limits ANN-to-SNN Conversion in Continuous Control", "sequence": 1941, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 270, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 72}, "raw_topic_score": 270, "selection_score": 270, "matched_terms": "reinforcement learning, continuous control, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #614", "poster_number": 614, "poster_band": "#0000-#0999"}, {"abstract": "Recently, the frontier of Large Language Model (LLM) capabilities has shifted from single-turn code generation to agentic software engineering—a paradigm where models autonomously navigate, edit, and test complex repositories.  While post-training methods have become the de facto approach for code agents, agentic mid-training —mid-training (MT) on large-scale data that mirrors authentic agentic workflows—remains critically underexplored due to substantial resource requirements, despite offering a more scalable path to instilling foundational agentic behaviors than relying solely on expensive reinforcement learning.  A central challenge in realizing effective agentic mid-training is the distribution mismatch between static training data and the dynamic, feedback-rich environment of real development. To address this, we present a systematic study of agentic mid-training, establishing both the data synthesis principles and training methodology for effective agent development at scale.  Central to our approach is agent-native data —supervision comprising two complementary types of trajectories: contextually-native trajectories that preserve the complete information flow an agent experiences, offering broad coverage and diversity; and environmentally-native trajectories collected from executable repositories where observations stem from actual tool invocations and test executions, providing depth and interaction authenticity.  We verify the model’s agentic capabilities on SWE-Bench Verified . We demonstrate our superiority over the previous open software engineering mid-training recipe Kimi-Dev under two post-training settings with an aligned base model and agentic scaffold, while using less than half mid-training tokens (73.1B).  Besides relative advantage, our best performing 32B and 72B models achieve 56.1% and 58.5% resolution rates, respectively, which are state-of-the-art among open training recipes using agentic scaffolds under their model sizes, despite starting from non-coder Qwen2.5-Base base models. Beyond these agentic capabilities, we also observe performance gains on general code generation and scientific benchmarks.  We plan to open-source a significant portion of our datasets, recipes, and model checkpoints—resources representing substantial computational investment typically unavailable to the broader community—to facilitate further research in this underexplored paradigm.", "authors": "Ji Zeng, Dayuan Fu, Tiantian Mi, Zhuang Yumin, Yaxing Huang, Xuefeng Li, Lyumanshan Ye, Muhang Xie, Qishuo Hua, Zhen Huang, Mohan Jiang, Hanning Wang, Shijie Xia, Yang Xiao, Jie Sun, Yunze Wu, Pengfei Liu", "icml_url": "https://icml.cc/virtual/2026/poster/63099", "is_oral": true, "is_spotlight": true, "poster_id": "63099", "presentation_type": "oral", "related_events": "Oral presentation: Oral 1B Agentic Systems", "title": "daVinci-Dev: Agent-native Mid-training for Software Engineering", "sequence": 2624, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 296, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 296, "selection_score": 386, "matched_terms": "post-training, large language model, llm, language model, agent, agents", "selection_reasons": "oral", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #1816", "poster_number": 1816, "poster_band": "#1000-#1999"}, {"abstract": "In embodied vision-language decision making tasks such as robotic manipulation and navigation, Vision-Language and Vision-Language-Action Models (VLMs \\& VLAs) are powerful tools with different benefits: VLMs are better at long-term planning, while VLAs are better at reactive control. However, their performance is limited by the same perceptual bottleneck: visual hallucinations arise due to the models’ inability to distinguish task-relevant objects from distractors. In principle, accurate identification and focus on critical objects while filtering out irrelevant ones is the key to break this limitation. A straightforward solution is one-step focus: directly attending to essential objects. However, this approach proves ineffective because effective focus inherently requires deep scene understanding. To this end, we propose ${\\it SceneDiver}$, a coarse-to-fine focus plan generation method for VLMs leveraging their long-term planning abilities, that first constructs a holistic scene graph to establish initial comprehension, then progressively decomposes the task into simpler sub-problems through an iterative cycle of recognition, understanding, and analysis. To enable reactive control, we also design a lightweight adapter for distilling the deliberate focus ability into VLAs.  Evaluations on standard embodied AI benchmarks confirm that our method substantially reduces visual hallucinations for both VLMs and VLAs, while preserving computational efficiency in tasks requiring fast execution.", "authors": "Boyuan Xiao, Bohong Chen, Yumeng Li, Ji Feng, Yao-Xiang Ding, Kun Zhou", "icml_url": "https://icml.cc/virtual/2026/poster/65750", "is_oral": false, "is_spotlight": false, "poster_id": "65750", "presentation_type": "regular", "related_events": "", "title": "Dive into the Scene: Breaking the Perceptual Bottleneck in Vision-Language Decision Making via Focus Plan Generation", "sequence": 5273, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 52, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 34, "Robotics, VLA & diffusion policy": 390}, "raw_topic_score": 390, "selection_score": 390, "matched_terms": "vision-language-action, vla, robot, robotic, embodied, manipulation, navigation, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2303", "poster_number": 2303, "poster_band": "#2000-#2999"}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) has enabled progress on reasoning-intensive tasks by relying on task-specific verifiers that provide automated correctness signals. However, many realistic language tasks are difficult to equip with reliable verifiers, motivating a growing reliance on reinforcement learning from human feedback (RLHF).  In this setting, we argue that a closer examination of how human feedback should be interpreted is essential. We introduce Regret-based Preference Optimization (RePO), which reframes RLHF through regret minimization rather than reward maximization.  Human preferences are often shaped by prospective anticipation of outcomes and counterfactual comparisons to alternative behaviors, rather than by immediate, outcome-independent utility.  RePO captures this structure by modeling preferences as behavior-conditioned assessments of relative suboptimality. Within a KL-regularized reinforcement learning framework, RePO admits a closed-form policy update compatible with direct preference optimization.  Experiments on mathematical reasoning benchmarks and human-annotated preference datasets demonstrate consistent performance gains, indicating that regret-based preference learning is an effective and human-aligned approach for training large language models.", "authors": "Suhwan Kim, Taehyun Cho, Youngsoo Jang, Geon-Hyeong Kim, Yu Jin Kim, Moontae Lee, Jungwoo Lee", "icml_url": "https://icml.cc/virtual/2026/poster/62432", "is_oral": false, "is_spotlight": true, "poster_id": "62432", "presentation_type": "spotlight", "related_events": "", "title": "A Regret Minimization Framework on Preference Learning  in Large Language Models", "sequence": 1959, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 48, "RL & control": 138, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 480, "LLM adaptation & fine-tuning": 112, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 480, "selection_score": 525, "matched_terms": "rlhf, preference learning, preference optimization, verifiable reward, large language model, language model, reasoning", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2400", "poster_number": 2400, "poster_band": "#2000-#2999"}, {"abstract": "Managing agent thought and observation during multi-turn agent-environment interactions is an emerging strategy to improve agent efficiency.  However, existing studies treat the entire interaction trajectories equally, overlooking the thought necessity and observation utility varies across turns. To this end, we first conduct quantitative investigations into how thought and observation affect agent effectiveness and efficiency. Based on our findings, we propose Agent-Omit, a unified training framework that empowers LLM agents to adaptively omit redundant thoughts and observations. Specifically, we first synthesize a small amount of cold-start data, including both single-turn and multi-turn omission scenarios, to fine-tune the agent for omission behaviors.  Furthermore, we introduce an omit-aware agentic reinforcement learning approach, incorporating a dual sampling mechanism and a tailored omission reward to incentivize the agent's adaptive omission capability. Theoretically, we prove that the deviation of our omission policy is upper-bounded by KL-divergence. Experimental results on five agent benchmarks show that our constructed Agent-Omit-8B could obtain performance comparable to seven frontier LLM agent, and achieve the best effectiveness-efficiency trade-off than seven efficient LLM agents methods. Our code and data are avaliable at https://anonymous.4open.science/r/Agent-Omit/", "authors": "Yansong Ning, Jun Fang, Naiqiang Tan, Hao Liu", "icml_url": "https://icml.cc/virtual/2026/poster/63271", "is_oral": false, "is_spotlight": false, "poster_id": "63271", "presentation_type": "regular", "related_events": "", "title": "Agent-Omit: Training Efficient LLM Agents for Adaptive Thought and Observation Omission via Agentic Reinforcement Learning", "sequence": 2796, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 364, "LLM adaptation & fine-tuning": 124, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 364, "selection_score": 364, "matched_terms": "llm, agent, agents", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2404", "poster_number": 2404, "poster_band": "#2000-#2999"}, {"abstract": "Recent large language models (LLMs) have demonstrated strong capabilities across challenging tasks, enabling their widespread adoption in agentic systems that interact with external tools. In such deployments, however, LLMs are typically trained with general-purpose tokenizers designed for broad language coverage, while their usage is dominated by narrow, structured tool-calling interactions. This training–deployment mismatch leads to inefficient tokenization, where repetitive structural patterns and frequent semantic units in function calls are fragmented into long sequences of low-level tokens, increasing decoding overhead. To address this gap, we introduce $\\textbf{AgentVocab}$, a structure-aware vocabulary adaptation framework for efficient LLM agents. AgentVocab derives specialized vocabulary entries from real tool-calling traces and adapts the model vocabulary to better reflect structural and semantic regularities, without task-specific schema engineering. Experiments on $\\tau$ and $\\tau^2$-bench show that AgentVocab significantly improves decoding efficiency, reducing latency by approximately 15-25\\% relative to the vanilla baseline, while preserving tool-calling performance. Our approach is orthogonal to existing fine-tuning and agent-training methods and integrates seamlessly into standard agent pipelines. Source code and models will be available at https://anonymous.4open.science/r/AgentVocab-28CC.", "authors": "Kai Bian, Haosi Mo, Xuebo Liu, Shuangyong Song, Jing Li, Yongxiang Li, Min zhang, Xuelong Li", "icml_url": "https://icml.cc/virtual/2026/poster/61748", "is_oral": false, "is_spotlight": false, "poster_id": "61748", "presentation_type": "regular", "related_events": "", "title": "AgentVocab: Structure-Aware Vocabulary Adaptation for Efficient LLM Agents", "sequence": 1276, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 294, "LLM adaptation & fine-tuning": 370, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 370, "selection_score": 610, "matched_terms": "fine-tuning, vocabulary adaptation, adapt, large language model, language model, llm", "selection_reasons": "user-named / must include", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2406", "poster_number": 2406, "poster_band": "#2000-#2999"}, {"abstract": "While video generation holds promise for embodied intelligence, current video models struggle with physical realism, and progress is hindered by the lack of standardized benchmarks. To address this gap, we introduce a comprehensive robotics benchmark, RBench, designed to evaluate robot-oriented video generation across five task domains and four distinct embodiments. By assessing task correctness and visual fidelity through reproducible metrics, our evaluation of 25 models reveals significant deficiencies in generating physically realistic robot behaviors. Furthermore, the benchmark achieves a 0.96 Spearman correlation with human judgment, validating its effectiveness. While RBench provides the necessary lens to identify these deficiencies, achieving physical realism requires moving beyond evaluation to address the critical shortage of high-quality training data. Driven by these insights, we introduce a refined four-stage data pipeline, resulting in RoVid-X, the largest open-source robotic dataset for video generation with 4 million annotated video clips, covering thousands of tasks and enriched with physical property annotations. Extensive experiments demonstrate that finetuning on RoVid-X yields consistent performance gains. Collectively, this synergistic ecosystem of evaluation and data establishes a robust foundation for rigorous assessment and scalable training of video models, accelerating the evolution of embodied AI toward physical intelligence. The code and video demos are available in the supplementary materials.", "authors": "Yufan Deng, Zilin Pan, Hongyu Zhang, Xiaojie Li, Huruoqing , Yufei Ding, Yiming Zou, Yan Zeng, Zhou Daquan", "icml_url": "https://icml.cc/virtual/2026/poster/61543", "is_oral": false, "is_spotlight": false, "poster_id": "61543", "presentation_type": "regular", "related_events": "", "title": "Rethinking Video Generation Model for the Embodied World", "sequence": 1071, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 34, "Robotics, VLA & diffusion policy": 362}, "raw_topic_score": 362, "selection_score": 362, "matched_terms": "robot, robotic, robotics, embodied", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2614", "poster_number": 2614, "poster_band": "#2000-#2999"}, {"abstract": "Learning latent actions from action-free video has emerged as a powerful paradigm for scaling up controllable world model learning. Latent actions provide a natural interface for users to iteratively generate and manipulate videos. However, most existing approaches rely on monolithic inverse and forward dynamics models that learn a single latent action to control the entire scene, and therefore struggle in complex environments where multiple entities act simultaneously. This paper introduces Factored Latent Action Model (FLAM), a factored dynamics framework that decomposes the scene into independent factors, each inferring its own latent action and predicting its own next-step factor value. This factorized structure enables more accurate modeling of complex multi-entity dynamics and improves video generation quality in action-free video settings compared to monolithic models. Based on experiments on both simulation and real-world multi-entity datasets, we find that FLAM outperforms prior work in prediction accuracy and representation quality, and facilitates downstream policy learning, demonstrating the benefits of factorized latent action models.", "authors": "Zizhao Wang, Chang Shi, Jiaheng Hu, Kevin Rohling, Roberto Martín-Martín, Amy Zhang, Peter Stone", "icml_url": "https://icml.cc/virtual/2026/poster/61299", "is_oral": false, "is_spotlight": false, "poster_id": "61299", "presentation_type": "regular", "related_events": "", "title": "Factored Latent Action World Models", "sequence": 827, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 28, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 418}, "raw_topic_score": 418, "selection_score": 418, "matched_terms": "latent action, world model, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2704", "poster_number": 2704, "poster_band": "#2000-#2999"}, {"abstract": "Despite the rapid progress of video generation models, the role of data in influencing motion is poorly understood. We present Motive (MOTIon attribution for Video gEneration), a motion-centric, gradient-based data attribution framework that scales to modern, large, high-quality video datasets and models. We use this to study which fine-tuning clips improve or degrade temporal dynamics. Motive isolates temporal dynamics from static appearance via motion-weighted loss masks, yielding efficient and scalable motion-specific influence computation. On text-to-video models, Motive identifies clips that strongly affect motion and guides data curation that improves temporal consistency and physical plausibility. With Motive-selected high-influence data, we improve both motion smoothness and dynamic degree on VBench, achieving a 74.1% human preference win rate compared with the pretrained base model. To our knowledge, this is the first framework to attribute motion rather than visual appearance in video generative models and to use it to curate fine-tuning data.", "authors": "Xindi Wu, Despoina Paschalidou, Jun Gao, Antonio Torralba, Laura Leal-Taixé, Olga Russakovsky, Sanja Fidler, Jonathan Lorraine", "icml_url": "https://icml.cc/virtual/2026/poster/60542", "is_oral": true, "is_spotlight": true, "poster_id": "60542", "presentation_type": "oral", "related_events": "Oral presentation: Oral 1F Vision-Language Models & Video", "title": "Motion Attribution for Video Generation", "sequence": 71, "award": "Outstanding Paper Honorable Mention", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 68, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 68, "selection_score": 308, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper Honorable Mention", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2807", "poster_number": 2807, "poster_band": "#2000-#2999"}, {"abstract": "Preference optimization for diffusion models relies on reward functions that are both discriminative and computationally efficient. Vision-Language Models (VLMs) have emerged as powerful reward providers. However, their computation and memory cost can be substantial, and optimizing a latent diffusion generator through a pixel-space reward introduces a domain mismatch that complicates alignment. In this paper, we propose \\textbf{DiNa-LRM}, a \\textbf{di}ffusion-\\textbf{na}tive \\textbf{l}atent \\textbf{r}eward \\textbf{m}odel that formulates preference learning directly on noisy diffusion states. Our method introduces a noise-calibrated Thurstone likelihood with diffusion-noise-dependent uncertainty. DiNa-LRM leverages a pretrained latent diffusion backbone with a timestep-conditioned reward head, and supports inference-time noise ensembling, providing a diffusion-native mechanism for test-time scaling and robust rewarding. Across image alignment benchmarks, DiNa-LRM substantially outperforms existing diffusion-based reward baselines and achieves competitive performance compared to state-of-the-art VLMs while maintaining a substantially lower computational cost. In preference optimization, we demonstrate that DiNa-LRM improves preference optimization dynamics, enabling faster and more resource-efficient model alignment.", "authors": "Gongye Liu, Bo Yang, Zhi Yida, Zhizhou Zhong, Lei Ke, Didan Deng, Han Gao, Yongxiang Huang, Kaihao Zhang, Hongbo Fu, Wenhan Luo", "icml_url": "https://icml.cc/virtual/2026/poster/62868", "is_oral": false, "is_spotlight": false, "poster_id": "62868", "presentation_type": "regular", "related_events": "", "title": "Beyond VLM-Based Rewards: Diffusion-Native Latent Reward Modeling", "sequence": 2394, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 358, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 80}, "raw_topic_score": 358, "selection_score": 358, "matched_terms": "preference learning, preference optimization, reward model, reward modeling, alignment, language model", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #2816", "poster_number": 2816, "poster_band": "#2000-#2999"}, {"abstract": "Adaptability has been regarded as a central feature in the foundation models, enabling them to effectively acclimate to unseen downstream tasks. Parameter-efficient fine-tuning methods such as celebrated LoRA facilitate efficient adaptation of large foundation models using labeled, high-quality and generally scarce task data. To mitigate data scarcity in fine-tuning of foundation models, we propose to leverage task similarity across downstream users. Intuitively, users with similar tasks must be able to assist each other in boosting the effective fine-tuning data size. We propose Collaborative Low-Rank Adaptation , or CoLoRA, which exploits task similarity to collaboratively and efficiently fine-tune personalized foundation models. The main idea in CoLoRA is to train one shared adapter capturing underlying task similarities across all tasks, and personalized adapters tailored to user-specific tasks. We theoretically study CoLoRA on heterogeneous linear regression and provide provable guarantees for ground truth recovery.  We also conduct several natural language experiments with varying task similarity, which further demonstrate that when trained together with similar tasks, individual performances are significantly boosted.", "authors": "Gagik Magakyan, Amirhossein Reisizadeh, Chanwoo Park, Pablo A. Parrilo, Asuman Ozdaglar", "icml_url": "https://icml.cc/virtual/2026/poster/61063", "is_oral": false, "is_spotlight": false, "poster_id": "61063", "presentation_type": "regular", "related_events": "", "title": "Collaborative and Efficient Fine-tuning: Leveraging Task Similarity", "sequence": 591, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 540, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 540, "selection_score": 540, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapter, adapt", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3002", "poster_number": 3002, "poster_band": "#3000-#3999"}, {"abstract": "High-fidelity measurements of continuum physical fields are essential for scientific discovery and engineering design but remain challenging under sparse and constrained sensing. Conventional reconstruction methods typically rely on fixed sensor layouts, which cannot adapt to evolving physical states. We propose LASER, a unified, closed-loop framework that formulates active sensing as a Partially Observable Markov Decision Process (POMDP). At its core, LASER employs a continuum field latent world model that captures the underlying physical dynamics and provides intrinsic reward feedback. This enables a reinforcement learning policy to simulate ''what-if'' sensing scenarios within a latent imagination space. By conditioning sensor movements on predicted latent states, LASER navigates toward potentially high-information regions beyond current observations. Our experiments demonstrate that LASER consistently outperforms static and offline-optimized strategies, achieving high-fidelity reconstruction under sparsity across diverse continuum fields.", "authors": "Huayu Deng, Jinghui Zhong, Xiangming Zhu, Yunbo Wang, Xiaokang Yang", "icml_url": "https://icml.cc/virtual/2026/poster/62307", "is_oral": true, "is_spotlight": true, "poster_id": "62307", "presentation_type": "oral", "related_events": "Oral presentation: Oral 1D DL: Representations & Distributions", "title": "LASER: Learning Active Sensing for Continuum Field Reconstruction", "sequence": 1834, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 118, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 298}, "raw_topic_score": 298, "selection_score": 738, "matched_terms": "active sensing, continuum field, world model", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3008", "poster_number": 3008, "poster_band": "#3000-#3999"}, {"abstract": "Fine-tuning-as-a-Service (FaaS) enables personalization of large language models (LLMs) but poses significant safety risks, as fine-tuning user-provided data degrades the model's safety-alignment. Prior works addressing this issue typically rely on explicit regularization, which leads
