<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICML 2026 Paper Itinerary</title>
  <style>
    :root {
      --ink: #17201b;
      --muted: #63706a;
      --line: #d7dfda;
      --panel: #ffffff;
      --wash: #f5f7f3;
      --accent: #196f63;
      --accent-2: #8a4f18;
      --award: #7a3d85;
      --rl: #315d93;
      --multi: #7b4f15;
      --llm: #8b3f46;
      --adapt: #6750a4;
      --robot: #4d6a2d;
      --core: #146253;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--wash);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px 10px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }
    input, select, button {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      min-height: 38px;
    }
    input, select { padding: 8px 10px; min-width: 0; }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .session-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 2px;
    }
    .session-nav button {
      white-space: nowrap;
      flex: 0 0 auto;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px 36px;
    }
    .session {
      margin: 0 0 24px;
      scroll-margin-top: 120px;
    }
    .session-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 2px solid var(--ink);
    }
    .session h2 {
      margin: 0;
      font-size: 20px;
    }
    .session-meta {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .band {
      margin-top: 16px;
    }
    .band h3 {
      margin: 0 0 8px;
      padding: 7px 10px;
      font-size: 14px;
      background: #e7ede8;
      border-left: 4px solid var(--accent);
    }
    .paper {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 8px 0;
    }
    .paper-line {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .poster-no {
      font-weight: 700;
      font-size: 18px;
      color: var(--accent);
      white-space: nowrap;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .authors {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #eef2ef;
      color: var(--ink);
      font-size: 12px;
      border: 1px solid transparent;
    }
    .badge.award { background: #f2e7f4; color: var(--award); border-color: #dec4e2; }
    .badge.oral { background: #f7e8d5; color: var(--accent-2); border-color: #edcfaa; }
    .badge.core { background: #e1f0ec; color: var(--core); }
    .badge.rl { background: #e5edf7; color: var(--rl); }
    .badge.multi { background: #f5ecd9; color: var(--multi); }
    .badge.llm { background: #f5e7e8; color: var(--llm); }
    .badge.adapt { background: #ece8f8; color: var(--adapt); }
    .badge.robot { background: #e8efdf; color: var(--robot); }
    details {
      margin-top: 8px;
      color: #303a35;
      font-size: 13px;
    }
    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 700;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hidden { display: none !important; }
    .empty {
      padding: 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
      .paper-line { grid-template-columns: 62px minmax(0, 1fr); }
      .poster-no { font-size: 16px; }
      .session-head { display: block; }
      .session-meta { text-align: left; margin-top: 4px; }
      main { padding-left: 10px; padding-right: 10px; }
      .topbar { padding-left: 10px; padding-right: 10px; }
    }
  </style>

  <script id="paperData" type="application/json">{"generatedAt": "2026-07-07 00:21", "sessions": [{"slot": "2026-07-06T18:30:00-07:00", "label": "Tue, Jul 7, 2026 10:30 KST", "icmlTime": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "count": 38, "rows": [{"abstract": "World models simulate environment dynamics from raw sensory inputs like video. However, using them for planning can be challenging due to the vast and unstructured search space. We propose a robust and highly parallelizable planner that  leverages the differentiability of the learned world model for efficient optimization, solving long-horizon control tasks from visual input. Our method treats states as optimization variables (\"virtual states\") with soft dynamics constraints, enabling parallel computation and easier optimization. To facilitate exploration and avoid local optima, we introduce stochasticity into the states. To mitigate sensitive gradients through high-dimensional vision-based world models, we modify the gradient structure to descend towards valid plans while only requiring action-input gradients. Our approach can be viewed as a stochastic version of a non-condensed or collocation-based optimal controller. We provide theoretical justification and experiments on video-based world models, where our resulting planner outperforms existing planning algorithms like the cross-entropy method (CEM) and vanilla gradient-based optimization (GD) on long-horizon experiments, both in success rate and time to convergence.", "authors": "Michael Psenka, Michael Rabbat, Aditi Krishnapriyan, Yann LeCun, Amir Bar", "icml_url": "https://icml.cc/virtual/2026/poster/64851", "is_oral": false, "is_spotlight": false, "poster_id": "64851", "presentation_type": "regular", "related_events": "", "title": "Parallel Stochastic Gradient-Based Planning for World Models", "sequence": 4375, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 124, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 178}, "raw_topic_score": 178, "selection_score": 178, "matched_terms": "world model, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #110", "poster_number": 110, "poster_band": "#0000-#0999"}, {"abstract": "Training LLMs as interactive agents for multi-turn decision-making remains challenging, particularly in long-horizon tasks with sparse and delayed rewards, where agents must execute extended sequences of actions before receiving meaningful feedback. Most existing reinforcement learning (RL) methods model LLM agents as flat policies operating at a single time scale, selecting an action at each turn. In sparse-reward settings, this forces the agent to infer long-range dependencies solely from distant end-of-trajectory signals, often leading to inefficient learning and unstable behavior in complex environments.  We propose HiPER , a novel Hi erarchical P lan– E xecute R L framework that jointly models and optimizes high-level subgoal planning and low-level action execution for LLM agents to overcome flat RL's brittle long-horizon behavior and weak credit assignment under sparse outcome feedback. By maintaining persistent subgoals across multiple turns and explicitly deciding when to switch between them, HiPER introduces structured intermediate decision points that facilitate learning under sparse feedback, converting implicit multi-turn structure into learnable decisions at different time scales. To enable effective training, we introduce Hierarchical Advantage Estimation (HAE), a two-timescale policy gradient method that assigns credit to both action execution and subgoal transitions and achieves variance reduction relative to flat advantage estimation.  Empirically, HiPER achieves state-of-the-art performance on challenging interactive benchmarks, reaching 97.4\\% success on ALFWorld (+6.6\\% over the best prior method) and 83.3\\% on WebShop, with especially large gains on long-horizon tasks requiring multiple dependent subtasks. These results highlight the importance of explicit hierarchical decomposition for scalable RL training of multi-turn LLM agents.", "authors": "Jiangweizhi Peng, Yuanxin Liu, Ruida Zhou, Charles Fleming, Zhaoran Wang, Alfredo Garcia, Mingyi Hong", "icml_url": "https://icml.cc/virtual/2026/poster/64058", "is_oral": false, "is_spotlight": false, "poster_id": "64058", "presentation_type": "regular", "related_events": "", "title": "HiPER: Hierarchical Plan–Execute RL for Multi-Turn LLM Agents", "sequence": 3583, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 62, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 312, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 16}, "raw_topic_score": 312, "selection_score": 312, "matched_terms": "policy gradient, llm, agent, agents, decision-making", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #111", "poster_number": 111, "poster_band": "#0000-#0999"}, {"abstract": "Recent advances in reinforcement learning (RL) using numerical rewards have significantly enhanced the complex reasoning capabilities of large language models (LLMs). However, we identify three fundamental limitations of purely numerical feedback: performance plateaus, ineffective spontaneous self-reflection, and persistent failures. We show that plateaued RL models can successfully refine failed solutions when given natural language critiques. Motivated by this, we propose Critique-GRPO, an online RL framework that integrates both natural language and numerical feedback for policy optimization. This approach enables LLMs to learn simultaneously from initial responses and critique-guided refinements, effectively internalizing the exploration benefits of both stages. Extensive experiments show that Critique-GRPO outperforms all compared supervised and RL-based fine-tuning methods, achieving average Pass@1 improvements of approximately +15.0-21.6% on various Qwen models and +7.3% on Llama-3.2-3B-Instruct across eight challenging reasoning tasks. Notably, Critique-GRPO facilitates effective self-improvement through self-critiquing, achieving substantial gains over GRPO, e.g., a +16.7% Pass@1 improvement on AIME 2024.", "authors": "Xiaoying Zhang, Yipeng Zhang, Hao Sun, Kaituo Feng, Chaochao Lu, Chao Yang, Helen M Meng", "icml_url": "https://icml.cc/virtual/2026/poster/62398", "is_oral": false, "is_spotlight": true, "poster_id": "62398", "presentation_type": "spotlight", "related_events": "", "title": "Advancing LLM Reasoning with Natural Language and Numerical Feedback", "sequence": 1925, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 92, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 254, "LLM adaptation & fine-tuning": 170, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 254, "selection_score": 299, "matched_terms": "grpo, large language model, llm, language model, reasoning", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #114", "poster_number": 114, "poster_band": "#0000-#0999"}, {"abstract": "Benchmarks play a central role in reinforcement learning (RL) research, yet their computational constraints often shape what is studied. Despite the motivation of lifelong learning, most continual RL papers consider only 3–10 sequential tasks, as CPU-bound environments make longer sequences impractical. Meanwhile, continual learning in cooperative multi-agent settings remains largely unexplored. To address these gaps, we introduce MEAL ( M ulti-agent E nvironments for A daptive L earning), the first benchmark for continual multi-agent RL. By leveraging JAX and GPU acceleration, MEAL enables training on sequences of 100 tasks on a single GPU in a few hours. We find that long task sequences reveal failure modes that do not appear at smaller scales.", "authors": "Tristan Tomilin, Luka van den Boogaard, Samuel Garcin, Constantin Ruhdorfer, Bram Grooten, Fabrice Kusters, Yali Du, Andreas Bulling, Mykola Pechenizkiy, Meng Fang", "icml_url": "https://icml.cc/virtual/2026/poster/64499", "is_oral": false, "is_spotlight": false, "poster_id": "64499", "presentation_type": "regular", "related_events": "", "title": "MEAL: A Benchmark for Continual Multi-Agent Reinforcement Learning", "sequence": 4023, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 508, "LLM post-training, RLHF & agents": 192, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 508, "selection_score": 508, "matched_terms": "multi-agent reinforcement learning, multi-agent rl, multi-agent, cooperative", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #116", "poster_number": 116, "poster_band": "#0000-#0999"}, {"abstract": "In RL post-training of LLM agents, calls to ex ternal tools take several seconds or even min- utes, leaving allocated GPUs idle and inflating post-training time and cost. While many tool invocations repeat across parallel rollouts and could in principle be cached, naively caching their outputs for reuse is incorrect since tool outputs  depend on the environment state induced by prior agent interactions. We present TVCACHE, a stateful tool-value cache for LLM agent post- training. TVCACHE maintains a tree of observed tool-call sequences and performs longest-prefix matching for cache lookups: a hit occurs only when the agent’s full tool history matches a previ- ously executed sequence, guaranteeing identical environment state. On three diverse workloads— terminal-based tasks, SQL generation, and video understanding—TVCACHE achieves cache hit rates of up to 70% and reduces median tool call execution time by up to 6.9×, with no degradation in post-training reward accumulation.", "authors": "Abhishek Vijaya Kumar, Bhaskar Kataria, Byungsoo Oh, Emaad Manzoor, Rachee Singh", "icml_url": "https://icml.cc/virtual/2026/poster/61148", "is_oral": false, "is_spotlight": false, "poster_id": "61148", "presentation_type": "regular", "related_events": "", "title": "Tvcache: A Tool-Value Cache for Post-Training LLM Agents", "sequence": 676, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 396, "LLM adaptation & fine-tuning": 70, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 396, "selection_score": 396, "matched_terms": "post-training, llm, agent, agents", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #118", "poster_number": 118, "poster_band": "#0000-#0999"}, {"abstract": "Learning domain adaptive policies that can generalize to unseen transition dynamics, remains a fundamental challenge in learning-based control. Substantial progress has been made through domain representation learning to capture domain-specific information, thus enabling domain-aware decision making. We analyze the process of learning domain representations through dynamical prediction and find that selecting contexts adjacent to the current step causes the learned representations to entangle static domain information with varying dynamical properties. Such mixture can confuse the conditioned policy, thereby constraining zero-shot adaptation. To tackle the challenge, we propose DADP (Domain Adaptive Diffusion Policy), which achieves robust adaptation through unsupervised disentanglement and domain-aware diffusion injection. First, we introduce Lagged Context Dynamical Prediction, a strategy that conditions future state estimation on a historical offset context; by increasing this temporal gap, we unsupervisedly disentangle static domain representations by filtering out transient properties. Second, we integrate the learned domain representations directly into the generative process by biasing the prior distribution and reformulating the diffusion target. Extensive experiments on challenging benchmarks across locomotion and manipulation demonstrate the superior performance, and the generalizability of DADP over prior methods.  More visualization results are available on the https://anonymous.4open.science/w/dadp-webpage-D841.", "authors": "Pengcheng Wang, Qinghang Liu, Haotian Lin, Yiheng Li, Guojian Zhan, Masayoshi Tomizuka, Yixiao Wang", "icml_url": "https://icml.cc/virtual/2026/poster/63942", "is_oral": false, "is_spotlight": false, "poster_id": "63942", "presentation_type": "regular", "related_events": "", "title": "DADP: Domain Adaptive Diffusion Policy", "sequence": 3467, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 314}, "raw_topic_score": 314, "selection_score": 554, "matched_terms": "diffusion policy, manipulation, control, diffusion", "selection_reasons": "user-named / must include", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #211", "poster_number": 211, "poster_band": "#0000-#0999"}, {"abstract": "Reparameterization Policy Gradient (RPG) has emerged as a powerful paradigm for model-based reinforcement learning, enabling high sample efficiency by backpropagating gradients through differentiable dynamics. However, prior RPG approaches have been predominantly restricted to Gaussian policies, limiting their performance and failing to leverage recent advances in generative models. In this work, we identify that flow policies, which generate actions via differentiable ODE integration, naturally align with the RPG framework, a connection not established in prior work. Yet, naively realizing this synergy is non-trivial: it often suffers from training instability and a lack of exploration. We propose Reparameterization Flow Policy Optimization (RFO). RFO computes policy gradients by backpropagating jointly through the flow generation process and system dynamics, unlocking high sample efficiency without requiring intractable log-likelihood calculations. RFO includes two tailored regularization terms for stability and exploration. We also propose a variant of RFO with action chunking. Extensive experiments on diverse locomotion and manipulation tasks—involving both rigid and soft bodies with state or visual inputs—demonstrate the effectiveness of RFO. Notably, on a challenging locomotion task controlling a soft-body quadruped, RFO achieves almost $2\\times$ the reward of the state-of-the-art baseline.", "authors": "Hai Zhong, Zhuoran Li, Xun Wang, Longbo Huang", "icml_url": "https://icml.cc/virtual/2026/poster/63464", "is_oral": false, "is_spotlight": false, "poster_id": "63464", "presentation_type": "regular", "related_events": "", "title": "Reparameterization Flow Policy Optimization", "sequence": 2989, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 196, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 40, "LLM adaptation & fine-tuning": 76, "Robotics, VLA & diffusion policy": 42}, "raw_topic_score": 196, "selection_score": 196, "matched_terms": "reinforcement learning, policy optimization, policy gradient, control, exploration", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #217", "poster_number": 217, "poster_band": "#0000-#0999"}, {"abstract": "Recent advances in vision-language-action (VLA) models for robotics have highlighted the importance of reliable uncertainty quantification in sequential tasks. However, assessing and improving calibration in such settings remains mostly unexplored, especially when only partial trajectories are observed. In this work, we formulate sequential calibration for episodic tasks, where task-success confidence is produced along an episode, while success is determined at the end of it. We introduce a sequential extension of the Brier score and show that, for binary outcomes, its risk minimizer coincides with the VLA policy’s value function. This connection bridges uncertainty calibration and reinforcement learning, enabling the use of temporal-difference (TD) value estimation as a principled calibration mechanism over time.  We empirically show that TD calibration improves performance relative to the state-of-the-art on simulated and real-robot data. Interestingly, we show that when calibrated using TD, the VLA's single-step action probabilities can yield competitive uncertainty estimates, in contrast to recent findings that employed different calibration techniques.", "authors": "Shelly Francis-Meretzki, Mirco Mutti, Yaniv Romano, Aviv Tamar", "icml_url": "https://icml.cc/virtual/2026/poster/63834", "is_oral": false, "is_spotlight": false, "poster_id": "63834", "presentation_type": "regular", "related_events": "", "title": "Temporal Difference Calibration in Sequential Tasks: Application to Vision-Language-Action Models", "sequence": 3359, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 418}, "raw_topic_score": 418, "selection_score": 418, "matched_terms": "vision-language-action, vla, robot, robotic, robotics", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #306", "poster_number": 306, "poster_band": "#0000-#0999"}, {"abstract": "End-to-end (E2E) autonomous driving has recently attracted increasing interest in unifying Vision–Language–Action (VLA) with World Models to enhance decision-making and forward-looking imagination. However, existing methods fail to effectively unify future scene evolution and action planning within a single architecture due to inadequate sharing of latent states, limiting the impact of visual imagination on action decisions. To address this limitation, we propose DriveWorld-VLA, a novel framework that unifies world modeling and planning within a latent space by tightly integrating VLA and world models at the representation level, which enables the VLA planner to benefit directly from holistic scene-evolution modeling and reducing reliance on dense annotated supervision. Additionally, DriveWorld-VLA incorporates the latent states of the world model as core decision-making states for the VLA planner, facilitating the planner to assess how candidate actions impact future scene evolution. By conducting world modeling entirely in the latent space, DriveWorld-VLA supports controllable, action-conditioned imagination at the feature level, avoiding expensive pixel-level rollouts. Extensive open-loop and closed-loop evaluations demonstrate the effectiveness of DriveWorld-VLA, which achieves state-of-the-art performance with 91.3 PDMS on NAVSIMv1, 86.8 EPDMS on NAVSIMv2, and 0.16 3-second average collision rate on nuScenes. Code and models will be publicly released.", "authors": "Feiyang Jia, Lin Liu, Ziying Song, Caiyan Jia, Hangjun Ye, Xiaoshuai Hao, Long Chen", "icml_url": "https://icml.cc/virtual/2026/poster/61191", "is_oral": false, "is_spotlight": false, "poster_id": "61191", "presentation_type": "regular", "related_events": "", "title": "DriveWorld-VLA: Unified Latent-Space World Modeling with Vision–Language–Action for Autonomous Driving", "sequence": 719, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 38, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 48, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 606}, "raw_topic_score": 606, "selection_score": 606, "matched_terms": "vla, world model, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #307", "poster_number": 307, "poster_band": "#0000-#0999"}, {"abstract": "Diagnosing complex diseases is inherently a sequential and iterative medical investigation process, in which a clinician strategically requests multiple rounds of diagnostic tests to differentiate among similar diseases until reaching a definitive diagnosis.  Although large language models show great potential as clinical assistants, they often struggle to navigate this complex interactive process, suffering from premature diagnostic closure. Furthermore, optimizing LLMs for such multi-round environments is frequently hindered by the challenge of reward sparsity and hacking. In this paper, we introduce $\\textbf{CompDiag-Bench}$, a benchmark that formalizes diagnosis as a sequential decision-making process where a clinician must strategically request diagnostic tests from a dynamic environment in order to reach a definitive diagnosis. To address this task, we propose $\\texttt{Salus}$, a multi-agent framework that decouples diagnostic reasoning into three specialized functional roles: a Differential Reasoner, a Strategic Controller, and a Workup Proposer.  $\\texttt{Salus}$ is optimized via multi-agent reinforcement learning employing structured rewards to calibrate strategic diagnostic behavior. Specifically, we leverage an LLM-as-a-Judge reward mechanism to provide dense, semantically-grounded feedback, designed to penalize premature closure and incentivize accurate differential diagnoses.  Experimental results show that our model, $\\texttt{Salus-7B}$, attains state-of-the-art Top-1 accuracy of $83.64\\%$ on complex cases, outperforming DeepSeek-V3.2 ($71.38\\%$) and achieving performance on par with GPT-5.2 ($80.30\\%$).", "authors": "Shuohao Gao, Xuanzhong Chen, Lingxiao Luo, Zilin Ding, Rong Han, Rui Jiang, Ting Chen", "icml_url": "https://icml.cc/virtual/2026/poster/64732", "is_oral": false, "is_spotlight": false, "poster_id": "64732", "presentation_type": "regular", "related_events": "", "title": "Salus: Strategic Diagnostic Testing for Complex Diagnosis via Multi-Agent Reinforcement Learning", "sequence": 4256, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 134, "Multi-agent RL, games & coordination": 490, "LLM post-training, RLHF & agents": 318, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 490, "selection_score": 490, "matched_terms": "multi-agent reinforcement learning, multi-agent", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #509", "poster_number": 509, "poster_band": "#0000-#0999"}, {"abstract": "While Large Language Models (LLMs) excel in certain reasoning tasks, they struggle in multi-agent games where the final outcome depends on the joint strategies of all agents. In multi-agent games, the non-stationarity of other agents brings significant challenges on the evaluation of the reasoning process and the credit assignment over multiple reasoning steps. Existing single-agent reinforcement learning (RL) approaches and their multi-agent extensions fail to address these challenges as they do not incorporate other agents in the reasoning process. In this work, we propose Strat-Reasoner, a novel RL-based framework that improves LLMs' strategic reasoning ability in multi-agent games. We introduce a novel recursive reasoning paradigm where an agent's reasoning also integrates other agents' reasoning processes. To provide effective reward signals for the intermediate reasoning sequences, we employ a centralized Chain-of-Thought (CoT) comparison module to evaluate the reasoning quality. Finally, we compute an accurate hybrid advantage and develop a group-relative RL approach to optimize the LLM policy.  Experimental results show that Strat-Reasoner substantially improves strategic abilities of underlying LLMs, achieving 22.1\\% average performance improvements across various multi-agent games. Our code is publicly available at https://anonymous.4open.science/r/Strat-Reasoner-3B04.", "authors": "Yidong He, Yutao Lai, Pengxu Yang, Jiarui Gan, Jiexin Wang, Yi Cai, Mengchen Zhao", "icml_url": "https://icml.cc/virtual/2026/poster/63649", "is_oral": false, "is_spotlight": false, "poster_id": "63649", "presentation_type": "regular", "related_events": "", "title": "Strat-Reasoner: Reinforcing Strategic Reasoning of LLMs in Multi-Agent Games", "sequence": 3174, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 644, "LLM post-training, RLHF & agents": 482, "LLM adaptation & fine-tuning": 126, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 644, "selection_score": 644, "matched_terms": "multi-agent, game, games", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #706", "poster_number": 706, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning (RL) has shown promising results in active flow control (AFC), yet progress in the field remains difficult to assess as existing studies rely on heterogeneous observation and actuation schemes, numerical setups, and evaluation protocols. Current AFC benchmarks attempt to address these issues but heavily rely on external computational fluid dynamics (CFD) solvers, are not fully differentiable, and provide limited 3D and multi-agent support. To overcome these limitations, we introduce FluidGym, the first standalone, fully differentiable benchmark suite for RL in AFC. Built entirely in PyTorch on top of the GPU-accelerated PICT solver, FluidGym runs in a single Python stack, requires no external CFD software, and provides standardized evaluation protocols. We present baseline results with PPO and SAC and release all environments, datasets, and trained models as public resources. FluidGym enables systematic comparison of control methods, establishes a scalable foundation for future research in learning-based flow control, and is available at https://anonymous.4open.science/r/fluidgym (anonymized mirror of our public repository).", "authors": "Jannis Becktepe, Aleksandra Franz, Nils Thuerey, Sebastian Peitz", "icml_url": "https://icml.cc/virtual/2026/poster/62198", "is_oral": false, "is_spotlight": false, "poster_id": "62198", "presentation_type": "regular", "related_events": "", "title": "Plug-and-Play Benchmarking of Reinforcement Learning Algorithms for Large-Scale Flow Control", "sequence": 1725, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 204, "Multi-agent RL, games & coordination": 42, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 72}, "raw_topic_score": 204, "selection_score": 204, "matched_terms": "reinforcement learning, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #1212", "poster_number": 1212, "poster_band": "#1000-#1999"}, {"abstract": "Effectively modeling non-stationary dynamics in probabilistic multivariate time series(MTS) forecasting requires balancing expressiveness with robustness. Existing parametric approaches benefit from strong inductive biases but lack flexibility, whereas deep generative models struggle to capture complex temporal dependencies without extensive data and compute. We introduce Parametric Prior Mapping (PPM), a framework that injects parametric structural priors into a generative modeling process. Specifically, PPM utilizes a parametric estimator to derive a dynamic, adaptive prior, which guides the learning of a complex predictive distribution via a learnable mapping. This design allows the model to retain the efficiency of parametric methods while exploiting the expressive power of generative models. Trained with a hybrid objective, PPM yields precise forecasts with well-calibrated uncertainty estimates. Empirical results show that PPM outperforms existing baselines in handling non-stationary data, offering a superior trade-off between accuracy and computational efficiency.", "authors": "Jinglin Li, Jun Tan, QI Fang, Ning Gui", "icml_url": "https://icml.cc/virtual/2026/poster/61351", "is_oral": false, "is_spotlight": false, "poster_id": "61351", "presentation_type": "regular", "related_events": "", "title": "Parametric Prior Mapping Framework for Non-stationary Probabilistic Time Series Forecasting", "sequence": 879, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 160, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 160, "selection_score": 160, "matched_terms": "non-stationary", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #1407", "poster_number": 1407, "poster_band": "#1000-#1999"}, {"abstract": "World models are essential for autonomous robotic planning. However, the substantial computational overhead of existing dense Transformer-based models significantly hinders real-time deployment. To address this efficiency-performance bottleneck, we introduce DDP-WM, a novel world model centered on the principle of Disentangled Dynamics Prediction (DDP). We hypothesize that latent state evolution in observed scenes is heterogeneous and can be decomposed into sparse primary dynamics driven by physical interactions and secondary context-driven background updates. DDP-WM realizes this decomposition through an architecture that integrates efficient historical processing with dynamic localization to isolate primary dynamics. By employing a cross-attention mechanism for background updates, the framework optimizes resource allocation and provides a smooth optimization landscape for planners. Extensive experiments demonstrate that DDP-WM achieves superior efficiency and performance across diverse tasks, including navigation, precise tabletop manipulation, and complex deformable or multi-body interactions. Specifically, on the challenging Push-T task, DDP-WM achieves an approximately 9 times inference speedup and improves the MPC success rate from 90% to 98% compared to state-of-the-art dense models.", "authors": "Shicheng Yin, Kaixuan Yin, Weixing Chen, Yang Liu, Guanbin Li, Liang Lin", "icml_url": "https://icml.cc/virtual/2026/poster/62480", "is_oral": false, "is_spotlight": false, "poster_id": "62480", "presentation_type": "regular", "related_events": "", "title": "DDP-WM: Disentangled Dynamics Prediction for Efficient World Models", "sequence": 2007, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 12, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 224}, "raw_topic_score": 224, "selection_score": 224, "matched_terms": "robot, robotic, manipulation, navigation, world model", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #1614", "poster_number": 1614, "poster_band": "#1000-#1999"}, {"abstract": "Personalizing large language models (LLMs) to individual user preferences is a critical step beyond generating generically helpful responses. However, current personalization methods are ill-suited for new users, as they typically require either slow, resource-intensive fine-tuning or a substantial amount of pre-existing user data, creating a significant cold-start problem. To address this challenge, we introduce a new paradigm for real-time personalization by learning from online pairwise preference feedback collected during text generation. We propose T-POP (Test-Time Personalization with Online Preference Feedback), a novel algorithm that synergistically combines test-time alignment with dueling bandits. Without updating the LLM parameters, T-POP steers the decoding process of a frozen LLM by learning a reward function online that captures user preferences. By leveraging dueling bandits, T-POP intelligently queries the user to efficiently balance between exploring their preferences and exploiting the learned knowledge to generate personalized text. Extensive experiments demonstrate that T-POP achieves rapid and data-efficient personalization, significantly outperforming existing baselines and showing consistent improvement with more user interactions.", "authors": "Zikun Qu, Min Zhang, Mingze Kong, Xiang Li, Zhiwei Shang, Zhiyong Wang, Yikun Ban, Shuang Qiu, Yao Shu, Zhongxiang Dai", "icml_url": "https://icml.cc/virtual/2026/poster/63328", "is_oral": false, "is_spotlight": false, "poster_id": "63328", "presentation_type": "regular", "related_events": "", "title": "T-POP: Test-Time Personalization with Online Preference Feedback", "sequence": 2853, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 112, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 92, "LLM adaptation & fine-tuning": 104, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 112, "selection_score": 112, "matched_terms": "bandit, bandits", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #1705", "poster_number": 1705, "poster_band": "#1000-#1999"}, {"abstract": "Reinforcement Learning from Human Feedback (RLHF) for Large Language Models increasingly relies on critic-free methods as a practical alternative to actor–critic training. Despite their simplicity, existing critic-free approaches propagate a trajectory-level learning signal uniformly across all tokens appearing in the trajectory. This requires full-trajectory update for every rollouts, leading to substantial optimization cost for long reasoning traces although the feedback signal is effectively determined early in the trajectory. We propose Prefix-Sampling Proximal Policy Optimization (PS-PPO), a compute-efficient critic-free method for RLHF that exploits this temporal redundancy. PS-PPO introduces a prompt-conditioned cutoff distribution and samples a cutoff timestep for each trajectory. Policy gradient updates are then applied only up to the sampled cutoff timestep, while a correction mechanism ensures that the resulting truncated gradient estimator remains unbiased with respect to the full-trajectory objective. This procedure bypasses later tokens whose contribution to the feedback signal is negligible, without distorting the underlying learning signal. Experiments on mathematical reasoning and RLHF benchmarks show that PS-PPO achieves large reductions in training compute and peak GPU memory, while maintaining accuracy comparable to strong critic-free baselines.", "authors": "Doo Hwan Hwang, Kee-Eung Kim", "icml_url": "https://icml.cc/virtual/2026/poster/62531", "is_oral": false, "is_spotlight": false, "poster_id": "62531", "presentation_type": "regular", "related_events": "", "title": "PS-PPO : Prefix-Sampling PPO for Critic-Free RLHF", "sequence": 2058, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 72, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 322, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 96}, "raw_topic_score": 322, "selection_score": 322, "matched_terms": "rlhf, policy gradient, large language model, language model, reasoning", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #1902", "poster_number": 1902, "poster_band": "#1000-#1999"}, {"abstract": "Large Language Models (LLMs) have achieved significant success across a wide range of tasks, serving as the cognitive backbone for Multi-Agent Systems (MAS) designed to orchestrate complex practical workflows. Given that MAS performance is highly sensitive to input prompts and many deployment scenarios preclude MAS architecture modifications, prompt optimization emerges as a critical strategy for performance enhancement. However, real-world deployment is impeded by three key challenges: (1) the need for high sample efficiency due to prohibitive evaluation costs, (2) topology-induced coupling among prompts, and (3) the combinatorial explosion of the search space. To address these challenges, we introduce MASPOB ( M ulti- A gent S ystem P rompt O ptimization via B andits), a novel sample-efficient framework based on bandits. By leveraging Upper Confidence Bound (UCB) to quantify uncertainty, the bandit framework balances exploration and exploitation, maximizing gains within a strictly limited budget. To handle topology-induced coupling, MASPOB integrates Graph Neural Networks (GNNs) to capture structural priors, learning topology-aware representations of prompt semantics. Furthermore, it employs coordinate ascent to decompose the optimization into univariate sub-problems, reducing search complexity from exponential to linear. Extensive experiments across diverse benchmarks demonstrate that MASPOB achieves state-of-the-art performance, consistently outperforming existing baselines.", "authors": "Zhi Hong, Qian Zhang, Jiahang Sun, Zhiwei Shang, Mingze Kong, Xiangyi Wang, Yao Shu, Zhongxiang Dai", "icml_url": "https://icml.cc/virtual/2026/poster/65791", "is_oral": false, "is_spotlight": true, "poster_id": "65791", "presentation_type": "spotlight", "related_events": "", "title": "MASPOB: Bandit-Based Prompt Optimization for Multi-Agent Systems with Graph Neural Networks", "sequence": 5314, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 168, "RL & control": 12, "Multi-agent RL, games & coordination": 168, "LLM post-training, RLHF & agents": 84, "LLM adaptation & fine-tuning": 80, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 168, "selection_score": 213, "matched_terms": "bandit, bandits", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #1916", "poster_number": 1916, "poster_band": "#1000-#1999"}, {"abstract": "Fine-tuning large language models (LLMs) on resource-constrained clients remains a challenging problem. Recent works have fused low-rank adaptation (LoRA) techniques with federated fine-tuning to mitigate challenges associated with client model sizes and data scarcity. Still, the heterogeneity of resources remains a critical bottleneck: while higher-rank modules generally enhance performance, varying client capabilities constrain LoRA's feasible rank range. Existing approaches attempting to resolve this issue either lack analytical justification or impose additional computational overhead, leaving a wide gap for efficient and theoretically-grounded solutions. To address these challenges, we propose federated sketching LoRA (FSLoRA), which leverages a sketching mechanism to enable clients to selectively update submatrices of global LoRA modules maintained by the server. By adjusting the sketching ratios, which determine the ranks of the submatrices on the clients, FSLoRA flexibly adapts to client-specific communication and computational constraints. We provide a rigorous convergence analysis of FSLoRA that characterizes how the sketching ratios affect the convergence rate. Through extensive experiments, we demonstrate that FSLoRA outperforms baselines and significantly improves training efficiency while preserving stable convergence.", "authors": "Wenzhi Fang, Dong-Jun Han, Liangqi Yuan, Seyyedali Hosseinalipour, Christopher G. Brinton", "icml_url": "https://icml.cc/virtual/2026/poster/61429", "is_oral": false, "is_spotlight": false, "poster_id": "61429", "presentation_type": "regular", "related_events": "", "title": "Federated Sketching LoRA: A Flexible Framework for Heterogeneous Collaborative Fine-Tuning of LLMs", "sequence": 957, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 86, "LLM adaptation & fine-tuning": 788, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 788, "selection_score": 788, "matched_terms": "fine-tuning, lora, low-rank adaptation, federated fine-tuning, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2002", "poster_number": 2002, "poster_band": "#2000-#2999"}, {"abstract": "Role specialization in multi-LLM agent systems is often realized via multi-LoRA, where agents share a pretrained backbone and differ only through lightweight adapters. Despite sharing base model weights, each agent independently builds and stores its own KV cache for the same long, tool-augmented trajectories, incurring substantial memory and compute overhead. Existing KV cache sharing methods largely overlook this multi-LoRA setting. We observe that, across agents, cache differences are dominated by adapter outputs, while activations from the shared pretrained backbone remain highly similar. Based on this observation, we propose LRAgent, a KV cache sharing framework for multi-LoRA agents that decomposes the cache into a shared base component from the pretrained weights and an adapter-dependent component from LoRA weights. LRAgent reduces memory overhead by sharing the base component and storing the adapter component in its inherent low-rank form, and further reduces compute overhead, enabled by shared-$A$ multi-LoRA architectures, by also sharing the low-rank cache and avoiding redundant computations for contexts already processed by other agents. To efficiently reconstruct adapter contributions at runtime, we introduce Flash-LoRA-Attention, a kernel that reorders attention computation to avoid materializing the low-rank cache to full dimension. LRAgent achieves throughput and time-to-first-token latency close to fully shared caching, while preserving accuracy near the non-shared caching baseline across agentic question-answering benchmarks.", "authors": "Hyesung Jeon, Hyeongju Ha, jae-joon kim", "icml_url": "https://icml.cc/virtual/2026/poster/61572", "is_oral": false, "is_spotlight": false, "poster_id": "61572", "presentation_type": "regular", "related_events": "", "title": "LRAgent: Efficient KV Cache Sharing for Multi-LoRA LLM Agents", "sequence": 1100, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 286, "LLM adaptation & fine-tuning": 568, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 568, "selection_score": 568, "matched_terms": "lora, adapter, adapt, llm", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2011", "poster_number": 2011, "poster_band": "#2000-#2999"}, {"abstract": "Low-rank adaptation (LoRA) is one of the most widely used parameter-efficient fine-tuning (PEFT) methods for adapting pre-trained large language models (LLMs) to downstream tasks. Although LoRA significantly reduces the number of trainable parameters and lowers fine-tuning costs, its performance is often limited by the inherent low-rank assumption. In this paper, we revisit the notion of rank for LoRA update matrices and show that the standard matrix rank fails to capture duplicated directions and redundancy in the update subspace. Motivated by this analysis, we argue that the Kruskal rank offers a more informative criterion for characterizing update diversity. We therefore propose **Low Kruskal Rank Adaptation** (LoKRA), a new PEFT algorithm with provable theoretical guarantees that mitigates the limitations of LoRA. We further introduce LoKRA$^+$, an enhanced variant that provides a tighter theoretical lower bound on the Kruskal rank and yields stronger empirical performance. Experiments on multiple LLMs show that our approach consistently outperforms LoRA and other baselines, establishing state-of-the-art performance across a range of benchmarks.", "authors": "Yixing Xu, Guanchen Li, Chao Li, Xuanwu Yin, Dong Li, Spandan Tiwari, Ashish Sirasao, Emad Barsoum", "icml_url": "https://icml.cc/virtual/2026/poster/63686", "is_oral": false, "is_spotlight": false, "poster_id": "63686", "presentation_type": "regular", "related_events": "", "title": "Low Kruskal-Rank Adaptation", "sequence": 3211, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 58, "LLM adaptation & fine-tuning": 454, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 454, "selection_score": 454, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2015", "poster_number": 2015, "poster_band": "#2000-#2999"}, {"abstract": "Monolithic agents in deep search often suffer from \"cognitive overload,\" while existing multi-agent approaches mostly rely on frozen models that cannot learn from collaboration failures. To bridge this gap, we propose $\\textbf{DECOR}$ ($\\textbf{DE}$compose and $\\textbf{CO}$llaborate via $\\textbf{R}$ole-specialized agents),  a framework formulating deep search as a Multi-Agent Reinforcement Learning (MARL) problem. DECOR functionally decomposes the task into three specialized roles: a $\\textit{Planner}$ to navigate, a $\\textit{Filter}$ to curate a noise-reduced memory, and an $\\textit{Answerer}$ for synthesis. Unlike training-free orchestration, we jointly optimize these agents using a hybrid reward strategy that harmonizes role-specific intrinsic feedback with team-level outcome signals. Experiments on seven benchmarks show that DECOR significantly outperforms strong monolithic baselines, demonstrating the necessity of learning-based functional decomposition in handling cognitive overload.", "authors": "Ruiqing Chen, Zekun Zhang, Gongduo Zhang, Lihong Gu, Lin Zhou", "icml_url": "https://icml.cc/virtual/2026/poster/62745", "is_oral": false, "is_spotlight": false, "poster_id": "62745", "presentation_type": "regular", "related_events": "", "title": "DECOR: Learning to Decompose and Collaborate in Deep Search via Multi-Agent Reinforcement Learning", "sequence": 2271, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 576, "LLM post-training, RLHF & agents": 286, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 576, "selection_score": 576, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, collaboration", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2110", "poster_number": 2110, "poster_band": "#2000-#2999"}, {"abstract": "Asynchronous reinforcement learning (RL) has shown notable success in accelerating the post-training of large language models (LLMs). However, its decoupled data generation and training paradigm introduces a fundamental distributional mismatch between data generated by stale behavior policies and current policy, leading to unstable training and degraded performance. To address this challenge, we propose D-ARL, a **D**istribution-matched **A**synchronous **R**einforcement **L**earning framework that selects high-quality asynchronous samples whose distributions are well aligned with the current policy for policy optimization. Specifically, D-ARL maintains a replay buffer that collects samples from the most recent $K$ behavior policies and proposes a variance-guided metric to select distribution-matched data. During training, D-ARL introduces a multi-behavior policy optimization algorithm to leverage the multi-source nature of the selected samples for policy update. Experiments on six widely used reasoning benchmarks show that D-ARL outperforms state-of-the-art asynchronous methods, achieving an average improvement of 6.4\\% in reasoning performance and 34.7\\% in sample efficiency.", "authors": "白 寅岐, Xialiang Tong, Jie Wang, Hongyu Liu, Longdi Pan, Jiashuo Li, Zehao Wang, Jianye Hao, Mingxuan Yuan, Feng Wu", "icml_url": "https://icml.cc/virtual/2026/poster/60620", "is_oral": false, "is_spotlight": false, "poster_id": "60620", "presentation_type": "regular", "related_events": "", "title": "D-ARL: A Distribution-Matched Asynchronous Reinforcement Learning Framework for Language Reasoning", "sequence": 149, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 164, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 130, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 164, "selection_score": 164, "matched_terms": "reinforcement learning, policy optimization", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2111", "poster_number": 2111, "poster_band": "#2000-#2999"}, {"abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) is an effective paradigm for improving the reasoning capabilities of large language models. However, existing RLVR methods utilize rollouts in an indiscriminate and short-horizon manner: responses of heterogeneous quality within each prompt are treated uniformly, and historical rollouts are discarded after a single use. This leads to noisy supervision, poor sample efficiency, and suboptimal policy updates. We address these issues by formulating rollout scheduling in RLVR as a contextual bandit problem and proposing a unified neural scheduling framework that adaptively selects high-value rollouts throughout training. Each rollout is treated as an arm whose reward is defined by the induced performance gain between consecutive optimization steps. The resulting scheduler supports both noise-aware intra-group selection and adaptive global reuse of historical rollouts within a single principled framework. We provide theoretical justification by deriving sublinear regret bounds and showing that enlarging the rollout buffer improves the achievable performance upper bound. Experiments on six mathematical reasoning benchmarks demonstrate consistent gains in performance and training efficiency across multiple RLVR optimization methods.", "authors": "Xiaodong Lu, Xiaohan Wang, Jiajun Chai, Guojun Yin, Wei Lin, Zhijun Chen, Yu Luo, Fuzhen Zhuang, Yikun Ban, deqing wang", "icml_url": "https://icml.cc/virtual/2026/poster/60796", "is_oral": false, "is_spotlight": false, "poster_id": "60796", "presentation_type": "regular", "related_events": "", "title": "Contextual Rollout Bandits for Reinforcement Learning with Verifiable Rewards", "sequence": 325, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 248, "RL & control": 128, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 162, "LLM adaptation & fine-tuning": 44, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 248, "selection_score": 248, "matched_terms": "bandit, bandits, contextual bandit, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2112", "poster_number": 2112, "poster_band": "#2000-#2999"}, {"abstract": "Recent diffusion large language models (dLLMs) have demonstrated both effectiveness and efficiency in reasoning via a block-based semi-autoregressive generation paradigm. Despite their progress, the fixed-size block generations remain a critical bottleneck for effective and coherent reasoning. (I) From a global perspective, different reasoning tasks would correspond to different optimal decoding block sizes, which makes a \"one-size-fits-all\" assumption ineffective. (II) Even within a single reasoning task, the rigid block partitioning would break the logical flow and reduce reasoning coherence. Through empirical observations, we reveal that, for block-wise entropy, incorrect reasoning exhibits a fluctuating and unsteady trend between blocks, while the correctly generated tasks follow a consistent descending paradigm. Therefore, this paper proposes b1, a novel post-training framework that learns dynamic-size reasoning blocks via a Monotonic Entropy Descent objective with reinforcement learning to enhance reasoning coherence. b1 integrates seamlessly as a plug-and-play module with existing dLLM's post-training algorithms. Extensive experiments across various reasoning benchmarks showcase b1's consistent improvement over fixed-size block baselines. Our code has been provided.", "authors": "Yan Jiang, Ruihong Qiu, Zi Huang", "icml_url": "https://icml.cc/virtual/2026/poster/66581", "is_oral": false, "is_spotlight": false, "poster_id": "66581", "presentation_type": "regular", "related_events": "", "title": "Break the Block: Dynamic-size Reasoning Blocks for Diffusion Large Language Models via Monotonic Entropy Descent with Reinforcement Learning", "sequence": 6100, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 340, "LLM adaptation & fine-tuning": 140, "Robotics, VLA & diffusion policy": 32}, "raw_topic_score": 340, "selection_score": 340, "matched_terms": "post-training, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2208", "poster_number": 2208, "poster_band": "#2000-#2999"}, {"abstract": "While continuous diffusion models have achieved remarkable success, discrete diffusion offers a unified framework for jointly modeling text and images. Beyond unification, discrete diffusion provides faster inference, finer control, and principled training-free guidance, making it well-suited for posterior sampling. Existing approaches to posterior sampling using discrete diffusion face severe challenges: derivative-free guidance yields sparse signals, continuous relaxations limit applicability, and split Gibbs samplers suffer from the curse of dimensionality. To overcome these limitations, we introduce Anchored Posterior Sampling (APS), built on two key innovations: quantized expectation for gradient-like guidance in discrete embedding space, and anchored remasking for adaptive decoding. APS achieves state-of-the-art performance among discrete diffusion samplers on both linear and nonlinear inverse problems across the standard image benchmarks. We demonstrate the generality of APS through training-free stylization and text-guided editing. We further apply APS to a large-scale diffusion language model, showing consistent improvement in question answering.", "authors": "Litu Rout, Andreas Lugmayr, Yasamin Jafarian, Srivatsan Varadharajan, Constantine Caramanis, Sanjay Shakkottai, Ira Kemelmacher-Shlizerman", "icml_url": "https://icml.cc/virtual/2026/poster/61295", "is_oral": false, "is_spotlight": false, "poster_id": "61295", "presentation_type": "regular", "related_events": "", "title": "Test-Time Anchoring for Discrete Diffusion Posterior Sampling", "sequence": 823, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 158, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 12, "LLM adaptation & fine-tuning": 20, "Robotics, VLA & diffusion policy": 84}, "raw_topic_score": 158, "selection_score": 158, "matched_terms": "posterior sampling, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2500", "poster_number": 2500, "poster_band": "#2000-#2999"}, {"abstract": "Controllable diffusion generation often relies on various heuristics that are seemingly disconnected without a unified understanding. We bridge this gap with Diffusion Controller (DiffCon), a unified control-theoretic view that casts reverse diffusion sampling as state-only stochastic control within (generalized) linearly-solvable Markov Decision Processes (LS-MDPs). Under this framework, control acts by reweighting the pretrained reverse-time transition kernels, balancing terminal objectives against an $f$-divergence cost. From the resulting optimality conditions, we derive practical reinforcement learning methods for diffusion fine-tuning: (i) $f$-divergence-regularized policy-gradient updates, including a PPO-style rule, and (ii) a regularizer-determined reward-weighted regression objective with a minimizer-preservation guarantee under the Kullback–Leibler (KL) divergence. The LS-MDP framework further implies a principled model form: the optimal score decomposes into a fixed pretrained baseline plus a lightweight control correction, motivating a side-network parameterization conditioned on exposed intermediate denoising outputs, enabling effective \\emph{gray-box adaptation} with a frozen backbone. Experiments on Stable Diffusion v1.4 across supervised and reward-driven finetuning show consistent gains in preference-alignment win rates and improved quality–efficiency trade-offs versus gray-box baselines and even the parameter-efficient white-box adapter LoRA.", "authors": "Tong Yang, Moonkyung Ryu, Chih-wei Hsu, Guy Tennenholtz, Yuejie Chi, Craig Boutilier, Bo Dai", "icml_url": "https://icml.cc/virtual/2026/poster/64970", "is_oral": false, "is_spotlight": false, "poster_id": "64970", "presentation_type": "regular", "related_events": "", "title": "Latent Diffusion Controller: Framework, Algorithms and Parameterization", "sequence": 4494, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 246, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 190, "Robotics, VLA & diffusion policy": 172}, "raw_topic_score": 246, "selection_score": 246, "matched_terms": "reinforcement learning, markov decision, mdp, control", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2613", "poster_number": 2613, "poster_band": "#2000-#2999"}, {"abstract": "Recent studies have demonstrated the efficacy of integrating Group Relative Policy Optimization (GRPO) into flow matching models, particularly for text-to-image and text-to-video generation. However, we find that directly applying these techniques to image-to-video (I2V) models often fails to yield consistent reward improvements. To address this limitation, we present TAGRPO, a robust post-training framework for I2V models inspired by contrastive learning. Our approach is grounded in the observation that rollout videos generated from identical initial noise provide superior guidance for optimization. Leveraging this insight, we propose a novel GRPO loss applied to intermediate latents, encouraging direct alignment with high-reward trajectories while maximizing distance from low-reward counterparts. Furthermore, we introduce a memory bank for rollout videos to enhance diversity and reduce computational overhead. Despite its simplicity, TAGRPO achieves significant improvements over DanceGRPO in I2V generation. Code and models will be made publicly available.", "authors": "Jin Wang, Jianxiang Lu, Xu Guangzheng, Comi Chen, Haoyu Yang, zhenzhen qin, Peng Chen, Mingtao Chen, Zhichao hu, Longhuang Wu, Shuai Shao, Qinglin Lu, Ping Luo", "icml_url": "https://icml.cc/virtual/2026/poster/64473", "is_oral": false, "is_spotlight": false, "poster_id": "64473", "presentation_type": "regular", "related_events": "", "title": "TAGRPO: Boosting GRPO on Image-to-Video Generation with Direct Trajectory Alignment", "sequence": 3997, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 22, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 402, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 48}, "raw_topic_score": 402, "selection_score": 402, "matched_terms": "grpo, post-training, alignment", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2805", "poster_number": 2805, "poster_band": "#2000-#2999"}, {"abstract": "Heterogeneous LoRA-rank methods address system heterogeneity in federated fine-tuning of foundation models by assigning client-specific ranks based on computational capabilities. However, these methods achieve only marginal computational savings, as dense feed-forward computations dominate. Sparse Mixture-of-Experts (SMoE) provides a promising alternative through conditional computation, yet we identify that its naive application to heterogeneous federated settings introduces two critical discordances: (i) expert utilization imbalance and (ii) non-differentiability of Top-K routing. Our convergence analysis demonstrates that these discordances lead to degraded convergence, particularly for resource-constrained clients. To address these challenges, we propose Universally Balanced Sparse Mixture-of-Experts (UB-SMoE), which introduces Dynamic Modulated Routing (DMR) to rebalance expert utilization, and Universal Pseudo-Gradient (PG) to reconstruct learning signals for non-activated experts. These mechanisms form a self-reinforcing cycle that maintains expert viability across heterogeneous clients. Experiments on benchmarks show that UB-SMoE achieves up to $45.0\\%$ computational reduction on low-resource clients while improving their performance by $8.7 \\times$ compared to existing heterogeneous LoRA-rank methods.", "authors": "Van-Tuan Tran, Hong-Hanh Nguyen-Le, Merim Dzaferagic, Marco Ruffini", "icml_url": "https://icml.cc/virtual/2026/poster/61663", "is_oral": false, "is_spotlight": false, "poster_id": "61663", "presentation_type": "regular", "related_events": "", "title": "UB-SMoE: Universally Balanced Sparse Mixture-of-Experts for Resource-adaptive Federated Fine-tuning of Foundation Models", "sequence": 1191, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 436, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 436, "selection_score": 436, "matched_terms": "fine-tuning, lora, federated fine-tuning, adapt", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #2806", "poster_number": 2806, "poster_band": "#2000-#2999"}, {"abstract": "Self-evolving large language model (LLM) agents continually improve by accumulating and reusing past experience, yet it remains unclear whether they faithfully rely on that experience to guide their behavior. We present the first systematic investigation of \\emph{experience faithfulness}—the causal dependence of an agent's decisions on the experience it is given—in self-evolving LLM agents. Using controlled causal interventions on both raw and condensed forms of experience, we comprehensively evaluate four representative frameworks across 10 LLM backbones and 9 environments. Our analysis uncovers a striking asymmetry: while agents consistently depend on raw experience, they often disregard or misinterpret condensed experience, even when it is the only experience provided. This gap persists across single- and multi-agent configurations and across backbone scales. We trace its underlying causes to three factors: the semantic limitations of condensed content, internal processing biases that suppress experience, and task regimes where pretrained priors already suffice. These findings challenge prevailing assumptions about self-evolving methods and underscore the need for more faithful and reliable approaches to experience integration.", "authors": "Weixiang Zhao, Yingshuo Wang, Yichen Zhang, Yang Deng, Yanyan Zhao, Wanxiang Che, Bing Qin, Ting Liu", "icml_url": "https://icml.cc/virtual/2026/poster/62034", "is_oral": false, "is_spotlight": false, "poster_id": "62034", "presentation_type": "regular", "related_events": "", "title": "Large Language Model Agents Are Not Always Faithful Self-Evolvers", "sequence": 1561, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 42, "LLM post-training, RLHF & agents": 302, "LLM adaptation & fine-tuning": 154, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 302, "selection_score": 302, "matched_terms": "large language model, llm, language model, agent, agents", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #3406", "poster_number": 3406, "poster_band": "#3000-#3999"}, {"abstract": "Direct Preference Optimization (DPO) guides large language models (LLMs) to generate recommendations aligned with user historical behavior distributions by minimizing preference alignment loss. However, our systematic empirical research and theoretical analysis reveal that DPO tends to amplify spurious correlations caused by environmental confounders during the alignment process, significantly undermining the generalization capability of LLM-based generative recommendation methods in out-of-distribution (OOD) scenarios. To mitigate this issue, we propose CausalDPO, an extension of DPO that incorporates a causal invariance learning mechanism. This method introduces a backdoor adjustment strategy during the preference alignment phase to eliminate interference from environmental confounders, explicitly models the latent environmental distribution using a soft clustering approach, and enhances robust consistency across diverse environments through invariance constraints. Theoretical analysis demonstrates that CausalDPO can effectively capture users' stable preference structures across multiple environments, thereby improving the OOD generalization performance of LLM-based recommendation models. We conduct extensive experiments under four representative distribution shift settings to validate the effectiveness of CausalDPO, achieving an average performance improvement of 24.10\\% across four evaluation metrics.", "authors": "Chu Zhao, Enneng Yang, Jianzhe Zhao, Guibing Guo", "icml_url": "https://icml.cc/virtual/2026/poster/63635", "is_oral": false, "is_spotlight": false, "poster_id": "63635", "presentation_type": "regular", "related_events": "", "title": "Causal Direct Preference Optimization for Distributionally Robust Generative Recommendation", "sequence": 3160, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 400, "LLM adaptation & fine-tuning": 70, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 400, "selection_score": 400, "matched_terms": "preference optimization, dpo, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Tue, Jul 7, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T18:30:00-07:00", "location": "HALL A #3911", "poster_number": 3911, "poster_band": "#3000-#3999"}, {"abstract": "Standard on-policy reinforcement learning relies on heuristic clipping to enforce trust regions, but this mechanism imposes a severe cost by indiscriminately truncating high-return yet high-divergence updates. We demonstrate that explicitly constraining the *policy ratio **variance*** provides a principled local approximation to trust-region constraints, eliminating the need for binary hard clipping. By acting as a distributional ''soft brake'', this approach preserves critical gradient signals from novel discoveries while naturally down-weighting and enabling the reuse of stale, off-policy data. We introduce **R$^2$VPO** (Ratio-Variance Regularized Policy Optimization), which implements this constraint via a primal–dual optimization framework. Extensive evaluations across $7$ LLM scales, spanning both fast and slow reasoning paradigms, and
