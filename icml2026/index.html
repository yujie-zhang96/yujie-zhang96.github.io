asons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2002", "poster_number": 2002, "poster_band": "#2000-#2999"}, {"abstract": "Maximum likelihood is fundamental to supervised learning but it cannot be directly applied in correctness-based problems with non-differentiable sampling. In these settings, reinforcement learning (RL) is typically used to maximize expected reward. We show that for binary correctness tasks, expected-reward RL is a first-order approximation of the maximum likelihood objective, yielding vanishing learning signal on low-success inputs. We introduce **Maximum Likelihood Reinforcement Learning (MaxRL)**, a compute-indexed family of sampling-based objectives derived from a pass@k expansion of the likelihood, which interpolates between standard RL and exact maximum likelihood as compute increases. MaxRL admits a simple unbiased policy-gradient estimator whose optimized objective improves with additional compute. Across multiple domains, MaxRL consistently outperforms standard RL and GRPO, achieving higher $pass@1$ and substantially improved $pass@k$.", "authors": "Fahim Tajwar, Guanning Zeng, Yueer Zhou, Yuda Song, Daman Arora, Yiding Jiang, Jeff Schneider, Russ Salakhutdinov, Haiwen Feng, Andrea Zanette", "icml_url": "https://icml.cc/virtual/2026/poster/65332", "is_oral": true, "is_spotlight": true, "poster_id": "65332", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2E Reinforcement Learning: Theory", "title": "Maximum Likelihood Reinforcement Learning", "sequence": 4856, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 150, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 596, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 596, "selection_score": 926, "matched_terms": "grpo, maximum likelihood reinforcement learning, maxrl", "selection_reasons": "oral, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2006", "poster_number": 2006, "poster_band": "#2000-#2999"}, {"abstract": "Diffusion Large Language Models (dLLMs) have emerged as a promising non-autoregressive generative paradigm. Given the prohibitive computational cost of full fine-tuning, Parameter-Efficient Fine-Tuning (PEFT) has become the standard approach. However, existing PEFT methods (e.g., LoRA), originally tailored for autoregressive models, rely on static parameters that are agnostic to the noise level. Consequently, they ignore the intrinsic dynamics of the diffusion process, where input distributions and generation difficulty shift significantly along the denoising trajectory, rendering them suboptimal for dLLMs. To address this, we propose N oise- a ware Low- R ank A daptation (NaRA), which introduces a low-rank core matrix generated by a lightweight, globally shared hypernetwork conditioned on the noise level. This design enables the update matrices to vary continuously along the diffusion process while keeping parameter and latency overhead negligible. We provide a theoretical justification for the proposed NaRA framework and empirically demonstrate consistent improvements over noise-agnostic baselines across commonsense reasoning, mathematical reasoning, and code generation benchmarks.", "authors": "Shuaidi Wang, Zhan Zhuang, HUANG Ruping, Yu Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/61250", "is_oral": false, "is_spotlight": false, "poster_id": "61250", "presentation_type": "regular", "related_events": "", "title": "NaRA: Noise-Aware LoRA for Parameter-Efficient Fine-Tuning of Diffusion LLMs", "sequence": 778, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 120, "LLM adaptation & fine-tuning": 588, "Robotics, VLA & diffusion policy": 64}, "raw_topic_score": 588, "selection_score": 588, "matched_terms": "fine-tuning, parameter-efficient, lora, large language model, language model, llm", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2013", "poster_number": 2013, "poster_band": "#2000-#2999"}, {"abstract": "We study continual pre-training (CPT) as a mechanism for adapting general-purpose large language models to specialized domains: mathematics, instruction, code, and natural text. Using singular value decomposition of weight matrices, we find that CPT leaves singular value spectra largely invariant, with adaptation driven mainly by changes in singular vectors. An analysis of attention-head projection matrices reveals strong, domain-dependent head heterogeneity , which we exploit to define a head-importance criterion: up to 60\\% of head updates can be removed without measurable quality loss. Selectively rewinding low-importance heads to their pre-trained state improves benchmark accuracy by up to 4\\% versus the fully trained baseline. Finally, we identify domain connectivity —linear interpolation between CPT checkpoints yields smooth domain-quality interpolation without notable degradation on either domain—and release Diffract, an open-source toolkit for scalable spectral analysis of billion-parameter models.", "authors": "Nikita Borodin, Maria Krylova, Artem Zabolotnyi, Dmitry Aspisov, Egor Shikov, Nikita Tyuplyaev, Oleg Travkin, Roman Alferov, Dmitry Vinichenko", "icml_url": "https://icml.cc/virtual/2026/poster/63441", "is_oral": true, "is_spotlight": true, "poster_id": "63441", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2G Theory: Deep Learning Expressivity", "title": "Diffract: Spectral View of LLM Domain Adaptation", "sequence": 2966, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 72, "LLM adaptation & fine-tuning": 236, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 236, "selection_score": 566, "matched_terms": "domain adaptation, adapt, large language model, language model, llm", "selection_reasons": "oral, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2206", "poster_number": 2206, "poster_band": "#2000-#2999"}, {"abstract": "A central goal of large language model (LLM) research is to build agentic systems that can plan, act, and adapt through sustained interaction with dynamic environments. While recent LLM-based agents exhibit impressive contextual reasoning, their long-horizon decision-making remains fragile, often suffering from $\\textit{objective drift}$, where goals and plans drift over extended interactions. We introduce $\\texttt{Multi}^2$, a hierarchical multi-agent decision-making framework that explicitly decomposes agent behavior into complementary roles. A high-level agent ($\\texttt{System 1}$) focuses on context-aware sub-goal generation using supervised fine-tuning (SFT), while a low-level agent ($\\texttt{System 2}$) executes atomic actions through offline-to-online reinforcement learning (RL) in interactive environments. This separation enables stable long-horizon control, mitigates objective drift, and allows efficient adaptation. Across diverse interactive environments, $\\texttt{Multi}^2$ consistently outperforms strong agentic baselines, demonstrating improved robustness and coordination in multi-turn interaction. Beyond performance, we introduce and release three hierarchical benchmark datasets, filling a long-standing gap in training and evaluating hierarchical decision-making for LLM-based agents.", "authors": "Sangeun Park, Minhae Kwon", "icml_url": "https://icml.cc/virtual/2026/poster/65074", "is_oral": false, "is_spotlight": false, "poster_id": "65074", "presentation_type": "regular", "related_events": "", "title": "$\\texttt{Multi}^2$: Hierarchical Multi-Agent Decision-Making with LLM-Based Agents in Interactive Environments", "sequence": 4598, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 44, "Multi-agent RL, games & coordination": 198, "LLM post-training, RLHF & agents": 458, "LLM adaptation & fine-tuning": 162, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 458, "selection_score": 458, "matched_terms": "large language model, llm, language model, reasoning, agent, agents, decision-making", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2315", "poster_number": 2315, "poster_band": "#2000-#2999"}, {"abstract": "In closed-loop multi-turn agent reinforcement learning, LLM agents exhibit reasoning collapse,  where reasoning shift toward generic templates, weakly coupled to the inputs. We firstly identify that such collapse is easy to miss with entropy or surface diversity metrics since reasoning text still varies but becomes input-agnostic. We then propose an information-theoretic decomposition of reasoning variable $Z$'s variation into conditional entropy $H(Z \\mid X)$ (randomness under same input) and mutual information (MI) $I(X; Z)$ (input dependence). Template collapse occurs when $H(Z \\mid X)$ stays high while $I(X; Z)$ drops, yielding diverse-looking but generic reasoning. To make $I(X; Z)$ a reproducible and sanity-checkable diagnostic, we further introduce an MI-style retrieval protocol treating each reasoning trace $Z$ as a query to retrieve its source $X$ from a minibatch; accuracy degrades toward chance under collapse.  We thus provide a signal-to-noise ratio explanation for why $I(X; Z)$ drops: when within-input reward variance $\\mathrm{Var}(R \\mid X)$ is low, task gradients weaken and input-agnostic regularizers (KL, entropy) dominate, flattening cross-input differences. Finally, we propose reward-variance-aware filtering to prioritize high-signal updates. Across multi-turn environments, model scales, and modalities (including VLMs), this improves input dependence, stability, and performance while remaining competitive with state-of-the-art stabilization baselines.", "authors": "Zihan (Zenus) Wang, Chi Gui, Xing Jin, Qineng Wang, Licheng Liu, Kangrui Wang, Shiqi Chen, Linjie Li, Zhengyuan Yang, Pingyue Zhang, Yiping Lu, Jiajun Wu, Li Fei-Fei, Lijuan Wang, Yejin Choi, Manling Li", "icml_url": "https://icml.cc/virtual/2026/poster/66821", "is_oral": true, "is_spotlight": true, "poster_id": "66821", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2B LLM Reasoning", "title": "Understanding Reasoning Collapse in LLM Agent Reinforcement Learning", "sequence": 6339, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 430, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 430, "selection_score": 870, "matched_terms": "llm, reasoning, agent, agents, closed-loop multi-turn agent, agent reinforcement learning", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2608", "poster_number": 2608, "poster_band": "#2000-#2999"}, {"abstract": "Direct Preference Optimization (DPO) has emerged as a popular alternative to Reinforcement Learning from Human Feedback (RLHF), offering theoretical equivalence with simpler implementation. We prove this equivalence is conditional rather than universal, depending on an implicit assumption frequently violated in practice: the RLHF-optimal policy must prefer human-preferred responses. When this assumption fails, DPO optimizes relative advantage over the reference policy rather than absolute alignment with human preferences, leading to pathological convergence where policies decrease DPO loss while preferring dispreferred responses. We characterize when this assumption is violated, show the existence of an undesirable solution space, and prove that DPO and RLHF optimize fundamentally different objectives in such cases. To address this, we introduce Constrained Preference Optimization (CPO), augmenting RLHF with constraints for provable alignment. We further provide a geometric interpretation through soft margin ranking, revealing DPO implements margin ranking with potentially negative targets. Our theoretical analysis establishes when DPOs' guarantees hold and provides solutions preserving simplicity with provable alignment. Comprehensive experiments on standard benchmarks demonstrate that CPO achieves state-of-the-art performance.", "authors": "Yonggang Zhang, Zhiqin Yang, Wei Xue, Dong Fang, Bo Han, Yike Guo", "icml_url": "https://icml.cc/virtual/2026/poster/66055", "is_oral": false, "is_spotlight": true, "poster_id": "66055", "presentation_type": "spotlight", "related_events": "", "title": "Conditional Equivalence of DPO and RLHF: Assumptions, Failure Modes, and Provable Alignment", "sequence": 5578, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 680, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 680, "selection_score": 725, "matched_terms": "rlhf, preference optimization, dpo, alignment", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #2708", "poster_number": 2708, "poster_band": "#2000-#2999"}, {"abstract": "Reinforcement learning (RL) has become essential to the reasoning and alignment post-training of large language models (LLMs). However, successful RL relies on sufficient exploration of diverse actions by the model during training. We study whether RL is robust to exploration hacking , where a model strategically alters its exploration during training to influence the subsequent training outcome. First, we create model organisms of exploration hacking by using fine-tuning-based \"locking\" techniques; we show that these models can successfully resist RL-based capability elicitation in AI R&D and agentic biosecurity environments, while maintaining performance on closely related tasks. Next, we use our model organisms to evaluate the effectiveness of monitoring techniques as detection methods for exploration hacking. Finally, we show that current frontier models can reason effectively about suppressing their exploration when presented with simulated RL environments and encouraged to act strategically. Together, our results empirically establish exploration hacking as a failure mode of RL on sufficiently capable LLMs.", "authors": "Eyon Jang, Damon Falck, Joschka Cedric Braun, Nathalie Kirch, Achyutha Menon, Perusha Moodley, Scott Emmons, Roland S. Zimmermann, David Lindner", "icml_url": "https://icml.cc/virtual/2026/poster/64674", "is_oral": false, "is_spotlight": false, "poster_id": "64674", "presentation_type": "regular", "related_events": "", "title": "Exploration Hacking: LLMs Can Learn to Resist RL Training", "sequence": 4198, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 150, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 176, "LLM adaptation & fine-tuning": 512, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 512, "selection_score": 512, "matched_terms": "fine-tuning, lora, large language model, language model, llm", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #3101", "poster_number": 3101, "poster_band": "#3000-#3999"}, {"abstract": "Post-training alignment of large language models (LLMs) relies on large-scale human annotations guided by policy specifications that change over time. Cultural shifts, value reinterpretations, and regulatory or industrial updates make static alignment increasingly brittle. As policies evolve, deployed models can diverge from current alignment objectives, creating an Alignment–Reality Gap that is difficult to audit or correct. Existing remediation typically requires re-annotation under revised guidelines, which introduces systematic challenges, including guideline ambiguity, annotator interpretation drift, and reduced consistency at scale. We introduce TRACE (Triage and Re-align by Alignment Conflict Evaluation), a framework that transforms re-alignment into a structured optimization problem over existing data without requiring fresh human annotation. Leveraging a stronger model as a proxy judge, TRACE operates via a three-stage pipeline: (1) triaging preference pairs into inversion, suppression, or retention categories based on alignment conflicts; (2) computing an alignment impact score via bi-level optimization to prioritize high-leverage samples; and (3) executing updates using a hybrid objective that combines relational losses (e.g., IPO) for preference inversion and punitive losses (e.g., NPO) for response suppression. Experiments on Qwen2.5-7B, Gemma-2-9B, and Llama-3.1-8B demonstrate robust re-alignment on synthetic benchmarks and the PKU-SafeRLHF dataset without degrading general utility. This work provides a scalable approach for LLM realignment under evolving data annotation policies and alignment guidelines.", "authors": "Aakash Sen Sharma, Debdeep Sanyal, Manodeep Ray, Vivek Srivastava, Shirish Karande, Murari Mandal", "icml_url": "https://icml.cc/virtual/2026/poster/60573", "is_oral": false, "is_spotlight": false, "poster_id": "60573", "presentation_type": "regular", "related_events": "", "title": "The Realignment Problem: When Right becomes Wrong in LLMs", "sequence": 102, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 458, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 458, "selection_score": 458, "matched_terms": "rlhf, post-training, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #3113", "poster_number": 3113, "poster_band": "#3000-#3999"}, {"abstract": "Training against white-box deception detectors has been proposed as a way to make AI systems honest. However, such training risks models learning to obfuscate their deception to evade the detector. Prior work has studied obfuscation only in artificial settings where models were directly rewarded for harmful output. We construct a realistic coding environment where reward hacking via hardcoding test cases naturally occurs, and show that obfuscation emerges in this setting. We introduce a taxonomy of possible outcomes when training against a deception detector. The model either remains honest, or becomes deceptive via two possible obfuscation strategies. (i) Obfuscated activations : the model outputs deceptive text while its activations change to no longer trigger the detector. (ii) Obfuscated policy : the model produces detector-evading deceptive text, typically by including a justification for the reward hack. Empirically, obfuscated activations arise from representation drift during RL, with or without a detector penalty. The penalty only incentivizes obfuscated policies: we theoretically show this is expected for policy gradient methods. Sufficiently high KL regularization and detector penalty reliably yield honest policies, establishing white-box deception detectors as viable training signals for tasks prone to reward hacking.", "authors": "Mohammad Taufeeque, Stefan Heimersheim, Adam Gleave, Chris Cundy", "icml_url": "https://icml.cc/virtual/2026/poster/60766", "is_oral": true, "is_spotlight": true, "poster_id": "60766", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2C AI Safety & Alignment", "title": "The Obfuscation Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes", "sequence": 295, "award": "Outstanding Paper Honorable Mention", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 20, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 20, "selection_score": 260, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper Honorable Mention", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #3114", "poster_number": 3114, "poster_band": "#3000-#3999"}, {"abstract": "Aligning Multimodal Large Language Models (MLLMs) with human preferences remains a fundamental challenge. While Generative Reward Models (GRMs) offer a promising reasoning-based alternative to scalar models, they are often hindered by severe position bias and prohibitively high computational overhead. To address these limitations, we propose GenAlign, a unified framework that synergizes robust generative reward modeling with efficient MLLM alignment. First, we introduce a rubric-based GRM that explicitly models the preference judgment process. By employing reinforcement learning with verifiable rewards and an online position debiasing mechanism, our model produces interpretable reasoning critiques and robust preference predictions. Second, we propose a policy optimization strategy utilizing advantage-smoothed dynamic reference anchoring. This approach reduces computational complexity  while mitigating gradient instability caused by variance collapse. Extensive experiments demonstrate that GenAlign achieves state-of-the-art preference prediction accuracy on multimodal reward modeling benchmarks. Moreover, it consistently improves the performance of three MLLMs across seven diverse evaluation benchmarks, particularly making significant progress in safety and hallucination.", "authors": "Jingyu Zhang, Kun Yang, Ming Wen, jiawei zhao, Yuxuan Liu, Zhuoer Xu, shiwen cui", "icml_url": "https://icml.cc/virtual/2026/poster/62209", "is_oral": false, "is_spotlight": false, "poster_id": "62209", "presentation_type": "regular", "related_events": "", "title": "GenAlign: Towards Unified Alignment Framework of MLLMs via Generative Reward Model", "sequence": 1736, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 52, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 434, "LLM adaptation & fine-tuning": 112, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 434, "selection_score": 434, "matched_terms": "reward model, reward modeling, alignment, verifiable reward, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #3209", "poster_number": 3209, "poster_band": "#3000-#3999"}, {"abstract": "We analyze the Bayesian regret of the Gaussian process posterior sampling reinforcement learning (GP-PSRL) algorithm. Posterior sampling is an effective heuristic for decision-making under uncertainty that has been used to develop successful algorithms for a variety of continuous control problems. However, theoretical work on GP-PSRL is limited. All known regret bounds either fail to achieve a tight dependence on a kernel-dependent quantity called the maximum information gain or fail to properly account for the fact that the set of possible system states is unbounded. Through a recursive application of the Borell-Tsirelson-Ibragimov-Sudakov inequality, we show that, with high probability, the states actually visited by the algorithm are contained within a ball of near-constant radius. To obtain tight dependence on the maximum information gain, we use the chaining method to control the regret suffered by GP-PSRL. Our main result is a Bayesian regret bound of the order $\\widetilde{\\mathcal{O}}(H^{3/2}\\sqrt{\\gamma_{T/H} T})$, where $H$ is the horizon, $T$ is the number of time steps and $\\gamma_{T/H}$ is the maximum information gain. With this result, we resolve the limitations with prior theoretical work on PSRL, and provide the theoretical foundation and tools for analyzing PSRL in complex settings.", "authors": "Hamish Flynn, Joe Watson, Ingmar Posner, Jan Peters", "icml_url": "https://icml.cc/virtual/2026/poster/64056", "is_oral": false, "is_spotlight": false, "poster_id": "64056", "presentation_type": "regular", "related_events": "", "title": "Posterior Sampling Reinforcement Learning with Gaussian Processes for Continuous Control: Sublinear Regret Bounds for Unbounded State Spaces", "sequence": 3581, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 56, "RL & control": 470, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 24, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 60}, "raw_topic_score": 470, "selection_score": 470, "matched_terms": "reinforcement learning, posterior sampling, continuous control, control, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #3905", "poster_number": 3905, "poster_band": "#3000-#3999"}, {"abstract": "Gradient-variation online learning has drawn increasing attention due to its deep connections to game theory, optimization, etc. It has been studied extensively in the full-information setting, but is underexplored with bandit feedback. In this work, we focus on gradient variation in Bandit Convex Optimization (BCO) with two-point feedback. By proposing a refined analysis on the non-consecutive gradient variation, a fundamental quantity in gradient variation with bandits, we improve the dimension dependence for both convex and strongly convex functions compared with the best known results (Chiang et al., 2013). Our improved analysis for the non-consecutive gradient variation also implies other favorable problem-dependent guarantees, such as gradient-variance and small-loss regrets. Beyond the two-point setup, we demonstrate the versatility of our technique by achieving the first gradient-variation bound for one-point bandit linear optimization over hyper-rectangular domains. Finally, we validate the effectiveness of our results in more challenging tasks such as dynamic/universal regret minimization and bandit games, establishing the first gradient-variation dynamic and universal regret bounds for two-point BCO and fast convergence rates in bandit games.", "authors": "Hang Yu, Yu-Hu Yan, Peng Zhao", "icml_url": "https://icml.cc/virtual/2026/poster/63449", "is_oral": false, "is_spotlight": true, "poster_id": "63449", "presentation_type": "spotlight", "related_events": "", "title": "Improved Dimension Dependence for Bandit Convex Optimization with Gradient Variations", "sequence": 2974, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 334, "RL & control": 24, "Multi-agent RL, games & coordination": 110, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 334, "selection_score": 379, "matched_terms": "online learning, bandit, bandits, regret", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4108", "poster_number": 4108, "poster_band": "#4000-#4999"}, {"abstract": "We revisit the standard perturbation-based approach of Abernethy et al. (2008) in the context of unconstrained Bandit Linear Optimization (uBLO). We show the surprising result that in the unconstrained setting, this approach effectively reduces Bandit Linear Optimization (BLO) to a standard Online Linear Optimization (OLO) problem. Our framework improves on prior work in several ways. First, we derive expected-regret guarantees when our perturbation scheme is combined with comparator-adaptive OLO algorithms, leading to new insights about the impact of different adversarial models on the resulting comparator-adaptive rates. We extend our analysis to dynamic regret, obtaining the optimal $\\sqrt{P_T}$ path-length dependencies without prior knowledge of $P_T$. We then develop the first high-probability guarantees for both static and dynamic regret in uBLO. Finally, we discuss lower bounds on the static regret, and prove the folklore $\\Omega(\\sqrt{dT})$ rate for adversarial linear bandits on the unit Euclidean ball, which is of independent interest.", "authors": "Andrew Jacobsen, Dorian Baudry, Shinji Ito, Nicolò Cesa-Bianchi", "icml_url": "https://icml.cc/virtual/2026/poster/63400", "is_oral": false, "is_spotlight": false, "poster_id": "63400", "presentation_type": "regular", "related_events": "", "title": "A Perturbation Approach to Unconstrained Linear Bandits", "sequence": 2925, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 572, "RL & control": 32, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 572, "selection_score": 572, "matched_terms": "dynamic regret, bandit, bandits, linear bandit, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4110", "poster_number": 4110, "poster_band": "#4000-#4999"}, {"abstract": "We study the geometry of feasible value functions in infinite-horizon partially observable Markov decision processes (POMDPs) under memoryless stochastic policies. Our main contribution is a characterization of the feasible set of value functions as a semi-algebraic set, defined by explicit polynomial inequalities determined by the transition dynamics, observation kernel, and reward structure of the POMDP. This result extends prior work for fully observable Markov decision processes, where the feasible set is known to be a polytope, to the substantially more intricate partially observable setting. In contrast to the polyhedral structure arising in MDPs, partial observability induces fundamentally nonlinear constraints, leading to a richer and more complex geometric structure. Our geometric characterization provides new insight into the landscape of policy optimization in both MDPs and POMDPs, and reveals qualitative phenomena unique to partial observability, including the emergence of isolated local maximizers of the long-term reward and their dependence on the initial state distribution.", "authors": "Ryan Anderson, Guido Montufar", "icml_url": "https://icml.cc/virtual/2026/poster/61967", "is_oral": false, "is_spotlight": false, "poster_id": "61967", "presentation_type": "regular", "related_events": "", "title": "The Value Function Semi-Algebraic Set in Partially Observable Markov Decision Processes", "sequence": 1494, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 406, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 406, "selection_score": 406, "matched_terms": "markov decision, mdp, pomdp, policy optimization", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4205", "poster_number": 4205, "poster_band": "#4000-#4999"}, {"abstract": "LLM-based agents already operate in production across many industries, yet we lack a clear understanding of which technical methods make these deployments successful. We present the first systematic study of Characterizing Agents in Production (CAP) using first-hand data from agent developers. We conducted 20 in-depth case studies through interviews and surveyed 306 practitioners across 26 domains. We examine why organizations build agents, how they build them, how they evaluate them, and the key challenges they face in deployment. Our findings show that production agents rely on simple, controllable approaches: 68% execute at most 10 steps before human intervention, 70% rely on prompting off-the-shelf models rather than weight tuning, and 74% depend primarily on human evaluation. Reliability—defined as consistent correct behavior over time—emerges as the dominant challenge, which practitioners address through system-level design choices. CAP documents the current state of production agents, providing the research community with visibility into real-world deployment practices and underexplored research opportunities.", "authors": "Melissa Pan, Negar Arabzadeh, Riccardo Cogo, Yuxuan Zhu, Alexander Xiong, Lakshya A Agrawal, Huanzhi Mao, Emma Shen, Sid Pallerla, Liana Patel, Shu Liu, Tianneng Shi, Xiaoyuan Liu, Jared Davis, Emmanuele Lacavalla, Alessandro Basile, Shuyi Yang, Paul Castro, Daniel Kang, Koushik Sen, Dawn Song, Joseph E Gonzalez, Ion Stoica, Matei Zaharia, Marquita Ellis", "icml_url": "https://icml.cc/virtual/2026/poster/61834", "is_oral": true, "is_spotlight": true, "poster_id": "61834", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6B Agentic Systems", "title": "Characterizing Agents in Production", "sequence": 1362, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 184, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 184, "selection_score": 514, "matched_terms": "llm, agent, agents", "selection_reasons": "oral, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4211", "poster_number": 4211, "poster_band": "#4000-#4999"}, {"abstract": "We introduce OPO-CMDP, the first policy optimization algorithm for stochastic Contextual Markov Decision Process (CMDPs) under general offline function approximation. Our approach achieves a high probability regret bound of $\\widetilde{O}(H^4\\sqrt{T|S||A|\\log(|\\mathcal{F}||\\mathcal{P}|)}),$ where $S$ and $A$ denote the state and action spaces, $H$ the horizon length, $T$ the number of episodes, and $\\mathcal{F}, \\mathcal{P}$ the finite function classes used to approximate the losses and dynamics, respectively. This is the first regret bound with optimal dependence on $|S|$ and $|A|$, directly improving the current state-of-the-art (Qian, Hu, and Simchi-Levi, 2024).  These results demonstrate that optimistic policy optimization provides a natural, computationally superior and theoretically near-optimal path for solving CMDPs.", "authors": "Orin Levy, Aviv Rosenberg, Alon Peled-Cohen, Yishay Mansour", "icml_url": "https://icml.cc/virtual/2026/poster/66220", "is_oral": false, "is_spotlight": false, "poster_id": "66220", "presentation_type": "regular", "related_events": "", "title": "Near-Optimal Regret for Policy Optimization in Contextual MDPs with General Offline Function Approximation", "sequence": 5742, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 40, "RL & control": 432, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 432, "selection_score": 432, "matched_terms": "markov decision, mdp, policy optimization, cmdp, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4300", "poster_number": 4300, "poster_band": "#4000-#4999"}, {"abstract": "We study reinforcement learning with delayed state observation, where the agent observes the current state after some random number of time steps. We propose an algorithm that combines the augmentation method and the upper confidence bound approach. For tabular Markov decision processes (MDPs), we derive a regret bound of $\\tilde{\\mathcal{O}}(H \\sqrt{D_{\\max} SAK})$, where $S$ and $A$ are the cardinalities of the state and action spaces, $H$ is the time horizon, $K$ is the number of episodes, and $D_{\\max}$ is the maximum length of the delay. We also provide a matching lower bound up to logarithmic factors, showing the optimality of our approach. Our analytical framework formulates this problem as a special case of a broader class of MDPs, where their transition dynamics decompose into a known component and an unknown but structured component. We establish general results for this abstract setting, which may be of independent interest.", "authors": "Harin Lee, Kevin Jamieson", "icml_url": "https://icml.cc/virtual/2026/poster/62587", "is_oral": true, "is_spotlight": true, "poster_id": "62587", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2E Reinforcement Learning: Theory", "title": "Minimax Optimal Strategy for Delayed Observations in Online Reinforcement Learning", "sequence": 2113, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 8, "RL & control": 218, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 218, "selection_score": 308, "matched_terms": "reinforcement learning, markov decision, mdp, regret", "selection_reasons": "oral", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4302", "poster_number": 4302, "poster_band": "#4000-#4999"}, {"abstract": "We analytically solve the Mountain Car problem, a canonical benchmark in RL, and derive an optimal control solution, closing a gap after 36 years. This enables us to reveal two surprising insights: The optimal control is quite simple, yet modern RL agents display a large gap to optimality. Motivated by the analysis of the optimal control, we introduce Chebyshev policies as a universal (i.e. dense) class of RL policies from first principles. They can be trained as drop-in replacements of neural nets, reducing the regret by a factor of 4.18, while requiring 268 times fewer parameters, fostering sample efficiency, explainability and real-time capability. Chebyshev policies are evaluated on further RL environments, including a real-world non-linear motion control testbed. They consistently improve performance over neural nets with PPO, ARS and REINFORCE. Our results demonstrate how Chebyshev policies offer a compelling and lightweight alternative or addition to neural nets for low-dimensional control tasks.", "authors": "Stefan Huber, Hannes Unger, Georg Schäfer, Jakob Rehrl", "icml_url": "https://icml.cc/virtual/2026/poster/63070", "is_oral": true, "is_spotlight": true, "poster_id": "63070", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2E Reinforcement Learning: Theory", "title": "Chebyshev Policies and the Mountain Car Problem: Reinforcement Learning for Low-dimensional Control Tasks", "sequence": 2595, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 8, "RL & control": 282, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 96}, "raw_topic_score": 282, "selection_score": 372, "matched_terms": "reinforcement learning, optimal control, control, regret", "selection_reasons": "oral", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4308", "poster_number": 4308, "poster_band": "#4000-#4999"}, {"abstract": "We investigate the contextual slate bandit problem with generalized linear rewards under limited adaptivity. At each round, the learner is presented with $N$ sets of items and constructs a slate by selecting one item per set; the resulting slate yields a scalar reward sampled from a Generalized Linear Model (GLM). We propose algorithms under two limited-adaptivity paradigms: (a) batched and (b) rarely-switching settings. For the batched setting, we introduce B-SlateGLinCB, which partitions the time horizon into $O(\\log\\log T)$ batches such that each batch's policy relies only on data from previous batches. For the rarely-switching setting, we propose RS-SlateGLinCB, which adaptively performs only $O(d\\log T)$ parameter updates. Under a diversity assumption on the item sequences, we prove that B-SlateGLinCB and RS-SlateGLinCB achieve regret bounds of $O(Nd^{3/2}\\sqrt{T})$ and $O(Nd\\sqrt{T})$, respectively. Notably, both bounds are independent of the non-linearity parameter $\\kappa$ that is typically found to scale the regret of GLM bandit algorithms. Our algorithms are computationally efficient, requiring only $\\text{poly}(N)$ time per round despite $2^{\\Omega(N)}$ possible slates. Simulations show our algorithms outperform existing batched baselines and remain competitive with Slate-GLM-OFU, a fully adaptive state-of-the-art algorithm. Notably, a slightly modified B-SlateGLinCB empirically matches this baseline. Finally, we demonstrate strong performance in a practical in-context example selection task for language models.", "authors": "Tanmay Goyal, Sukruta Midigeshi, Gaurav Sinha", "icml_url": "https://icml.cc/virtual/2026/poster/66297", "is_oral": false, "is_spotlight": false, "poster_id": "66297", "presentation_type": "regular", "related_events": "", "title": "Contextual Slate GLM Bandits with Limited Adaptivity", "sequence": 5818, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 292, "RL & control": 16, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 12, "LLM adaptation & fine-tuning": 68, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 292, "selection_score": 292, "matched_terms": "bandit, bandits, generalized linear, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4401", "poster_number": 4401, "poster_band": "#4000-#4999"}, {"abstract": "We study dynamic regret minimization in non-stationary online learning, with a primary focus on follow-the-regularized-leader (FTRL) methods. FTRL is important for curved losses and for understanding adaptive algorithms, yet existing dynamic regret analyses are less explored for FTRL. To address this, we build on the discounted-to-dynamic reduction and present a modular way to obtain dynamic regret bounds. The reduction simplifies prior proofs for online linear regression, recovers optimal rates, and provides new guarantees for online logistic regression, covering two representative curved losses. Beyond online convex optimization, we apply the reduction to analyze the Adam optimizers, obtaining optimal convergence rates in stochastic, non-convex, and non-smooth settings. The reduction also enables a more detailed treatment of Adam with two discount parameters $(\\beta_1,\\beta_2)$, leading to new results for both clipped and clip-free variants.", "authors": "Yan-Feng Xie, Yu-Jie Zhang, Peng Zhao, Zhi-Hua Zhou", "icml_url": "https://icml.cc/virtual/2026/poster/62883", "is_oral": false, "is_spotlight": false, "poster_id": "62883", "presentation_type": "regular", "related_events": "", "title": "Dynamic Regret via Discounted-to-Dynamic Reduction with Applications to Curved Losses and Adam Optimizer", "sequence": 2409, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 397, "RL & control": 48, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 397, "selection_score": 637, "matched_terms": "online learning, online convex, dynamic regret, non-stationary, regret", "selection_reasons": "user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4404", "poster_number": 4404, "poster_band": "#4000-#4999"}, {"abstract": "Nash regret has recently emerged as a principled fairness-aware performance metric for stochastic multi-armed bandits, motivated by the Nash Social Welfare objective. Although this notion has been extended to linear bandits, existing results suffer from suboptimality in ambient dimension $d$, stemming from proof techniques that rely on restrictive concentration inequalities. In this work, we resolve this open problem by introducing new analytical tools that yield an order-optimal Nash regret bound in linear bandits. Beyond Nash regret, we initiate the study of $p$-means regret in linear bandits, a unifying framework that interpolates between fairness and utility objectives and strictly generalizes Nash regret. We propose a generic algorithmic framework, FairLinBandit, that works as a meta-algorithm on top of any linear bandit strategy. We instantiate this framework using two bandit algorithms: Phased Elimination and Upper Confidence Bound, and prove that both achieve sublinear $p$-means regret for the entire range of $p$. Extensive experiments on linear bandit instances generated from real-world datasets demonstrate that our methods consistently outperform the existing state-of-the-art baseline.", "authors": "Dhruv Sarkar, Nishant Pandey, Sayak Ray Chowdhury", "icml_url": "https://icml.cc/virtual/2026/poster/66239", "is_oral": false, "is_spotlight": false, "poster_id": "66239", "presentation_type": "regular", "related_events": "", "title": "Improved Algorithms for Nash Welfare in Linear Bandits", "sequence": 5761, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 904, "RL & control": 48, "Multi-agent RL, games & coordination": 304, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 904, "selection_score": 904, "matched_terms": "bandit, bandits, linear bandit, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4406", "poster_number": 4406, "poster_band": "#4000-#4999"}, {"abstract": "Recent studies have shown that reinforcement learning with KL-regularized objectives can enjoy *faster* rates of convergence or *logarithmic* regret, in contrast to the classical $\\sqrt{T}$-type regret in the unregularized setting. However, the statistical efficiency of online learning with respect to KL-regularized objectives remains far from completely characterized, even when specialized to multi-armed bandits (MABs). We address this problem for MABs via a sharp analysis of KL-UCB (Zhao et al., 2025b) using a novel peeling argument, which yields a $\\tilde{O}(\\eta K\\log^2T)$ upper bound: the *first* high-probability regret bound with linear dependence on $K$. Here, $T$ is the time horizon, $K$ is the number of arms, $\\eta^{-1}$ is the regularization intensity, and $\\tilde{O}$ hides all logarithmic factors except those involving $\\log T$. The near-tightness of our analysis is certified by the *first* non-constant lower bound $\\Omega(\\eta K \\log T)$, which follows from subtle hard-instance constructions and a tailored decomposition of the Bayes prior. Moreover, in the low-regularization regime (i.e., *large* $\\eta$), we show that the KL-regularized regret for MABs is $\\eta$-independent and scales as $\\tilde{\\Theta}(\\sqrt{KT})$. Overall, our results provide a thorough understanding of KL-regularized MABs across all regimes of $\\eta$ and yield nearly optimal bounds in terms of $K$, $\\eta$, and $T$.", "authors": "Kaixuan Ji, Qingyue Zhao, Heyang Zhao, Qiwei Di, Quanquan Gu", "icml_url": "https://icml.cc/virtual/2026/poster/63388", "is_oral": false, "is_spotlight": false, "poster_id": "63388", "presentation_type": "regular", "related_events": "", "title": "Near-Optimal Regret for KL-Regularized Multi-Armed Bandits", "sequence": 2913, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 310, "RL & control": 86, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 310, "selection_score": 310, "matched_terms": "online learning, bandit, bandits, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4407", "poster_number": 4407, "poster_band": "#4000-#4999"}, {"abstract": "Follow the regularized leader (FTRL) is the premier algorithm for online optimization. However, despite decades of research on its convergence in constrained optimization---and potential games in particular---its behavior remained hitherto poorly understood. In this paper, we establish that FTRL can take exponential time to converge to a Nash equilibrium in two-player potential games for any (permutation-invariant) regularizer and potentially vanishing learning rate. By known equivalences, this translates to an exponential lower bound for certain mirror descent counterparts, most notably multiplicative weights update. On the positive side, we establish the potential property for FTRL and obtain an exponential upper bound $\\exp(O_{\\epsilon}(1/\\epsilon^2))$ for any no-regret dynamics executed in a lazy, alternating fashion, matching our lower bound up to factors in the exponent. Finally, in multi-player potential games, we show that fictitious play---the extreme version of FTRL---can take doubly exponential time to reach a Nash equilibrium. This constitutes an exponentially stronger lower bound for the foundational learning algorithm in games.", "authors": "Ioannis Anagnostides, Ioannis Panageas, Nikolas Patris, Tuomas Sandholm", "icml_url": "https://icml.cc/virtual/2026/poster/61971", "is_oral": false, "is_spotlight": true, "poster_id": "61971", "presentation_type": "spotlight", "related_events": "", "title": "(Doubly) Exponential Lower Bounds for Follow the Regularized Leader in Potential Games", "sequence": 1498, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 8, "RL & control": 8, "Multi-agent RL, games & coordination": 680, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 680, "selection_score": 725, "matched_terms": "game, games, nash, equilibrium, potential games", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #4512", "poster_number": 4512, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-07T22:30:00-07:00", "label": "Wed, Jul 8, 2026 14:30 KST", "icmlTime": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "count": 40, "rows": [{"abstract": "Aligning large language models (LLMs) with human preferences is commonly done via reinforcement learning from human feedback (RLHF) with Proximal Policy Optimization (PPO) or, more simply, via Direct Preference Optimization (DPO). While DPO is stable and RL-free, it treats preferences as flat winner vs. loser signals and is sensitive to noisy or brittle preferences arising from fragile chains of thought. We propose TUR-DPO, a topology- and uncertainty-aware variant of DPO that rewards how answers are derived, not only what they say, by eliciting lightweight reasoning topologies and combining semantic faithfulness, utility, and topology quality into a calibrated uncertainty signal. A small learnable reward is factorized over these signals and incorporated into an uncertainty-weighted DPO objective that remains RL-free and relies only on a fixed or moving reference policy. Empirically, across open 7–8B models and benchmarks spanning mathematical reasoning, factual question answering, summarization, and helpful/harmless dialogue, TUR-DPO improves judge win-rates, faithfulness, and calibration relative to DPO while preserving training simplicity and avoiding online rollouts. We further observe consistent gains in multimodal and long-context settings, and show that TUR-DPO matches or exceeds PPO on reasoning-centric tasks while maintaining operational simplicity.", "authors": "Abdulhady abas, Fatemeh Daneshfar, Seyedali Mirjalili, Mourad Oussalah", "icml_url": "https://icml.cc/virtual/2026/poster/63310", "is_oral": false, "is_spotlight": false, "poster_id": "63310", "presentation_type": "regular", "related_events": "", "title": "TUR-DPO: Topology- and Uncertainty-Aware Direct Preference Optimization", "sequence": 2835, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 52, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 494, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 494, "selection_score": 494, "matched_terms": "rlhf, preference optimization, dpo, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #109", "poster_number": 109, "poster_band": "#0000-#0999"}, {"abstract": "The design of environments plays a critical role in shaping the development and evaluation of cooperative multi-agent reinforcement learning (MARL) algorithms. While existing benchmarks highlight critical challenges, they often lack the modularity required to design custom evaluation scenarios. We introduce the Totally Accelerated Battle Simulator in JAX (TABX), a high-throughput sandbox designed for reconfigurable multi-agent tasks. TABX provides granular control over environmental parameters, permitting a systematic investigation into emergent agent behaviors and algorithmic trade-offs across a diverse spectrum of task complexities. Leveraging JAX for hardware-accelerated execution on GPUs, TABX enables massive parallelization and significantly reduces computational overhead. By providing a fast, extensible, and easily customized framework, TABX facilitates the study of MARL agents in complex structured domains and serves as a scalable foundation for future research. Our code is available at: https://anonymous.4open.science/r/TABX-00CA.", "authors": "Hayeong Lee, JunHyeok Oh, Byung-Jun Lee", "icml_url": "https://icml.cc/virtual/2026/poster/62035", "is_oral": false, "is_spotlight": false, "poster_id": "62035", "presentation_type": "regular", "related_events": "", "title": "TABX: A High-Throughput Sandbox Battle Simulator for Multi-Agent Reinforcement Learning", "sequence": 1562, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 134, "Multi-agent RL, games & coordination": 630, "LLM post-training, RLHF & agents": 256, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 630, "selection_score": 630, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, cooperative", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #122", "poster_number": 122, "poster_band": "#0000-#0999"}, {"abstract": "Cooperation is central to multi-agent reinforcement learning (MARL), yet learned coordination can be fragile when external perturbations disrupt inter-agent interactions. Prior robust MARL methods have primarily considered value-oriented attacks, leaving a gap in robustness when interaction structures themselves are corrupted. In this paper, we propose an interaction-breaking adversarial learning (IBAL) framework that takes an information-theoretic view to construct attacks that impede coordination by perturbing agents’ observations and actions, and trains agents to perform reliably under such disruptions. Empirically, our approach improves robustness over existing robust MARL baselines across diverse attack settings and yields stronger performance even under agent-missing scenarios.", "authors": "Sunwoo Lee, Mingu Kang, Yonghyeon Jo, Seungyul Han", "icml_url": "https://icml.cc/virtual/2026/poster/61001", "is_oral": false, "is_spotlight": false, "poster_id": "61001", "presentation_type": "regular", "related_events": "", "title": "Interaction-Breaking Adversarial Learning Framework for Robust Multi-Agent Reinforcement Learning", "sequence": 529, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 682, "LLM post-training, RLHF & agents": 276, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 682, "selection_score": 682, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, coordination", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #213", "poster_number": 213, "poster_band": "#0000-#0999"}, {"abstract": "World models enable learning policies via latent imagination, offering benefits such as history compression and sample efficiency. The primary challenge in applying world models to multi-agent tasks is that modeling multi-agent dynamics in latent space requires integrating information from different agents, often creating spurious correlations between their latent states. Existing methods either reconstruct the observation for each agent or employ communication to maintain correlation during execution, failing to learn disentangled latent states that are crucial for effective decentralized control. To address this, we present the Disentangled Multi-Agent World Model (DMAWM). It facilitates learning decentralized policies in the latent space through a novel architecture comprising independent agent modules and a shared environment module. During real-environment execution, agent modules independently process local information to form a factorized latent representation. The environment module is then trained to mirror the factorized structure generated by the agent modules, effectively disentangling individual latent states from the interaction dynamics. Consequently, imaginary rollouts generated by the environment module more faithfully simulate decentralized execution dynamics, facilitating the transfer of policies from imagination to decentralized execution. Empirically, DMAWM outperforms existing model-based and model-free approaches in convergence speed and final performance, with additional visualization demonstrating its efficacy in capturing agent interactions.", "authors": "Di Xue, Jing Jiang, Shaowei Zhang, Wenhao Guo, lei yuan, Zongzhang Zhang, Yang Yu", "icml_url": "https://icml.cc/virtual/2026/poster/61713", "is_oral": false, "is_spotlight": false, "poster_id": "61713", "presentation_type": "regular", "related_events": "", "title": "Learning Disentangled Multi-Agent World Model for Decentralized Control", "sequence": 1241, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 56, "Multi-agent RL, games & coordination": 462, "LLM post-training, RLHF & agents": 130, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 180}, "raw_topic_score": 462, "selection_score": 462, "matched_terms": "multi-agent, decentralized", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #215", "poster_number": 215, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning from demonstrations (RLfD) offers a promising method for robotic manipulation with sparse rewards. However, limited demonstrations often cause agents to encounter out-of-distribution states where world models produce poor predictions. In multi-stage tasks, jointly optimizing a learned reward function and policy introduces a moving target problem, and the resulting non-stationarity intensifies the impact of uncertainty on policy learning. In this work, we propose QUEST, a model-based RL framework that adaptively switches between exploration and exploitation guided by uncertainty to achieve stable and efficient learning. Specifically, our approach employs intrinsic rewards to capture environmental stochasticity, leverages ensemble dynamics for uncertainty-guided planning, and introduces a hybrid sampling strategy to prioritize rare successful stage transitions. We evaluate QUEST on challenging sparse-reward manipulation tasks with limited expert demonstrations. Results show that QUEST outperforms state-of-the-art methods by 17\\% on average, with gains increasing to 60\\% on difficult tasks. We further demonstrate successful zero-shot sim-to-real transfer on three real-world tasks.", "authors": "Haowen Sun, Liqi Huang, Mingyang Li, Sihua Ren, Xinzhe Chen, Chengzhong Ma, Zeyang Liu, Xingyu Chen, Xuguang Lan", "icml_url": "https://icml.cc/virtual/2026/poster/64857", "is_oral": false, "is_spotlight": false, "poster_id": "64857", "presentation_type": "regular", "related_events": "", "title": "Uncertainty-Guided Exploration and Stable Planning for Sparse-Reward Manipulation from Limited Demonstrations", "sequence": 4381, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 126, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 160, "Robotics, VLA & diffusion policy": 236}, "raw_topic_score": 236, "selection_score": 236, "matched_terms": "robot, robotic, manipulation, world model", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #300", "poster_number": 300, "poster_band": "#0000-#0999"}, {"abstract": "Two-player games such as board games have long been used as traditional benchmark for reinforcement learning. This work revisits a regularized policy optimization with reverse Kullback-Leibler divergence and entropy divergence and analyzes this combination on two-player zero-sum settings from theoretical and empirical perspectives. From a theoretical perspective, we investigate the stability of the policy update rule on two theoretical settings: game-theoretic normal-form games and finite-length games. We provide convergence guarantees and verify our theoretical results by numerical experiments on synthetic games. From an empirical perspective, we derive a practical model-free reinforcement learning algorithm based on the regularized policy optimization. We validate the efficiency in training of our algorithm through comprehensive experiments on five board games: Animal Shogi, Gardner Chess, Go, Hex, and Othello. The experimental results demonstrate that our agent achieves more efficient learning than existing methods across the environments.", "authors": "Kazuki Ota, Takayuki Osa, Motoki Omura, Tatsuya Harada", "icml_url": "https://icml.cc/virtual/2026/poster/61227", "is_oral": false, "is_spotlight": false, "poster_id": "61227", "presentation_type": "regular", "related_events": "", "title": "Revisiting Regularized Policy Optimization for Stable and Efficient Reinforcement Learning in Two-Player Games", "sequence": 755, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 260, "Multi-agent RL, games & coordination": 418, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 418, "selection_score": 418, "matched_terms": "game, games", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #306", "poster_number": 306, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning (RL) struggles to scale to large, combinatorial action spaces common in many real-world problems. This paper introduces a novel framework for training discrete diffusion models as highly effective policies in these complex settings. Our key innovation is an efficient online training process that ensures stable and effective policy improvement. By leveraging policy mirror descent (PMD) to define an ideal, regularized target policy distribution, we frame the policy update as a distributional matching problem, training the expressive diffusion model to replicate this stable target. This decoupled approach stabilizes learning and significantly enhances training performance. Our method achieves state-of-the-art results and superior sample efficiency across a diverse set of challenging combinatorial benchmarks, including DNA sequence generation, RL with macro-actions, and multi-agent systems. Experiments demonstrate that our diffusion policies attain superior performance compared to other baselines. Crucially, our extensive empirical analysis reveals a key trade-off: FKL demonstrates superior sample efficiency and faster initial convergence, whereas RKL ensures greater training stability and higher asymptotic performance.", "authors": "Haitong Ma, Ofir Nabati, Aviv Rosenberg, Bo Dai, Oran Lang, Craig Boutilier, Na Li, Shie Mannor, Lior Shani, Guy Tennenholtz", "icml_url": "https://icml.cc/virtual/2026/poster/61107", "is_oral": false, "is_spotlight": false, "poster_id": "61107", "presentation_type": "regular", "related_events": "", "title": "Reinforcement Learning with Discrete Diffusion Policies for Combinatorial Action Spaces", "sequence": 635, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 42, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 272}, "raw_topic_score": 272, "selection_score": 272, "matched_terms": "diffusion policies, diffusion", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #308", "poster_number": 308, "poster_band": "#0000-#0999"}, {"abstract": "Reward models learned from human preferences are central to aligning large language models (LLMs) via reinforcement learning from human feedback, yet they are often vulnerable to reward hacking due to noisy annotations and systematic biases such as response length or style.  We propose Bayesian Non-Negative Reward Model (BNRM), a principled reward modeling framework that integrates non-negative factor analysis into Bradley–Terry (BT) preference model. BNRM represents rewards through a sparse, non-negative latent factor generative process that operates at two complementary levels:  instance-specific latent variables induce disentangled reward representations, while sparsity over global latent factors acts as an implicit debiasing mechanism that suppresses spurious correlations. Together, this disentanglement-then-debiasing structure enables robust uncertainty-aware reward learning.  To scale BNRM to modern LLMs, we develop an amortized variational inference network conditioned on deep model representations, allowing efficient end-to-end training. Extensive empirical results demonstrate that BNRM substantially mitigates reward over-optimization, improves robustness under distribution shifts, and yields more interpretable reward decompositions than strong baselines.", "authors": "Zhibin Duan, Guowei Rong, Zhuo Li, Bo Chen, Mingyuan Zhou, Dandan Guo", "icml_url": "https://icml.cc/virtual/2026/poster/65437", "is_oral": true, "is_spotlight": true, "poster_id": "65437", "presentation_type": "oral", "related_events": "Oral presentation: Oral 3B Reinforcement Learning: RLHF and Post-training", "title": "Mitigating Reward Hacking in RLHF via Bayesian Non-negative Reward Modeling", "sequence": 4961, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 424, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 424, "selection_score": 514, "matched_terms": "rlhf, reward model, reward modeling, large language model, llm, language model", "selection_reasons": "oral", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #315", "poster_number": 315, "poster_band": "#0000-#0999"}, {"abstract": "We propose a data augmentation method for offline reinforcement learning, motivated by active positioning problems. Particularly, our approach enables the training of off-policy models from a limited number of suboptimal trajectories. We introduce a trajectory-based augmentation technique that exploits task structure and the geometric relationship between rewards, value functions, and mathematical properties of logging policies. During data collection, our augmentation supports suboptimal logging policies, leading to higher data quality and improved offline reinforcement learning performance. We provide theoretical justification for these strategies and validate them empirically across positioning tasks of varying dimensionality and under partial observability.", "authors": "Tobias Schmähling, Matthias Burkhardt, Tobias Windisch", "icml_url": "https://icml.cc/virtual/2026/poster/64589", "is_oral": false, "is_spotlight": false, "poster_id": "64589", "presentation_type": "regular", "related_events": "", "title": "Trajectory-Level Data Augmentation for Offline Reinforcement Learning", "sequence": 4113, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 290, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 64}, "raw_topic_score": 290, "selection_score": 290, "matched_terms": "reinforcement learning, offline reinforcement", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #400", "poster_number": 400, "poster_band": "#0000-#0999"}, {"abstract": "Cross-domain offline reinforcement learning (RL) aims to train an agent that performs well in the target domain using a limited target domain dataset and a source domain dataset that exhibits a dynamics shift. Training directly on the original source dataset typically leads to performance collapse. Recent studies perform data filtering from the perspective of dynamics alignment or value alignment to enable efficient policy transfer. However, these studies are typically validated on single-domain or single-behavior-policy source datasets. In this work, we explore a more general setting where the source datasets may be collected from multiple source domains by diverse behavior policies, which we name heterogeneous cross-domain offline RL. We first uncover a critical yet overlooked issue in this setting: \\textit{value misassignment}. Empirically and theoretically, we demonstrate that value misassignment can undermine value alignment, mislead data filtering toward selecting suboptimal samples, and loosen the suboptimality gap, thereby degrading the agent’s performance. To address this issue, we propose V2A, a simple yet effective framework that integrates dynamics alignment, value alignment, and value assignment. V2A first employs temporally-consistent modality representation learning to extract dynamics modalities from the source dataset, followed by modality-aware advantage learning to rectify value alignment. Finally, it adopts a data filtering paradigm to selectively share source data for policy learning. Empirical results show that under general heterogeneous cross-domain offline RL settings, V2A significantly outperforms strong baseline methods and exhibits excellent performance across multiple tasks and datasets.", "authors": "Zhongjian Qiao, Jiafei Lyu, Chenjia Bai, Peisong Wang, Siyang Gao, Shuang Qiu", "icml_url": "https://icml.cc/virtual/2026/poster/62450", "is_oral": false, "is_spotlight": false, "poster_id": "62450", "presentation_type": "regular", "related_events": "", "title": "Unifying Value Alignment and Assignment in Cross-Domain Offline Reinforcement Learning with Heterogeneous Datasets", "sequence": 1977, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 288, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 200, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 288, "selection_score": 288, "matched_terms": "reinforcement learning, offline rl, offline reinforcement", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #401", "poster_number": 401, "poster_band": "#0000-#0999"}, {"abstract": "Offline reinforcement learning (RL) learns effective policies from pre-collected datasets, offering a practical solution for applications where online interactions are risky or costly. Model-based approaches are particularly advantageous for offline RL, owing to their data efficiency and generalizability. However, due to inherent model errors, model-based methods often artificially introduce conservatism guided by heuristic uncertainty estimation, which can be unreliable.  In this paper, we introduce VIPO, a novel model-based offline RL algorithm that incorporates self-supervised feedback from value estimation to enhance model training. Specifically, the model is learned by additionally minimizing the inconsistency between the value learned directly from the offline data and the value estimated from the model. We perform comprehensive evaluations from multiple perspectives to show that VIPO can learn a highly accurate model efficiently and consistently outperform existing methods. In particular, it achieves state-of-the-art performance on almost all tasks in both D4RL and NeoRL benchmarks. Overall, VIPO offers a \\textit{general framework} that can be readily integrated into existing model-based offline RL algorithms to systematically enhance model accuracy. Our code is available at~\\url{https://anonymous.4open.science/r/vipo2025-8FD4}.", "authors": "Xuyang Chen, Keyu Yan, Guojian Wang, Lin Zhao", "icml_url": "https://icml.cc/virtual/2026/poster/63445", "is_oral": false, "is_spotlight": false, "poster_id": "63445", "presentation_type": "regular", "related_events": "", "title": "VIPO: Value
