 to practical limitations. In this paper, we propose a different paradigm that neutralizes harmful updates via harmful gradient saturation rather than explicit suppression. Our key observation is that, in a jailbroken LLM, safety-degrading gradients are largely saturated, while gradients unrelated to safety remain active during fine-tuning.  Based on this insight, we introduce a BufferLoRA-based fine-tuning framework . BufferLoRA is a removable adapter that temporarily jailbreaks the model during user fine-tuning, saturating harmful updates while allowing a UserLoRA to learn user-specific tasks. After fine-tuning, BufferLoRA is removed to restore the base model’s original safety-alignment. To further reinforce safety, we additionally train a SafetyLoRA and integrate its safety components into the UserLoRA via QR decomposition-based merging strategy. Extensive experiments show that our framework achieves superior performance in both safety and utility, without requiring additional safety data during fine-tuning and with minimal computational cost.", "authors": "Seokil Ham, Jaehyuk Jang, Wonjun Lee, Changick Kim", "icml_url": "https://icml.cc/virtual/2026/poster/64399", "is_oral": false, "is_spotlight": true, "poster_id": "64399", "presentation_type": "spotlight", "related_events": "", "title": "Jailbreak to Protect: Buffering Harmful Fine-Tuning via Temporary Jailbreaking LoRA in Large Language Models", "sequence": 3924, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 188, "LLM adaptation & fine-tuning": 994, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 994, "selection_score": 1279, "matched_terms": "fine-tuning, lora, adapter, harmful fine-tuning, adapt, large language model, language model, llm", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3107", "poster_number": 3107, "poster_band": "#3000-#3999"}, {"abstract": "While Reinforcement Learning from Human Feedback (RLHF) is the standard paradigm for aligning large language models with human preferences, its effectiveness in pluralistic settings has been called into question. Notably, recent work by Golz et al. (2025) demonstrated that the *distortion* — defined as the multiplicative gap between the average user utility of the RLHF policy and the optimal average utility — can scale exponentially with the Bradley-Terry temperature parameter $\\beta$ when users have heterogeneous preferences. In this work, we present a fine-grained analysis of the distortion of RLHF with reward clipping and demonstrate that such exponential degradation is not fundamental property of the algorithm but rather a consequence of distribution mismatch between the distribution generating preference data ($\\mu$) and the KL reference policy ($\\pi_{\\mathrm{ref}})$. We establish tight upper and lower bounds on the distortion of RLHF across multiple regimes of the KL regularization strength. We show that in a representative regime, under the Bradley–Terry model, the distortion is $\\tilde{\\Theta}(\\beta B)$, where $\\beta$ denotes the temperature parameter and $B$ is an upper bound on the log density ratio between $\\mu$ and $\\pi_{\\mathrm{ref}}$. As a consequence, when there is no distribution mismatch (i.e., $\\mu = \\pi_{\\mathrm{ref}}$), RLHF achieves the optimal distortion of $O(\\beta)$ up to a constant.", "authors": "Kazusato Oko, Annie Ulichney, Nika Haghtalab, Han Bao", "icml_url": "https://icml.cc/virtual/2026/poster/60739", "is_oral": false, "is_spotlight": false, "poster_id": "60739", "presentation_type": "regular", "related_events": "", "title": "Distortion of AI Alignment Revisited: RLHF is a Decent Utilitarian Aligner", "sequence": 268, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 426, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 426, "selection_score": 426, "matched_terms": "rlhf, alignment, large language model, language model", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3215", "poster_number": 3215, "poster_band": "#3000-#3999"}, {"abstract": "Zeroth-order optimizers have recently emerged as an attractive approach for fine-tuning large language models (LLMs), as they avoid backpropagation and can substantially reduce memory overhead relative to standard first-order training. However, existing zeroth-order methods rely on hand-crafted, static sampling strategies that are not adaptable to model-specific structures. To address this, we propose ZO Fine-tuner, a learning-based zeroth-order optimizer for LLMs that automatically learns efficient perturbation strategies through a compact and memory-efficient design. Motivated by the fact that a small set of base LLMs is repeatedly fine-tuned across tasks, ZO Fine-tuner supports one-time per-model training and reuse across downstream tasks with minimal overhead. Therefore, learning the optimizer once for a given LLM and reusing it across diverse downstream tasks is both feasible and highly desirable. Accordingly, ZO Fine-tuner is designed to scale learning to learn (L2L) to the foundation-model era by supporting one-time per-model training with minimal overhead. Experiments on 4 LLMs and 7 datasets show that ZO Fine-tuner outperforms prior zeroth-order baselines in 82.1\\% of task-model combinations, thereby demonstrating strong performance and scalability for efficient LLM fine-tuning.", "authors": "Kairun Zhang, Haoyu Li, Yanjun Zhao, Yifan Sun, Huan Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/62961", "is_oral": false, "is_spotlight": false, "poster_id": "62961", "presentation_type": "regular", "related_events": "", "title": "Learning a Zeroth-Order Optimizer for Fine-Tuning LLMs", "sequence": 2486, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 156, "LLM adaptation & fine-tuning": 500, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 500, "selection_score": 500, "matched_terms": "fine-tuning, zeroth-order, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3700", "poster_number": 3700, "poster_band": "#3000-#3999"}, {"abstract": "The low-rank adaptation (LoRA) algorithm for fine-tuning large models has grown popular in recent years due to its remarkable performance and low computational requirements. LoRA trains two \"adapter\" matrices that form a low-rank representation of the model parameters, thereby massively reducing the number of parameters that need to be updated at every step. Although LoRA is simple, its convergence is poorly understood due to the lack of Lipschitz smoothness, a key condition for classic convergence analyses. As a result, current theoretical results only consider asymptotic behavior or assume strong boundedness conditions which artificially enforce Lipschitz smoothness. In this work, we provide for the first time a non-asymptotic convergence analysis of the *original LoRA gradient descent* algorithm, which reflects widespread practice, without such assumptions. Our work relies on three key steps: i) reformulating the problem in terms of the outer product of the stacked adapter matrices, ii) a modified descent lemma for the \"Lipschitz-like\" reparametrized function, and iii) controlling the step size. With this approach, we prove that LoRA gradient descent converges to a stationary point at rate $O(\\frac{1}{\\log T})$, where $T$ is the number of iterations. We conduct numerical experiments to validate our theoretical findings.", "authors": "Siqiao Mu, Diego Klabjan", "icml_url": "https://icml.cc/virtual/2026/poster/65870", "is_oral": true, "is_spotlight": true, "poster_id": "65870", "presentation_type": "oral", "related_events": "Oral presentation: Oral 1G Optimization & Games", "title": "On the Convergence Rate of LoRA Gradient Descent", "sequence": 5393, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 464, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 464, "selection_score": 554, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapter, adapt", "selection_reasons": "oral", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3705", "poster_number": 3705, "poster_band": "#3000-#3999"}, {"abstract": "Fine-tuning APIs offered by major AI providers create new attack surfaces where adversaries can bypass safety measures through targeted fine-tuning. We introduce Trojan-Speak , an adversarial fine-tuning method that bypasses Anthropic's Constitutional Classifiers. Our approach uses curriculum learning combined with GRPO-based hybrid reinforcement learning to teach models a communication protocol that evades LLM-based content classification. Crucially, while prior adversarial fine-tuning approaches report more than 25\\% capability degradation on reasoning benchmarks, Trojan-Speak incurs less than 5\\% degradation while achieving 99+\\% classifier evasion for models with 14B+ parameters. We demonstrate that fine-tuned models can provide detailed responses to expert-level CBRN (Chemical, Biological, Radiological, and Nuclear) queries from Anthropic's Constitutional Classifiers bug-bounty program. Our findings reveal that LLM-based content classifiers alone are insufficient for preventing dangerous information disclosure when adversaries have fine-tuning access, and we show that activation-level probes can substantially improve robustness to such attacks.", "authors": "Bilgehan Sel, Xuanli He, Alwin Peng, Ming Jin, Jerry Wei", "icml_url": "https://icml.cc/virtual/2026/poster/66278", "is_oral": false, "is_spotlight": true, "poster_id": "66278", "presentation_type": "spotlight", "related_events": "", "title": "Trojan-Speak: Bypassing Constitutional Classifiers with No Jailbreak Tax via Adversarial Finetuning", "sequence": 5800, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 64, "LLM adaptation & fine-tuning": 300, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 300, "selection_score": 345, "matched_terms": "fine-tuning, finetuning, llm", "selection_reasons": "spotlight", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #3713", "poster_number": 3713, "poster_band": "#3000-#3999"}, {"abstract": "We study a widely used Bayesian optimization method, Gaussian process Thompson sampling (GP-TS), under the assumption that the objective function is a sample path from a GP. Compared with the GP upper confidence bound (GP-UCB) with established high-probability and expected regret bounds, most analyses of GP-TS have been limited to expected regret. Moreover, whether the recent analyses of GP-UCB for the lenient regret and the improved cumulative regret upper bound can be applied to GP-TS remains unclear. To fill these gaps, this paper shows several regret bounds:  (i) a regret lower bound for GP-TS, which implies that GP-TS suffers from a polynomial dependence on $1/\\delta$ with probability $\\delta$,  (ii) an upper bound of the second moment of cumulative regret, which directly suggests an improved regret upper bound on $\\delta$,  (iii) expected lenient regret upper bounds, and  (iv) an improved cumulative regret upper bound on the time horizon $T$. Along the way, we provide several useful lemmas, including a relaxation of the necessary condition from recent analysis to obtain improved regret upper bounds on $T$.", "authors": "Shion Takeno, Shogo Iwazaki", "icml_url": "https://icml.cc/virtual/2026/poster/60600", "is_oral": false, "is_spotlight": false, "poster_id": "60600", "presentation_type": "regular", "related_events": "", "title": "On Regret Bounds of Thompson Sampling for Bayesian Optimization", "sequence": 129, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 224, "RL & control": 112, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 224, "selection_score": 224, "matched_terms": "thompson sampling, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4001", "poster_number": 4001, "poster_band": "#4000-#4999"}, {"abstract": "In-Context Reinforcement Learning (ICRL) has enabled foundation agents to adapt instantaneously to novel tasks, yet its efficacy in Ad-Hoc Teamwork (AHT)—where coordination with unknown partners is required—remains unexplored. To rigorously evaluate this, we introduce a large-scale benchmark ICRL4AHT , built upon a high-throughput JAX implementation of Overcooked-V2. Our benchmark includes a large, diverse teammate suite spanning both RL and heuristic policies, enabling controlled train-test shifts, and provides an end-to-end pipeline to generate learning histories, serialize them into reproducible datasets, and perform online multi-episode evaluation.   We evaluate state-of-the-art ICRL algorithms, including Algorithm Distillation (AD) and Decision-Pretrained Transformer (DPT), across millions of transitions. Results reveal startling limitations: contrary to their success in single-agent domains, current ICRL architectures fail to exhibit test-time adaptation in multi-agent settings. Specifically, these methods frequently underperform random baselines across both unseen teammate and unseen layout tracks, with no observable in-context improvement over long horizons. These findings highlight the fundamental challenges of strategic inference under partial observability, establishing our benchmark as a critical testbed for next-generation coordination algorithms. Our repository is available at https://anonymous.4open.science/r/ICRL4AHT.", "authors": "Yuheng Jing, Kai Li, Jiajun Zhang, Zeyao Ma, Jiaxi Yang, Lei Zhang, zhe wu, Jinmin He, Junliang Xing, Jian Cheng", "icml_url": "https://icml.cc/virtual/2026/poster/65339", "is_oral": false, "is_spotlight": false, "poster_id": "65339", "presentation_type": "regular", "related_events": "", "title": "Benchmarking the Limits of In-Context Reinforcement Learning for Ad-Hoc Teamwork", "sequence": 4863, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 134, "Multi-agent RL, games & coordination": 510, "LLM post-training, RLHF & agents": 40, "LLM adaptation & fine-tuning": 58, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 510, "selection_score": 510, "matched_terms": "multi-agent, ad-hoc teamwork, teamwork, coordination", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4312", "poster_number": 4312, "poster_band": "#4000-#4999"}, {"abstract": "Inference-time scaling has recently emerged as a powerful paradigm for improving the reasoning capability of large language models. Among various approaches, \\emph{Sequential Monte Carlo (SMC)} has become a particularly important framework, enabling iterative generation, evaluation, rejection, and resampling of intermediate reasoning trajectories. A central component in this process is the \\emph{reward model}, which evaluates partial solutions and guides the allocation of computation during inference.  However, in practice, true reward models are never available. All deployed systems rely on \\emph{approximate reward models}, raising a fundamental question: \\emph{Why and when do approximate reward models suffice for effective inference-time scaling?} In this work, we provide a theoretical answer. We identify the \\emph{Bellman error} of the approximate reward model as the key quantity governing the effectiveness of SMC-based inference-time scaling. For a reasoning process of length $T$, we show that if the Bellman error of the approximate reward model is bounded by $O(1/T)$, then combining this reward model with SMC reduces the computational complexity of reasoning from exponential in $T$ to polynomial in $T$. This yields an \\emph{exponential improvement} in inference efficiency despite using only approximate rewards.", "authors": "Youheng Zhu, Yiping Lu", "icml_url": "https://icml.cc/virtual/2026/poster/64511", "is_oral": false, "is_spotlight": false, "poster_id": "64511", "presentation_type": "regular", "related_events": "", "title": "On the Power of (Approximate) Reward Models for Inference-Time Scaling", "sequence": 4035, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 338, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 338, "selection_score": 338, "matched_terms": "reward model, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4408", "poster_number": 4408, "poster_band": "#4000-#4999"}, {"abstract": "Post-deployment machine learning algorithms often influence the environments they act in, and thus shift the underlying dynamics that the standard reinforcement learning (RL) methods ignore. While designing optimal algorithms in this performative setting has recently been studied in supervised learning, the RL counterpart remains under-explored. In this paper, we prove the performative counterparts of the performance difference lemma and the policy gradient theorem in RL, and introduce the Performative Policy Gradient algorithm PePG . PePG is the first policy gradient algorithm designed to account for performativity in RL. Under softmax parametrisation, and also with and without entropy regularisation, we prove that PePG converges to performatively optimal policies , i.e. policies that remain optimal under the distribution shifts induced by themselves. Thus, PePG significantly extends the prior works in Performative RL that achieves performative stability but not optimality. Our empirical analysis on standard performative RL environments validate that PePG outperforms the existing performative RL algorithms aiming for stability.", "authors": "Debabrota Basu, Udvas Das, Brahim Driss, Uddalak Mukherjee", "icml_url": "https://icml.cc/virtual/2026/poster/65820", "is_oral": false, "is_spotlight": false, "poster_id": "65820", "presentation_type": "regular", "related_events": "", "title": "Performative Policy Gradient: Optimality in Performative Reinforcement Learning", "sequence": 5343, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 240, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 120, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 240, "selection_score": 240, "matched_terms": "reinforcement learning, policy gradient", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4410", "poster_number": 4410, "poster_band": "#4000-#4999"}, {"abstract": "We consider an online learning problem in environments with multiple change points.  In contrast to the single change point problem that is widely studied using classical \"high confidence\" detection schemes, the multiple change point environment presents new learning-theoretic and algorithmic challenges. Specifically, we show that classical methods may exhibit catastrophic failure (high regret) due to a phenomenon we refer to as  endogenous confounding. To overcome this, we propose a new class of learning algorithms dubbed Anytime Tracking CUSUM (ATC). These are horizon-free online algorithms that implement a selective detection principle, balancing the need to ignore \"small\" (hard-to-detect) shifts, while reacting \"quickly\" to significant ones. We prove that the performance of a properly tuned ATC algorithm is nearly minimax-optimal;  its regret is guaranteed to closely match a novel information-theoretic lower bound on the achievable performance of any learning algorithm in the multiple change point problem. Experiments on synthetic as well as real-world data validate the aforementioned theoretical findings.", "authors": "Tomer Gafni, Garud Iyengar, Assaf Zeevi", "icml_url": "https://icml.cc/virtual/2026/poster/60699", "is_oral": false, "is_spotlight": false, "poster_id": "60699", "presentation_type": "regular", "related_events": "", "title": "The Cost of Learning under Multiple Change Points", "sequence": 228, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 200, "RL & control": 16, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 200, "selection_score": 200, "matched_terms": "online learning, change point, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4505", "poster_number": 4505, "poster_band": "#4000-#4999"}, {"abstract": "In adaptive experiments, statistical inference is essential for reliable decision-making and scientific discovery. Often in these settings, collecting labeled data is expensive, but decision-makers have access to large unlabeled datasets and strong pretrained AI models that can generate outcome predictions. Effectively leveraging these predictions in online experiments poses fundamental challenges for statistical inference: AI models may be misspecified, and data collected under adaptive policies are inherently non-i.i.d., invalidating classical inference techniques. To address these challenges, we propose a Prediction-Powered Adaptive Inference (PPAI) estimator that integrates unlabeled data, predicted labels, and adaptively collected labeled data through a single estimating equation. We establish asymptotic normality of the PPAI estimator under mild conditions on the data-collection policy, enabling valid confidence intervals and hypothesis tests for a broad class of Z-functionals. The method incorporates a data-driven tuning mechanism that adaptively weights AI predictions according to their informativeness, guaranteeing that the resulting asymptotic variance is no worse than that of the labeled-only baseline, and is strictly smaller when predictions are informative. Numerical experiments further support the theory, illustrating efficiency gains with informative AI predictions and robust performance when predictions are inaccurate.", "authors": "Gabriel Sargent, Wei Sun, Zhengwu Zhang, Yufeng Liu", "icml_url": "https://icml.cc/virtual/2026/poster/62629", "is_oral": false, "is_spotlight": false, "poster_id": "62629", "presentation_type": "regular", "related_events": "", "title": "Prediction-Powered Adaptive Inference with Pretrained AI Models for Contextual Bandits", "sequence": 2155, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 300, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 24, "LLM adaptation & fine-tuning": 64, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 300, "selection_score": 300, "matched_terms": "bandit, bandits, contextual bandit", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4508", "poster_number": 4508, "poster_band": "#4000-#4999"}, {"abstract": "In this paper, we study dynamic regret in unconstrained online convex optimization (OCO) with movement costs.  Specifically, we generalize the standard setting by allowing the movement cost coefficients $\\lambda_t$ to vary arbitrarily over time.  Our main contribution is a novel algorithm that establishes the first comparator-adaptive dynamic regret bound for this setting, guaranteeing $\\widetilde{\\mathcal{O}}(\\sqrt{(1+P_T)(T+\\sum_t \\lambda_t)})$ regret, where $P_T$ is the path length of the comparator sequence over $T$ rounds. This recovers the optimal guarantees for both static and dynamic regret in standard OCO as a special case where $\\lambda_t=0$ for all rounds. To demonstrate the versatility of our results, we consider two applications: *OCO with delayed feedback* and *OCO with time-varying memory*. We show that both problems can be translated into time-varying movement costs, establishing a *novel reduction* specifically for the delayed feedback setting that is of independent interest. A crucial observation is that the first-order dependence on movement costs in our regret bound plays a key role in enabling optimal comparator-adaptive dynamic regret guarantees in both settings.", "authors": "Emmanuel Esposito, Andrew Jacobsen, Hao Qiu, Mengxiao Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/60670", "is_oral": false, "is_spotlight": false, "poster_id": "60670", "presentation_type": "regular", "related_events": "", "title": "Parameter-free Dynamic Regret: Time-varying Movement Costs, Delayed Feedback, and Memory", "sequence": 199, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 491, "RL & control": 72, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 491, "selection_score": 491, "matched_terms": "online convex, dynamic regret, delayed feedback, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4509", "poster_number": 4509, "poster_band": "#4000-#4999"}, {"abstract": "Online structured prediction, including online classification as a special case, is the task of sequentially predicting labels from input features. In this setting, the *surrogate regret*—the cumulative excess of the actual target loss (e.g., 0–1 loss) over the surrogate loss (e.g., logistic loss) incurred by the best fixed estimator—has gained attention because it admits a finite bound independent of the time horizon $T$. However, such guarantees break down in *non-stationary* environments, where every fixed estimator may incur surrogate loss that grows linearly with $T$. To address this limitation, we obtain an upper bound of $F_T + O(1 + P_T)$ on the cumulative target loss, where $F_T$ is the cumulative surrogate loss of any comparator sequence and $P_T$ is its *path length*. This bound depends on $T$ only through $F_T$ and $P_T$, thus offering stronger guarantees under non-stationarity. Our core idea is to combine the dynamic regret analysis of online gradient descent (OGD) with the *exploit-the-surrogate-gap* technique. This viewpoint sheds light on the usefulness of a Polyak-style learning rate for OGD, which systematically yields target-loss bounds and performs well empirically. We then extend our approach to broader settings beyond prior work via the *convolutional Fenchel–Young loss*. Finally, a lower bound shows that the dependence on $F_T$ and $P_T$ is tight.", "authors": "Shinsaku Sakaue, Han Bao, Yuzhou Cao", "icml_url": "https://icml.cc/virtual/2026/poster/64806", "is_oral": false, "is_spotlight": false, "poster_id": "64806", "presentation_type": "regular", "related_events": "", "title": "Non-Stationary Online Structured Prediction with Surrogate Losses", "sequence": 4330, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 186, "RL & control": 16, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 186, "selection_score": 186, "matched_terms": "dynamic regret, non-stationary, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4511", "poster_number": 4511, "poster_band": "#4000-#4999"}, {"abstract": "Online convex optimization in non-stationary environments has garnered considerable attention in the literature. Recently, Pasteris et al. (2024) investigate online convex optimization with the optimal switching regret, defined as the sum of the static regret over each segment, where the segmentation is an arbitrary partition of the entire time horizon. For general convex functions, their work has established an optimal switching regret bound. However, it remains open whether similar bounds are attainable for other types of convex functions, such as exponentially concave or strongly convex functions. In this paper, we affirmatively answer this question by proposing a novel meta-algorithm, termed IRESET, which is used to aggregate the decisions from a group of experts. The essence of our method lies in running multiple experts over a set of intervals, and then employing a meta-algorithm equipped with second-order bounds to sequentially combine their decisions. We leverage the segment tree structure to analyze the switching regret over the entire time horizon, and  offer new insights into utilizing recursive equations over the segment tree. By choosing appropriate expert-algorithms for IRESET, our methods achieve logarithmic switching regret bounds for exponentially concave or strongly convex functions, respectively.", "authors": "Wenhao Yang, Yibo Wang, Yuanyu Wan, Lijun Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/64212", "is_oral": false, "is_spotlight": false, "poster_id": "64212", "presentation_type": "regular", "related_events": "", "title": "Logarithmic Switching Regret for Online Convex Optimization", "sequence": 3737, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 509, "RL & control": 64, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 509, "selection_score": 509, "matched_terms": "online convex, switching regret, non-stationary, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4512", "poster_number": 4512, "poster_band": "#4000-#4999"}, {"abstract": "This work studies online episodic tabular Markov decision processes (MDPs) with known transitions and develops best-of-both-worlds algorithms that achieve refined data-dependent regret bounds in the adversarial regime and variance-dependent regret bounds in the stochastic regime. We quantify MDP complexity using a first-order quantity and several new data-dependent measures for the adversarial regime, including a second-order quantity and a path-length measure, as well as variance-based measures for the stochastic regime. To adapt to these measures, we develop algorithms based on global optimization and policy optimization, both built on optimistic follow-the-regularized-leader with log-barrier regularization. For global optimization, our algorithms achieve first-order, second-order, and path-length regret bounds in the adversarial regime, and in the stochastic regime, they achieve a variance-aware gap-independent bound and a variance-aware gap-dependent bound that is polylogarithmic in the number of episodes. For policy optimization, our algorithms achieve the same data- and variance-dependent adaptivity, up to a factor of the episode horizon, by exploiting a new optimistic $Q$-function estimator. Finally, we establish regret lower bounds in terms of data-dependent complexity measures for the adversarial regime and a variance measure for the stochastic regime, implying that the regret upper bounds achieved by the global-optimization approach are nearly optimal.", "authors": "Mingyi Li, Taira Tsuchiya, Kenji Yamanishi", "icml_url": "https://icml.cc/virtual/2026/poster/65529", "is_oral": false, "is_spotlight": false, "poster_id": "65529", "presentation_type": "regular", "related_events": "", "title": "Data- and Variance-dependent Regret Bounds for Online Tabular MDPs", "sequence": 5052, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 64, "RL & control": 288, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 288, "selection_score": 288, "matched_terms": "markov decision, mdp, policy optimization, regret", "selection_reasons": "", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4515", "poster_number": 4515, "poster_band": "#4000-#4999"}, {"abstract": "This paper proposes an asymmetric perturbation technique for solving bilinear saddle-point optimization problems, commonly arising in minimax problems, game theory, and constrained optimization. Perturbing payoffs or values is known to be effective in stabilizing learning dynamics and equilibrium computation. However, it requires decreasing perturbation magnitudes to ensure convergence to an equilibrium in the underlying game, resulting in a slower rate. To overcome this, we introduce an asymmetric perturbation approach, where only one player's payoff function is perturbed. Exploiting the near-linear structure of bilinear problems, we show that, for a sufficiently small perturbation, the equilibrium strategy of the asymmetrically perturbed game coincides with an equilibrium strategy of the original game. Building on this property, we develop a perturbation-based learning algorithm with a linear last-iterate convergence rate to an equilibrium strategy of the original game, and we further show how to construct a parameter-free procedure that retains a linear rate. Finally, we empirically demonstrate fast convergence toward equilibria in both normal-form and extensive-form games.", "authors": "Kenshi Abe, Mitsuki Sakamoto, Kaito Ariu, Atsushi Iwasaki", "icml_url": "https://icml.cc/virtual/2026/poster/62508", "is_oral": true, "is_spotlight": true, "poster_id": "62508", "presentation_type": "oral", "related_events": "Oral presentation: Oral 1G Optimization & Games", "title": "Asymmetric Perturbation in Solving Bilinear Saddle-Point Optimization", "sequence": 2035, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 264, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 264, "selection_score": 354, "matched_terms": "game, games, equilibrium", "selection_reasons": "oral", "icml_time": "Mon, Jul 6, 2026 • 10:00 PM – 11:45 PM PDT", "kst_start": "Tue, Jul 7, 2026 14:00 KST", "timezone_from_page": "PDT", "date_label": "Tue, Jul 7", "time_sort_key": "2026-07-06T22:00:00-07:00", "location": "HALL A #4617", "poster_number": 4617, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-07T18:30:00-07:00", "label": "Wed, Jul 8, 2026 10:30 KST", "icmlTime": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "count": 40, "rows": [{"abstract": "Reinforcement learning usually assumes a given or sometimes even fixed environment in which an agent seeks an optimal policy to maximize its long-term discounted reward. In contrast, we consider agents that are not limited to passive adaptations: they instead have model-changing actions that actively modify the RL model of world dynamics itself. Reconfiguring the underlying transition processes can potentially increase the agents' rewards. Motivated by this setting, we introduce the multi-layer configurable time-varying Markov decision process (MCTVMDP). In an MCTVMDP, the lower-level MDP has a non-stationary transition function that is configurable through upper-level model-changing actions. The agent's objective consists of two parts: Optimize the configuration policies in the upper-level MDP and optimize the primitive action policies in the lower-level MDP to jointly improve its expected long-term reward.", "authors": "Ziqing Lu, Babak Hassibi, Lifeng Lai, Weiyu Xu", "icml_url": "https://icml.cc/virtual/2026/poster/66277", "is_oral": false, "is_spotlight": false, "poster_id": "66277", "presentation_type": "regular", "related_events": "", "title": "Learn to change the world: Multi-level reinforcement learning with model-changing actions", "sequence": 5799, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 32, "RL & control": 300, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 60, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 300, "selection_score": 300, "matched_terms": "reinforcement learning, markov decision, mdp", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #112", "poster_number": 112, "poster_band": "#0000-#0999"}, {"abstract": "We introduce Unsupervised Partner Design (UPD), a population-free multi-agent reinforcement learning method for robust ad-hoc teamwork.  UPD generates training partners on-the-fly and selects them adaptively based on a learnability criterion, removing the need for pre-trained partner populations or manual parameter tuning. We show that this simple mechanism enables effective partner diversity and can be extended to joint partner-environment selection when a procedural level generator is available.  Across Level-Based Foraging, Overcooked-AI, and the Overcooked Generalisation Challenge, UPD consistently outperforms both population-based and population-free baselines.  In a human-AI user study, agents trained with UPD achieve higher returns and are rated as more adaptive, more human-like, and less frustrating than existing approaches.", "authors": "Constantin Ruhdorfer, Matteo Bortoletto, Victor Oei, Anna Penzkofer, Andreas Bulling", "icml_url": "https://icml.cc/virtual/2026/poster/66728", "is_oral": true, "is_spotlight": true, "poster_id": "66728", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2F Robotics and Multi-agent RL", "title": "Unsupervised Partner Design Enables Robust Ad-hoc Teamwork", "sequence": 6246, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 696, "LLM post-training, RLHF & agents": 74, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 696, "selection_score": 1136, "matched_terms": "multi-agent reinforcement learning, multi-agent, ad-hoc teamwork, teamwork, partner design", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #116", "poster_number": 116, "poster_band": "#0000-#0999"}, {"abstract": "Offline cooperative multi-agent reinforcement learning (MARL) faces unique challenges due to the distribution shift between online and offline data collection. While online MARL typically converges to a single coordinated joint policy, offline datasets are often mixtures of diverse cooperative behaviors, resulting in highly multimodal joint behavior distributions. In such settings, independent policy regularization often misaligns joint policy constraints and leads to severe distribution shift. To address this, we propose OMSD, which sequentially decomposes the joint behavior policy into individual conditional distributions and leverages diffusion-based generative models to provide modality-coordinated regularization for each agent. Combined with centralized critic guidance, OMSD achieves coordinated exploration within high-value, in-distribution regions, and avoids out-of-distribution joint actions. Experiments across multiple datasets on various continuous control tasks demonstrate that OMSD consistently achieves state-of-the-art performance, especially in challenging multimodal scenarios. Our results highlight the necessity of modality-aware coordination for robust offline MARL.", "authors": "Dan Qiao, Wenhao Li, Shanchao Yang, Hongyuan Zha, Baoxiang Wang", "icml_url": "https://icml.cc/virtual/2026/poster/64191", "is_oral": false, "is_spotlight": false, "poster_id": "64191", "presentation_type": "regular", "related_events": "", "title": "Offline Multi-Agent Reinforcement Learning via Sequential Score Decomposition", "sequence": 3716, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 32, "RL & control": 172, "Multi-agent RL, games & coordination": 700, "LLM post-training, RLHF & agents": 226, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 20}, "raw_topic_score": 700, "selection_score": 700, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, coordination, cooperative", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #125", "poster_number": 125, "poster_band": "#0000-#0999"}, {"abstract": "We study episodic constrained Markov decision processes (CMDPs) with linear function approximation, where the goal is to achieve strong regret and constraint violation guarantees without allowing error cancellations. Unlike the existing work, which focuses on either tabular CMDP or model-based reinforcement learning methods. We propose a model-free policy APMPO that achieves near-optimal $\\widetilde{O}(\\sqrt{K})$ strong regret and strong constraint violation with Slater's condition (or strict feasibility assumption), where $K$ is the total number of episodes. It matches the best-known rates without requiring any prior knowledge of the feasibility gap reported in prior model-based work for tabular CMDPs. Besides,  APMPO achieves $\\widetilde{O}(K^{\\frac{3}{4}})$ strong regret and $\\widetilde{O}(K^\\frac{3}{4})$ strong constraint violation without Slater's condition. To the best of our knowledge, this is the first sublinear result of CMDP w.r.t. the strong metrics without Slater's condition.   APMPO achieves these results by a novel and adaptive design of a violation-aware penalty and learning rates to balance the strong regret and constraint violation, which is quite different from the (regularized) primal-dual methods imposing constraints via dual penalty in the literature. The experiments show APMPO significantly outperforms the strong baselines, which justify our design and theoretical performance.", "authors": "Xiyue Peng, Lingkai Zu, Ziyu Shao, Xin Liu", "icml_url": "https://icml.cc/virtual/2026/poster/60646", "is_oral": false, "is_spotlight": false, "poster_id": "60646", "presentation_type": "regular", "related_events": "", "title": "Towards Achieving Optimal Strong Regret and Constraint Violation via Computational Efficient Model-free RL", "sequence": 175, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 56, "RL & control": 332, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 332, "selection_score": 332, "matched_terms": "reinforcement learning, markov decision, mdp, cmdp, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #206", "poster_number": 206, "poster_band": "#0000-#0999"}, {"abstract": "We study learning multi-task, multi-agent policies for cooperative, temporal objectives, under centralized training, decentralized execution. In this setting, using automata to represent tasks assigned to agents enables breaking down a team-level objective into simpler, smaller sub-tasks. However, existing approaches remain sample-inefficient and are limited to the single-task case, requiring retraining policies for each new task. In this work, we present Automata-Conditioned Cooperative Multi-Agent Reinforcement Learning (ACC-MARL), a framework for learning task-conditioned, decentralized team policies. We identify the main challenges to the feasibility of ACC-MARL, propose solutions, and prove that our approach is optimal. We further show that learned value functions can be used to assign tasks optimally at test time. Experiments demonstrate emergent task-aware, multi-step coordination among agents, such as pressing a button to unlock a door, holding the door, and short-circuiting tasks.", "authors": "Beyazit Yalcinkaya, Marcell Vazquez-Chanlatte, Ameesh Shah, Hanna Krasowski, Sanjit Seshia", "icml_url": "https://icml.cc/virtual/2026/poster/63254", "is_oral": false, "is_spotlight": false, "poster_id": "63254", "presentation_type": "regular", "related_events": "", "title": "Automata-Conditioned Cooperative Multi-Agent Reinforcement Learning", "sequence": 2779, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 816, "LLM post-training, RLHF & agents": 266, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 816, "selection_score": 816, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, decentralized, coordination, cooperative", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #209", "poster_number": 209, "poster_band": "#0000-#0999"}, {"abstract": "Memory is critical for long-horizon and history-dependent robotic manipulation. Such tasks often involve counting repeated actions or manipulating objects that become temporarily occluded. Recent vision-language-action (VLA) models have begun to incorporate memory mechanisms; however, their evaluations remain confined to narrow, non-standardized settings. This limits their systematic understanding, comparison, and progress measurement. To address these challenges, we introduce **RoboMME**: a large-scale standardized benchmark for evaluating and advancing VLA models in long-horizon, history-dependent scenarios. Our benchmark comprises 16 manipulation tasks constructed under a carefully designed taxonomy that evaluates temporal, spatial, object, and procedural memory. We further develop a suite of 14 memory-augmented VLA variants built on the $\\pi_{0.5}$ backbone to systematically explore different memory representations across multiple integration strategies. We show that the effectiveness of memory representations is highly task-dependent, with each design offering distinct advantages and limitations across different tasks.  Videos and code can be found in https://anonymtest1.github.io", "authors": "Yinpei Dai, Hongze Fu, Jayjun Lee, Yuejiang Liu, Haoran Zhang, Jianing Yang, Chelsea Finn, Nima Fazeli, Joyce Chai", "icml_url": "https://icml.cc/virtual/2026/poster/65933", "is_oral": true, "is_spotlight": true, "poster_id": "65933", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2F Robotics and Multi-agent RL", "title": "RoboMME: Benchmarking and Understanding Memory for Robotic Generalist Policies", "sequence": 5456, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 600}, "raw_topic_score": 600, "selection_score": 800, "matched_terms": "vision-language-action, vla, robot, robotic, manipulation, robotic generalist", "selection_reasons": "oral, oral robotics / multi-agent RL focus", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #502", "poster_number": 502, "poster_band": "#0000-#0999"}, {"abstract": "Diffusion policies have achieved remarkable success in robotic manipulation, yet they often fail to satisfy strict physical constraints required for safe deployment.  Existing approaches impose safety either prematurely during training or reactively via external guardrails at test time, limiting policy expressivity and overall scalability. We propose Physical safety Alignment for Constrained Trajectories (PACT), a self-evolving post-training framework that projects pretrained diffusion policies onto constraint-feasible regions without accessing demonstration data or task rewards. PACT distills constraint gradients into the diffusion model through a reverse-KL objective with dense supervision across timesteps. It incorporates a curriculum that progressively tightens constraints while maintaining theoretically bounded policy shift and monotone improvement, mitigating the safety-performance trade-off from catastrophic forgetting. On simulated and real-world embodied manipulation benchmarks, PACT significantly reduces safety violations by 31.0% on average while improving task success by 30.7%.", "authors": "Lingxuan Wu, Zijian Zhu, Lizhong Wang, Chengyang Ying, Huayu Chen, Xiao Yang, Fangming Liu, Jun Zhu", "icml_url": "https://icml.cc/virtual/2026/poster/62679", "is_oral": false, "is_spotlight": true, "poster_id": "62679", "presentation_type": "spotlight", "related_events": "", "title": "PACT: Self-Evolving Physical Safety Alignment for Diffusion Policies in Embodied Manipulation", "sequence": 2205, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 116, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 654}, "raw_topic_score": 654, "selection_score": 699, "matched_terms": "diffusion policies, robot, robotic, embodied, manipulation, diffusion", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #506", "poster_number": 506, "poster_band": "#0000-#0999"}, {"abstract": "We consider anonymous multi-agent path finding (MAPF) where a set of robots is tasked to travel to a set of targets on a finite, connected graph. We show that MAPF can be cast as a special class of multi-marginal optimal transport (MMOT) problems with an underlying Markovian structure, under which the exponentially large MMOT collapses to a linear program (LP) polynomial in size. Focusing on the anonymous setting, we establish conditions under which the corresponding LP is feasible, totally unimodular, and yields min-cost, integral~$(\\{0,1\\})$ transports that do not overlap in both space and time. To adapt the approach to large-scale problems, we cast the MAPF-MMOT in a probabilistic framework via Schrödinger bridges. Under standard assumptions, we show that the Schrödinger bridge formulation reduces to an entropic regularization of the corresponding MMOT that admits an iterative Sinkhorn-type solution. The Schrödinger bridge, being a probabilistic framework, provides a shadow (fractional) transport that we use as a template to solve a reduced LP and demonstrate that it results in near-optimal, integral transports at a significant reduction in complexity. Extensive experiments highlight the optimality and scalability of the proposed approaches.", "authors": "Usman A Khan, Joseph Durham", "icml_url": "https://icml.cc/virtual/2026/poster/65504", "is_oral": true, "is_spotlight": true, "poster_id": "65504", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2F Robotics and Multi-agent RL", "title": "Optimal and Scalable MAPF via Multi-Marginal Optimal Transport and Schrödinger Bridges", "sequence": 5028, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 838, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 30}, "raw_topic_score": 838, "selection_score": 1278, "matched_terms": "multi-agent, mapf, multi-agent path finding, multi-marginal optimal transport, schrödinger bridges", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #507", "poster_number": 507, "poster_band": "#0000-#0999"}, {"abstract": "Large and diverse datasets are needed for training generalist robot policies that have potential to control a variety of robot embodiments--robot arm and gripper combinations--across diverse tasks and environments. As re-collecting demonstrations and retraining for each new hardware platform are prohibitively costly, we show that existing robot data can be augmented for transfer and generalization. The Open X-Embodiment (OXE) dataset, which aggregates demonstrations from over 60 robot datasets, has been widely used as the foundation for training generalist policies. However, it is highly imbalanced: the top four robot types account for over 85% of its real data, which risks overfitting to robot--scene combinations. We present AugE-Toolkit, a scalable robot augmentation pipeline, and OXE-AugE, a high-quality open-source dataset that augments OXE with 9 different robot embodiments. OXE-AugE provides over 4.4 million trajectories, more than triple the size of the original OXE. We conduct a systematic study of how scaling robot augmentation impacts cross-embodiment learning. Results suggest that augmenting datasets with diverse arms and grippers improves policy performance not only on the augmented robots, but also on unseen robots and even the original robots under distribution shifts. In physical experiments, we demonstrate that generalist policies such as OpenVLA and $\\pi_0$ benefit from fine-tuning on OXE-AugE, improving success rates by 24-45% on previously unseen robot-gripper combinations across four real-world manipulation tasks.", "authors": "Guanhua Ji, Harsha Polavaram, Lawrence Yunliang Chen, Sandeep Bajamahal, Zehan Ma, Simeon Adebola, Chenfeng Xu, Ken Goldberg", "icml_url": "https://icml.cc/virtual/2026/poster/64619", "is_oral": false, "is_spotlight": true, "poster_id": "64619", "presentation_type": "spotlight", "related_events": "", "title": "OXE-AugE: A Large-Scale Robot Augmentation of OXE for Scaling Cross-Embodiment Policy Learning", "sequence": 4143, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 34, "Robotics, VLA & diffusion policy": 624}, "raw_topic_score": 624, "selection_score": 669, "matched_terms": "vla, robot, manipulation, robot policies, control", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #509", "poster_number": 509, "poster_band": "#0000-#0999"}, {"abstract": "Robotic manipulation benefits from foundation models that describe goals, but today's agents still lack a principled way to learn from their own mistakes. We ask whether natural language can serve as feedback, an error-reasoning signal that helps embodied agents diagnose what went wrong and correct course. We introduce LAGEA (Language Guided Embodied Agents), a framework that turns episodic, schema-constrained reflections from a vision language model (VLM) into temporally grounded guidance for reinforcement learning. LAGEA summarizes each attempt in concise language, localizes the decisive moments in the trajectory, aligns feedback with visual state in a shared representation, and converts goal progress and feedback agreement into bounded, step-wise shaping rewardswhose influence is modulated by an adaptive, failure-aware coefficient. This design yields dense signals early when exploration needs direction and gracefully recedes as competence grows. On the Meta-World MT10 and Robotic Fetch embodied manipulation benchmarks, LAGEA improves average success over the state-of-the-art (SOTA) methods by 9.0% on random goals, 5.3% on fixed goals, and 17% on fetch tasks, while converging faster. These results support our hypothesis: language, when structured and grounded in time, is an effective mechanism for teaching robots to self-reflect on mistakes and make better choices. Code will be released soon.", "authors": "Abdul Monaf Chowdhury, Akm Moshiur Rahman Mazumder, Safaeid Arib, Rabeya Akter", "icml_url": "https://icml.cc/virtual/2026/poster/60801", "is_oral": false, "is_spotlight": false, "poster_id": "60801", "presentation_type": "regular", "related_events": "", "title": "LAGEA: Language Guided Embodied Agents for Robotic Manipulation", "sequence": 330, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 42, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 142, "LLM adaptation & fine-tuning": 58, "Robotics, VLA & diffusion policy": 684}, "raw_topic_score": 684, "selection_score": 684, "matched_terms": "robot, robotic, embodied, manipulation, trajectory", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #602", "poster_number": 602, "poster_band": "#0000-#0999"}, {"abstract": "Visual-language action (VLA) models enable robots to predict actions directly from observations and language instructions, but their performance depends on large-scale, high-quality data and is limited by the scarcity of real-world robot action datasets. To facilitate VLA model learning with abundant unlabeled human videos, Latent Action Models (LAM) learn latent action representations from visual dynamics to provide additional supervision for VLA learning. However, LAM and VLA are typically trained separately, leaving LAM ungrounded during VLA training and VLA models constrained by frozen LAM representations. To address these issues, we propose Latent Action Representation Alignment (LARA), a plug-and-play framework that jointly optimizes LAM and VLA via representation alignment. This enables reciprocal benefits where LAMs learn with action trajectories to avoid spurious visual changes, while VLAs are regularized by forward dynamics learned within LAMs to reduce hallucinations of functionally ineffective trajectories. We demonstrate LARA's versatility and effectiveness for pre-training, post-training enhancement of pre-trained VLA models, and LAM refinement, achieving an average of ~10%, ~5%, and ~15% improvement over 3 simulation and 1 meticulously designed real-world robotic manipulation benchmarks.", "authors": "Mengya Liu, Baoxiong Jia, Jiangyong Huang, Jingze Zhang, Siyuan Huang", "icml_url": "https://icml.cc/virtual/2026/poster/61232", "is_oral": false, "is_spotlight": false, "poster_id": "61232", "presentation_type": "regular", "related_events": "", "title": "LARA: Latent Action Representation Alignment for Vision-Language-Action Models", "sequence": 760, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 136, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 832}, "raw_topic_score": 832, "selection_score": 832, "matched_terms": "vision-language-action, vla, robot, robotic, manipulation, latent action", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #603", "poster_number": 603, "poster_band": "#0000-#0999"}, {"abstract": "Vision-Language-Action (VLA) models have recently shown strong generalization, with some approaches seeking to explicitly generate linguistic reasoning traces or predict future observations prior to execution. However, explicit reasoning typically incurs non-negligible inference latency, which constrains the temporal resolution required for robotic manipulation. Moreover, such reasoning is confined to the linguistic space, imposing a representational bottleneck that struggles to faithfully capture ineffable physical attributes. To mitigate these limitations, we propose LaST$_0$, a framework that enables efficient reasoning before acting through a Latent Spatio-Temporal Chain-of-Thought (CoT), capturing fine-grained physical and robotic dynamics that are often difficult to verbalize. Specifically, we introduce a token-efficient latent CoT space that models future visual dynamics, 3D structural information, and robot proprioceptive states, and further extends these representations across time to enable temporally consistent implicit reasoning trajectories. Furthermore, LaST$_0$ adopts a dual-system architecture implemented via a Mixture-of-Transformers design, where a reasoning expert conducts low-frequency latent inference and an acting expert generates high-frequency actions conditioned on robotics-oriented latent representations. To facilitate coordination, LaST$_0$ is trained with heterogeneous operation frequencies, enabling adaptive switching during deployment. Across 10 real-world tasks spanning tabletop, mobile, and dexterous hand manipulation, LaST$_0$ improves mean success rates by 13%, 14% and 14% over prior SOTA VLA methods, respectively.", "authors": "Zhuoyang Liu, Jiaming Liu, Hao Chen, Jiale Yu, Ziyu Guo, Chengkai Hou, Xiangju Mi, Chenyang Gu, Renrui Zhang, Kun Wu, Yinuo Zhao, Jian Tang, Pheng Ann Heng, Shanghang Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/61887", "is_oral": false, "is_spotlight": true, "poster_id": "61887", "presentation_type": "spotlight", "related_events": "", "title": "LaST$_{0}$: Latent Spatio-Temporal Chain-of-Thought for Robotic Vision-Language-Action Model", "sequence": 1414, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 30, "LLM post-training, RLHF & agents": 60, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 760}, "raw_topic_score": 760, "selection_score": 805, "matched_terms": "vision-language-action, vla, robot, robotic, robotics, manipulation", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #605", "poster_number": 605, "poster_band": "#0000-#0999"}, {"abstract": "Vision-Language-Action (VLA) models benefit from Chain-of-Thought (CoT) reasoning, but existing approaches incur high inference overhead and rely on discrete reasoning representations that mismatch continuous perception and control. We propose Latent Reasoning VLA (LaRA-VLA), a unified VLA framework that internalizes multi-modal CoT reasoning into continuous latent representations for embodied action.  LaRA-VLA performs unified reasoning and prediction in latent space, eliminating explicit CoT generation at inference time and enabling efficient, action-oriented control. To realize latent embodied reasoning, we introduce a curriculum-based training paradigm that progressively transitions from explicit textual and visual CoT supervision to latent reasoning, and finally adapts latent reasoning dynamics to condition action generation. We construct two structured CoT datasets, LIBERO-LaRA and Bridge-LaRA, and evaluate LaRA-VLA across simulation benchmarks and long-horizon real-robot manipulation tasks. Experimental results show that LaRA-VLA outperforms existing state-of-the-art VLA methods while achieving up to a 90\\% reduction in inference latency compared to explicit CoT-based VLA approaches, highlighting latent reasoning as an effective and efficient paradigm for real-time embodied control.", "authors": "Shuanghao Bai, Jing Lyu, Wanqi Zhou, Zhe Li, Dakai Wang, Lei Xing, Xiaoguang Zhao, Pengwei Wang, Zhongyuan Wang, Cheng Chi, Badong Chen, Shanghang Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/64290", "is_oral": false, "is_spotlight": false, "poster_id": "64290", "presentation_type": "regular", "related_events": "", "title": "Latent Reasoning VLA: Latent Thinking and Prediction for Vision-Language-Action Models", "sequence": 3815, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 42, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 120, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 812}, "raw_topic_score": 812, "selection_score": 812, "matched_terms": "vision-language-action, vla, robot, embodied, manipulation, control", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #607", "poster_number": 607, "poster_band": "#0000-#0999"}, {"abstract": "To improve generalization and resilience in human–robot collaboration (HRC), robots must handle the combinatorial diversity of human behaviors and contexts, motivating multi-agent reinforcement learning (MARL). However, inherent heterogeneity between robots and humans creates a rationality gap (RG) in the learning process--a variational mismatch between decentralized best-response dynamics and centralized cooperative ascent. The resulting learning problem is a general-sum differentiable game, so independent policy-gradient updates can oscillate or diverge without added structure. We propose heterogeneous-agent Lyapunov policy optimization (HALyPO), which establishes formal stability directly in the policy-parameter space by enforcing a per-step Lyapunov decrease condition on a parameter-space disagreement metric. Unlike Lyapunov-based safe RL, which targets state/trajectory constraints in constrained Markov decision processes, HALyPO uses Lyapunov certification to stabilize decentralized policy learning. HALyPO rectifies decentralized gradients via optimal quadratic projections, ensuring monotonic contraction of RG and enabling effective exploration of open-ended interaction spaces. Extensive simulations and real-world humanoid-robot experiments show that this certified stability improves generalization and robustness in collaborative corner cases.", "authors": "Hao Zhang, Yaru Niu, Yikai Wang, Ding Zhao, Eric Tseng", "icml_url": "https://icml.cc/virtual/2026/poster/61049", "is_oral": true, "is_spotlight": true, "poster_id": "61049", "presentation_type": "oral", "related_events": "Oral presentation: Oral 2F Robotics and Multi-agent RL", "title": "Learning Human-Robot Collaboration via Heterogeneous-Agent Lyapunov Policy Optimization", "sequence": 577, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 368, "Multi-agent RL, games & coordination": 826, "LLM post-training, RLHF & agents": 94, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 400}, "raw_topic_score": 826, "selection_score": 1266, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, decentralized, heterogeneous-agent, human-robot collaboration, collaboration, cooperative, game", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #609", "poster_number": 609, "poster_band": "#0000-#0999"}, {"abstract": "We present a fine-grained theoretical analysis of the performance gap between reinforcement learning from human feedback (RLHF) and direct preference optimization (DPO) under a representation gap. Our study decomposes this gap into two sources: an explicit representation gap under exact optimization and an implicit representation gap under finite samples. In the exact optimization setting, we characterize how the relative capacities of the reward and policy model classes influence the final policy qualities. We show that RLHF, DPO, or online DPO can outperform one another depending on type of model mis-specifications. Notably, online DPO can outperform both RLHF and standard DPO when the reward and policy model classes are isomorphic and both mis-specified. In the approximate optimization setting, we provide a concrete construction where the ground-truth reward is implicitly sparse and show that RLHF requires significantly fewer samples than DPO to recover an effective reward model, highlighting a statistical advantage of two-stage learning. Together, these results provide a comprehensive understanding of the performance gap between RLHF and DPO under various settings, and offer practical insights into when each method is preferred.", "authors": "Ruizhe Shi, Minhak Song, Runlong Zhou, Zihan Zhang, Maryam Fazel, Simon Du", "icml_url": "https://icml.cc/virtual/2026/poster/61206", "is_oral": false, "is_spotlight": false, "poster_id": "61206", "presentation_type": "regular", "related_events": "", "title": "Understanding the Performance Gap in Preference Learning: A Dichotomy of RLHF and DPO", "sequence": 734, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 822, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 822, "selection_score": 822, "matched_terms": "rlhf, preference learning, preference optimization, online dpo, dpo, reward model", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #1502", "poster_number": 1502, "poster_band": "#1000-#1999"}, {"abstract": "We propose SHINE (Scalable Hyper In-context NEtwork), a scalable hypernetwork that can map diverse meaningful contexts into high-quality LoRA adapters for large language models (LLM). By reusing the frozen LLM's own parameters in an in-context hypernetwork design and introducing architectural innovations, SHINE overcomes key limitations of prior hypernetworks and achieves strong expressive power with a relatively small number of parameters. We introduce a pretraining and instruction fine-tuning pipeline, and train our hypernetwork to generate high quality LoRA adapters from diverse meaningful contexts in a single forward pass. It updates LLM parameters without any fine-tuning, and immediately enables complex question answering tasks related to the context without directly accessing the context, effectively transforming in-context knowledge to in-parameter knowledge in one pass. Our work achieves outstanding results on various tasks, greatly saves time, computation and memory costs compared to SFT-based LLM adaptation, and shows great potential for scaling. Our code is available at https://anonymous.4open.science/r/metalora-734E", "authors": "Yewei Liu, Xiyuan Wang, Yansheng Mao, Yoav Gelberg, Haggai Maron, Muhan Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/63178", "is_oral": false, "is_spotlight": false, "poster_id": "63178", "presentation_type": "regular", "related_events": "", "title": "SHINE: A Scalable In-Context Hypernetwork for Mapping Context to LoRA in a Single Pass", "sequence": 2703, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 86, "LLM adaptation & fine-tuning": 526, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 526, "selection_score": 526, "matched_terms": "llm adaptation, fine-tuning, lora, adapter, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Wed, Jul 8, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T18:30:00-07:00", "location": "HALL A #1801", "poster_number": 1801, "poster_band": "#1000-#1999"}, {"abstract": "While Large language models (LLMs) have strong abilities, they generally rely on fine-tuning to supplement downstream task-specific knowledge. Due to the prohibitive memory overhead of full fine-tuning (FT), existing parameter-efficient fine-tuning techniques, e.g., LoRA and Adapters, update parameters only in low-rank or restricted subspaces. However, they fail to approximate FT---the performative fine-tuner---and risk performance degradation in tough tasks. Therefore, we naturally raise a Low-cost Full Fine-tuning question: Can we approach standard full fine-tuning in theory, yet with much lower costs in practice? Our key insight is that performing selective updates at each step can, theoretically, recover FT asymptotically, while being cost-effective and ignoring no parameter direction. This motivates a new general fine-tuning paradigm (called Think-Touch ): we first predict potentials of parameter groups ( think ) and then update only the selected ( touch ) in one step. Theoretically, we show that under a very weak sufficient condition---divergence of the cumulative coverage of the expected gradient norm---any selection strategy can converge in the full-parameter space to a stationary point at which the FT admits no further first-order improvement. Besides, we further derive the general convergence rate for our paradigm and identify a post-hoc greedy strategy that is rate-optimal. Unfortunately, this strategy cannot be directly applied in practice due to its reliance on full and accurate gradient information. Thus, we propose a bandit-based method to online approximate this ideal strategy in the long run with a rigorous regret guarantee. Extensive experimental results on various tasks demonstrate the potential of our paradigm, including much lower space overheads against FT and better performance than LoRAs.", "authors": "Li, Yaming Guo, Shenghao Gao, Xinlong Chen, Zuhao Xu, Ying Sun, Chao Wang, Hui Xiong", "icml_url": "https://icml.cc/virtual/2026/poster/65033", "is_oral": false, "is_spotlight": false, "poster_id": "65033", "presentation_type": "regular", "related_events": "", "title": "Low-cost Full Fine-tuning: Learning What to Update for LLMs", "sequence": 4557, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 36, "RL & control": 8, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 86, "LLM adaptation & fine-tuning": 542, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 542, "selection_score": 542, "matched_terms": "fine-tuning, parameter-efficient, lora, adapter, adapt, large language model, language model, llm", "selection_re
