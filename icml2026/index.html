res": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 432, "LLM post-training, RLHF & agents": 340, "LLM adaptation & fine-tuning": 84, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 432, "selection_score": 432, "matched_terms": "multi-agent reinforcement learning, multi-agent, cooperative, game", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3504", "poster_number": 3504, "poster_band": "#3000-#3999"}, {"abstract": "Large Vision-Language Models (LVLMs) have achieved remarkable progress in multimodal reasoning tasks; however, their learning remains constrained by the limitations of human-annotated supervision. Recent self-rewarding approaches attempt to overcome this constraint by allowing models to act as their own critics or reward providers. Yet, purely text-based self-evaluation struggles to verify complex visual reasoning steps and often suffers from evaluation hallucinations. To address these challenges, inspired by recent advances in tool-integrated reasoning, we propose Agent0-VL, a self-evolving vision-language agent that achieves continual improvement with tool-integrated reasoning. Agent0-VL incorporates tool usage not only into reasoning but also into self-evaluation and self-repair, enabling the model to introspect, verify, and refine its reasoning through evidence-grounded analysis. It unifies two synergistic roles within a single LVLM: a Solver that performs multi-turn tool-integrated reasoning, and a Verifier that generates structured feedback and fine-grained self-rewards through tool-grounded critique. These roles interact through a Self-Evolving Reasoning Cycle, where tool-based verification and reinforcement learning jointly align the reasoning and evaluation distributions for stable self-improvement. Through this zero-external-reward evolution, Agent0-VL aligns its reasoning and verification behaviors without any human annotation or external reward models, achieving continual self-improvement. Experiments on chart reasoning, geometric problem solving, and visual scientific analysis show that Agent0-VL achieves an 12.5% improvement over the Qwen-VL base model.", "authors": "Jiaqi Liu, Kaiwen Xiong, Peng Xia, Yiyang Zhou, Haonian Ji, Lu Feng, Siwei Han, Mingyu Ding, Huaxiu Yao", "icml_url": "https://icml.cc/virtual/2026/poster/63095", "is_oral": true, "is_spotlight": true, "poster_id": "63095", "presentation_type": "oral", "related_events": "Oral presentation: Oral 5G Spatial Reasoning", "title": "Agent0-VL: Exploring Self-Evolving Agent for Tool-Integrated Vision-Language Reasoning", "sequence": 2620, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 286, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 286, "selection_score": 376, "matched_terms": "reward model, language model, reasoning, agent", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3513", "poster_number": 3513, "poster_band": "#3000-#3999"}, {"abstract": "Achieving Artificial General Intelligence (AGI) requires agents that learn and interact adaptively, with interactive world models providing scalable environments for perception, reasoning, and action. Yet current research still lacks large-scale datasets and unified benchmarks to evaluate their physical interaction capabilities. To address this, we propose iWorld-Bench, a comprehensive benchmark for training and testing world models on interaction-related abilities such as distance perception and memory. We construct a diverse dataset with 330k video clips and select 2.1k high-quality samples covering varied perspectives, weather, and scenes. As existing world models differ in interaction modalities, we introduce an \\textbf{Action Generation Framework} to unify evaluation and design six task types, generating 4.9k test samples. These tasks jointly assess model performance across \\textbf{visual generation, trajectory following, and memory}. Evaluating 14 representative world models, we identify key limitations and provide insights for future research. The iWorld-Bench model leaderboard is publicly available at iWorld-Bench.com.", "authors": "Jianjie Fang, Yingshan Lei, Qin Wan, Ziyou Wang, Yuchao Huang, Yongyan Xu, Baining Zhao, Weichen Zhang, Chen Gao, Xinlei Chen, Yong Li", "icml_url": "https://icml.cc/virtual/2026/poster/63894", "is_oral": false, "is_spotlight": false, "poster_id": "63894", "presentation_type": "regular", "related_events": "", "title": "iWorld-Bench: A Benchmark for Interactive World Models with a Unified Action Generation Framework", "sequence": 3419, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 30, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 170}, "raw_topic_score": 170, "selection_score": 170, "matched_terms": "world model, trajectory", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3605", "poster_number": 3605, "poster_band": "#3000-#3999"}, {"abstract": "Recently, it has received growing attention in building AI Scientist agents with Large Language Models (LLMs). Since scientific discovery fundamentally relies on uncovering causal relationships from observations, the capability of causal thinking that distinguish causation from correlation and hidden biases, is essential to LLM agents. Despite a number of existing benchmarks for AI scientists, none of them are designed with the consideration of hidden biases and confounders, that widely exist in real-world scientific discovery. To this end, we present CausalGame, a benchmark that evaluates the causal thinking capabilities of LLM agents through interactive games. More specifically, we ask LLM agents to actively design experimental protocols, collect observation data and derive a final solution with an explanation report. To emulate realistic scientific discovery challenges, we design 14 game settings with the incorporation of selection bias, noisy measurements, and hidden confounders. The results with 16 frontier LLM agents show that they consistently fail to reason about and recover the underlying causal relationships required to solve the games. CausalGame provides a rigorous measurement of capabilities essential to AI Scientist agents.", "authors": "Zhenhao Chen, Yongqiang Chen, Chenxi Liu, Junchi Yu, Xiangchen Song, Zijian Li, Jialin Li, Phil Torr, Bo Han, Kun Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/63530", "is_oral": true, "is_spotlight": true, "poster_id": "63530", "presentation_type": "oral", "related_events": "Oral presentation: Oral 5D AI Evaluation & Methodology", "title": "CausalGame: Benchmarking Causal Thinking of LLM Agents in Games", "sequence": 3055, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 352, "LLM post-training, RLHF & agents": 322, "LLM adaptation & fine-tuning": 140, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 352, "selection_score": 442, "matched_terms": "game, games", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3609", "poster_number": 3609, "poster_band": "#3000-#3999"}, {"abstract": "Low-Rank Adaptation (LoRA) and its variants enable parameter-efficient fine-tuning of large language models under the supervised fine-tuning (SFT) paradigm. However, their efficacy and behavior under Reinforcement Learning with Verifiable Rewards (RLVR) are less well understood. In particular, two structurally initialized LoRA variants, PiSSA and MiLoRA, which outperform standard LoRA under SFT, can underperform standard LoRA under RLVR and may even exhibit training instability. These observations suggest that how to initialize the low-rank matrices in RLVR remains unclear. In this work, we develop a theoretical analysis of LoRA in RLVR, showing that orthonormal initialization achieves the minimal gap between LoRA’s outcome and that of full fine-tuning. Guided by this insight, we propose geometry-preserving orthonormal initialization for low-rank adaptation in RLVR, leading to two new variants, LoRA-RLPO and LoRA-RLMO. Experiments on mathematical reasoning benchmarks show that our orthonormal initialization stabilizes RLVR training and outperforms standard LoRA, contrasting with PiSSA and MiLoRA. Finally, our unified analysis also explains why PiSSA and MiLoRA can underperform in RLVR, which may be of independent interest.", "authors": "Ruijia Zhang, Jiacheng Zhu, Hanqing Zhu, Laixi Shi", "icml_url": "https://icml.cc/virtual/2026/poster/63355", "is_oral": false, "is_spotlight": false, "poster_id": "63355", "presentation_type": "regular", "related_events": "", "title": "Geometry-Preserving Orthonormal Initialization for Low-Rank Adaptation in Reinforcement Learning", "sequence": 2880, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 68, "LLM adaptation & fine-tuning": 918, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 918, "selection_score": 918, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt, large language model, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3612", "poster_number": 3612, "poster_band": "#3000-#3999"}, {"abstract": "In this paper, we study a class of non-convex optimization problems known as multi-affine quadratic equality constrained problems, which appear in various applications--from generating feasible force trajectories in robotic locomotion and manipulation to training neural networks. Although these problems are generally non-convex, they exhibit convexity or related properties when all variables except one are fixed. Under mild assumptions, we prove that the alternating direction method of multipliers (ADMM) converges when applied to this class of problems. Furthermore, when the \"degree\" of non-convexity in the constraints remains within certain bounds, we show that ADMM achieves a linear convergence rate. We validate our theoretical results through practical examples in robotic locomotion.", "authors": "Yutong Chao, Michal Ciebielski, Jalal Etesami, Majid Khadiv", "icml_url": "https://icml.cc/virtual/2026/poster/64498", "is_oral": false, "is_spotlight": false, "poster_id": "64498", "presentation_type": "regular", "related_events": "", "title": "Last-iterate Convergence of ADMM on Multi-affine Quadratic Equality Constrained Problem", "sequence": 4022, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 158}, "raw_topic_score": 158, "selection_score": 158, "matched_terms": "robot, robotic, manipulation", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3711", "poster_number": 3711, "poster_band": "#3000-#3999"}, {"abstract": "As Multimodal Large Language Models (MLLMs) continue to be trained, the availability of public data diminishes, limiting the possibility for further training and adaptation. However, private data remains an underutilized yet valuable resource. Federated Learning (FL) enables decentralized training on private data, yet extending it to MLLMs is challenging: heterogeneous client modalities induce architectural incompatibility, and full-parameter fine-tuning of billion-scale models incurs prohibitive communication costs. Parameter-efficient methods like LoRA alleviate these issues but introduce aggregation inconsistency, as averaged low-rank updates fail to recover the true global update faithfully.  To address these issues, we propose **UniFLoW**(Universal multi-modal Federated LoRA fine-tuning framework With Analytical Aggregation), a unified federated framework that leverages pre-trained large language models and a multi-modal Encoder architecture, and our proposed Federated Aggregating Analytical Low-Rank Adaption$FedA^2$-$LoRA$). UniFLoW effectively utilizes fragmented client-side multi-modal data while $FedA^2$-$LoRA$ ensuring consistent aggregation. And modality-specific encoders and a II stage training strategy ensure effective integration of diverse modalities without overfitting.  Experiments on text, image, and speech demonstrate that **UniFLoW** enables scalable, communication-efficient, and aggregation-consistent federated fine-tuning,   with $FedA^2$-$LoRA$ achieving state-of-the-art performance compared to existing FedLoRA approaches. We envision UniFLoW as a promising solution to the growing scarcity of public data.", "authors": "haoyuan liang, Zhiyu Ye, Jielong Tang, Yang Yang, Shilei Cao, Guowen Li, Fei Hu, Zhiwei Zhang, Haohuan Fu, Juepeng Zheng", "icml_url": "https://icml.cc/virtual/2026/poster/66625", "is_oral": false, "is_spotlight": false, "poster_id": "66625", "presentation_type": "regular", "related_events": "", "title": "UniFLoW: Universal Multi-Modal Federated LoRA Fine-Tuning Framework with Analytical Aggregation", "sequence": 6144, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 30, "LLM post-training, RLHF & agents": 88, "LLM adaptation & fine-tuning": 738, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 738, "selection_score": 738, "matched_terms": "fine-tuning, parameter-efficient, lora, federated fine-tuning, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3712", "poster_number": 3712, "poster_band": "#3000-#3999"}, {"abstract": "Recent advances in reinforcement learning (RL) have significantly improved the complex reasoning capabilities of large language models (LLMs). Despite these successes, existing methods mainly focus on single-domain RL (e.g., mathematics) with verifiable rewards (RLVR), and their reliance on purely online RL frameworks restricts the exploration space, thereby limiting reasoning performance. In this paper, we address these limitations by leveraging rubrics to provide both fine-grained reward signals and offline guidance. We propose $\\textbf{RGR-GRPO}$ (Reward and Guidance through Rubrics), a rubric-driven RL framework for multi-domain reasoning.  RGR-GRPO enables LLMs to receive dense and informative rewards while exploring a larger solution space during GRPO training. Extensive experiments across 14 benchmarks spanning multiple domains demonstrate that RGR-GRPO consistently outperforms RL methods that rely solely on alternative reward schemes or offline guidance. Compared with verifiable online RL baseline, RGR-GRPO achieves average improvements of +7.0%, +5.4%, +8.4%, and +6.6% on mathematics, physics, chemistry, and general reasoning tasks, respectively. Notably, RGR-GRPO maintains stable entropy fluctuations during off-policy training and achieves superior pass@k performance, reflecting sustained exploration and effective breakthrough beyond existing performance bottlenecks.", "authors": "Baolong Bi, Shenghua Liu, Yiwei Wang, Siqian Tong, Lingrui Mei, Yuyao Ge, Yilong Xu, Jiafeng Guo, Xueqi Cheng", "icml_url": "https://icml.cc/virtual/2026/poster/65737", "is_oral": false, "is_spotlight": true, "poster_id": "65737", "presentation_type": "spotlight", "related_events": "", "title": "Reward and Guidance through Rubrics: Promoting Exploration to Improve Multi-Domain Reasoning", "sequence": 5260, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 146, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 312, "LLM adaptation & fine-tuning": 246, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 312, "selection_score": 357, "matched_terms": "grpo, verifiable reward, large language model, llm, language model, reasoning", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3911", "poster_number": 3911, "poster_band": "#3000-#3999"}, {"abstract": "Federated LoRA provides a communication-efficient mechanism for fine-tuning large language models on decentralized data. In practice, however, a discrepancy between the factor-wise averaging used to preserve low rank and the mathematically correct aggregation of local updates can cause significant aggregation error and unstable training. We argue that a major source of this problem is *rotational misalignment*, arising from the rotational invariance of low-rank factorizations -- semantically equivalent updates can be represented in different latent subspaces across clients since $(B_i R_i)(R_i^\\top A_i) = B_i A_i$. When such misaligned factors are averaged directly, they interfere destructively and degrade the global update. To address this issue, we propose **FedRot-LoRA**, a federated LoRA framework that aligns client updates via orthogonal transformations prior to aggregation. This alignment preserves the semantic update while reducing cross-client subspace mismatch, without increasing communication cost or restricting model expressivity. We provide a convergence analysis that examines the aggregation error induced by factor-wise averaging and shows how rotational alignment yields a tighter upper bound on this error. Extensive experiments on natural language understanding and generative tasks demonstrate that FedRot-LoRA consistently outperforms existing federated LoRA baselines across a range of heterogeneity levels and LoRA ranks. Code is available at https://anonymous.4open.science/r/FedRot-LoRA", "authors": "Haoran Zhang, Dongjun Kim, Seohyeon Cha, Haris Vikalo", "icml_url": "https://icml.cc/virtual/2026/poster/66566", "is_oral": false, "is_spotlight": false, "poster_id": "66566", "presentation_type": "regular", "related_events": "", "title": "FedRot-LoRA: Mitigating Rotational Misalignment in Federated LoRA", "sequence": 6085, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 30, "LLM post-training, RLHF & agents": 150, "LLM adaptation & fine-tuning": 556, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 556, "selection_score": 556, "matched_terms": "fine-tuning, lora, large language model, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4115", "poster_number": 4115, "poster_band": "#4000-#4999"}, {"abstract": "Federated Continual Learning (FCL) enables the continuous acquisition of knowledge from streaming tasks, but inherently struggles with the temporal dynamics of client data distributions. These dynamics naturally induce asynchronous concept drift, where distribution shifts occur independently across clients at unsynchronized times and with varying magnitudes. Such asynchrony generates conflicting updates that destabilize global convergence and exacerbate catastrophic forgetting. However, existing FCL research focuses on static or incremental settings, typically treating all incoming updates uniformly, which obscures concept drift under divergent distributions and fails to adapt to the evolution of learned concepts. To address these limitations, we propose RC-FCL, a retrospective calibration framework for FCL that can effectively distinguish asynchronous concept drift and adjust the learning strategy adaptively. Specifically, RC-FCL leverages a conditional generative model to synthesize class-conditional reference distributions of previously learned concepts for local drift detection. It calibrates local adaptation using a weighting mechanism driven by the local discriminator to prioritize informative samples, and executes a global aggregation strategy based on drift magnitude. Our experimental results demonstrate that RC-FCL achieves competitive performance against state-of-the-art methods.", "authors": "Hang Su, Yijun Mo, Zhiyu Zhang, Yankai Jiang, Bo Liu, Yichen Li, Imran Razzak", "icml_url": "https://icml.cc/virtual/2026/poster/64573", "is_oral": false, "is_spotlight": false, "poster_id": "64573", "presentation_type": "regular", "related_events": "", "title": "RC-FCL: Combating Asynchronous Concept Drift in Federated Continual Learning via Retrospective Calibration", "sequence": 4097, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 172, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 24, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 172, "selection_score": 172, "matched_terms": "concept drift, distribution shift, streaming", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4202", "poster_number": 4202, "poster_band": "#4000-#4999"}, {"abstract": "In this paper, we provide a comprehensive theoretical analysis of Stochastic Gradient Descent (SGD) and its momentum variants (Polyak Heavy-Ball and Nesterov) for tracking time-varying optima under strong convexity and smoothness. Our finite-time bounds reveal a sharp decomposition of tracking error into transient, noise-induced, and drift-induced components. This decomposition exposes a fundamental trade-off: while momentum is often used as a gradient-smoothing heuristic, under distribution shift it incurs an explicit drift-amplification penalty that diverges as the momentum parameter $\\beta$ approaches 1, yielding systematic tracking lag. We complement these upper bounds with minimax lower bounds under gradient-variation constraints, proving this momentum-induced tracking penalty is not an analytical artifact but an information-theoretic barrier: in drift-dominated regimes, momentum is unavoidably worse because stale-gradient averaging forces systematic lag. Our results provide theoretical grounding for the empirical instability of momentum in dynamic settings and precisely delineate regime boundaries where vanilla SGD provably outperforms its accelerated counterparts.", "authors": "Sharan Sahu, Cameron Hogan, Martin Wells", "icml_url": "https://icml.cc/virtual/2026/poster/63752", "is_oral": false, "is_spotlight": false, "poster_id": "63752", "presentation_type": "regular", "related_events": "", "title": "On the Provable Suboptimality of Momentum SGD in Nonstationary Stochastic Optimization", "sequence": 3277, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 112, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 112, "selection_score": 112, "matched_terms": "nonstationary, distribution shift", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4505", "poster_number": 4505, "poster_band": "#4000-#4999"}, {"abstract": "We study linear contextual bandits under rare parameter updates: the learner may incorporate reward feedback into its parameter estimate only at a small number of update times, while still observing contexts online and selecting actions sequentially. This viewpoint clarifies a practical distinction that is often blurred in the literature: many \"strictly batched\" methods additionally restrict within-interval context adaptivity, meaning that the action rule inside an interval cannot depend on the sequence of realized contexts/actions in that interval (beyond the current round's context). For linear contextual bandits, we propose two practical algorithms with only $O(\\log\\log T)$ parameter updates. Our first algorithm BLCE-G attains minimax-optimal regret (up to polylogarithmic factors in $T$) simultaneously in both the small-$K$ and large-$K$ regimes under a static schedule. Our second algorithm BLCE removes the near G-optimal design step---a dominant computational bottleneck in prior strictly batched static-grid methods---yet preserves minimax-optimal regret and achieves the lowest known runtime complexity among optimal algorithms. We further extend these rare-update and computational principles to generalized linear contextual bandits. Overall, our results yield statistically optimal algorithms under $O(\\log\\log T)$ parameter updates that are also computationally efficient in practice.", "authors": "Sanghoon Yu, Min-hwan Oh", "icml_url": "https://icml.cc/virtual/2026/poster/61334", "is_oral": false, "is_spotlight": true, "poster_id": "61334", "presentation_type": "spotlight", "related_events": "", "title": "Practical and Optimal Algorithm for Linear Contextual Bandits with Rare Parameter Updates", "sequence": 862, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 642, "RL & control": 16, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 642, "selection_score": 927, "matched_terms": "bandit, bandits, contextual bandit, generalized linear, regret", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4510", "poster_number": 4510, "poster_band": "#4000-#4999"}, {"abstract": "We study generalized linear bandits with memory, a non-stationary setting in which rewards depend on past actions through a finite memory matrix. Building on prior work for linear models Clerici et al.,(2024), we show that the previously known $\\tilde{\\mathcal{O}}(T^{3/4})$ regret stems from a loose analysis based on cyclic proxy policies, and we refine the analysis to recover a $\\tilde{\\mathcal{O}}(\\sqrt{T})$ regret rate in the linear case. We then extend this improvement to generalized linear models and propose a block-wise algorithm based on shrinkage-based confidence bounds. Our algorithm achieves a regret bound of $\\tilde{\\mathcal{O}}(\\sqrt{mT}+ d\\sqrt{T}+\\sqrt{\\kappa} d^{2} m^{1/4} T^{1/4} + \\kappa d^{2})$, where $d$ denotes the feature dimension, $m$ the memory length, and $\\kappa$ a curvature parameter of the link function, thereby attaining a $\\sqrt{T}$ rate despite nonlinear rewards and memory effects. To the best of our knowledge, this analysis provides a unified treatment of memory-induced non-stationarity and nonlinear link functions, while ensuring that the leading regret term is independent of the curvature of the link function. We conduct numerical experiments that are consistent with our theoretical findings.", "authors": "Heesang Ann, Hyun-jun Choi, Taehyun Hwang, Younghoon Shin, Haeju Cheong, Min-hwan Oh", "icml_url": "https://icml.cc/virtual/2026/poster/65438", "is_oral": false, "is_spotlight": false, "poster_id": "65438", "presentation_type": "regular", "related_events": "", "title": "Generalized Linear Bandits with Memory", "sequence": 4962, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 594, "RL & control": 32, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 594, "selection_score": 594, "matched_terms": "non-stationary, bandit, bandits, linear bandit, generalized linear, regret", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4511", "poster_number": 4511, "poster_band": "#4000-#4999"}, {"abstract": "We study the decoupled multi-armed bandit problem, where the learner selects one arm for exploration and one arm for exploitation separately at each round. In this setting, the loss of the explored arm is observed but not incurred, whereas the loss of the exploited arm is incurred without being observed. We propose an efficient Follow-the-Perturbed-Leader (FTPL) policy that achieves Best-of-Both-Worlds (BOBW) guarantee with constant regret in the stochastic regime and optimal $\\mathcal{O}(\\sqrt{KT})$ regret in the adversarial regime. A key feature of our method is that it completely avoids both the convex optimization required by prior BOBW policy, and the resampling procedures that are typically used in FTPL bandit policies. This allows FTPL to fully realize its computational efficiency advantages, and thus leads to substantial reductions in computational cost. We empirically confirm that our policy not only improves the runtime but also demonstrates superior regret performance in both regimes.", "authors": "Chaiwon Kim, Jongyeong Lee, Min-hwan Oh", "icml_url": "https://icml.cc/virtual/2026/poster/61445", "is_oral": false, "is_spotlight": false, "poster_id": "61445", "presentation_type": "regular", "related_events": "", "title": "Follow-the-Perturbed-Leader for Decoupled Bandits: Best-of-Both-Worlds and Practicality", "sequence": 973, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 248, "RL & control": 36, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 248, "selection_score": 248, "matched_terms": "bandit, bandits, regret", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4512", "poster_number": 4512, "poster_band": "#4000-#4999"}, {"abstract": "We study bilinear bandits with partially observable features on both the user and item sides. In each of $T$ rounds, the learner selects an arm and observes only the reward for the chosen pair. The reward model     is linear in the user and item features with an unknown parameter matrix. Existing literature commonly reduces this problem to a linear bandit via a Kronecker product representation of user and item features, at the cost of increased dimensionality.     We propose \\texttt{BiRoLF}, an algorithm robust to latent features, which directly leverages the bilinear structure without such linearization. It enhances feature selection by augmenting the null space of the observed features and employs doubly robust (DR) estimation to impute unobserved rewards for unselected arms, constructing unbiased pseudo-rewards. We estimate the parameters using Lasso regularization, which promotes sparsity in the coefficients of latent components orthogonal to the observed features.     \\texttt{BiRoLF} achieves a $\\tilde{O}(\\sqrt{(d_x + d_{h_x})(d_y + d_{h_y}) T})$ regret bound, where $d_x$ and $d_y$ are the dimensions of the observable feature vectors, $d_{h_x}$ and $d_{h_y}$ denote the numbers of nonzero coefficients in the components orthogonal to the observed features. We segment cases by the relationship between observable and latent features and find that \\texttt{BiRoLF} achieves strong regret performance while outperforming competing methods in computational metrics, reducing the overhead of feature linearization.", "authors": "Wooseong Cho, Ji Hyeong Park, Min-hwan Oh", "icml_url": "https://icml.cc/virtual/2026/poster/62858", "is_oral": false, "is_spotlight": false, "poster_id": "62858", "presentation_type": "regular", "related_events": "", "title": "Bilinear Bandits with Partially Observable Features", "sequence": 2384, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 488, "RL & control": 16, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 24, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 488, "selection_score": 488, "matched_terms": "bandit, bandits, linear bandit, regret", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4513", "poster_number": 4513, "poster_band": "#4000-#4999"}, {"abstract": "Recent advances in image and video generation raise hopes that these models possess world modeling capabilities—the ability to generate realistic, physically plausible videos. This could revolutionize applications in robotics, autonomous driving, and scientific simulation. However, before treating these models as world models, we must ask: Do they adhere to physical laws?  Current evaluation methods rely on subjective judgments or trajectory matching, limiting their usage for physical reasoning estimation, where many generations could be physically plausible.  Thus, we introduce Morpheus , one of the first physics-informed evaluation frameworks for measuring the ability of video generation models to comprehend Newtonian dynamics. Morpheus features 130 real-world videos capturing physical phenomena, guided by conservation laws. Using those as conditioning for video generation, we assess physical plausibility leveraging interpretable metrics evaluated with respect to infallible conservation laws known per physical setting, leveraging advances in physics-informed neural networks and vision-language foundation models. Importantly, Morpheus targets controlled Newtonian rigid-body settings to enable quantitative checks. Our findings reveal that even with advanced prompting and video conditioning, contemporary models struggle to encode physical principles despite generating aesthetically pleasing videos.", "authors": "Antonios Tragoudaras, Daniil Cherniavskii, Chenyu Zhang, Antonis Vozikis, Thijmen Nijdam, Derck Prinzhorn, Márk Bodrácska, Nicu Sebe, Andrii Zadaianchuk, Efstratios Gavves", "icml_url": "https://icml.cc/virtual/2026/poster/62609", "is_oral": false, "is_spotlight": false, "poster_id": "62609", "presentation_type": "regular", "related_events": "", "title": "Probing Newtonian Mechanics in Video Generative Models with Real Physical Systems", "sequence": 2135, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 170}, "raw_topic_score": 170, "selection_score": 170, "matched_terms": "robot, robotic, robotics, world model, trajectory, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4611", "poster_number": 4611, "poster_band": "#4000-#4999"}, {"abstract": "We introduce, to our knowledge, the first direct second-order method for computing Nash equilibria in two-player zero-sum games. To do so, we construct a Douglas-Rachford-style splitting formulation, which we then solve with a semi-smooth Newton (SSN) method. We show that our algorithm enjoys local superlinear convergence. To augment the fast local behavior of our SSN method with global efficiency guarantees, we develop a hybrid method that combines our SSN method with the state-of-the-art first-order method for game solving, Predictive Regret Matching (PRM$^+$). Our hybrid algorithm leverages the global progress provided by PRM$^+$ while achieving a local superlinear convergence rate once it switches to SSN near a Nash equilibrium. Numerical experiments on matrix games demonstrate order-of-magnitude speedups over PRM$^+$ for high-precision solutions.", "authors": "David Yang, Yuan Gao, Tianyi Lin, Christian Kroer", "icml_url": "https://icml.cc/virtual/2026/poster/62106", "is_oral": false, "is_spotlight": false, "poster_id": "62106", "presentation_type": "regular", "related_events": "", "title": "A Direct Second-Order Method for Solving Two-Player Zero-Sum Games", "sequence": 1633, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 8, "RL & control": 8, "Multi-agent RL, games & coordination": 340, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 340, "selection_score": 340, "matched_terms": "game, games, nash, equilibrium", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #4621", "poster_number": 4621, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-09T01:00:00-07:00", "label": "Thu, Jul 9, 2026 17:00 KST", "icmlTime": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "count": 40, "rows": [{"abstract": "Reinforcement learning (RL) faces a persistent tension: policies that are stable to optimize (e.g., Gaussians) are often too simple to represent the multimodal action distributions required for complex control. Conversely, expressive generative policies—such as diffusion and flow matching—are frequently unstable in online RL due to intractable likelihoods and gradients propagating through long sampling chains. We address this tension with a key structural principle: decoupling optimization from generation. Building on this, we introduce GoRL (Generative Online Reinforcement Learning), an algorithm-agnostic framework that trains expressive policies from scratch by confining policy optimization to a tractable latent space while delegating action synthesis to a conditional generative decoder. Using a two-timescale alternating schedule and anchoring decoder refinement to a fixed prior, GoRL enables stable optimization while continuously expanding expressiveness. Empirically, GoRL consistently outperforms unimodal and generative baselines across diverse continuous-control tasks. Notably, on the challenging HopperStand task, it achieves episodic returns exceeding 870—more than $3\\times$ that of the strongest baseline—demonstrating a practical path to policies that are both stable and highly expressive.", "authors": "Chubin Zhang, Zhenglin Wan, Feng Chen, Fuchao Yang, Lang Feng, Yaxin Zhou, Xingrui Yu, Yang You, Ivor Tsang, Bo An", "icml_url": "https://icml.cc/virtual/2026/poster/66002", "is_oral": false, "is_spotlight": false, "poster_id": "66002", "presentation_type": "regular", "related_events": "", "title": "Generative Online Reinforcement Learning", "sequence": 5525, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 228, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 32}, "raw_topic_score": 228, "selection_score": 228, "matched_terms": "reinforcement learning, online rl, policy optimization, control", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #113", "poster_number": 113, "poster_band": "#0000-#0999"}, {"abstract": "Designing dense rewards is crucial for reinforcement learning (RL), yet in robotics it often demands extensive manual effort and lacks scalability. One promising solution is to view task progress as a dense reward signal, as it quantifies the degree to which actions advance the system toward task completion over time. We present TimeRewarder, a simple yet effective reward learning method that derives progress estimation signals from passive videos, including robot demonstrations and human videos, by modeling temporal distances between frame pairs. We then demonstrate how TimeRewarder can supply step-wise proxy rewards to guide reinforcement learning. In our comprehensive experiments on ten challenging Meta-World tasks, we show that TimeRewarder dramatically improves RL for sparse-reward tasks, achieving nearly perfect success in 9/10 tasks with only 200,000 interactions per task with the environment. This approach outperforms previous methods and even the manually designed environment dense reward on both the final success rate and sample efficiency. Moreover, we show that TimeRewarder pretraining can exploit real-world human videos, highlighting its potential as a scalable approach to rich reward signals from diverse video sources.", "authors": "Yuyang Liu, Chuan Wen, Yihang Hu, Dinesh Jayaraman, Yang Gao", "icml_url": "https://icml.cc/virtual/2026/poster/63337", "is_oral": false, "is_spotlight": true, "poster_id": "63337", "presentation_type": "spotlight", "related_events": "", "title": "TimeRewarder: Learning Dense Reward from Passive Videos via Frame-wise Temporal Distance", "sequence": 2862, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 60, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 128}, "raw_topic_score": 128, "selection_score": 173, "matched_terms": "robot, robotic, robotics", "selection_reasons": "spotlight", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #120", "poster_number": 120, "poster_band": "#0000-#0999"}, {"abstract": "Diffusion-based Q-learning has emerged as a powerful paradigm for offline reinforcement learning, but its reliance on multi-step denoising makes both training and inference computationally expensive and brittle. Recent efforts to accelerate diffusion Q-learning toward single-step action generation typically introduce auxiliary networks, policy distillation, or multi-phase training, which frequently compromise simplicity, stability, or performance. To address these limitations, we introduce Bootstrapped Flow Q-Learning (BFQ), a novel framework that enables accurate single-step action generation during both training and inference—without auxiliary networks or distillation procedures. BFQ adopts a divide-and-conquer view of the displacement vector along the flow path: it begins by learning short-range displacements that can be accurately estimated from the Flow Matching marginal velocity, and bootstraps these components to directly learn a noise-to-action mapping in a single step. This formulation eliminates multi-step denoising, resulting in a learning procedure that is substantially faster, simpler, and more robust. Extensive D4RL evaluations show that BFQ improves performance while significantly reducing computational cost compared to multi-step diffusion baselines, demonstrating that single-step action generation suffices for high-performance offline Reinforcement Learning.", "authors": "Thanh Nguyen, Tri Ton, Hongbin Choe, Minh-Tung Luu, Chang D. Yoo", "icml_url": "https://icml.cc/virtual/2026/poster/66531", "is_oral": false, "is_spotlight": false, "poster_id": "66531", "presentation_type": "regular", "related_events": "", "title": "Fast and Highly Expressive Policy Learning for Offline Reinforcement Learning via Bootstrapped Flow Q-Learning", "sequence": 6050, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 410, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 24}, "raw_topic_score": 410, "selection_score": 410, "matched_terms": "reinforcement learning, offline reinforcement, q-learning", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #206", "poster_number": 206, "poster_band": "#0000-#0999"}, {"abstract": "Decoding-based regression, which reformulates regression as a sequence generation task, has emerged as a promising paradigm of applying large language models for numerical prediction. However, its progress is hindered by the misalignment between discrete token-level objectives (e.g., cross-entropy) and continuous numerical values. Existing approaches relying on token-level constraints often fail to capture the global magnitude of the target value, limiting their precision and generalization. In this paper, we propose to unlock the potential of decoding-based regression via reinforcement learning. We formulate the generation process as a Markov decision process, utilizing sequence-level rewards to enforce global numerical coherence. Under this framework, we present GenRe$^2$, which combines policy gradient methods to preserve error magnitudes with dense expert supervision, resolving the temporal credit assignment challenge. Extensive experiments across tabular regression, code metric prediction and generative reward modeling demonstrate that GenRe$^2$ consistently outperforms traditional baselines, establishing a robust paradigm for general-purpose numerical prediction.", "authors": "Ming Chen, Sheng Tang, Rong-Xi Tan, Ziniu Li, Jiacheng Chen, Ke Xue, Chao Qian", "icml_url": "https://icml.cc/virtual/2026/poster/60986", "is_oral": false, "is_spotlight": false, "poster_id": "60986", "presentation_type": "regular", "related_events": "", "title": "Beyond Token-level Supervision: Unlocking the Potential of Decoding-based Regression via Reinforcement Learning", "sequence": 514, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 170, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 118, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 170, "selection_score": 170, "matched_terms": "reinforcement learning, markov decision, policy gradient", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #210", "poster_number": 210, "poster_band": "#0000-#0999"}, {"abstract": "Flow Matching (FM) has shown remarkable ability in modeling complex distributions and achieves strong performance in offline imitation learning for cloning expert behaviors. However, despite its behavioral cloning expressiveness, FM-based policies are inherently limited by their lack of environmental interaction and exploration. This leads to poor generalization in unseen scenarios beyond the expert demonstrations, underscoring the necessity of online interaction with environment. Unfortunately, optimizing FM policies via online interaction is challenging and inefficient due to instability in gradient computation and high inference costs. To address these issues, we propose to let a \"student'' policy with simple MLP structure to explore the environment and be online updated via RL algorithm with a reward model. This reward model is associated with a \"teacher'' FM model, containing rich information of expert data distribution. Furthermore, the same \"teacher'' FM model is utilized to regularize the \"student'' policy's behavior to stabilize policy learning. Due to the student’s simple architecture, we avoid the gradient instability of FM policies and enable efficient online exploration, while still leveraging the expressiveness of the teacher FM model. Extensive experiments shows that our approach significantly enhances learning efficiency, generalization, and robustness, especially when learning from suboptimal expert data.", "authors": "Zhenglin Wan, Jingxuan Wu, Xingrui Yu, Chubin Zhang, Mingcong Lei, Bo An, Ivor Tsang, Yang You", "icml_url": "https://icml.cc/virtual/2026/poster/61158", "is_oral": false, "is_spotlight": false, "poster_id": "61158", "presentation_type": "regular", "related_events": "", "title": "Flow Inverse Reinforcement Learning", "sequence": 686, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 222, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 48, "LLM adaptation & fine-tuning": 76, "Robotics, VLA & diffusion policy": 22}, "raw_topic_score": 222, "selection_score": 222, "matched_terms": "reinforcement learning, inverse reinforcement learning, exploration", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #211", "poster_number": 211, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning from human feedback (RLHF) or verifiable rewards (RLVR), the standard paradigm for aligning LLMs or building recent SOTA reasoning models, is highly sensitive to noise from inconsistent or erroneous rewards. Yet, the interaction between such noise and widely used group-based policy optimization methods remains underexplored. We introduce a noise-robust Group Relative Policy Optimization (GRPO) and Done Right GRPO (Dr.GRPO) framework that explicitly models reward corruption as Bernoulli noise. Our method applies noise correction after estimating reward flip probabilities to debias the learning signal, yielding unbiased gradient estimates. Theoretical analysis shows that group-based methods inherently mitigate individual-level noise, and our correction strategy amplifies this robustness. Empirically, we observe consistent improvements across math and code tasks when applying our noise correction to standard reward model usage, with particular gains of up to 6.7 percentage points in accuracy on math tasks and 1.5 on code tasks under realistic reward model conditions. This work bridges label-noise correction from supervised learning with modern RLHF, offering both theoretical insights and a practical algorithm for noisy real-world deployment.", "authors": "Omar Elmansouri, Fathinah Izzati, Mohamed El Amine Seddik, Salem Lahlou", "icml_url": "https://icml.cc/virtual/2026/poster/61804", "is_oral": false, "is_spotlight": false, "poster_id": "61804", "presentation_type": "regular", "related_events": "", "title": "Noise-corrected GRPO: From Noisy Rewards to Unbiased Gradients", "sequence": 1332, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 74, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 340, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 340, "selection_score": 340, "matched_terms": "rlhf, grpo, reward model, verifiable reward, llm, reasoning", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #212", "poster_number": 212, "poster_band": "#0000-#0999"}, {"abstract": "High-performance GPU kernels are critical for efficient LLM serving, yet their optimization remains a bottleneck requiring deep system expertise. While code LLMs show promise in generating functionally correct code, kernel optimization is intrinsically a search problem over a vast optimization space.  The fundamental mismatch prevents existing LLM agents from efficiently exploring the optimization space for diverse hardware and compute patterns.  To bridge the gap, we present KernelBand, a framework that formulates kernel optimization as a Multi-Armed Bandit (MAB) problem, explicitly balancing exploration and exploitation to unlock the potential of code LLMs.  To navigate the infinite arm space of optimization strategies applied to candidate kernels, we design two key mechanisms: a hardware-aware pruning strategy via profiling bounds and a trace-driven clustering algorithm that leverages Lipschitz continuity. Theoretically, we prove that KernelBand reduces the regret bound to depend on the compact covering number of runtime clusters, ensuring sample-efficient discovery of high-performance kernels. Extensive experiments on TritonBench-G with three GPU architectures and four code LLMs show that KernelBand consistently and substantially outperforms state-of-the-art methods with over 33% average improvement.", "authors": "Dezhi Ran, Shuxiao Xie, Mingfang Ji, Anmin Liu, Mengzhou Wu, Yuan Cao, Yuzhe Guo, Hao Yu, Linyi Li, Yitao Hu, Wei Yang, Tao Xie", "icml_url": "https://icml.cc/virtual/2026/poster/62803", "is_oral": false, "is_spotlight": false, "poster_id": "62803", "presentation_type": "regular", "related_events": "", "title": "KernelBand: Steering LLM-based Kernel Optimization via Hardware-Aware Multi-Armed Bandits", "sequence": 2329, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 204, "RL & control": 20, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 132, "LLM adaptation & fine-tuning": 150, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 204, "selection_score": 204, "matched_terms": "bandit, bandits, regret", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #309", "poster_number": 309, "poster_band": "#0000-#0999"}, {"abstract": "We propose a new method for estimating how much a model knows about a datapoint and use it to measure the capacity of modern language models. Prior studies of language model memorization have struggled to disentangle memorization from generalization. We formally separate memorization into two components: unintended memorization, the information a model contains about a specific dataset, and generalization, the information a model contains about the true data-generation process. When we completely eliminate generalization, we can compute the total memorization, which provides an estimate of model capacity: our measurements estimate that GPT-style models have a capacity of approximately 3.6 bits per parameter. We train language models on datasets of increasing size and observe that models memorize until their capacity fills, at which point unintended memorization decreases as models begin to generalize. We train hundreds of transformer language models ranging from 500K to 1.5B parameters and produce a series of scaling laws relating model capacity and data size to membership inference.", "authors": "John Morris, Chawin Sitawarin, Narine Kokhlikyan, Chuan Guo, Edward Suh, Alexander Rush, Kamalika Chaudhuri, Saeed Mahloujifar", "icml_url": "https://icml.cc/virtual/2026/poster/62989", "is_oral": true, "is_spotlight": true, "poster_id": "62989", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6A LLMs", "title": "How much can language models memorize?", "sequence": 2514, "award": "Outstanding Paper Honorable Mention", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 84, "LLM adaptation & fine-tuning": 84, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 84, "selection_score": 324, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper Honorable Mention", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #312", "poster_number": 312, "poster_band": "#0000-#0999"}, {"abstract": "Recent advances in large language models (LLMs) have led to remarkable progress across various domains, yet their capabilities in the humanities, particularly history, remain underexplored. Historical reasoning poses unique challenges for LLMs, involving multimodal source interpretation, temporal inference, and cross-linguistic analysis. Existing general-purpose agents perform well on many current benchmarks but lack the domain expertise needed to address complex historical questions. To address this gap, we introduce HistBench, a new benchmark of 414 high-quality and carefully-reviewed questions stratified by difficulty and designed to evaluate LLM's capacity for historical reasoning. The tasks span a wide range of historical problems—from factual retrieval based on primary sources to interpretive analysis of manuscripts and images, to interdisciplinary challenges involving archaeology, linguistics, or cultural history. Furthermore, the benchmark dataset spans 29 ancient and modern languages and covers a wide range of historical periods and world regions. Finding the poor performance of LLMs and other agents on HistBench, we further present HistAgent, a history-specific agent equipped with carefully designed tools for OCR, translation, archival search, and image understanding in History. On HistBench, HistAgent based on GPT-4o achieves an accuracy of 27.54% pass@1 and 36.47% pass@2, significantly outperforming LLMs with online search and generalist agents, including GPT-4o (18.60%), DeepSeek-R1(14.49%), Grok 3(17.63%) and Open Deep Research by smolagents(20.29% pass@1 and 25.12% pass@2). These results highlight the limitations of existing LLMs and generalist agents and demonstrate the advantages of HistAgent for historical reasoning. Notably, HistAgent also achieves 60.00% pass@1 accuracy on the GAIA benchmark, showing that domain-specific customization doesn't hinder HistAgent's competitive performance on real-world general tasks.", "authors": "Jiahao Qiu, Fulian Xiao, Yimin Wang, Yuchen Mao, Yijia Chen, Xinzhe Juan, Siran Wang, Xuan Qi, Tongcheng Zhang, Zixin Yao, Jiacheng Guo, Yifu Lu, Charles Argon, Jundi Cui, Daixin Chen, Junran Zhou, Shuyao Zhou, Zhanpeng Zhou, Ling Yang, Shilong Liu, Hongru WANG, Kaixuan Huang, xun jiang, Xi Gao, Mengdi Wang", "icml_url": "https://icml.cc/virtual/2026/poster/62318", "is_oral": false, "is_spotlight": false, "poster_id": "62318", "presentation_type": "regular", "related_events": "", "title": "On Path to Multimodal Historical Reasoning: HistBench and HistAgent", "sequence": 1845, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 364, "LLM adaptation & fine-tuning": 112, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 364, "selection_score": 364, "matched_terms": "large language model, llm, language model, reasoning, agent, agents", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #403", "poster_number": 403, "poster_band": "#0000-#0999"}, {"abstract": "Robot manipulation has increasingly adopted data-driven generative policy frameworks, yet the field faces a persistent trade-off: diffusion models suffer from high inference latency, while flow-based methods often require complex architectural constraints. Although in image generation domain, the MeanFlow paradigm offers a path to single-step inference, its direct application to robotics is impeded by critical theoretical pathologies, specifically spectral bias and gradient starvation in low-velocity regimes. To overcome these limitations, we propose the One-step MeanFlow Policy (OMP), a novel framework designed for high-fidelity, real-time manipulation. We introduce a lightweight directional alignment mechanism to explicitly synchronize predicted velocities with true mean velocities. Furthermore, we implement a Differential Derivation Equation (DDE) to approximate the Jacobian-Vector Product (JVP) operator, which decouples forward and backward passes to significantly reduce memory complexity. Extensive experiments on the Adroit and Meta-World benchmarks demonstrate that OMP outperforms state-of-the-art methods in success rate and trajectory accuracy, particularly in high-precision tasks, while retaining the efficiency of single-step generation.", "authors": "Han Fang, Yize Huang, Yuheng Zhao, Paul Weng, Xiao Li, Yutong Ban", "icml_url": "https://icml.cc/virtual/2026/poster/66693", "is_oral": false, "is_spotlight": false, "poster_id": "66693", "presentation_type": "regular", "related_events": "", "title": "OMP: One-step Meanflow Policy with Directional Alignment", "sequence": 6211, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 80, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 212}, "raw_topic_score": 212, "selection_score": 212, "matched_terms": "robot, robotic, robotics, manipulation, trajectory, diffusion", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #500", "poster_number": 500, "poster_band": "#0000-#0999"}, {"abstract": "Recent advances in large language models (LLMs) have substantially expanded the scope of Table Question Answering (TableQA). However, existing benchmarks primarily treat TableQA as a passive, single-turn natural language understanding task, lacking the capacity to evaluate autonomous reasoning and tool-call trajectories in realistic, multi-turn scenarios. To bridge this gap, we introduce TableAgent-Bench, a large-scale bilingual benchmark that reformulates TableQA as proactive, agentic interactions over structurally complex, multi-table environments. With a topology-aware construction strategy, TableAgent-Bench captures dynamic intent evolution through 1,310 multi-turn dialogues grounded in 2,275 industrial tables. Furthermore, we propose the Table-centric Agent Evaluation Framework (TAEF) to assess agent interactions with complex table structures. Specifically, TAEF integrates a specialized agent toolset and 4 metric categories to systematically diagnose intermediate failure modes, assessing performance across table localization, tool-invocation rationality, and trajectory-level pass rate. Extensive experiments with 25 state-of-the-art LLM agents reveal a substantial capability gap, with even the strongest model Gemini-3-Pro-Preview achieving only 53.4% information coverage. We expect TableAgent-Bench to serve as a rigorous testbed for developing and evaluating agents capable of robust table-centric reasoning.", "authors": "Jingwang Huang, Jie Zhang, Haoyang Zeng, Changzai Pan, Xianjie Wu, Guanting Dong, Jiaheng Liu, Wei Zhang, Mingyu Zheng, Chunxiao Liu, Kaiwen Wei, Jiang Zhong, Jian Yang", "icml_url": "https://icml.cc/virtual/2026/poster/66187", "is_oral": false, "is_spotlight": false, "poster_id": "66187", "presentation_type": "regular", "related_events": "", "title": "How Far Can LLM Agents Reason with Tables? Benchmarking Multi-Turn Agentic Table Question Answering in the Wild", "sequence": 5710, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 320, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 16}, "raw_topic_score": 320, "selection_score": 320, "matched_terms": "large language model, llm, language model, reasoning, agent, agents", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #510", "poster_number": 510, "poster_band": "#0000-#0999"}, {"abstract": "Structure-based drug design (SBDD) can be effectively realized through an iterative refinement via the Design-Make-Test-Analyze (DMTA) cycle, which is a common workflow used by human experts. However, most LLMs function as one-shot generators that lack feedback mechanisms, leaving the DMTA loop disconnected. In this work, we propose K-BTS, a Knowledge-Driven Bi-level Thompson Sampling framework that formalizes iterative SBDD as a Dynamic Hierarchical Multi-Armed Bandit problem. K-BTS closes the DMTA loop by decoupling decisions into two levels: an upper-level policy that prioritizes high-potential molecular lineages and a lower-level mechanism that retrieves explicit chemical rules to guide LLM generation. By integrating a dual-level Bayesian update, the framework transforms sparse docking scores into reusable experience. On the CrossDocked2020 benchmark, K-BTS achieves a state-of-the-art Top-1 average docking score. The results from diverse dimensions show that K-BTS ensures search determinism through a smooth, monotonic convergence that synchronizes structural drift with affinity improvement.", "authors": "Xuanning Hu, Hao Tuo, Jinglong Ji, Anchen Li, Qianli Xing, Bo Yang", "icml_url": "https://icml.cc/virtual/2026/poster/60577", "is_oral": false, "is_spotlight": false, "poster_id": "60577", "presentation_type": "regular", "related_events": "", "title": "Steering Large Language Models through the DMTA Cycle: Structure-Based Drug Design via Knowledge-Driven Bi-Level Thompson Sampling", "sequence": 106, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 140, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 118, "LLM adaptation & fine-tuning": 112, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 140, "selection_score": 140, "matched_terms": "bandit, thompson sampling", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #602", "poster_number": 602, "poster_band": "#0000-#0999"}, {"abstract": "Reliable microbiome-based diagnosis is critical for precision medicine at scale in inflammatory diseases, yet current post-training pipelines in LLMs often overlook the interaction structure that governs microbial ecosystems. In inflammatory bowel disease (IBD), disease signals arise not only from species-level abundance shifts but also from latent microbe–microbe cross-talk. We propose iLoRA, a parameter-efficient Bayesian LoRA framework that infers latent interaction graphs from microbiome inputs and integrates them into adaptation, enabling joint clinical prediction and interaction discovery. Unlike correlation-based post hoc analysis, iLoRA models microbial interactions as latent variables learned end-to-end, yielding uncertainty-aware estimates of cross-talk. We evaluate iLoRA on (i) interactive question answering with human-annotated interaction graphs to quantify structural recovery and (ii) gut microbiome cohorts for IBD diagnosis. Across both domains, iLoRA consistently improves accuracy over strong LoRA baselines while producing interpretable interaction graphs consistent with annotated relations and conventional microbiome association networks.", "authors": "Yang Song, Yixuan Zhang, Lingfa Meng, Tongyuan Hu, Haizhou Shi, Hao Wang, Samir Bhatt, Hengguan Huang", "icml_url": "https://icml.cc/virtual/2026/poster/66077", "is_oral": false, "is_spotlight": false, "poster_id": "66077", "presentation_type": "regular", "related_events": "", "title": "iLoRA: Bayesian Low-Rank Adaptation with Latent Interaction Graphs for Microbiome Diagnosis", "sequence": 5600, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 50, "LLM adaptation & fine-tuning": 580, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 580, "selection_score": 580, "matched_terms": "parameter-efficient, lora, low-rank adaptation, adapt, llm", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #609", "poster_number": 609, "poster_band": "#0000-#0999"}, {"abstract": "Flow-based generative models provide strong unconditional priors for inverse problems, but guiding their dynamics for conditional generation remains challenging. Recent work casts training-free conditional generation in flow models as an optimal control problem; however, solving the resulting trajectory optimisation is computationally and memory intensive, requiring differentiation through the flow dynamics or adjoint solves. We propose MPC-Flow, a model predictive control framework that formulates inverse problem solving with flow-based generative models as a sequence of control sub-problems, enabling practical optimal control-based guidance at inference time. We provide theoretical guarantees linking MPC-Flow to the underlying optimal control objective and show how different algorithmic choices yield a spectrum of guidance algorithms, including regimes that avoid backpropagation through the generative model trajectory. We evaluate MPC-Flow on benchmark image restoration tasks, spanning linear and non-linear settings such as in-painting, deblurring, and super-resolution, and demonstrate strong performance and scalability to massive state-of-the-art architectures via training-free guidance of FLUX.2 (32B) in a quantised setting on consumer hardware.", "authors": "George Webber, Alexander Denker, Riccardo Barbano, Andrew Reader", "icml_url": "https://icml.cc/virtual/2026/poster/66281", "is_oral": false, "is_spotlight": false, "poster_id": "66281", "presentation_type": "regular", "related_events": "", "title": "Solving Inverse Problems with Flow-based Models via Model Predictive Control", "sequence": 5803, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 184, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 128}, "raw_topic_score": 184, "selection_score": 184, "matched_terms": "optimal control, control", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #1004", "poster_number": 1004, "poster_band": "#1000-#1999"}, {"abstract": "We study post-training linear autoregressive models with outcome and process rewards. Given a context $\\boldsymbol{x}$, the model must predict the response $\\boldsymbol{y} \\in \\mathcal{Y}^N$, a sequence of length $N$ that satisfies a standard $\\gamma$ margin assumption extended to sequences. We prove that on test samples where the base model achieves a non-trivial likelihood $\\alpha$, a variant of policy gradient (PG) can achieve likelihood $1 - \\varepsilon$ with an essentially minimax optimal number of reward queries $\\tilde{\\mathcal{O}}((\\alpha^{-1} + \\varepsilon^{-1})/\\gamma^2)$. However, a barrier arises for going beyond the support of the base model. We prove that the overall expected error after post-training with outcome rewards is governed by a property of the base model we call the *Likelihood Quantile* (LQ), and that variants of PG, while minimax optimal, may require a number of reward queries exponential in $N$ to go beyond this support, regardless of the pre-training algorithm. To overcome this barrier, we study post-training with a process reward model, and demonstrate how PG variants in this setting avoid the curse of dimensionality in $N$ via dependence on a token-level LQ. Along the way, we prove that under the margin condition, SGD with adaptive learning rate (LR) achieves a near optimal test error for statistical learning, and PG with adaptive LR achieves a near optimal number of mistakes for online learning while being computationally efficient whenever possible, both of which may be of independent interest.", "authors": "Alireza Mousavi-Hosseini, Murat Erdogdu", "icml_url": "https://icml.cc/virtual/2026/poster/61683", "is_oral": false, "is_spotlight": true, "poster_id": "61683", "presentation_type": "spotlight", "related_events": "", "title": "Post-Training with Policy Gradients: Optimality and the Base Model Barrier", "sequence": 1211, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 30, "RL & control": 80, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 320, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 320, "selection_score": 365, "matched_terms": "post-training, reward model, policy gradient", "selection_reasons": "spotlight", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #1307", "poster_number": 1307, "poster_band": "#1000-#1999"}, {"abstract": "Large language models (LLMs) are increasingly deployed as agents for decision-making (DM) in interactive and dynamic environments. However, since they are not originally designed for DM, recent studies show that LLMs struggle in basic online DM settings. We introduce ITERATIVE REGRET-MINIMIZATION FINE-TUNING (ITERATIVE RMFT), a post-training procedure that repeatedly distills low-regret decision trajectories into the base model. Unlike prior methods that rely on distilling known algorithms or enforcing manually designed reasoning formats, our approach leverages regret as a training signal to elicit improved decision-making behavior while incorporating model-generated reasoning in natural language. Empirically, ITERATIVE RMFT improves DM performance across models, including numerical Transformers, lightweight open-weight LLMs, and the closed-weight model GPT-4o mini, while exhibiting generalization across varying horizons, action spaces, reward processes, and natural-language-described DM scenarios. Overall,  we position our approach as an initial exploration, calling for more principled and novel post-training paradigms for LLMs when it comes to addressing DM tasks.", "authors": "Chanwoo Park, Ziyang Chen, Asuman Ozdaglar, Kaiqing Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/62760", "is_oral": false, "is_spotlight": false, "poster_id": "62760", "presentation_type": "regular", "related_events": "", "title": "Post-Training LLMs as Better Decision-Making Agents: A Regret-Minimization Approach", "sequence": 2286, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 48, "RL & control": 60, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 672, "LLM adaptation & fine-tuning": 198, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 672, "selection_score": 912, "matched_terms": "post-training, large language model, llm, language model, reasoning, agent, agents, decision-making, regret-minimization", "selection_reasons": "user-named / must include", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #1709", "poster_number": 1709, "poster_band": "#1000-#1999"}, {"abstract": "Large Language Models (LLMs) have shown significant potential in scientific discovery but struggle to bridge the gap between theoretical reasoning and verifiable physical simulation. Existing solutions operate in a passive \"execute-then-response\" loop and thus lack runtime perception, obscuring agents to transient anomalies (e.g., numerical instability or diverging oscillations). To address this limitation, we propose EmbodiedAct, a framework that transforms established scientific software into active embodied agen
