& diffusion policy": 0}, "raw_topic_score": 346, "selection_score": 586, "matched_terms": "fine-tuning, zeroth-order, llm", "selection_reasons": "user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3809", "poster_number": 3809, "poster_band": "#3000-#3999"}, {"abstract": "Fine-tuning LLMs is necessary for various dedicated downstream tasks, but classic backpropagation-based fine-tuning methods require substantial GPU memory. To this end, a recent work, MeZO, which relies solely on forward passes to fine-tune LLMs, significantly reduces GPU requirements at the cost of slower convergence due to its indifference to loss landscapes. Standard solutions, such as Adam, explore loss landscapes by estimating the first- and second-order moments and storing them in memory to guide the model's movement through dimensions with lower curvature and vice versa. However, directly applying Adam negates MeZO's advantage as it will triple the memory requirement. In light of this, we propose AdaMeZO, a zeroth-order optimizer that leverages Adam-style first- and second-moment estimates without maintaining them in memory. We present a theoretical analysis of AdaMeZO, corroborated by extensive experiments demonstrating its performance, showing that it can outperform MeZO while requiring up to 70% fewer forward passes. Trajectory visualizations affirm AdaMeZO's ability to adapt to diverse loss landscapes.", "authors": "Zhijie Cai, Haolong Chen, Guangxu Zhu", "icml_url": "https://icml.cc/virtual/2026/poster/63417", "is_oral": false, "is_spotlight": false, "poster_id": "63417", "presentation_type": "regular", "related_events": "", "title": "AdaMeZO: Adam-style Zeroth-Order Optimizer for LLM Fine-tuning Without Maintaining the Moments", "sequence": 2942, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 70, "LLM adaptation & fine-tuning": 344, "Robotics, VLA & diffusion policy": 16}, "raw_topic_score": 344, "selection_score": 584, "matched_terms": "fine-tuning, zeroth-order, adapt, llm", "selection_reasons": "user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3811", "poster_number": 3811, "poster_band": "#3000-#3999"}, {"abstract": "Multi-tenant multi-LoRA serving multiplexes many LoRA adapters on a single GPU under high utilization, where most device memory is reserved for the KV cache, leaving only a small residency budget $K$ for adapters. In this regime, adapter readiness is atomic: if an adapter is not device-resident, the engine must perform a mandatory fetch, stalling shared execution and amplifying tail latency system-wide. With only $K$ residency slots, we identify a LoRA residency cliff: once the active adapter working set exceeds $K$, time-to-first-token (TTFT) tail latency can exhibit a congestion collapse rather than smooth degradation. To tame this cliff, we propose CLIMB, a minimal ingress controller that enforces feasibility-first admission by queueing non-resident adapters outside the engine, prioritizing critical (VIP) traffic, and rotating background adapters via round-robin. On a cliff-inducing workload, CLIMB averts collapse, reducing VIP TTFT p99 from 38.7 s to 13.1 s at matched throughput (10.66 rps) by keeping VIP engine latency near 0.13 s and shifting the residual tail into explicit ingress queueing. Overall, CLIMB shifts fetch-induced stalls from inside the engine to managed ingress queues, mitigating tail amplification without throughput loss in the evaluated settings.", "authors": "Haoran Zhang, Zhiyu Liang, ZUO Decheng, Hongzhi Wang", "icml_url": "https://icml.cc/virtual/2026/poster/66332", "is_oral": false, "is_spotlight": false, "poster_id": "66332", "presentation_type": "regular", "related_events": "", "title": "CLIMB: Taming the LoRA Residency Cliff in Multi-LoRA Serving", "sequence": 5852, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 580, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 580, "selection_score": 580, "matched_terms": "lora, adapter, adapt", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4213", "poster_number": 4213, "poster_band": "#4000-#4999"}, {"abstract": "The advancement of LLMs and their accessibility have triggered renewed interest in multi-agent reinforcement learning as robust and adaptive frameworks for dynamically changing environments. This paper introduces RL-Focal, a two-stage RL agent framework that routes and ensembles LLMs. First, we develop the Decider RL-agent, which learns to dynamically select an ensemble of small size ($m_i$) among $N$ LLMs ($m_i \\ll N$) for incoming queries from a user-defined downstream task $i$, by maximizing both error-diversity and reasoning-performance of the selected ensemble through iterative updates of task-adaptive rewards and policy. Second, to enable effective fusion of dynamically selected LLMs, we develop the stage-2 Fusion RL-agent, which learns to resolve reasoning conflicts from different LLMs and dynamically adapt to different ensemble teams composed by the Decider Agent for different downstream tasks. {\\em Third}, we introduce the focal diversity metric to better model the error correlations among multiple LLMs further improving the generalization performance of the Decider Agent, which actively prunes the ensemble combinations. By focal diversity, we enhance performance across tasks by effectively promoting reward-aware and policy-adaptive ensemble selection and inference fusion. Extensive evaluations on five benchmarks show that RL-Focal achieves the performance improvement of 8.48\\% with an ensemble of small size compared to the best individual LLM in a pool and offers stronger robustness. Code is available at \\url{https://anonymous.4open.science/r/rl-focal-8DCF/}", "authors": "Selim Furkan Tekin, Gaowen Liu, Ramana Kompella, Ling Liu", "icml_url": "https://icml.cc/virtual/2026/poster/64593", "is_oral": false, "is_spotlight": false, "poster_id": "64593", "presentation_type": "regular", "related_events": "", "title": "Dynamic Optimizations of LLM Ensembles with Two-Stage Reinforcement Learning Agents", "sequence": 4117, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 120, "Multi-agent RL, games & coordination": 112, "LLM post-training, RLHF & agents": 324, "LLM adaptation & fine-tuning": 172, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 324, "selection_score": 324, "matched_terms": "llm, reasoning, agent, agents, agent reinforcement learning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4215", "poster_number": 4215, "poster_band": "#4000-#4999"}, {"abstract": "Experimental design has emerged as a powerful approach for improving the sample efficiency of A/B testing, yet existing designs rely critically on correctly specified models. We study robust sequential experimental design under model misspecification and develop a unified framework that covers both contextual bandit and dynamic settings. Theoretically, we prove that our design bounds the worst-case mean squared error of the estimated treatment effect. Empirically, we demonstrate the effectiveness of the proposed approach using synthetic and real-world datasets from a leading technology company.", "authors": "Qianglin Wen, Xiangkun Wu, Chengchun Shi, Ting Li, Niansheng Tang, Yingying Zhang, Hongtu Zhu", "icml_url": "https://icml.cc/virtual/2026/poster/64187", "is_oral": false, "is_spotlight": false, "poster_id": "64187", "presentation_type": "regular", "related_events": "", "title": "Robust Sequential Experimental Design for A/B Testing", "sequence": 3712, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 72, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 72, "selection_score": 72, "matched_terms": "bandit, contextual bandit", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4313", "poster_number": 4313, "poster_band": "#4000-#4999"}, {"abstract": "Temporal systems often exhibit non-stationary behaviour, such as seasonal climate variation or glucose fluctuations in patients with type-1 diabetes.  One way to model non-stationarity is through discrete latent regimes, i.e.,  stationary segments of time.  Such systems induce a Markov Switching Model (MSM), a class of Hidden Markov Models with autoregressive dependencies among latent regimes and observed variables.  Identifying latent regimes  is challenging in the presence of frequent regime switches and nonlinear and non-Gaussian dynamics, particularly when there are instantaneous effects between the variables, e.g., due to slow rates of measurements. In this work, we establish the identifiability of both latent regimes and regime-dependent causal structures under temporal regime dependencies, nonlinear lagged and instantaneous effects, and independent noise from the exponential family. Our identifiability theory subsumes non-temporal mixtures of causal models.  Furthermore, we introduce FlowMSM, a regime detection framework that can be paired with any stationary causal discovery method to recover regime-dependent causal structures.  Experiments on synthetic benchmarks and a financial economics dataset demonstrate the effectiveness of our approach to detect latent regimes and discover causal structures from non-stationary time series.", "authors": "Roel Hulsman, Carles Balsells-Rodas, Sara Magliacane", "icml_url": "https://icml.cc/virtual/2026/poster/64905", "is_oral": false, "is_spotlight": false, "poster_id": "64905", "presentation_type": "regular", "related_events": "", "title": "Identifiable Markov Switching Models with Instantaneous Effects and Exponential Families", "sequence": 4429, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 64, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 64, "selection_score": 64, "matched_terms": "non-stationary", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4409", "poster_number": 4409, "poster_band": "#4000-#4999"}, {"abstract": "Despite their impressive performance on a wide variety of tasks, modern language models remain susceptible to distribution shifts, exhibiting brittle behavior when evaluated on data that differs in distribution from their training data. In this paper, we describe how distribution shifts in language models can be separated into observable and unobservable components, and we discuss how established approaches for dealing with distribution shift address only the former. Importantly, we identify that the resulting omitted variable bias from unobserved variables can compromise both evaluation and optimization in language models. To address this challenge, we introduce a framework that maps the strength of the omitted variables to bounds on the worst-case generalization performance of language models under distribution shift. In empirical experiments, we show that using these bounds directly in language model evaluation and optimization provides more principled measures of out-of-distribution performance, improves true out-of-distribution performance relative to standard distribution shift adjustment methods, and further enables inference about the strength of the omitted variables when target distribution labels are available.", "authors": "Victoria Lin, Louis-Philippe Morency, Eli Ben-Michael", "icml_url": "https://icml.cc/virtual/2026/poster/62063", "is_oral": false, "is_spotlight": false, "poster_id": "62063", "presentation_type": "regular", "related_events": "", "title": "Omitted Variable Bias in Language Models Under Distribution Shift", "sequence": 1590, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 128, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 96, "LLM adaptation & fine-tuning": 96, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 128, "selection_score": 128, "matched_terms": "distribution shift", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4412", "poster_number": 4412, "poster_band": "#4000-#4999"}, {"abstract": "We study grokking - the onset of generalization long after overfitting - in a classical ridge regression setting. We prove end-to-end grokking results for learning over-parameterized linear regression models using gradient descent with weight decay. Specifically, we prove that the following stages occur: (i) the model overfits the training data early during training; (ii) poor generalization persists long after overfitting has manifested; and (iii) the generalization error eventually becomes arbitrarily small. Moreover, we show, both theoretically and empirically, that grokking can be amplified or eliminated in a principled manner through proper hyperparameter tuning. To the best of our knowledge, these are the first rigorous quantitative bounds on the generalization delay (which we refer to as the \"grokking time\") in terms of training hyperparameters. Lastly, going beyond the linear setting, we empirically demonstrate that our quantitative bounds also capture the behavior of grokking on non-linear neural networks. Our results suggest that grokking is not an inherent failure mode of deep learning, but rather a consequence of specific training conditions, and thus does not require fundamental changes to the model architecture or learning algorithm to avoid.", "authors": "Mingyue Xu, Gal Vardi, Itay Safran", "icml_url": "https://icml.cc/virtual/2026/poster/66206", "is_oral": true, "is_spotlight": true, "poster_id": "66206", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4F Learning Theory", "title": "To Grok Grokking: Provable Grokking in Ridge Regression", "sequence": 5728, "award": "Outstanding Paper Honorable Mention", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 0, "selection_score": 240, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper Honorable Mention", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4508", "poster_number": 4508, "poster_band": "#4000-#4999"}, {"abstract": "We study a setting in which two players play a (possibly approximate) Nash equilibrium of a bimatrix game, while a learner observes only their actions and has no knowledge of the equilibrium or the underlying game. A natural question is whether the learner can rationalize the observed behavior by inferring the players' payoff functions. Rather than producing a single payoff estimate, inverse game theory aims to identify the entire set of payoffs consistent with observed behavior, enabling downstream use in, e.g., counterfactual analysis and mechanism design across applications like auctions, pricing, and security games. We focus on the problem of estimating the set of feasible payoffs with high probability and up to precision $\\epsilon$ on the Hausdorff metric. We provide the first minimax-optimal rates for both exact and approximate equilibrium play, in zero-sum as well as general-sum games. Our results provide learning-theoretic foundations for set-valued payoff inference in multi-agent environments.", "authors": "Annalisa Barbara, Riccardo Poiani, Martino Bernasconi, Andrea Celli", "icml_url": "https://icml.cc/virtual/2026/poster/61409", "is_oral": false, "is_spotlight": true, "poster_id": "61409", "presentation_type": "spotlight", "related_events": "", "title": "Optimal Rates for Feasible Payoff Set Estimation in Games", "sequence": 937, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 432, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 432, "selection_score": 477, "matched_terms": "multi-agent, game, games, nash, equilibrium", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4623", "poster_number": 4623, "poster_band": "#4000-#4999"}, {"abstract": "Direct alignment methods are increasingly used to align large language models (LLMs) with human preferences. However, many real-world alignment problems involve multiple conflicting objectives, where naive aggregation of preferences can lead to unstable training and poor trade-offs. In particular, weighted loss methods may fail to identify update directions that simultaneously improve all objectives, and existing multi-objective approaches often rely on explicit reward models, introducing additional complexity and distorting user-specified preferences. The contributions of this paper are two-fold. First, we propose a R eward-free A lignment framework for C onflicted O bjectives (RACO) that directly leverages pairwise preference data and resolves gradient conflicts via a novel clipped variant of conflict-averse gradient descent. We provide convergence guarantees to Pareto-critical points that respect user-specified objective weights, and further show that clipping can strictly improve convergence rate in the two-objective setting. Second, we improve our method using some heuristics and conduct experiments to demonstrate the compatibility of the proposed framework for LLM alignment. Both qualitative and quantitative evaluations on multi-objective summarization and safety alignment tasks across multiple LLM families (Qwen 3, Llama 3, Gemma 3) show that our method consistently achieves better Pareto trade-offs compared to existing multi-objective alignment baselines.", "authors": "Peter Chen, Xiaopeng Li, Xi Chen, Tianyi Lin", "icml_url": "https://icml.cc/virtual/2026/poster/60903", "is_oral": true, "is_spotlight": true, "poster_id": "60903", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4C LLM Alignment & Reliability", "title": "Reward-free Alignment for Conflicting Objectives", "sequence": 432, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 256, "LLM adaptation & fine-tuning": 70, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 256, "selection_score": 346, "matched_terms": "reward model, alignment, large language model, llm, language model", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #4626", "poster_number": 4626, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-08T22:30:00-07:00", "label": "Thu, Jul 9, 2026 14:30 KST", "icmlTime": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "count": 40, "rows": [{"abstract": "In reinforcement learning (RL), agents benefit from exploration *only* because they repeatedly encounter similar states: trying different actions can improve performance or reduce uncertainty; without such retries, a greedy policy is optimal. We formalize this intuition with **ReMax**, an objective that evaluates a policy by the expected maximum return over $M$ samples ($M \\in \\mathbb{N}$), while accounting for return uncertainty. Optimizing this objective induces stochastic exploration as an emergent property, without explicit bonus terms. For efficient policy optimization, we derive a new policy-gradient formulation for ReMax and introduce **Re**Max **PPO** (**RePPO**), a PPO variant that optimizes ReMax while generalizing the discrete retry count $M$ to a continuous parameter $m > 0$, enabling fine-grained control of exploration. Empirically, RePPO promotes exploration—without any explicit exploration bonuses—on the MinAtar and Craftax benchmarks.", "authors": "Soichiro Nishimori, Paavo Parmas, Sotetsu Koyamada, Tadashi Kozuno, Toshinori Kitamura, Shin Ishii, Yutaka Matsuo", "icml_url": "https://icml.cc/virtual/2026/poster/64417", "is_oral": false, "is_spotlight": false, "poster_id": "64417", "presentation_type": "regular", "related_events": "", "title": "Emergence of Exploration in Policy Gradient Reinforcement Learning via Retrying", "sequence": 3941, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 312, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 80, "LLM adaptation & fine-tuning": 304, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 312, "selection_score": 312, "matched_terms": "reinforcement learning, policy optimization, policy gradient, control, exploration", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #111", "poster_number": 111, "poster_band": "#0000-#0999"}, {"abstract": "Empirical successes show that regularization improves the stability and efficiency of reinforcement learning (RL), with applications in robotics and post-training of large language models. Yet, theoretical analyses of regularized Markov decision processes (MDPs) have mostly been confined to the standard RL setting. In this work, we investigate regularized MDPs through the lens of robust RL. We introduce a doubly regularized MDP framework that combines policy and dynamics regularization to enable robust policy learning against reward and dynamics perturbations. Within this framework, we develop an optimism-based online algorithm and provide the first finite-sample regret guarantees in both tabular and rich-observation settings, where the state-action space may be continuous. Our results show that algorithms for doubly regularized MDPs are as sample-efficient as well-studied robust MDP algorithms, while additionally benefiting from the flexibility of soft policies. Finally, we use experiments to demonstrate that our approach efficiently and effectively handles function approximation and exploration in large state-action spaces, achieving robust performances.", "authors": "Yiting He, Zhishuai Liu, Pan Xu", "icml_url": "https://icml.cc/virtual/2026/poster/62655", "is_oral": false, "is_spotlight": false, "poster_id": "62655", "presentation_type": "regular", "related_events": "", "title": "Doubly Regularized Markov Decision Processes for Robust Reinforcement Learning", "sequence": 2181, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 8, "RL & control": 432, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 66, "LLM adaptation & fine-tuning": 66, "Robotics, VLA & diffusion policy": 98}, "raw_topic_score": 432, "selection_score": 432, "matched_terms": "reinforcement learning, markov decision, mdp, robust rl, exploration, regret", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #121", "poster_number": 121, "poster_band": "#0000-#0999"}, {"abstract": "Formal specification is a powerful tool to guide the learning process and provides significant advantages over ad-hoc reward shaping:  (1) mathematical rigor; (2) expressiveness to specify objectives and constraints, and (3) the ability to define strategies to achieve objectives. However, these benefits remain largely unexplored in the context of MARL. This paper introduces HyPOLE, a novel framework for MARL under partial observability, where learning is guided by the expressive power of the so-called hyperproperties and, in particular, the temporal logic HyperLTL. HyPOLE targets settings in which agents operate under partial observability, modeled as partially observable Markov decision processes (POMDPs). We integrate CTDE techniques with HyPOLE to synthesize decentralized policies, and our evaluation on StarCraft~II and Wildfire benchmark demonstrates clear advantages over vanilla MARL baselines.", "authors": "Arshia Rafieioskouei, Tzu-Han Hsu, Matthew Lucas, Borzoo Bonakdarpour", "icml_url": "https://icml.cc/virtual/2026/poster/65345", "is_oral": false, "is_spotlight": false, "poster_id": "65345", "presentation_type": "regular", "related_events": "", "title": "HyPOLE: Hyperproperty-Guided Multi-Agent Reinforcement Learning under Partial Observation", "sequence": 4869, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 178, "Multi-agent RL, games & coordination": 540, "LLM post-training, RLHF & agents": 182, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 540, "selection_score": 540, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, decentralized", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #123", "poster_number": 123, "poster_band": "#0000-#0999"}, {"abstract": "We propose a distributional framework for offline Inverse Reinforcement Learning (IRL) that jointly models uncertainty over reward functions and full distributions of returns. Unlike conventional IRL approaches that recover a deterministic reward estimate or match only expected returns, our method captures richer structure in expert behavior, particularly in learning the reward distribution, by minimizing first-order stochastic dominance (FSD) violations and thus integrating distortion risk measures (DRMs) into policy learning, enabling the recovery of both reward distributions and distribution-aware policies. This formulation is well-suited for behavior analysis and risk-aware imitation learning. Theoretical analysis show that the algorithm converge with $\\mathcal{O}(\\varepsilon^{-2})$ iteration complexity. Empirical results on synthetic benchmarks, real-world neurobehavioral data, and MuJoCo control tasks demonstrate that our method recovers expressive reward representations and achieves state-of-the-art imitation performance.", "authors": "Feiyang Wu, Ye Zhao, Anqi Wu", "icml_url": "https://icml.cc/virtual/2026/poster/63146", "is_oral": true, "is_spotlight": true, "poster_id": "63146", "presentation_type": "oral", "related_events": "Oral presentation: Oral 5C Reinforcement Learning", "title": "Distributional Inverse Reinforcement Learning", "sequence": 2671, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 278, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 34}, "raw_topic_score": 278, "selection_score": 718, "matched_terms": "reinforcement learning, inverse reinforcement learning, control", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #212", "poster_number": 212, "poster_band": "#0000-#0999"}, {"abstract": "Inverse reinforcement learning (IRL) is typically formulated as maximizing entropy subject to matching the distribution of expert trajectories. Classical (dual-ascent) IRL guarantees monotonic performance improvement but requires fully solving an RL problem each iteration to compute dual gradients. More recent adversarial methods avoid this cost at the expense of stability and monotonic dual improvement, by directly optimizing the primal problem and using a discriminator to provide rewards. In this work, we bridge the gap between these approaches by enabling monotonic improvement of the reward function and policy without having to fully solve an RL problem at every iteration. Our key theoretical insight is that a trust-region-optimal policy for a reward function update can be globally optimal for a smaller update in the same direction. This smaller update allows us to explicitly optimize the dual objective while only relying on a local search around the current policy. In doing so, our approach avoids the training instabilities of adversarial methods, offers monotonic performance improvement, and learns a reward function in the traditional sense of IRL—one that can be globally optimized to match expert demonstrations. Our proposed algorithm, Trust Region Inverse Reinforcement Learning (TRIRL) , outperforms state-of-the-art imitation learning methods across multiple challenging tasks by a factor of 2.4x in terms of aggregate inter-quartile mean, while recovering reward functions that generalize to system dynamics shifts.", "authors": "Anish Abhijit Diwan, Davide Tateo, Christopher Mower, Haitham Bou Ammar, Jan Peters, Oleg Arenz", "icml_url": "https://icml.cc/virtual/2026/poster/63401", "is_oral": false, "is_spotlight": false, "poster_id": "63401", "presentation_type": "regular", "related_events": "", "title": "Trust Region Inverse Reinforcement Learning", "sequence": 2926, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 330, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 22}, "raw_topic_score": 330, "selection_score": 330, "matched_terms": "reinforcement learning, inverse reinforcement learning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #213", "poster_number": 213, "poster_band": "#0000-#0999"}, {"abstract": "Behavior cloning (BC) is a practical offline imitation learning method, but it often fails when expert demonstrations are limited. Recent works have introduced a class of architectures named predictive inverse dynamics models (PIDM) that combine a future state predictor with an inverse dynamics model (IDM). While PIDM often outperforms BC, the reasons behind its benefits remain unclear. In this paper, we provide a theoretical explanation: PIDM introduces a bias-variance tradeoff. While predicting the future state introduces bias, conditioning the IDM on the prediction can significantly reduce variance. We establish conditions on the state predictor bias for PIDM to achieve lower prediction error and higher sample efficiency than BC, with the gap widening when additional data sources are available. We validate the theoretical insights empirically in 2D navigation tasks, where BC requires up to five times (three times on average) more demonstrations than PIDM to reach comparable performance; and in a complex 3D environment in a modern video game with high-dimensional visual inputs and stochastic transitions, where BC requires over 66\\% more samples than PIDM.", "authors": "Lukas Schäfer, Pallavi Choudhury, Abdelhak Lemkhenter, Chris Lovett, Somjit Nath, Luis França, Matheus Mendonca, Alex Lamb, Riashat Islam, Siddhartha Sen, John Langford, Katja Hofmann, Sergio Valcarcel Macua", "icml_url": "https://icml.cc/virtual/2026/poster/61591", "is_oral": false, "is_spotlight": false, "poster_id": "61591", "presentation_type": "regular", "related_events": "", "title": "When does predictive inverse dynamics outperform behavior cloning?", "sequence": 1119, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 22, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 130}, "raw_topic_score": 130, "selection_score": 130, "matched_terms": "navigation, imitation learning, behavior cloning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #304", "poster_number": 304, "poster_band": "#0000-#0999"}, {"abstract": "In safety-critical domains where online data collection is infeasible, offline reinforcement learning (RL) is attractive only if policies achieve high returns without catastrophic lower-tail risk. Prior work on risk-averse offline RL achieves safety at the cost of value- or model-based pessimism, and restricted policy classes that limit policy expressiveness, whereas diffusion/flow-based expressive generative policies have largely been used in risk-neutral settings. We introduce **Risk-Aware Multimodal Actor-Critic (RAMAC)**, a simple, modular, model-free framework that couples an expressive generative actor (e.g., diffusion/flow) with a distributional critic and optimizes a composite objective that combines Conditional Value-at-Risk (CVaR) with behavioral cloning (BC), enabling risk-sensitive learning in complex multimodal scenarios. Since out-of-distribution (OOD) actions are a major driver of catastrophic failures in offline RL, we further provide an objective-level analysis showing that controlling behavior divergence via BC suppresses OOD actions and stabilizes CVaR. Instantiating RAMAC with a diffusion actor, we illustrate these insights on a 2-D risky bandit and evaluate on Stochastic-D4RL, observing consistent gains in CVaR$_{0.1}$ while maintaining strong returns.", "authors": "Kai Fukazawa, Kunal Mundada, Iman Soltani", "icml_url": "https://icml.cc/virtual/2026/poster/62421", "is_oral": false, "is_spotlight": false, "poster_id": "62421", "presentation_type": "regular", "related_events": "", "title": "RAMAC: Multimodal Risk-Aware Offline Reinforcement Learning and the Role of Behavior Regularization", "sequence": 1948, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 28, "RL & control": 322, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 36}, "raw_topic_score": 322, "selection_score": 322, "matched_terms": "reinforcement learning, offline rl, offline reinforcement, actor-critic, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #311", "poster_number": 311, "poster_band": "#0000-#0999"}, {"abstract": "Generalization remains a central challenge in offline reinforcement learning (RL), where policies are trained solely from static datasets and must perform reliably under distribution shift. While most existing offline RL methods focus on reducing training loss using standard optimizers such as Adam, the role of loss landscape geometry $-$ particularly sharpness $-$ has received little attention. Sharpness-Aware Minimization (SAM) has recently shown strong generalization benefits in supervised learning by favoring flatter minima. However, directly applying SAM to offline RL is non-trivial: unlike supervised settings with ground-truth labels, offline RL relies on bootstrapped targets, making sharpness estimation noisy and often destabilizing optimization. In this paper, we revisit offline RL from an optimization perspective and investigate how sharpness-aware optimization can be made effective in this setting. We propose Q bound weighted SAM (Q-SAM), a robust and scalable framework that treats sharpness as a weighted objective and selectively prioritizes samples that are most suitable for sharpness-aware optimization based on Q bounds. By aligning the SAM objective with the characteristics of bootstrapped value estimation, Q-SAM amplifies the benefits of sharpness minimization while preserving training stability. Extensive experiments on standard offline RL benchmarks demonstrate that Q-SAM consistently improves generalization performance across diverse datasets and algorithms. Our results highlight the importance of loss sharpness in offline RL and suggest optimizer design as a promising direction for developing more robust offline RL methods.", "authors": "Da Wang, Yi Ma, Ting Guo, Lin Li, Wei Wei, Jiye Liang", "icml_url": "https://icml.cc/virtual/2026/poster/61812", "is_oral": false, "is_spotlight": false, "poster_id": "61812", "presentation_type": "regular", "related_events": "", "title": "Q-SAM: Unlocking Sharpness-Aware Minimization for Generalization in Offline Reinforcement Learning", "sequence": 1340, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 428, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 428, "selection_score": 428, "matched_terms": "reinforcement learning, offline rl, offline reinforcement", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #312", "poster_number": 312, "poster_band": "#0000-#0999"}, {"abstract": "Offline reinforcement learning (RL) offers a powerful paradigm for data-driven control. Compared to model-free approaches, offline model-based RL (MBRL) explicitly learns a world model from a static dataset and uses it as a surrogate simulator, improving data efficiency and enabling potential generalization beyond the dataset support. However, most existing offline MBRL methods follow a two-stage training procedure: first learning a world model by maximizing the likelihood of the observed transitions, then optimizing a policy to maximize its expected return under the learned model. This objective mismatch results in a world model that is not necessarily optimized for effective policy learning. Moreover, we observe that policies learned via offline MBRL often lack robustness during deployment, and small adversarial noise in the environment can lead to significant performance degradation. To address these, we propose a framework that dynamically adapts the world model alongside the policy under a unified learning objective aimed at improving robustness. At the core of our method is a maximin optimization problem, which we solve by innovatively utilizing Stackelberg learning dynamics. We provide theoretical analysis to support our design and introduce computationally efficient implementations. We benchmark our algorithm on twelve noisy D4RL MuJoCo tasks and three stochastic Tokamak Control tasks, demonstrating its state-of-the-art performance.", "authors": "Jiayu Chen, Le Xu, Aravind Venugopal, Jeff Schneider", "icml_url": "https://icml.cc/virtual/2026/poster/62695", "is_oral": false, "is_spotlight": false, "poster_id": "62695", "presentation_type": "regular", "related_events": "", "title": "Policy-Driven World Model Adaptation for Robust Offline Model-based Reinforcement Learning", "sequence": 2221, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 176, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 32, "Robotics, VLA & diffusion policy": 178}, "raw_topic_score": 178, "selection_score": 178, "matched_terms": "world model, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #314", "poster_number": 314, "poster_band": "#0000-#0999"}, {"abstract": "Logical reasoning is a fundamental aspect of human intelligence and an essential capability for multimodal large language models (MLLMs). Despite the significant advancement in multimodal reasoning, existing benchmarks fail to comprehensively evaluate their reasoning abilities due to the lack of explicit categorization for logical reasoning types and an unclear understanding of reasoning. To address these issues, we introduce MME-Reasoning, a comprehensive benchmark designed to evaluate the reasoning ability of MLLMs, which covers all three types of reasoning (i.e., inductive, deductive, and abductive). We carefully curate the data to ensure that each question effectively evaluates reasoning ability rather than perceptual skills or knowledge breadth, and extend the evaluation protocols to cover the evaluation of diverse questions. Our evaluation reveals substantial limitations of SoTA MLLMs when subjected to holistic assessments of logical reasoning capabilities. Even the most advanced MLLMs show limited performance in comprehensive logical reasoning, with notable performance imbalances across reasoning types. In addition, we conducted an in-depth analysis of approaches such as ``thinking mode'' and Rule-based RL, which are commonly believed to enhance reasoning abilities. We hope the community can pay more attention to the comprehensive reasoning capabilities of MLLMs instead of only focusing on its subset.", "authors": "Jiakang Yuan, Tianshuo Peng, Yilei Jiang, Yiting Lu, Renrui Zhang, Kaituo Feng, Chaoyou Fu, Tao Chen, LEI BAI, Bo Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/61025", "is_oral": false, "is_spotlight": false, "poster_id": "61025", "presentation_type": "regular", "related_events": "", "title": "MME-Reasoning: A Broad-Spectrum Benchmark for Evaluating Logical Reasoning in MLLMs", "sequence": 553, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 342, "LLM adaptation & fine-tuning": 140, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 342, "selection_score": 342, "matched_terms": "large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #404", "poster_number": 404, "poster_band": "#0000-#0999"}, {"abstract": "Diffusion policies offer a powerful and expressive parameterization for continuous control. Yet, their integration with reinforcement learning remains conceptually and algorithmically challenging. In this work, we address this gap by introducing a noisy-space action-value (Q-)function that assigns values to diffusion latents through the distribution of executed actions induced by the denoising process. We show that this construction admits a precise semantic interpretation and derive a noisy-space policy gradient (NSPG) in which value estimates for noisy latents are computed exclusively using clean action-space values. Building on this result, we formulate a KL-regularized policy improvement over noisy latents and show that the resulting objective admits a diffusion-compatible regression form, avoiding backpropagation through the denoising process. Experiments on the D4RL benchmark demonstrate that semantically grounded value gradients provide a principled, effective foundation for training diffusion policies in offline reinforcement learning.", "authors": "Mahmoud Selim, Cristina Cipriani, Karl Johansson", "icml_url": "https://icml.cc/virtual/2026/poster/62289", "is_oral": false, "is_spotlight": false, "poster_id": "62289", "presentation_type": "regular", "related_events": "", "title": "Noisy-Space Policy Gradient for Diffusion Policies in Offline Reinforcement Learning", "sequence": 1816, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 382, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 80, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 348}, "raw_topic_score": 382, "selection_score": 622, "matched_terms": "reinforcement learning, offline reinforcement, policy gradient, continuous control, control", "selection_reasons": "user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #415", "poster_number": 415, "poster_band": "#0000-#0999"}, {"abstract": "Recent multimodal large language models have demonstrated strong reasoning ability, yet their reliability as automated evaluators remains limited by a critical weakness: when visual evidence conflicts with textual cues, MLLM judges tend to reward plausible narratives over perceptually correct answers. We identify and systematically analyze this phenomenon, which we term \\textit{Perceptual Judgment Bias}. Through controlled visual perturbations, existing multimodal judges frequently anchor on the response text instead of their own visual perception, leading to inconsistent and non-verifiable evaluations. To address this issue, we introduce the \\textit{Perceptually Perturbed Judgment Dataset}, which constructs minimally edited counterfactual responses that isolate perceptual errors and enable verifiable supervision. Building on this dataset, we develop a unified training framework that combines a structured GRPO-based reward with a batch-ranking objective, achieving coherent global ordering without explicit pairwise labels. Experiments across diverse MLLM-as-a-Judge benchmarks show that our approach substantially improves perceptual fidelity, ranking coherence, and alignment with human evaluation. Our results establish a scalable and generalizable pathway for training multimodal judges that are perceptually grounded, interpretable, and robust to visual–reasoning conflicts.", "authors": "Seojeong Park, Jiho Choi, Junyong Kang, Seonho Lee, Jaeyo Shin, Hyunjung Shim", "icml_url": "https://icml.cc/virtual/2026/poster/61108", "is_oral": false, "is_spotlight": false, "poster_id": "61108", "presentation_type": "regular", "related_events": "", "title": "Mitigating Perceptual Judgment Bias in Multimodal LLM-as-a-Judge via Perceptual Perturbation and Reward Modeling", "sequence": 636, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 310, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 310, "selection_score": 310, "matched_terms": "grpo, reward model, reward modeling, alignment, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #600", "poster_number": 600, "poster_band": "#0000-#0999"}, {"abstract": "World models require robust relational understanding to support prediction, reasoning, and control. While object-centric representations provide a useful abstraction, they are not sufficient to capture interaction-dependent dynamics. We therefore propose C-JEPA, a simple and flexible object-centric world model that extends masked joint embedding prediction from image patches to object-centric representations.  By applying object-level masking that requires an object’s state to be inferred from other objects, C-JEPA induces latent interventions with counterfactual-like effects and prevents shortcut solutions, making interaction reasoning essential. Empirically, C-JEPA leads to consistent gains in visual question answering, with an absolute improvement of about 20\\% in counterfactual reasoning over the same architecture without object-level masking. On agent control tasks, C-JEPA enables substantially more efficient planning by using only 1\\% of the total latent input features required by patch-based world models, while achieving comparable performance. Finally, we provide a formal analysis demonstrating that object-level masking induces a causal inductive bias via latent interventions. Code will be available at anonymous .", "authors": "Heejeong Nam, Quentin Le Lidec, Lucas Maes, Yann LeCun, Randall Balestriero", "icml_url": "https://icml.cc/virtual/2026/poster/63623", "is_oral": false, "is_spotlight": false, "poster_id": "63623", "presentation_type": "regular", "related_events": "", "title": "Causal-JEPA: Learning World Models through Object-Level Latent Interventions", "sequence": 3148, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 40, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 40, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 156}, "raw_topic_score": 156, "selection_score": 156, "matched_terms": "world model, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #1008", "poster_number": 1008, "poster_band": "#1000-#1999"}, {"abstract": "Harmful fine-tuning can invalidate safety alignment of large language models, exposing significant safety risks. In this paper, we utilize the attention sink mechanism to mitigate harmful fine-tuning. Specifically, we first measure a statistic named sink divergence for each attention head and observe that different attention heads exhibit two different signs of sink divergence . To understand its safety implications, we conduct experiments and find that the number of attention heads of positive sink divergence increases along with the increase of the model's harmfulness when undergoing harmful fine-tuning. Based on this finding, we propose a separable sink divergence hypothesis -- attention heads associating with learning harmful patterns during fine-tuning are separable by their sign of sink divergence . Based on the hypothesis, we propose a fine-tuning-stage defense, dubbed Surgery. Surgery utilizes a regularizer for sink divergence suppression, which steers attention heads toward the negative sink divergence group, thereby reducing the model’s tendency to learn and amplify harmful patterns. Extensive experiments demonstrate that Surgery improves defense performance by 5.90\\%, 11.25\\%, and 9.55\\% on the BeaverTails, HarmBench, and SorryBench benchmarks, respectively. Source code is available on https://anonymous.4open.science/r/Surgery-A69E.", "authors": "Guozhi Liu, Weiwei Lin, Tiansheng Huang, Ruichao Mo, Qi Mu, Xiumin Wang, Li Shen", "icml_url": "https://icml.cc/virtual/2026/poster/66119", "is_oral": false, "is_spotlight": true, "poster_id": "66119", "presentation_type": "spotlight", "related_events": "", "title": "Surgery: Mitigating Harmful  Fine-Tuning for Large Language Models via Attention Sink", "sequence": 5642, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 140, "LLM adaptation & fine-tuning": 660, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 660, "selection_score": 945, "matched_terms": "fine-tuning, harmful fine-tuning, large language model, language model", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #1409", "poster_number": 1409, "poster_band": "#1000-#1999"}, {"abstract": "LoRA has become a widely adopted method for PEFT, and its initialization methods have attracted increasing attention.  However, existing methods have notable limitations:  many methods do not incorporate target-domain data, while gradient-based methods exploit data only at a shallow level by relying on one-step gradient decomposition. In this paper, we establish a theoretical framework for data-aware LoRA initialization.  Starting from minimizing the expectation of the parameter discrepancy between the fine-tuned and target models, we derive an optimization problem with two components: a bias term, which is related to the parameter distance between the fine-tuned and target models, and is approximated using a Fisher–gradient formulation to preserve anisotropy; and a variance term, which accounts for the uncertainty introduced by sampling stochasticity through the Fisher information. Solving this problem yields an optimal initialization strategy for LoRA, based on which we develop an efficient algorithm, LoRA-DA. Empirical results across multiple benchmarks demonstrate that LoRA-DA consistently improves final accuracy over existing initialization methods. Additional studies show faster, more stable convergence, robustness across ranks, and only a small initialization overhead for LoRA-DA. The source code will be released upon publication.", "authors": "Qingyue Zhang, Chang Chu, Tianren Peng, Qi Li, Xiangyang Luo, Zhihao Jiang, Shao-Lun Huang", "icml_url": "https://icml.cc/virtual/2026/poster/64590", "is_oral": false, "is_spotlight": false, "poster_id": "64590", "presentation_type": "regular", "related_events": "", "title": "LoRA-DA: Data-Aware Initialization for Low-Rank Adaptation via Asymptotic Analysis", "sequence": 4114, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 516, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 516, "selection_score": 516, "matched_terms": "lora, low-rank adaptation, adapt", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #1706", "poster_number": 1706, "poster_band": "#1000-#1999"}, {"abstract": "While Large Language Models (LLMs) have demonstrated strong zero-shot reasoning capabilities, their deployment as embodied agents still faces fundamental challenges in long-horizon planning. Unlike open-ended text generation, embodied agents must decompose high-level intent into actionable sub-goals while strictly adhering to the logic of a dynamic, observed environment. Standard LLM planners frequently fail to maintain strategy coherence over extended horizons due to context window limitation or hallucinate transitions that violate constraints. We propose GiG, a novel planning framework that structures embodied agents' memory using a $\\underline{G}$raph-$\\underline{i}$n-$\\underline{G}$raph architecture.  Our approach employs a Graph Neural Network (GNN) to encode environmental states into embeddings, organizing these embeddings into action-connected execution trace graphs within a latent memory bank. By clustering these graph embeddings, the framework enables retrieval of structure-aware priors, allowing agents to ground current decisions in relevant past structural patterns. Furthermore, we introduce a novel bounded lookahead module that leverages symbolic transition logic to enhance the agents' planning capabilities through the grounded action projection.  We evaluate our framework on three embodied planning benchmarks—Robotouille Synchronous, Robotouille Asynchronous, and ALFWorld. Our method outperforms state-of-the-art baselines, achieving Pass@1 performance gains of up to 22\\% on Robotouille Synchronous, 37\\% on Asynchronous, and 15\\% on ALFWorld with comparable or lower computational cost.", "authors": "Xiang Li, Ning Yan, Masood Mortazavi", "icml_url": "https://icml.cc/virtual/2026/poster/61431", "is_oral": false, "is_spotlight": false, "poster_id": "61431", "presentation_type": "regular", "related_events": "", "title": "Embodied Task Planning via Graph-Informed Action Generation with Large Lanaguage Model", "sequence": 959, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 84, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 168, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 286}, "raw_topic_score": 286, "selection_score": 286, "matched_terms": "robot, embodied", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #1908", "poster_number": 1908, "poster_band": "#1000-#1999"}, {"abstract": "Aligning large language models (LLMs) to heterogeneous and rapidly evolving safety requirements remains a critical challenge. Existing instruction-tuned LLMs and standalone safety classifiers often fail to generalize to new safety configurations, motivating the need for Reward Models (RMs) that are explicitly configurable to changing specifications. We introduce the Configurable Safety Reward Model (CSRM), which is jointly optimized for calibrated safety compliance and reward modeling. Our approach is supported by configuration-targeted data augmentation that enforces instruction adherence while preserving relative severity structure. The resulting RM is sensitive to fine-grained safety configurations and conversational nuances, substantially improving generalization to previously unseen safety configurations. CSRM achieves state-of-the-art performance on recent configurable safety benchmarks, including CoSApien (94.6\\% F1) and DynaBench (75.8\\% F1), without requiring additional human annotation. When used for downstream safety alignment, CSRM yields LLMs with a significantly improved helpfulness–safety tradeoff compared to existing baselines.", "authors": "Zhengping Jiang, Mehran Khodabandeh, Akash Bharadwaj, Manik Bhandari, Mayur Srungarapu, Anqi Liu, Benjamin Van Durme, Li Chen", "icml_url": "https://icml.cc/virtual/2026/poster/63055", "is_oral": false, "is_spotlight": false, "poster_id": "63055", "presentation_type": "regular", "related_events": "", "title": "Configurable Reward Model for Balanced Safety Alignment", "sequence": 2580, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 320, "LLM adaptation & fine-tuning": 70, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 320, "selection_score": 320, "matched_terms": "reward model, reward modeling, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #2003", "poster_number": 2003, "poster_band": "#2000-#2999"}, {"abstract": "Math reasoning has become the poster child of progress in large language models (LLMs), with new models rapidly surpassing human-level performance on benchmarks like MATH and AIME. But as math leaderboards improve week by week, it is worth asking: do these gains reflect broader problem-solving ability or just narrow overfitting? To answer this question, we evaluate over 20 open-weight reasoning-tuned models across a broad suite of tasks, including math, scientific QA, agent planning, coding, and standard instruction-following. We surprisingly find that most models that succeed in math fail to transfer their gains to other domains. To rigorously study this phenomenon, we conduct controlled experiments using math-only data with two widely-used methods: Reinforcement Learning (RL) and Supervised Finetuning (SFT) with detailed ablations. On top of the observation that RL-tuned models transfer better than SFT-tuned model, we identify on-policy fine-tuning as the key mechanism underlying cross-domain transfer, regardless of whether the training signal comes from RL or supervised learning. Latent-space representation and token-space distribution shift analyses reveal that off-policy SFT induces substantial representation and output drift, while on-policy RL preserves general-domain structure. Our results suggest a need to rethink the post-training recipes, particularly the reliance on off-policy SFT-distilled data to advance reasoning models.", "authors": "Maggie Ziyu Huan, Yuetai Li, Tuney Zheng, Xiaoyu Xu, Seungone Kim, Minxin Du, Radha Poovendran, Graham Neubig, Xiang Yue", "icml_url": "https://icml.cc/virtual/2026/poster/65125", "is_oral": false, "is_spotlight": false, "poster_id": "65125", "presentation_type": "regular", "related_events": "", "title": "Does Math Reasoning Improve General LLM Capabilities? Understanding Transferability of LLM Reasoning", "sequence": 4649, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 56, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 320, "LLM adaptation & fine-tuning": 194, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 320, "selection_score": 320, "matched_terms": "post-training, large language model, llm, language model, reasoning, agent, on-policy", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #2015", "poster_number": 2015, "poster_band": "#2000-#2999"}, {"abstract": "LLMs achieve remarkable multi-step reasoning capabilities, yet effectively transferring these skills via post-training distillation remains challenging. Existing data selection methods, ranging from manual curation to heuristics based on length, entropy, or overall loss, fail to capture the causal importance of individual reasoning steps, limiting distillation efficiency. To address this, we propose Attention Influence for Reasoning (AIR), a principled, unsupervised and training-free framework that leverages mechanistic insights of the retrieval head to select high-value post-training data. AIR first identifies reasoning-critical attention heads of an off-the-shelf model, then constructs a weakened reference model with disabled head influence, and finally quantifies the resulting loss divergence as the Attention Influence Score. This score enables fine-grained assessment at both the step and sample levels, supporting step-level weighted fine-tuning and global sample selection. Experiments across multiple reasoning benchmarks show that AIR consistently improves reasoning accuracy, surpassing heuristic baselines and effectively isolating the most critical steps and samples. Our work establishes a mechanism-driven, data-efficient approach for reasoning distillation in LLMs.", "authors": "Jinrui Liu, Kai Hua, Xuanguang Pan, Ge Zhang, Yong Wang, Shuai Ma, Chongyang Tao", "icml_url": "https://icml.cc/virtual/2026/poster/62115", "is_oral": false, "is_spotlight": false, "poster_id": "62115", "presentation_type": "regular", "related_events": "", "title": "AIR: Post-training Data Selection for Reasoning via Attention Head Influence", "sequence": 1642, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 308, "LLM adaptation & fine-tuning": 62, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 308, "selection_score": 308, "matched_terms": "post-training, llm, reasoning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #2209", "poster_number": 2209, "poster_band": "#2000-#2999"}, {"abstract": "Low-Rank Adaptation (LoRA) achieves parameter-efficient fine-tuning by constraining model updates to a low-rank subspace and has been widely used in practice.  However, LoRA typically employs a shared low-rank update across tokens, which limits its ability to fully exploit the adaptation subspace for tokens from different sequences. To address this issue, we propose an adaptive utilization of Low-Rank Adaptation (U-LoRA), which employs conditioned gating to explicitly learn effective token-level utilization of the limited low-rank adaptation subspace.  Specifically, U-LoRA generates utilization coefficients along low-rank directions for each token and jointly coordinates and constrains them using sequence-level contextual information, thereby inducing more consistent adaptive patterns within a sentence. To further enhance training stability, we introduce a bias-corrected exponential moving average (EMA) historical prior that calibrates utilization signals across optimization steps, suppressing noise caused by batch-to-batch fluctuations. The effectiveness of our method arises from a better utilization of the existing low-rank subspace via input-conditioned strategies, rather than from expanding the subspace. Experiments on mathematical reasoning and natural language understanding benchmarks demonstrate that U-LoRA achieves competitive performance under comparable parameter budgets when with strong LoRA baselines and recent variants.", "authors": "Guang Yang, Changhao Guan, Chao Huang, Yufeng Chen, Kaiyu Huang", "icml_url": "https://icml.cc/virtual/2026/poster/62892", "is_oral": false, "is_spotlight": false, "poster_id": "62892", "presentation_type": "regular", "related_events": "", "title": "Adaptive Utilization of Low-Rank Adaptation via Conditioned Gating", "sequence": 2418, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 700, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 700, "selection_score": 700, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #2212", "poster_number": 2212, "poster_band": "#2000-#2999"}, {"abstract": "LoRA efficiently adapts large pre-trained models via low-rank updates, making it a strong parameter-efficient fine-tuning (PEFT) method. When integrated with Federated Learning (FL), it enables collaborative fine-tuning across distributed clients, leveraging rich downstream data without exposing private information. However, this strategy is hindered by data heterogeneity and limits personalization performance. To address this, personalized FedLoRA approaches have been proposed and employ a dual-LoRA architecture, e.g., one branch for global knowledge and another for client-specific adaptation. Nevertheless, this dual-LoRA design introduces additional computational overhead and structural redundancy. To address this limitation, we propose FedPissa, the first framework that rethinks single-LoRA via selective aggregation and subspace decorrelation. We selectively aggregate LoRA components based on their aggregation dynamics, and further apply a decorrelated subspace projection to mitigate heterogeneous update conflicts, reducing cross-client interference and improving personalized adaptation. Experiments on textual and visual scenarios show that FedPissa not only achieves up to 35% lower communication and computation cost, but also improves overall accuracy by up to 8% compared to its counterparts.", "authors": "Wenwen He, Wenke Huang, Yi Liu, Jian Liang, Xirui Li, Guansong Pang, Mang Ye", "icml_url": "https://icml.cc/virtual/2026/poster/63191", "is_oral": false, "is_spotlight": true, "poster_id": "63191", "presentation_type": "spotlight", "related_events": "", "title": "FedPissa: Towards Federated Personalized Adaptation of Foundation Models via LoRA Subspace Mapping", "sequence": 2716, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 692, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 692, "selection_score": 977, "matched_terms": "personalized adaptation, fine-tuning, parameter-efficient, lora, adapt", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #2908", "poster_number": 2908, "poster_band": "#2000-#2999"}, {"abstract": "Preference-based reward modeling is a core component of RLHF and DPO pipelines. In practice, the humans providing preference feedback are rarely an i.i.d. sample: recruitment and exposure often follow social, institutional, or spatial structure, inducing non-uniform inclusion probabilities that correlate with graph centrality. We formalize preference learning with *network-sampled* annotators and show that identity-agnostic scalar reward modeling implicitly represents an inclusion-weighted welfare, over-representing structurally central communities when the inclusion distribution $q$ differs from a designer-chosen target weighting $\\pi$. We propose Graph-Preference Learning, which combines (i) a graph-personalized reward model that shares statistical strength across neighboring annotators and (ii) graph-balanced aggregation that computes stabilized importance weights to target $\\pi$. Our analysis characterizes the induced welfare represented by the learned aggregate reward and bounds its deviation from the target in terms of weight mismatch, reward-model approximation, and finite-sample effects. Experiments on synthetic graphs and a *semi-synthetic* case study on the LMArena preference dataset, where biased inclusion is *induced* via graph-based sampling, demonstrate up to 62% reduction in target-welfare recovery error and 17% reduction in cross-language performance gaps under biased inclusion.", "authors": "Guangrui Fan, DanDan Liu, AZNUL SABRI, Pan Lihu", "icml_url": "https://icml.cc/virtual/2026/poster/65433", "is_oral": false, "is_spotlight": false, "poster_id": "65433", "presentation_type": "regular", "related_events": "", "title": "Graph-Preference Learning: Debiasing Network-Sampled Human Feedback for Target Welfare Estimation", "sequence": 4957, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 384, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 384, "selection_score": 384, "matched_terms": "rlhf, preference learning, dpo, reward model, reward modeling", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3011", "poster_number": 3011, "poster_band": "#3000-#3999"}, {"abstract": "Algorithmic fairness is often studied in static or single-agent settings, yet many real-world decision-making systems involve multiple interacting entities whose multi-stage actions jointly influence long-term outcomes. Existing fairness methods applied at isolated decision points frequently fail to mitigate disparities that accumulate over time. Although recent work has modeled fairness as a sequential decision-making problem, it typically assumes centralized agents or simplified dynamics, limiting its applicability to complex social systems. We introduce MAFE , a suite of Multi-Agent Fair Environments designed to simulate realistic, modular, and dynamic systems in which fairness emerges from the interplay of multiple agents. We demonstrate MAFEs in three domains—loan processing, healthcare, and higher education—supporting heterogeneous agents, configurable interventions, and fairness metrics. The environments are open-source and compatible with standard multi-agent reinforcement learning (MARL) libraries, enabling reproducible evaluation of fairness-aware policies. Through extensive experiments on cooperative use cases, we demonstrate how MAFE facilitates the design of equitable multi-agent algorithms and reveals critical trade-offs between fairness, performance, and coordination. MAFE provides a foundation for systematic progress in dynamic, multi-agent fairness research.", "authors": "Zachary Lazri, Anirudh Nakra, Ivan Brugere, Danial Dervovic, Antigoni Polychroniadou, Furong Huang, Dana Dachman-Soled, Min Wu", "icml_url": "https://icml.cc/virtual/2026/poster/60878", "is_oral": false, "is_spotlight": false, "poster_id": "60878", "presentation_type": "regular", "related_events": "", "title": "MAFE: Enabling Equitable Algorithm Design in Multi-Agent Multi-Stage Decision-Making Systems", "sequence": 407, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 476, "LLM post-training, RLHF & agents": 304, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 476, "selection_score": 476, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, coordination, cooperative", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Thu, Jul 9, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T22:30:00-07:00", "location": "HALL A #3302", "poster_number": 3302, "poster_band": "#3000-#3999"}, {"abstract": "As Large Language Models (LLMs) gain agentic abilities, they will have to navigate complex multi-agent scenarios, interacting with human users and other agents in cooperative and competitive settings. This will require new reasoning skills, a crucial one being theory of mind (ToM), or the ability to reason about the \"mental\" states of other agents. However, ToM and other multi-agent abilities in LLMs are poorly understood, since existing benchmarks suffer from narrow scope, data leakage, saturation, and lack of interactivity. We thus propose Decrypto, a game-based benchmark for multi-agent reasoning and ToM drawing inspiration from cognitive science, computational pragmatics and multi-agent reinforcement learning. It is designed to be as easy as possible in all other dimensions, eliminating confounding factors commonly found in other benchmarks. To our knowledge, it is also the first platform for designing interactive ToM experiments.  We validate the benchmark design through comprehensive empirical evaluations of frontier LLMs, robustness studies, and human-AI cross-play experiments. We find that LLM game-playing abilities lag behind humans and simple word-embedding baselines. We then create variants of two classic cognitive science experiments within Decrypto to evaluate three key ToM abilities. Surprisingly, we find that state-of-the-art reasoning models are significantly worse at those tasks than their older counterparts. This demonstrates that Decrypto addresses a crucial gap in current reasoning and ToM evaluations, and paves the path towards better artificial agents. Code at anonymous.4open.science/r/decrypto/.", "authors": "Andrei Lupu, Timon Willi, Jakob Foerster", "icml_url": "https://icml.cc/virtual/2026/poster/62135", "is_oral": false, "is_spotlight": false, "poster_id": "62135", "presentation_type": "regular", "related_events": "", "title": "The Decrypto Benchmark for Multi-Agent Reasoning and Theory of Mind", "sequence": 1662, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_sco
