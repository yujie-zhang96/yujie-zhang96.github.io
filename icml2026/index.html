Function Inconsistency Penalized Offline Reinforcement Learning", "sequence": 2970, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 316, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 316, "selection_score": 316, "matched_terms": "reinforcement learning, offline rl, offline reinforcement", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #402", "poster_number": 402, "poster_band": "#0000-#0999"}, {"abstract": "Conveying complex objectives to reinforcement learning (RL) agents often requires meticulous reward engineering. Preference-based RL (PbRL) offers a promising alternative by learning reward functions from human feedback, but its scalability is hindered by high labeling costs. Inspired by advances in Video Foundation Models (ViFMs), we present Video-based Optimal Transport Preference (VOTP), a semi-supervised framework that learns effective reward functions from only a handful of labels. By leveraging optimal transport to align visual trajectories within the rich representation space of ViFMs, VOTP effectively generates high-fidelity pseudo-labels for large amounts of unlabeled data, substantially reducing human supervision. Extensive experiments across locomotion and manipulation benchmarks demonstrate the superiority of VOTP, which outperforms state-of-the-art offline PbRL methods under limited feedback budgets. We also showcase the robustness of VOTP in the presence of visual distractors and validate its utility on real robotic tasks, where it learns meaningful rewards with minimal human input.", "authors": "Minh-Tung Luu, Hwanhee Kim, Younghwan Lee, Chang D. Yoo", "icml_url": "https://icml.cc/virtual/2026/poster/65169", "is_oral": true, "is_spotlight": true, "poster_id": "65169", "presentation_type": "oral", "related_events": "Oral presentation: Oral 3B Reinforcement Learning: RLHF and Post-training", "title": "Video-Based Optimal Transport for Feedback-Efficient Offline Preference-Based Reinforcement Learning", "sequence": 4693, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 222, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 94}, "raw_topic_score": 222, "selection_score": 662, "matched_terms": "reinforcement learning, preference-based reinforcement", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #403", "poster_number": 403, "poster_band": "#0000-#0999"}, {"abstract": "Safe reinforcement learning (Safe RL) aims to maximize expected return while satisfying safety constraints, typically modeled as constrained Markov decision processes. While primal-dual methods scale well to deep RL, they often suffer from delayed constraint correction, leading to oscillatory behavior and prolonged safety violations. In this paper, we propose Constraint-Sensitive Policy Optimization (CSPO) , a first-order primal-dual method that incorporates local constraint sensitivity into policy updates. CSPO augments the primal objective with a constraint-sensitive correction derived from the shortest signed distance to the safety boundary, enabling smarter recovery steps back to safety, compensating for delayed Lagrange multiplier updates, and reducing oscillations near the boundary, while preserving the KKT solutions of the original constrained problem. Extensive experiments on navigation and locomotion benchmarks demonstrate that CSPO achieves faster safety recovery and high reward preservation, resulting in higher constrained returns (+15.6\\% average improvement) compared to state-of-the-art primal-dual and penalty-based methods.", "authors": "Ayoub Belouadah, Sylvain Kubler, YVES LE TRAON", "icml_url": "https://icml.cc/virtual/2026/poster/66410", "is_oral": false, "is_spotlight": true, "poster_id": "66410", "presentation_type": "spotlight", "related_events": "", "title": "CSPO: Constraint-Sensitive Policy Optimization for Safe Reinforcement Learning", "sequence": 5930, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 262, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 20}, "raw_topic_score": 262, "selection_score": 307, "matched_terms": "reinforcement learning, markov decision, policy optimization, safe rl", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #406", "poster_number": 406, "poster_band": "#0000-#0999"}, {"abstract": "We study offline reinforcement learning of style-conditioned policies using explicit style supervision via subtrajectory labeling functions. In this setting, aligning style with high task performance is particularly challenging due to distribution shift and inherent conflicts between style and reward. Existing methods, despite introducing numerous definitions of style, often fail to reconcile these objectives effectively. To address these challenges, we propose a unified definition of behavior style and instantiate it into a practical framework. Building on this, we introduce Style-Conditioned Implicit Q-Learning (SCIQL), which leverages offline goal-conditioned reinforcement learning techniques, such as hindsight relabeling and value learning, and combine it with a new Gated Advantage Weighted Regression mechanism to efficiently optimize task performance while preserving style alignment. Experiments demonstrate that SCIQL achieves superior performance on both objectives compared to prior offline methods.", "authors": "Mathieu Petitbois, Rémy Portelas, sylvain lamprier", "icml_url": "https://icml.cc/virtual/2026/poster/62084", "is_oral": false, "is_spotlight": true, "poster_id": "62084", "presentation_type": "spotlight", "related_events": "", "title": "Offline Reinforcement Learning of High-Quality Behaviors Under Robust Style Alignment", "sequence": 1611, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 282, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 80, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 16}, "raw_topic_score": 282, "selection_score": 327, "matched_terms": "reinforcement learning, offline reinforcement, q-learning", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #507", "poster_number": 507, "poster_band": "#0000-#0999"}, {"abstract": "Expressive policies based on flow-matching have been successfully applied in reinforcement learning (RL) more recently due to their ability to model complex action distributions from offline data. These algorithms build on standard policy gradients, which assume that there is no unmeasured confounding in the data. However, this condition does not necessarily hold for pixel-based demonstrations when a mismatch exists between the demonstrator's and the learner's sensory capabilities, leading to implicit confounding biases in offline data. We address the challenge by investigating the problem of confounded observations in offline RL from a causal perspective. We develop a novel causal offline RL objective that optimizes policies' worst-case performance that may arise due to confounding biases. Based on this new objective, we introduce a practical implementation that learns expressive flow-matching policies from confounded demonstrations, employing a deep discriminator to assess the discrepancy between the target policy and the nominal behavioral policy. Experiments across 25 pixel-based tasks demonstrate that our proposed confounding-robust augmentation procedure achieves a success rate 120\\% that of confounding-unaware, state-of-the-art offline RL methods.", "authors": "Mingxuan Li, Junzhe Zhang, Elias Bareinboim", "icml_url": "https://icml.cc/virtual/2026/poster/64920", "is_oral": false, "is_spotlight": false, "poster_id": "64920", "presentation_type": "regular", "related_events": "", "title": "Causal Flow Q-Learning for Robust Offline Reinforcement Learning", "sequence": 4444, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 368, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 368, "selection_score": 368, "matched_terms": "reinforcement learning, offline rl, offline reinforcement, policy gradient, q-learning", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #614", "poster_number": 614, "poster_band": "#0000-#0999"}, {"abstract": "Vision-Language-Action (VLA) models have recently shown strong decision-making capabilities in autonomous driving. However, existing VLAs often struggle with achieving efficient inference and generalizing to novel autonomous vehicle configurations and driving scenarios. In this paper, we propose Reasoning-VLA, a general and efficient action-generation VLA framework. The proposed model employs a set of learnable action queries, implicitly guided by predefined spatial representations to enhance spatial awareness.  These learnable queries interact with reasoning-enhanced vision–language features to generate continuous action trajectories in parallel. To promote robust generalization, we consolidate eight publicly available autonomous driving datasets into a standardized, Chain-of-Thought reasoning–based, and easy-to-use data format for model training. Leveraging both supervised learning and reinforcement learning fine-tuning, extensive empirical evaluations across multiple benchmarks demonstrate that Reasoning-VLA achieves state-of-the-art performance, strong generalization capability, and the excellent inference speed with parallel decode.", "authors": "Dapeng Zhang, Zhenlong Yuan, Zhangquan Chen, Chih-Ting Liao, Yinda Chen, Fei Shen, Qingguo Zhou, Tat-Seng Chua", "icml_url": "https://icml.cc/virtual/2026/poster/62900", "is_oral": false, "is_spotlight": false, "poster_id": "62900", "presentation_type": "regular", "related_events": "", "title": "Reasoning-VLA: An Efficient and Spatial-Guided General Vision-Language-Action Reasoning Model for Autonomous Driving", "sequence": 2426, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 124, "LLM adaptation & fine-tuning": 34, "Robotics, VLA & diffusion policy": 480}, "raw_topic_score": 480, "selection_score": 480, "matched_terms": "vision-language-action, vla", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #712", "poster_number": 712, "poster_band": "#0000-#0999"}, {"abstract": "Integrating vision-language models (VLMs) into end-to-end (E2E) autonomous driving (AD) systems has shown promise in improving scene understanding. However, existing integration strategies suffer from several limitations: they either struggle to resolve distribution misalignment between reasoning and action spaces,  underexploit the general reasoning capabilities of pretrained VLMs, or incur substantial inference latency during action policy generation, which degrades driving performance. To address these challenges, we propose AutoMoT in this work, an end-to-end AD framework that unifies reasoning and action generation within a single vision-language-action (VLA) model. Our approach leverages a mixture-of-transformer (MoT) architecture with joint attention sharing, which preserves the general reasoning capabilities of pre-trained VLMs while enabling efficient fast-slow inference through asynchronous execution at different task frequencies. Additionally, we introduce a VLA-oriented action refiner that further enhances driving performance via diffusion-based fine-tuning. Extensive experiments on multiple benchmarks, under both open- and closed-loop settings, demonstrate that AutoMoT achieves competitive performance compared to state-of-the-art methods.  We refer to \\href{https://automot-website.github.io/}{Project Page} for the demonstration videos and corresponding descriptions.", "authors": "Wenhui (Oscar) Huang, Songyan Zhang, Qihang Huang, Zhidong Wang, zhiqi mao, Collister Chua, Chen Zhan, Long Chen, Chen Lv", "icml_url": "https://icml.cc/virtual/2026/poster/64489", "is_oral": false, "is_spotlight": false, "poster_id": "64489", "presentation_type": "regular", "related_events": "", "title": "AutoMoT: A Unified Vision-Language-Action Model with Asynchronous Mixture -of-Transformers for End-to-End Autonomous Driving", "sequence": 4013, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 72, "LLM adaptation & fine-tuning": 46, "Robotics, VLA & diffusion policy": 260}, "raw_topic_score": 260, "selection_score": 260, "matched_terms": "vision-language-action, vla, diffusion", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #808", "poster_number": 808, "poster_band": "#0000-#0999"}, {"abstract": "While Vision-Language-Action (VLA) models offer broad general capabilities, deploying them on specific hardware requires real-world adaptation to bridge the embodiment gap. Since robot demonstrations are costly, this adaptation must often occur under a strict data budget. In this work, we identify a critical diversity trap : the standard heuristic of ``maximizing coverage\" by collecting diverse, single-shot demonstrations can be self-defeating due to non-vanishing estimation noise. We formalize this phenomenon as a Coverage--Density Trade-off . By decomposing the policy error into estimation (density) and extrapolation (coverage) terms, we characterize an interior optimal allocation of unique conditions for a fixed budget. Guided by this analysis, we propose Anchor-Centric Adaptation (ACA) , a two-stage framework that first stabilizes a policy skeleton through repeated demonstrations at core anchors, then selectively expands coverage to high-risk boundaries via teacher-forced error mining and constrained residual updates. Real-robot experiments validate our trade-off framework and demonstrate that ACA significantly improves task reliability and success rates over standard diverse sampling strategies under the same budget.", "authors": "Yanzhe Chen, Kevin Yuchen, Qi Lv, Lin Yiqi, Zechen Bai, Chen GAO, Mike Zheng Shou", "icml_url": "https://icml.cc/virtual/2026/poster/66510", "is_oral": false, "is_spotlight": false, "poster_id": "66510", "presentation_type": "regular", "related_events": "", "title": "Escaping the Diversity Trap in Robotic Manipulation via Anchor-Centric Adaptation", "sequence": 6029, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 48, "Robotics, VLA & diffusion policy": 424}, "raw_topic_score": 424, "selection_score": 424, "matched_terms": "vision-language-action, vla, robot, robotic, manipulation", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #809", "poster_number": 809, "poster_band": "#0000-#0999"}, {"abstract": "Existing Vision-Language-Action (VLA) models predominantly rely on explicit Chain-of-Thought (CoT) reasoning to bridge perception and action. While effective, this paradigm suffers from high computational costs and error propagation in multi-step tasks. In this paper, we propose Adaptive Variable Alignment VLA (AVA-VLA), a novel Latent Reasoning VLA framework that models reasoning as a sequence of unobservable latent variables, bypassing the need for explicit text generation. However, latent trajectories are inherently susceptible to noise interference and misalignment with downstream objectives. To address this, we introduce a Reinforcement Learning-based Denoising mechanism that treats latent state generation as a sequential decision process, optimizing reasoning trajectories via task-level rewards. Furthermore, we incorporate an Early-Exit Strategy that adaptively terminates reasoning based on state confidence, enabling a dynamic trade-off between depth and efficiency. Extensive experiments on embodied decision benchmarks demonstrate that AVA-VLA significantly reduces inference latency while achieving superior stability and success rates compared to full-reasoning baselines.", "authors": "Dianqiao Lei, Lianlei Shan", "icml_url": "https://icml.cc/virtual/2026/poster/61571", "is_oral": false, "is_spotlight": false, "poster_id": "61571", "presentation_type": "regular", "related_events": "", "title": "Think Less, Act Early: Reinforced Latent Reasoning with Early Exit in Vision-Language-Action Models", "sequence": 1099, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 130, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 394}, "raw_topic_score": 394, "selection_score": 394, "matched_terms": "vision-language-action, vla, embodied", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #813", "poster_number": 813, "poster_band": "#0000-#0999"}, {"abstract": "It is infeasible to encompass all possible disturbances within the training dataset. This raises a critical question regarding the robustness of Vision-Language-Action (VLA) models when encountering unseen real-world visual disturbances, particularly under imperfect visual conditions. In this work, we conduct a systematic study based on recent state-of-the-art VLA models and reveal a significant performance drop when visual disturbances absent from the training data are introduced. To mitigate this issue, we propose a lightweight adapter module grounded in information theory, termed the Information Bottleneck Adapter (IB-Adapter), which selectively filters potential noise from visual inputs. Without requiring any extra data or augmentation strategies, IB-Adapter consistently improves over the baseline by an average of 30%, while adding fewer than 10M parameters, demonstrating notable efficiency and effectiveness. Furthermore, even with a 14x smaller backbone (0.5B parameters) and no pre-training on the Open X-Embodiment dataset, our model StableVLA achieves robustness competitive with 7B-scale state-of-the-art VLAs. With negligible parameter overhead (\u003c10M), our approach maintains accuracy on long-horizon tasks and surpasses OpenPi under real-world visual disturbances. The code will be made publicly available.", "authors": "Yiyang Fu, Chubin Zhang, Shukai Gong, Yufan Deng, Kaiwei Sun, Qiyang Min, Qibin Hou, Yansong Tang, Jianan Wang, Zhou Daquan", "icml_url": "https://icml.cc/virtual/2026/poster/63066", "is_oral": false, "is_spotlight": false, "poster_id": "63066", "presentation_type": "regular", "related_events": "", "title": "StableVLA: Towards Robust Vision-Language-Action Models without Extra Data", "sequence": 2591, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 136, "Robotics, VLA & diffusion policy": 442}, "raw_topic_score": 442, "selection_score": 442, "matched_terms": "vision-language-action, vla", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #1108", "poster_number": 1108, "poster_band": "#1000-#1999"}, {"abstract": "Achieving robust perception-reasoning synergy is a central goal for advanced Vision-Language Models (VLMs). Recent advancements have pursued this goal via architectural designs or agentic workflows. However, these approaches are often limited by static textual reasoning or complicated by the significant compute and engineering burden of external agentic complexity. Worse, this heavy investment does not yield proportional gains, often witnessing a \"seesaw effect\" on perception and reasoning. This motivates a fundamental rethinking of the true bottleneck. In this paper, we argue that the root cause of this trade-off is an ambiguity in modality credit assignment: when a VLM fails, is it due to flawed perception (\"bad seeing\") or flawed logic (\"bad thinking\")? To resolve this, we introduce a reinforcement learning framework that improves perception-reasoning synergy by reliably rewarding the perception fidelity. We explicitly decompose the generation process into interleaved perception and reasoning steps. This decoupling enables targeted supervision on perception. Crucially, we introduce Perception Verification (PV), leveraging a \"blindfolded reasoning\" proxy to reward perceptual fidelity independently of reasoning outcomes. Furthermore, to scale training across free-form VL tasks, we propose Structured Verbal Verification, which replaces high-variance LLM judging with structured algorithmic execution. These techniques are integrated into a Modality-Aware Credit Assignment (MoCA) mechanism, which routes rewards to the specific source of error -- either bad seeing or bad thinking -- enabling a single VLM to achieve simultaneous performance gains across a wide task spectrum.", "authors": "Haozhe WANG, Qixin Xu, Changpeng Wang, Taofeng Xue, Chong Peng, Wenhu Chen, Fangzhen Lin", "icml_url": "https://icml.cc/virtual/2026/poster/62726", "is_oral": true, "is_spotlight": true, "poster_id": "62726", "presentation_type": "oral", "related_events": "Oral presentation: Oral 3D Computer Vision", "title": "Bad Seeing or Bad Thinking? Rewarding Perception for Multimodal Reasoning", "sequence": 2252, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 146, "LLM adaptation & fine-tuning": 26, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 146, "selection_score": 476, "matched_terms": "llm, language model, reasoning, agent", "selection_reasons": "oral, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #1512", "poster_number": 1512, "poster_band": "#1000-#1999"}, {"abstract": "Low-Rank Adaptation (LoRA) is a widely used parameter-efficient fine-tuning technique, and previous works have studied the update dynamics of LoRA, showing that updating via the low-rank matrix $\\mathbf{A}$ can be viewed as a process within the compressed subspace defined by $\\mathbf{A}^{\\top} \\mathbf{A}$ of the gradient $\\nabla f\\left(\\mathbf{W} \\right)$. However, few works analyze how the properties of the low-rank matrices affect the performance of LoRA, since existing methods heuristically initialize the low-rank matrices as Gaussian matrices. In this paper, we provide a theoretical understanding of the update dynamics of LoRA.  We reveal that the update dynamics can be viewed as a process within the subspace projected by $\\mathbf{A}^{\\top} (\\mathbf{A} \\mathbf{A}^{\\top})^{\\dagger} \\mathbf{A}$, and prove that when the gradient $\\nabla f\\left(\\mathbf{W} \\right)$ is unavailable, if $\\mathbf{A}$ is an Equiangular Tight Frame (ETF), $\\mathbf{A}^{\\top} \\mathbf{A}$ and $\\mathbf{A}^{\\top} (\\mathbf{A} \\mathbf{A}^{\\top})^{\\dagger} \\mathbf{A}$ can preserve the maximum information from the gradient $\\nabla f\\left(\\mathbf{W} \\right)$. Thus, initializing $\\mathbf{A}$ as an ETF is the optimal solution for low-rank adaptation when the gradient $\\nabla f\\left(\\mathbf{W} \\right)$ is unavailable. Furthermore, we establish the convergence of Low-Rank Adaptation with a rate of $\\mathcal{O}\\left(\\frac{1}{T}\\right)$ when $\\mathbf{A}$ is an ETF. Extensive experiments show that initializing the low-rank matrices as ETFs significantly outperforms the commonly used Gaussian initialization for existing primary LoRA variants.", "authors": "Shu Ding, Yang Peng, Hangan Zhou, Xinyu Lu, Shangwei Chen, Junhua Huang, Mingxuan Yuan, Wei Wang", "icml_url": "https://icml.cc/virtual/2026/poster/62781", "is_oral": false, "is_spotlight": false, "poster_id": "62781", "presentation_type": "regular", "related_events": "", "title": "Towards Understanding the Dynamics of Low-Rank Adaptation", "sequence": 2307, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 614, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 614, "selection_score": 614, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #1702", "poster_number": 1702, "poster_band": "#1000-#1999"}, {"abstract": "Diffusion Large Language Models (dLLMs) break the rigid left-to-right constraint of traditional LLMs, enabling token generation in arbitrary orders. Intuitively, this flexibility implies a solution space that strictly supersets the fixed autoregressive trajectory, theoretically unlocking superior reasoning potential. Indeed, for specific constraint satisfaction tasks (e.g., sudoku puzzles), this capability has proven to be highly advantageous. However, in this paper, we reveal that for general reasoning tasks (e.g., mathematics and coding), arbitrary order generation may in fact limit the reasoning potential of dLLMs. We find that dLLMs tend to exploit this order flexibility to bypass high-uncertainty tokens that are crucial for exploration, leading to a premature collapse of solution coverage. This observation motivates a rethink of RL approaches for dLLMs, where considerable complexities, such as handling combinatorial trajectories and intractable likelihoods, are often devoted to preserving this flexibility. We demonstrate that effective reasoning can be better elicited by simply forgoing arbitrary order and applying standard Group Relative Policy Optimization (GRPO) instead. Our approach, JustGRPO , is minimalist yet surprisingly effective (e.g., 89.1% accuracy on GSM8K) while fully retaining the parallel decoding ability of dLLMs.", "authors": "Zanlin Ni, Shenzhi Wang, Yang Yue, Tianyu Yu, Weilin Zhao, Yeguo Hua, Tianyi Chen, Jun Song, YuCheng , Bo Zheng, Gao Huang", "icml_url": "https://icml.cc/virtual/2026/poster/61998", "is_oral": true, "is_spotlight": true, "poster_id": "61998", "presentation_type": "oral", "related_events": "Oral presentation: Oral 3A Diffusion Models", "title": "The Flexibility Trap: Rethinking the Value of Arbitrary Order in Diffusion Language Models", "sequence": 1525, "award": "Outstanding Paper", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 34, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 242, "LLM adaptation & fine-tuning": 186, "Robotics, VLA & diffusion policy": 48}, "raw_topic_score": 242, "selection_score": 512, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #1708", "poster_number": 1708, "poster_band": "#1000-#1999"}, {"abstract": "Diffusion large language models (dLLMs), which offer a promising alternative to traditional autoregressive LLMs, have recently shown strong results in pretraining. However, due to their lack of tractable sequence-level likelihoods, they have yet to benefit from modern LLM post-training techniques such as reinforcement learning (RL), limiting their real-world applicability. Existing attempts at dLLM post-training rely on heuristic approximations or lower bounds of the true likelihood. In this work, we propose Amortized Group Relative Policy Optimization (AGRPO), a policy gradient algorithm that leverages the multi-step Markovian nature of dLLM generation, optimizing individual denoising steps rather than entire sequences. We demonstrate AGRPO's effectiveness on different math and reasoning tasks, achieving +9.9\\% absolute gain on GSM8K, +4.6\\% on MATH-500, +59.4\\% on Countdown, and +69.7\\% on Sudoku over the base LLaDA model, improving upon comparable dLLM RL methods such as diffu-GRPO. Furthermore, we analyze how post-training gains persist across different inference configurations, revealing that models trained with AGRPO can sample 4x faster with minimal performance sacrifices.", "authors": "Anthony Zhan", "icml_url": "https://icml.cc/virtual/2026/poster/65988", "is_oral": false, "is_spotlight": false, "poster_id": "65988", "presentation_type": "regular", "related_events": "", "title": "Simple Policy Gradients for Reasoning with Diffusion Language Models", "sequence": 5511, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 132, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 482, "LLM adaptation & fine-tuning": 148, "Robotics, VLA & diffusion policy": 32}, "raw_topic_score": 482, "selection_score": 482, "matched_terms": "grpo, post-training, policy gradient, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #1715", "poster_number": 1715, "poster_band": "#1000-#1999"}, {"abstract": "Deep research agents perform multi-step research to produce long-form, well-attributed answers. However, most open deep research agents are trained on easily verifiable short-form QA tasks via reinforcement learning with verifiable rewards, which does not extend to realistic long-form tasks. We address this with Reinforcement Learning with Evolving Rubrics (RLER) , where rubrics are constructed and maintained to co-evolve with the policy model during training. This allows the rubrics to incorporate newly explored information from search and contrasting model responses, enabling better fact checking and more discriminative on-policy feedback. Using RLER, we develop Deep Research Tulu (DR Tulu-8B) , the first fully open model that is directly trained for open-ended, long-form deep research. Across four long-form deep research benchmarks in science, healthcare, and general domains, DR Tulu-8B substantially outperforms existing open deep research agents (by 15.6% over Tongyi DR on average) and matches or exceeds proprietary deep research agents (by 0.7% over OpenAI DR on average), while being significantly smaller and cheaper per query (1000x cheaper than OpenAI DR per query).", "authors": "Rulin Shao, Akari Asai, Shannon Shen, Hamish Ivison, Varsha Kishore, Jingming Zhuo, Xinran Zhao, Molly Park, Samuel Finlayson, David Sontag, Tyler Murray, Sewon Min, Pradeep Dasigi, Luca Soldaini, Faeze Brahman, Scott Yih, Sherry Wu, Luke Zettlemoyer, Yoon Kim, Hannaneh Hajishirzi, Pang Wei Koh", "icml_url": "https://icml.cc/virtual/2026/poster/65886", "is_oral": true, "is_spotlight": true, "poster_id": "65886", "presentation_type": "oral", "related_events": "Oral presentation: Oral 3B Reinforcement Learning: RLHF and Post-training", "title": "Reinforcement Learning with Evolving Rubrics for Deep Research", "sequence": 5409, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 150, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 272, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 272, "selection_score": 602, "matched_terms": "verifiable reward, agent, agents, deep research agents, on-policy", "selection_reasons": "oral, user-named / must include", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #1800", "poster_number": 1800, "poster_band": "#1000-#1999"}, {"abstract": "Multi-adapter serving systems route entire sequences to a single adapter, forcing a choice when requests span multiple domains. This assumption fails in two important settings: (1) multimodal generation, where text and image tokens require different adapters within the same sequence, and (2) mixed-capability requests like ``write code to solve this equation,'' which need expertise from multiple specialized adapters. We introduce per-token routing, which routes individual tokens to adapters based on either vocabulary structure (for multimodal models) or learned gating (for semantic specialization). Per-token routing is provably optimal, achieving work $N$ for $N$ tokens versus $K \\cdot N$ for per-sequence routing with $K$ adapter types. Our key contribution is MoLoRA (Mixture of LoRA), which enables composable specialization: load multiple domain-specific adapters and let a learned router select the appropriate adapter per-token. We demonstrate that specialization dramatically beats scale: MoLoRA enables Qwen3-1.7B to exceed Qwen3-8B across four reasoning benchmarks while being 4.7$\\times$ smaller. This enables modular expertise at inference time: train focused LoRAs independently, combine them without retraining, and add new capabilities by simply loading new adapters.", "authors": "Shrey Shah, Justin Wagle", "icml_url": "https://icml.cc/virtual/2026/poster/66486", "is_oral": false, "is_spotlight": false, "poster_id": "66486", "presentation_type": "regular", "related_events": "", "title": "MoLoRA: Composable Specialization via Per-Token Adapter Routing", "sequence": 6005, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 674, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 674, "selection_score": 674, "matched_terms": "lora, adapter, adapt", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #2007", "poster_number": 2007, "poster_band": "#2000-#2999"}, {"abstract": "Process reward models (PRMs) allow for fine-grained credit assignment in reinforcement learning (RL), and seemingly contrast with outcome reward models (ORMs), which assign a single reward to an entire trajectory. However, we provide theoretical proof in this work that the Group Relative Policy Optimization (GRPO) RL algorithm equipped with an ORM is in fact equivalent to a PRM-aware RL objective equipped with a non-trivial, Monte-Carlo-based PRM (given mild assumptions). Leveraging the framework of GRPO-as-a-PRM, we identify a flaw in the GRPO objective that interacts with imbalanced process steps and rewards to hinder both exploration and exploitation (under different conditions). We propose a simple modification to the algorithm to mitigate this defect ($\\lambda$-GRPO), and show that LLMs tuned with $\\lambda$-GRPO outperform LLMs tuned with standard GRPO on downstream reasoning tasks$\\textemdash$and reach peak performance more rapidly. These results show that we can leverage the hidden, built-in PRM structure within the vanilla GRPO algorithm to boost model performance without employing an explicit PRM, and with a negligible impact on training time and cost.", "authors": "Michael Sullivan, Alexander Koller", "icml_url": "https://icml.cc/virtual/2026/poster/61734", "is_oral": false, "is_spotlight": false, "poster_id": "61734", "presentation_type": "regular", "related_events": "", "title": "GRPO is Secretly a Process Reward Model", "sequence": 1262, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 64, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 418, "LLM adaptation & fine-tuning": 66, "Robotics, VLA & diffusion policy": 16}, "raw_topic_score": 418, "selection_score": 418, "matched_terms": "grpo, reward model, llm, reasoning", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #2211", "poster_number": 2211, "poster_band": "#2000-#2999"}, {"abstract": "Low-rank adaptation (LoRA) enables parameter-efficient specialization of foundation models, but the proliferation of task-specific adapters fragments capabilities across many adapters, complicating reuse and deployment. We study the problem of merging $T$ LoRAs into **a single rank-$r$ LoRA**, thereby preserving the benefits of low-rank structure. Existing Merge-then-Compress pipelines treat the rank constraint as an afterthought: they merge adapters in the full parameter space, then compress the merged result to rank $r$ via truncated SVD. However, full-parameter merging may destroy the low-rank structure, making it difficult for subsequent compression to recover an effective rank-$r$ LoRA. We propose Compress-then-Merge (CtM), a reversed paradigm that enforces the rank-$r$ bottleneck _before_ merging: CtM computes shared $r$-dimensional subspaces using only the LoRA weights to capture cross-adapter common structure, projects each adapter into the shared subspaces to obtain $r\\times r$ coordinates, and then applies standard merging rules in this reduced space. CtM guarantees a rank-$r$ LoRA by construction, avoiding post-hoc truncation, and enables efficient computation in the core space spanned by concatenated LoRA factors. Experiments on ViT-B/32 and LLaMA3-8B demonstrate consistent improvements over single-LoRA-output baselines, while remaining competitive with (and in some cases surpassing) full-parameter merging methods.", "authors": "Zhengbao He, Ruiqi Ding, Zhehao Huang, Ruikai Yang, Tao Li, Xiaolin Huang", "icml_url": "https://icml.cc/virtual/2026/poster/61546", "is_oral": false, "is_spotlight": false, "poster_id": "61546", "presentation_type": "regular", "related_events": "", "title": "Compress then Merge: From Multiple LoRAs into One Low-Rank Adapter", "sequence": 1074, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 790, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 790, "selection_score": 790, "matched_terms": "parameter-efficient, lora, low-rank adaptation, adapter, adapt", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #2304", "poster_number": 2304, "poster_band": "#2000-#2999"}, {"abstract": "Diffusion models generate highly realistic images but often struggle with precise text–image alignment. While recent post-training methods improve alignment using external rewards or human preference signals, their performance heavily depends on reward quality and does not directly address alignment within the diffusion process itself. Recent reward-free approaches such as SoftREPA demonstrate that optimizing soft text tokens via contrastive learning can effectively improve text-image representation alignment, outperforming standard parameter-efficient fine-tuning baselines. However, the contrastive formulation can excessively penalize negative pairs, which manifests as characteristic failure cases such as over-counting and repetition. To address this issue, we propose a lightweight, reward-free post-training method that refines soft tokens by integrating contrastive alignment guidance directly into the score-matching objective of diffusion models. By assigning alignment directions at the score level, our approach mitigates these limitations and yields more coherent and semantically faithful generations. Experiments show that our method matches SoftREPA while substantially improving its failure cases, achieving over 35\\% improvement in counting accuracy on the GenEval benchmark. Our method is seamlessly applicable to existing diffusion backbones (SD1.5, SDXL, and SD3), and is complementary to existing RL-based diffusion post-training methods.", "authors": "Jaa-Yeon Lee, Yeobin Hong, Taesung Kwon, Jong Chul YE", "icml_url": "https://icml.cc/virtual/2026/poster/60920", "is_oral": false, "is_spotlight": true, "poster_id": "60920", "presentation_type": "spotlight", "related_events": "", "title": "Alignment-Guided Score Matching for Text-to-Image Alignment in Diffusion Models", "sequence": 448, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 348, "LLM adaptation & fine-tuning": 76, "Robotics, VLA & diffusion policy": 64}, "raw_topic_score": 348, "selection_score": 393, "matched_terms": "post-training, alignment", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #2610", "poster_number": 2610, "poster_band": "#2000-#2999"}, {"abstract": "Low-Rank Adaptation (LoRA) is the most widely adopted method for fine-tuning large language models. Notably, LoRA is inherently overparameterized: multiple pairs of low-rank factors can yield the same adapted weight matrix. We show—both theoretically and empirically—that these pairs exhibit significantly different condition numbers. As a result, converging to different loss minimizers directly impacts the convergence rate of LoRA. Building on this observation, we introduce Balanced Low-Rank Adaptation (BaLoRA), a variant of LoRA that projects iterates onto a balanced manifold. This manifold improves the conditioning of the loss landscape while preserving the adapted matrix. The projection step is computationally lightweight and integrates seamlessly into existing fine-tuning pipelines. Empirically, BaLoRA converges faster than standard LoRA and achieves superior performance across a range of fine-tuning tasks.", "authors": "Valérie Castin, Kimia Nadjahi, Pierre Ablin, Gabriel Peyré", "icml_url": "https://icml.cc/virtual/2026/poster/62055", "is_oral": false, "is_spotlight": false, "poster_id": "62055", "presentation_type": "regular", "related_events": "", "title": "Balanced LoRA: Removing Parameter Invariance to Accelerate Convergence", "sequence": 1582, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 30, "LLM adaptation & fine-tuning": 642, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 642, "selection_score": 642, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapt, large language model, language model", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #2705", "poster_number": 2705, "poster_band": "#2000-#2999"}, {"abstract": "Cooperative multi-agent reinforcement learning (CMARL) policies are vulnerable to action hijacking even when only a few timesteps are compromised. Recent adversarial attacks and adversarial training methods have been explored, but under an explicit attack budget, existing attacks often fail to accurately expose critical coordination weaknesses and incur substantial training cost. We propose Budgeted Hierarchical Efficient Attack (BHEA), a budgeted hierarchical adversarial attack that separates decisions on when and which agents to hijack from action replacement, enabling more precise vulnerability discovery under limited attack opportunities. We further show that training cooperative policies against BHEA substantially improves robustness to limited-step action hijacking while reducing training overhead. Experiments on the StarCraft Multi-Agent Challenge (SMAC) demonstrate stronger attacks under the same attack budget and improved robustness. Code is available at https://anonymous.4open.science/r/BHEA-068D.", "authors": "junyong jiang, Xin Yuan, Longhe Lin, Songze Li, Lu Dong", "icml_url": "https://icml.cc/virtual/2026/poster/62076", "is_oral": false, "is_spotlight": false, "poster_id": "62076", "presentation_type": "regular", "related_events": "", "title": "Budget-Efficient Attacks and Robustness Training for Cooperative MARL", "sequence": 1603, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 536, "LLM post-training, RLHF & agents": 84, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 536, "selection_score": 536, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, coordination, cooperative", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #2808", "poster_number": 2808, "poster_band": "#2000-#2999"}, {"abstract": "Reinforcement learning from human feedback is the leading approach to aligning powerful AI systems so that they can be safe and helpful for humanity. While RLHF is typically modelled as a problem of learning a single preference ranking from noisy feedback, true human preferences are complex and often conflicting, representing substantive disagreements stemming from the diversity of individual human values. With this motivation, a recent line of research has studied RLHF from the perspective of social choice theory, which provides a set of well-established desirable properties for aggregating diverse preferences. Seen through this lens, the standard learning objective in RLHF is equivalent to aggregating diverse human preferences via the Borda count rule. At the same time, several new RLHF algorithms have been proposed, which turn out to be equivalent to the von Neumann winner social choice rule. However, the connection between social choice theory and RLHF has thus far ignored the critical role of regularization to prevent divergence from a reference policy, which is utilized in essentially all practical RLHF algorithms. In this paper, we study how regularization affects the social choice axioms satisfied by different RLHF algorithms, and prove that regularization improves the axiomatic properties of the von Neumann winner rule. In contrast, the Borda count rule still fails to satisfy key social choice axioms even when regularized. These results provide a principled argument grounded in social choice theory for utilizing practical RLHF algorithms that correspond to the von Neumann winner, rather than the standard RLHF objective.", "authors": "Ezgi Korkmaz", "icml_url": "https://icml.cc/virtual/2026/poster/65803", "is_oral": false, "is_spotlight": true, "poster_id": "65803", "presentation_type": "spotlight", "related_events": "", "title": "Regularization in the Axiomatic Approach to Learning from Human Preferences", "sequence": 5326, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 378, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 378, "selection_score": 423, "matched_terms": "rlhf", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #3213", "poster_number": 3213, "poster_band": "#3000-#3999"}, {"abstract": "Large Language Models usually put more emphasis on accuracy and therefore, will guess even when not certain about the prediction, which is especially severe when fine-tuned on small datasets due to the inherent tendency toward miscalibration. In this work, we introduce Bayesian-LoRA, which reformulates the deterministic LoRA update as a probabilistic low-rank representation inspired by Sparse Gaussian Processes. We identify a structural isomorphism (in the functional sense of shared bilinear form, not strict algebraic equivalence) between LoRA's factorization and Kronecker-factored SGP posteriors, and show that LoRA emerges as a limiting case when posterior uncertainty collapses. We conduct extensive experiments on various LLM architectures across commonsense reasoning benchmarks. With only approximately 0.42M additional parameters and ${\\approx}1.2{\\times}$ training cost relative to standard LoRA, Bayesian-LoRA significantly improves calibration across models up to 30B, achieving up to 84\\% ECE reduction and 76\\% NLL reduction while maintaining competitive accuracy for both in-distribution and out-of-distribution (OoD) evaluations.", "authors": "Moule Lin, Shuhao Guan, Andrea Patane, David Gregg, Goetz Botterweck", "icml_url": "https://icml.cc/virtual/2026/poster/60552", "is_oral": false, "is_spotlight": false, "poster_id": "60552", "presentation_type": "regular", "related_events": "", "title": "Bayesian-LoRA: Probabilistic Low-Rank Adaptation of Large Language Models", "sequence": 81, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 144, "LLM adaptation & fine-tuning": 642, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 642, "selection_score": 642, "matched_terms": "lora, low-rank adaptation, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #3603", "poster_number": 3603, "poster_band": "#3000-#3999"}, {"abstract": "Principled uncertainty quantification (UQ) is increasingly recognized as essential for trustworthy artificial general intelligence (AGI). Bayesian Low-Rank Adaptation (LoRA) provides a principled mechanism for uncertainty-aware fine-tuning of large language models (LLMs). However, existing techniques either face scalability constraints, e.g. Laplace-LoRA, or rely on approximate inference schemes that lead to poorly calibrated posterior uncertainty, often manifesting as overconfident predictions under distribution shift. To address this challenge, we propose GPan-LoRA, the first scalable Gaussian Process (GP)-based framework for Bayesian LoRA, which integrates neural network-based sparse GP approximations with amortized variational inference. By preserving the Bayesian function prior and posterior semantics intrinsic to GPs, GPan-LoRA achieves a faithful balance between computational scalability and principled UQ. Empirically, GPan-LoRA produces well-calibrated uncertainty that remains reliable under distribution shift, mitigating overconfident failures while preserving competitive task performance.", "authors": "Weifeng Zhang, Wenyuan Zhao, Amir Hossein Rahmati, Yucheng Wang, Zhiyuan Wang, Chao Tian, Xiaoning Qian", "icml_url": "https://icml.cc/virtual/2026/poster/65740", "is_oral": false, "is_spotlight": false, "poster_id": "65740", "presentation_type": "regular", "related_events": "", "title": "GPan-LoRA: Gaussian Process Amortized Networks for Bayesian Low-Rank Adaptation in Large Language Models", "sequence": 5263, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 32, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 134, "LLM adaptation & fine-tuning": 734, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 734, "selection_score": 734, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #3609", "poster_number": 3609, "poster_band": "#3000-#3999"}, {"abstract": "Counterfactual reasoning is one of the fundamental facets of human cognition, involved in various tasks such as explanation, credit assignment, blame, and responsibility. It describes the queries what would have happened had some intervention been performed given that something else, corresponding to Layer 3 of the Pearl Causal Hierarchy. In this project, we examine a specific type of counterfactual quantities, called counterfactual direct (Str-DE), indirect (Str-IE), and spurious (Str-SE) effects for quantifying fairness in a sequential decision-making framework. Building on these measures, we formulate an online causally-fair learning problem with multiple long-term constraints and study it in both non-parametric contextual bandits and parametric logistic bandits settings. We achieve sublinear regret and violations bounds for both bandits settings with round-wise counterfactual fairness constraints (that are a priori unknown) without Slater’s condition. In particular, for logistic bandits, we obtain nearly optimal regret bound with leading term similar to that for unconstrained case (Zhang et al., 2025).", "authors": "Jiajun Chen, Jin Tian, Chris Quinn", "icml_url": "https://icml.cc/virtual/2026/poster/62056", "is_oral": true, "is_spotlight": true, "poster_id": "62056", "presentation_type": "oral", "related_events": "Oral presentation: Oral 3G Theory", "title": "Towards Fair Sequential Decision-Making: A Causal Decomposition Approach", "sequence": 1583, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 284, "RL & control": 16, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 106, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 284, "selection_score": 374, "matched_terms": "bandit, bandits, contextual bandit, regret", "selection_reasons": "oral", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #4207", "poster_number": 4207, "poster_band": "#4000-#4999"}, {"abstract": "We study a variant of the stochastic multi-armed bandit problem in which the learner aims to identify and play an arbitrary arm whose mean reward exceeds a known satisficing threshold $S$, rather than optimizing against the best arm. Prior work has shown that when such a satisficing arm exists, time-independent bounds on the satisficing regret are achievable, but these guarantees deteriorate when an arm lies close to the threshold. We focus on instances in which the excess gap $\\Delta_*$ (gap between the best arm and the threshold) is small relative to the suboptimality gaps $\\Delta_i$, a regime that exposes this limitation. To capture this challenge, we introduce a refined notion of regret and propose a new algorithm, uncertain-UCB, which achieves *satisficing* pseudo-regret of $ O \\left(\\sum_{i: \\Delta_i > \\Delta_*} \\frac{\\log(K/\\Delta_*)}{\\Delta_i}\\right), $ while recovering standard pseudo-regret bounds when no arm exceeds the threshold.   Further, we establish a near-matching lower bound in the small excess-gap regime, showing that any algorithm incurs at least $ \\Omega \\left(\\sum_{i: \\Delta_i > \\Delta_*} \\frac{\\log \\left(\\left(\\sum_{i:\\Delta_i > \\Delta_*} \\Delta_*/\\Delta_i\\right)^{-1}\\right)}{\\Delta_i}\\right) $ satisficing pseudo-regret.", "authors": "Chloé Rouyer, Ronald Ortner, Peter Auer", "icml_url": "https://icml.cc/virtual/2026/poster/64316", "is_oral": false, "is_spotlight": false, "poster_id": "64316", "presentation_type": "regular", "related_events": "", "title": "Understanding the Gaps in Satisficing Bandits", "sequence": 3841, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 280, "RL & control": 40, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 280, "selection_score": 280, "matched_terms": "bandit, bandits, best arm, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #4208", "poster_number": 4208, "poster_band": "#4000-#4999"}, {"abstract": "We propose Bayesian Forest Thompson Sampling (BFTS), which performs Thompson sampling using arm-wise Bayesian Additive Regression Trees (BART) to model each action's mean reward and generate MCMC-based posterior draws for decision-making. We derive an information-theoretic Bayesian regret bound of order $\\widetilde{\\mathcal O}(K\\sigma\\sqrt{T})$ for ideal posterior sampling under a correctly specified Bayesian design. Empirically, BFTS achieves competitive regret on nonlinear synthetic benchmarks with near-nominal uncertainty calibration, attains the best average rank across nine OpenML contextual bandit benchmarks, and yields higher estimated policy values than linear, neural, and tree-ensemble baselines in a Drink Less micro-randomized trial case study. Across OpenML benchmarks, BFTS is robust to hyperparameter choices.", "authors": "Ruizhe Deng, Bibhas Chakraborty, Ran Chen, Yan Shuo Tan", "icml_url": "https://icml.cc/virtual/2026/poster/63217", "is_oral": false, "is_spotlight": true, "poster_id": "63217", "presentation_type": "spotlight", "related_events": "", "title": "BFTS: Thompson Sampling with Bayesian Additive Regression Trees", "sequence": 2742, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 228, "RL & control": 40, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 24, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 228, "selection_score": 273, "matched_terms": "bandit, contextual bandit, thompson sampling, regret", "selection_reasons": "spotlight", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #4300", "poster_number": 4300, "poster_band": "#4000-#4999"}, {"abstract": "We study the stochastic linear bandits with parameter noise model, in which the reward of action $a$ is $a^\\top \\theta$ where $\\theta$ is sampled i.i.d. We show a regret upper bound of $\\widetilde{O} (\\sqrt{d T \\log(K/\\delta) \\sigma^2_{\\max}})$ for a horizon $T$, general action set of size $K$ of dimension $d$, and where $\\sigma^2_{\\max}$ is the maximal variance of the reward for any action.  We further provide a lower bound of $\\widetilde{\\Omega} (d \\sqrt{T \\sigma_{\\max}^2})$ which is tight (up to logarithmic factors) whenever $\\log K \\approx d$. For more specific action sets, $\\ell_p$ unit balls with $p \\leq 2$ and dual norm $q$, we show that the minimax regret is $\\widetilde{\\Theta} (\\sqrt{dT \\sigma_q^2})$, where $\\sigma_q^2$ is a variance-dependent quantity that is always at most $4$. This is in contrast to the minimax regret attainable for such sets in the classic additive noise model where the regret is of order $d \\sqrt{T}$. Surprisingly, we show that this optimal (up to logarithmic factors) regret bound is attainable using a very simple explore-exploit algorithm.", "authors": "Daniel Ezer, Alon Peled-Cohen, Yishay Mansour", "icml_url": "https://icml.cc/virtual/2026/poster/64708", "is_oral": false, "is_spotlight": false, "poster_id": "64708", "presentation_type": "regular", "related_events": "", "title": "Stochastic Linear Bandits with Parameter Noise", "sequence": 4232, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 440, "RL & control": 40, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 440, "selection_score": 440, "matched_terms": "bandit, bandits, linear bandit, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #4510", "poster_number": 4510, "poster_band": "#4000-#4999"}, {"abstract": "We study optimal experimental design for multinomial logit (MNL) bandits, where an agent repeatedly selects a subset of $K$ items from a ground set of size $N$ and observes single-choice feedback. Unlike linear or generalized linear bandits, MNL bandits have a combinatorial action space, which makes classical optimal design approaches and naive optimization over all subsets computationally intractable. We propose a computationally efficient optimal design framework for MNL models that achieves both statistical efficiency and scalability through two complementary approaches: (i) an exact or certified-approximate reformulation of the design oracle as a $0$-$1$ mixed-integer linear program (MILP) with solver-certified early stopping, and (ii) a fully polynomial-time lifted design that replaces the nonlinear objective with a tractable surrogate. Using the Kiefer-Wolfowitz equivalence theorem, we establish near G-optimality guarantees and characterize the induced statistical-computational trade-offs. As an application, we develop a best assortment identification algorithm for MNL bandits with linear utilities and non-uniform revenues, and prove an instance-dependent sample complexity of $\\tilde{\\mathcal{O}}\\big(\\frac{d \\log N}{\\Delta^2}\\big)$, where $d$ is the feature dimension, $N$ is the number of arms, and $\\Delta$ is the minimum revenue gap.", "authors": "Joongkyu Lee, Min-hwan Oh", "icml_url": "https://icml.cc/virtual/2026/poster/65220", "is_oral": false, "is_spotlight": false, "poster_id": "65220", "presentation_type": "regular", "related_events": "", "title": "Optimal Design for Multinomial Logit Model with Applications to Best Assortment Identification", "sequence": 4744, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 294, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 294, "selection_score": 294, "matched_terms": "bandit, bandits, linear bandit, generalized linear", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #4511", "poster_number": 4511, "poster_band": "#4000-#4999"}, {"abstract": "We introduce a practical, black-box framework termed Detection Augmented Learning (DAL) for the problem of piecewise stationary bandits without knowledge of the underlying non-stationarity. DAL accepts any stationary bandit algorithm with order-optimal regret as input and augments it with a change detector, enabling applicability to all common bandit variants. Extensive experimentation demonstrates that DAL consistently surpasses all state-of-the-art methods across diverse non-stationary scenarios, including synthetic benchmarks and real-world datasets, underscoring its versatility and scalability. We provide theoretical insights into DAL's strong empirical performance, complemented by thorough empirical validation.", "authors": "Argyrios Gerogiannis, Yu-Han Huang, Subhonmesh Bose, Venugopal Veeravalli", "icml_url": "https://icml.cc/virtual/2026/poster/62681", "is_oral": false, "is_spotlight": false, "poster_id": "62681", "presentation_type": "regular", "related_events": "", "title": "DAL: A Practical Prior-Free Black-Box Framework for Piecewise Stationary Bandits", "sequence": 2207, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 440, "RL & control": 8, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 440, "selection_score": 440, "matched_terms": "non-stationary, piecewise stationary, bandit, bandits, regret", "selection_reasons": "", "icml_time": "Tue, Jul 7, 2026 • 10:30 PM – 12:15 AM PDT", "kst_start": "Wed, Jul 8, 2026 14:30 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-07T22:30:00-07:00", "location": "HALL A #4514", "poster_number": 4514, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-08T01:00:00-07:00", "label": "Wed, Jul 8, 2026 17:00 KST", "icmlTime": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "count": 40, "rows": [{"abstract": "State-of-the-art model-based Reinforcement Learning (RL) approaches either use gradient-free, population-based methods for planning, learned policy networks, or a combination of policy networks and planning. Hybrid approaches that combine Model Predictive Control (MPC) with a learned model and a policy prior to leverage the advantages of both paradigms have shown promising results. However, these approaches typically rely on gradient-free optimization methods, which can be computationally expensive for high-dimensional control tasks. While gradient-based methods are a promising alternative, recent works have empirically shown that gradient-based methods often perform worse than their gradient-free counterparts. We propose Dream-MPC, a novel approach that generates few candidate trajectories from a rolled-out policy and optimizes each trajectory by gradient ascent using a learned world model, uncertainty regularization and amortization of optimization iterations over time by reusing previously optimized actions. Our results on 24 continuous control tasks show that Dream-MPC can significantly improve the performance of the underlying policy and can outperform gradient-free MPC and state-of-the-art baselines. We will open source our code and more at https://dream-mpc.github.io.", "authors": "Jonathan Spieler, Sven Behnke", "icml_url": "https://icml.cc/virtual/2026/poster/63244", "is_oral": false, "is_spotlight": false, "poster_id": "63244", "presentation_type": "regular", "related_events": "", "title": "Dream-MPC: Gradient-Based Model Predictive Control with Latent Imagination", "sequence": 2769, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 164, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 110}, "raw_topic_score": 164, "selection_score": 164, "matched_terms": "reinforcement learning, continuous control, control, planning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #111", "poster_number": 111, "poster_band": "#0000-#0999"}, {"abstract": "Due to limited resources and public safety concerns, deep reinforcement learning (RL) agents for many cyber-physical systems (e.g., autonomous vehicles) are first trained in simulators. However, when deployed in real world environments, they often suffer from performance degradation or safety violations because of the inevitable \\textit{Sim2Real} gap. Existing zero-shot approaches, such as robust safe RL and domain randomization, mitigate this issue but typically at the cost of degraded performance or residual safety risks when experiencing unmodeled system dynamics. To address these limitations, we propose a novel reinforcement learning framework that enables safe and efficient policy transfer via probabilistic latent embeddings and dynamic policy adaptation. We consider a family of Constrained Markov Decision Processes (CMDPs) under different environment contexts. By leveraging probabilistic latent context adaptation in meta-RL, the proposed framework infers the latent representation of the environment from simulated experiences. Furthermore, it incorporates a distributional RL formulation, which allows risk levels of the deployed policy to be adjusted dynamically at inference time, based on the estimation accuracy of the latent context variable. This strategy promotes safety at the early deployment stage and improves efficiency through fast policy adaptation under the Sim2Real gap.", "authors": "Gengyue Han, Yiheng Feng", "icml_url": "https://icml.cc/virtual/2026/poster/60802", "is_oral": false, "is_spotlight": false, "poster_id": "60802", "presentation_type": "regular", "related_events": "", "title": "Transferable Reinforcement Learning via Probabilistic Latent Embeddings and Dynamic Policy Adaptation for Sim-to-Real Deployment", "sequence": 331, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 258, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 48, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 258, "selection_score": 258, "matched_terms": "reinforcement learning, markov decision, mdp, safe rl, cmdp", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #113", "poster_number": 113, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning with massively parallel simulations has become an emerging trend; however, most existing approaches still rely on simple Gaussian policy parameterizations. Diffusion models provide a more expressive policy class and have shown strong performance on challenging control problems, yet most diffusion-based RL methods are designed for offline or off-policy training. In this work, we ask whether diffusion policies can be trained effectively in the massively parallel, on-policy regime. To this end, we introduce Trust-region Diffusion Policies (TruDi), which enables diffusion policies for on-policy RL with massively parallel simulations. This setting is particularly challenging because the data distribution changes quickly across updates, making stable training with complex policies difficult. TruDi addresses this by integrating a trust-region optimization rule to enforce a KL-divergence constraint over the entire diffusion trajectory, rather than only at the final denoising step. Empirically, we evaluate TruDi on a diverse set of 4 massively parallel RL benchmarks comprising a total of 73 tasks. Across these tasks, TruDi consistently outperforms or is on-par with strong baselines on standard tasks and achieves clear gains on more challenging humanoid control tasks, establishing a strong new baseline for massively parallel on-policy RL.", "authors": "Huy Le, Onur Celik, Denis Blessing, Tai Hoang, Claas Voelcker, Axel Brunnbauer, Felix Richter, Michael Volpp, Gerhard Neumann", "icml_url": "https://icml.cc/virtual/2026/poster/61866", "is_oral": false, "is_spotlight": false, "poster_id": "61866", "presentation_type": "regular", "related_events": "", "title": "Trust-Region Diffusion Policies for Massively Parallel On-Policy RL", "sequence": 1393, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 58, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 168, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 448}, "raw_topic_score": 448, "selection_score": 688, "matched_terms": "diffusion policies, trajectory, control, diffusion", "selection_reasons": "user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #123", "poster_number": 123, "poster_band": "#0000-#0999"}, {"abstract": "Low-Rank Adaptation (LoRA) is a standard tool for parameter-efficient finetuning of large models. While it induces a small memory footprint, its training dynamics can be surprisingly complex as they depend on several hyperparameters such as initialization, adapter rank, and learning rate. In particular, it is unclear *how the optimal learning rate scales with adapter rank*, which forces practitioners to re-tune the learning rate whenever the rank is changed. In this paper, we introduce *Maximal-Update Adaptation* ($\\mu$A), a theoretical framework that characterizes how the \"optimal\" learning rate should scale with model width and adapter rank to produce stable, non-vanishing feature updates under standard configurations. Our analysis leverages techniques from hyperparameter transfer and reveals that the optimal learning rate exhibits different scaling patterns depending on initialization and LoRA scaling factor. Specifically, we identify two regimes: one where the optimal learning rate remains roughly invariant across ranks, and another where it scales inversely with rank. We further identify a configuration that allows learning rate transfer from LoRA to full finetuning, drastically reducing the cost of learning rate tuning for full finetuning. Experiments across language, vision, vision–language, image generation, and reinforcement-learning tasks validate our scaling rules and show that learning rates tuned on LoRA transfer reliably to full finetuning.", "authors": "Nan Chen, Soledad Villar, Soufiane Hayou", "icml_url": "https://icml.cc/virtual/2026/poster/60938", "is_oral": false, "is_spotlight": false, "poster_id": "60938", "presentation_type": "regular", "related_events": "", "title": "Learning Rate Scaling across LoRA Ranks and Transfer to Full Finetuning", "sequence": 466, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 714, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 714, "selection_score": 714, "matched_terms": "finetuning, parameter-efficient, lora, low-rank adaptation, adapter, adapt", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #204", "poster_number": 204, "poster_band": "#0000-#0999"}, {"abstract": "In offline Reinforcement Learning, immediate rewards in logged batch data are often unobserved due to sparse or irregular record-keeping, or censored beyond certain reward values. This issue frequently arises in practical settings, including health care and marketing. We investigate off-policy evaluation (OPE) in finite-horizon Markov decision processes  when rewards are missing not at random (MNAR), which breaks ignorability and induces  selection bias even after conditioning on states and actions. To address this,  we formalize a reward-dependent propensity model and use future states as shadow  variables to identify the full-data conditional mea
