8, "selection_score": 648, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Value factorization eases non-stationarity in MARL, but its static coordination assumptions hinder generalization on long-horizon tasks with shifting dependencies. Prior VQ-VAE methods abstract trajectories yet miss time-varying inter-agent dependencies. We present TACTIC, a CTDE framework with three advances: (i) hierarchical goal decomposition to guide exploration under sparse rewards; (ii) dynamic sparse coordination graphs that adapt dependencies via variance-based TD-error pruning; and (iii) a semantic-conditioned VQ-VAE that discretizes trajectories into coordination classes and maps them to graph-level edge decisions, while also conditioning local policies. A pretrained, frozen goal predictor decouples task recognition from control, preventing gradient interference across coordination abstractions. On SMAC and SUMO, TACTIC delivers state-of-the-art coordination and transfer under sparse rewards and dynamic task structures.", "authors": "Kexing Peng, Pengyi Li, tinghuai ma, Jianye Hao", "icml_url": "https://icml.cc/virtual/2026/poster/66706", "is_oral": false, "is_spotlight": false, "poster_id": "66706", "presentation_type": "regular", "related_events": "", "title": "TACTIC: Task-Aware Sparse Coordination Graphs for Multi-Task Multi-agent Reinforcement Learning", "sequence": 6224, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 116, "Multi-agent RL, games & coordination": 634, "LLM post-training, RLHF & agents": 172, "LLM adaptation & fine-tuning": 46, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 634, "selection_score": 634, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, coordination", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Vision-Language-Action (VLA) models provide a versatile foundation for general robotic manipulation, yet they exhibit significant brittleness when confronted with novel task distributions. While In-Context Imitation Learning (ICIL) offers a training-free alternative, existing frameworks suffer from an adaptation bottleneck that hinders the effective translation of expert context to actions. This failure originates from superficial retrieval mechanisms and an entrenched behavioral inertia that anchors the policy to its pre-trained priors. To address these limitations, we present RA-VLA, a retrieval-augmented VLA framework that unifies behavior-aligned context retrieval with a grounded execution pipeline. By enforcing strict adherence to functional cues within a scalable architecture, our framework facilitates seamless task adaptation while preserving inference efficiency. Evaluations across the LIBERO benchmark and a real-world UR5e environment demonstrate that RA-VLA achieves superior success rates and computational efficiency, providing a robust framework for training-free robotic adaptation.", "authors": "Sanghwan Jang, Minjin Jeon, Minsoo Kim, Seong Jin Choi, Dongha Kim, Hwanjo Yu", "icml_url": "https://icml.cc/virtual/2026/poster/60980", "is_oral": false, "is_spotlight": false, "poster_id": "60980", "presentation_type": "regular", "related_events": "", "title": "RA-VLA: Retrieval-Augmented VLA for Test-Time Adaptation", "sequence": 508, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 174, "Robotics, VLA & diffusion policy": 604}, "raw_topic_score": 604, "selection_score": 604, "matched_terms": "vision-language-action, vla, robot, robotic, manipulation, imitation learning", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Federated Learning (FL) with Low-Rank Adaptation (LoRA) has become a standard for privacy-preserving LLM fine-tuning. However, existing personalized methods predominantly operated under a restrictive Flat-Model Assumption: they addressed client-side statistical heterogeneity but treated the model as a monolithic block, ignoring the functional heterogeneity across LLM layers. We argue that these two statistical (horizontal) and functional (vertical) dimensions, are orthogonal in source yet coupled in interaction , implying that the optimal depth of parameter sharing is functionally dependent on client similarity. To address this, we propose FedTreeLoRA , a framework employing tree-structured aggregation for fine-grained, layer-wise alignment. By dynamically constructing an aggregation hierarchy, FedTreeLoRA allows clients to share broad consensus on shallow ’trunks‘ while progressively specializing on deep ‘branches'. Experiments on NLU and NLG benchmarks demonstrate that FedTreeLoRA significantly outperforms state-of-the-art methods by effectively reconciling generalization and personalization.", "authors": "Jieming Bian, Lei Wang, Letian Zhang, Jie Xu", "icml_url": "https://icml.cc/virtual/2026/poster/62499", "is_oral": false, "is_spotlight": false, "poster_id": "62499", "presentation_type": "regular", "related_events": "", "title": "FedTreeLoRA: Reconciling Statistical and Functional Heterogeneity in Federated LoRA Fine-Tuning", "sequence": 2026, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 48, "LLM adaptation & fine-tuning": 602, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 602, "selection_score": 602, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapt, llm", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "In this paper, we study cooperative multi-agent reinforcement learning (MARL) where  the joint reward exhibits submodularity, which is a natural property capturing  diminishing marginal returns when adding agents to a team. Unlike standard  MARL with additive rewards, submodular rewards model realistic scenarios  where agent contributions overlap (e.g., multi-drone surveillance,  collaborative exploration). We provide the first formal framework for this  setting and develop algorithms with provable guarantees on sample efficiency and regret bound. For known dynamics,  our greedy policy optimization achieves a $1/2$-approximation with polynomial  complexity in the number of agents $K$, overcoming the exponential curse of  dimensionality inherent in joint policy optimization. For unknown dynamics,  we propose a UCB-based learning algorithm achieving a $1/2$-regret of $O(H^2KS\\sqrt{AT})$ over  $T$ episodes.", "authors": "Wenjing Chen, Chengyuan Qian, Shuo Xing, Yi Zhou, Victoria Crawford", "icml_url": "https://icml.cc/virtual/2026/poster/61139", "is_oral": false, "is_spotlight": false, "poster_id": "61139", "presentation_type": "regular", "related_events": "", "title": "Multi-Agent Reinforcement Learning with Submodular Reward", "sequence": 667, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 192, "Multi-agent RL, games & coordination": 588, "LLM post-training, RLHF & agents": 266, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 588, "selection_score": 588, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, cooperative", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "We revisit the finite-armed linear bandit model by Nelson et al. [2022], where contexts and rewards are governed by a finite hidden Markov chain. Nelson et al. [2022] approach this model by a reduction to linear bandits, but relies on a simplification in which rewards are linear functions of the posterior probabilities over the hidden states given the observed contexts, rather than functions of the hidden states themselves, and assumes knowledge of the HMM parameters. We instead study the more natural model incorporating direct dependencies in the hidden states (on top of dependencies on the observed contexts, as is natural for contextual bandits) and also target stronger, high-probability, regret bounds for a fully adaptive strategy that estimates HMM parameters online.", "authors": "Zhen Li, Gilles Stoltz", "icml_url": "https://icml.cc/virtual/2026/poster/66064", "is_oral": false, "is_spotlight": false, "poster_id": "66064", "presentation_type": "regular", "related_events": "", "title": "A Direct Approach for Handling Contextual Bandits with Latent State Dynamics", "sequence": 5587, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 580, "RL & control": 8, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 580, "selection_score": 580, "matched_terms": "bandit, bandits, contextual bandit, linear bandit, regret", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Alignment of large language models (LLMs) with human values has recently garnered significant attention, with prominent examples including the canonical yet costly Reinforcement Learning from Human Feedback (RLHF) and the simple Direct Preference Optimization (DPO). In this work, we demonstrate that both RLHF and DPO can be interpreted from the perspective of mutual information (MI) maximization, uncovering a profound connection to contrastive learning. Within this framework, both RLHF and DPO can be interpreted as methods that performing contrastive learning based on the positive and negative samples derived from base model, leveraging the Donsker–Varadhan (DV) lower bound on MI (equivalently, the MINE estimator). Such paradigm further illuminates why RLHF may not intrinsically incentivize reasoning capacities in LLMs beyond what is already present in the base model. Building on the perspective, we replace the DV/MINE bound with the Jensen–Shannon (JS) MI estimator and propose the Mutual Information Optimization (MIO). Comprehensive theoretical analysis and extensive empirical evaluations demonstrate that MIO mitigates the late-stage decline in chosen-likelihood observed in DPO, achieving competitive or superior performance across various challenging reasoning and mathematical benchmarks", "authors": "Xufei Lv, Kehai Chen, Haoyuan Sun, Xuefeng Bai, Min zhang, Houde Liu", "icml_url": "https://icml.cc/virtual/2026/poster/64549", "is_oral": false, "is_spotlight": false, "poster_id": "64549", "presentation_type": "regular", "related_events": "", "title": "The Secret Engine Behind RLHF: It's Contarstive Learning All Along", "sequence": 4073, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 514, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 514, "selection_score": 514, "matched_terms": "rlhf, preference optimization, dpo, alignment, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Video generation models offer a promising imagination mechanism for robot manipulation by predicting long-horizon future observations, but effectively exploiting these imagined futures for action execution remains challenging. Existing approaches either condition policies on predicted frames or directly decode generated videos into actions, both suffering from a mismatch between visual realism and control relevance. As a result, predicted observations emphasize perceptual fidelity rather than action-centric causes of state transitions, leading to indirect and unstable control. To address this gap, we propose MoLA (Mixture of Latent Actions), a control-oriented interface that transforms imagined future videos into executable representations. Instead of passing predicted frames directly to the policy, MoLA leverages multiple pretrained inverse dynamics models to infer a mixture of latent actions implied by generated visual transitions. These modality-aware inverse dynamics models capture complementary semantic, depth, and flow cues, providing a structured and physically grounded action representation that bridges video imagination and policy execution. We evaluate our approach on simulated benchmarks (LIBERO, CALVIN, and LIBERO-Plus) and real-world robot manipulation tasks, achieving consistent gains in task success, temporal consistency, and generalization. Code will be released.", "authors": "Yajie Li, Bozhou Zhang, Chun Gu, Zipei Ma, Jiahui Zhang, Jiankang Deng, Xiatian Zhu, Li Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/66091", "is_oral": false, "is_spotlight": false, "poster_id": "66091", "presentation_type": "regular", "related_events": "", "title": "From Imagined Futures to Executable Actions: Mixture of Latent Actions for Robot Manipulation", "sequence": 5614, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 42, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 506}, "raw_topic_score": 506, "selection_score": 506, "matched_terms": "robot, manipulation, latent action, control", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Despite rapid progress in Vision-Language-Action (VLA) models for robotic control, instruction drift remains a persistent failure mode in long-horizon tasks. This paper reconceptualizes this phenomenon, positing that instruction drift is fundamentally a systematic sampling error: local greedy sampling is prone to collapsing into ''Negative Pivotal Windows''—irreversible local optima with high local probability that sever global success pathways. To address this, we propose \\textbf{Context-Aware Power Sampling (CAPS)}, a training-free inference-time computation framework. CAPS leverages power distributions to sharpen global trajectory probabilities, effectively activating the model's implicit world model for lookahead planning. Furthermore, we introduce a metacognitive control mechanism based on Signal-to-Noise Ratio (SNR). This mechanism triggers adaptive MCMC search solely when drift risk is detected, enabling a dynamic transition from ''intuitive fast thinking'' to ''rational slow search.'' Experiments on RoboTwin, Simpler-WindowX, and Libero-long benchmarks demonstrate that CAPS significantly outperforms SOTA baselines, such as OpenVLA and TACO, without parameter updates. These results confirm that adaptive inference-time computation is a potent pathway to enhancing embodied long-horizon robustness.", "authors": "Kewei Chen, Yayu Long, mingsheng shang", "icml_url": "https://icml.cc/virtual/2026/poster/64055", "is_oral": false, "is_spotlight": false, "poster_id": "64055", "presentation_type": "regular", "related_events": "", "title": "Drift is a Sampling Error: SNR-Aware Power Distributions for Long-Horizon Robotic Planning", "sequence": 3580, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 76, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 496}, "raw_topic_score": 496, "selection_score": 496, "matched_terms": "vision-language-action, vla, robot, robotic, embodied, world model, trajectory, control", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Existing VLA models frequently fail in robotic manipulation tasks, with poorly structured fault types that often require expert diagnosis.While VLMs offer strong explanatory capabilities, their effectiveness in assisting VLAs is limited by their unclear role in diagnostics and inadequate collaboration mechanisms.To address this, we introduce VLA-FixBench, a fault evaluation dataset that spans perception, planning, and control failures, and provides annotations for task stages, fault types, and spatiotemporal repair strategies.We further propose FaultEval, a static-to-dynamic-to-real evaluation framework that benchmarks 20 VLMs across multiple fault-related dimensions.Building on these insights, we design a VLM–VLA collaboration mechanism that localizes spatiotemporal deviations and rolls back task execution to enable targeted recovery.Experiments show that FaultEval reliably characterizes VLM-based closed-loop diagnosis and repair.The upper-bound analysis using human expert intervention shows that an idealized feedback loop can improve task success rates by 13% on LIBERO and 35% on real-world robots.", "authors": "Bowen Yan, Jiahao Xiao, Kehui Liu, Jianbo Zhang, Zicheng Zhang, Qi Jia, Zhongjie Jia, Haoming Song, Chunyi Li, Bin Zhao, Guangtao Zhai", "icml_url": "https://icml.cc/virtual/2026/poster/64203", "is_oral": false, "is_spotlight": false, "poster_id": "64203", "presentation_type": "regular", "related_events": "", "title": "Can VLMs Diagnose and Recover from VLA Manipulation Faults?", "sequence": 3728, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 26, "Multi-agent RL, games & coordination": 56, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 492}, "raw_topic_score": 492, "selection_score": 492, "matched_terms": "vla, robot, robotic, manipulation, control", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Personalizing AI decision support for heterogeneous human decision-makers remains a key challenge. We study a collaboration workflow where AI provides a reduced prediction set via conformal prediction as an input for human, and human makes final decision. We use contextual bandits to learn the complex and intangible human decision function, where the optimal set size, governed by a significance parameter $\\alpha$ (arms), varies across individuals and tasks (context). To address large arms spaces and high-dimensional contexts, we introduce the Adaptively Grouped Contextual Bandit (AGCB) framework, bypassing unreliable complex function online approximation in favor of directly exploiting Human-AI problem structure through two pillars: continuity-aware counterfactual reasoning that efficiently shares information across decisions, and a data-driven zooming mechanism that adaptively partitions the context space. The zooming mechanism performs a principled, native trade-off between intra-group estimation error and inter-group approximation bias, ensuring optimal granularity for both cumulative and simple regret objectives. Crucially, a single continuity assumption uniquely enables both the bias control for adaptive grouping and the robustness of our counterfactual updates. This leads to minimax-optimal regret rates. Empirical results confirm that AGCB significantly outperforms existing methods in heterogeneous, data-scarce environments.", "authors": "Yanchen Wu, Bo Li", "icml_url": "https://icml.cc/virtual/2026/poster/63971", "is_oral": false, "is_spotlight": false, "poster_id": "63971", "presentation_type": "regular", "related_events": "", "title": "Adaptively Grouped Contextual Bandits for Heterogeneous Human-AI Decision Making with Conformal Prediction Sets", "sequence": 3496, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 488, "RL & control": 30, "Multi-agent RL, games & coordination": 28, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 48, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 488, "selection_score": 488, "matched_terms": "bandit, bandits, contextual bandit, regret", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Diffusion-based large language models (DLLMs) have shown promise for non-autoregressive text generation, but their deployment is constrained by large model sizes and heavy computational costs. Post-training quantization (PTQ), a widely used method for compressing and accelerating Large Language Models (LLMs), suffers from severe accuracy degradation and reduced generalization performance when directly applied to DLLMs (e.g., AWQ suffers a 16% accuracy drop on LLADA under W4A4). This paper explores how the unique mechanisms of Dynamic Language Models (DLLMs) conflict with quantization, identifying three core issues: 1) During the iterative generation process of DLLMs, dynamic masking ratios are inherently involved, leading to notable differences in token distributions across decoding steps. Unfortunately, these distinct distributions are not sufficiently captured by current PTQ calibration approaches; 2) Quantization errors propogate and accumalte progressively during iterations in DLLMs, leading to a gradual decline in the performance of quantized models as decoding steps advance; 3) The stability of unmasked tokens, combined with the probabilistic nature of masked tokens, gives rise to an overall feature distribution that is uncoordinated and unsuitable for PTQ. To address these issues, we propose DLLMQuant, a PTQ framework tailored for DLLMs, which incorporates three novel techniques: 1) Temporal-Mask Adaptive Sampling (TMAS), a calibration method that accounts for both time and mask factors, with the capacity to capture distributions across timesteps. 2) Interaction-Aware Activation Quantization (IA-AQ), which utilizes bidirectional attention scores to identify important tokens, and prioritizes these tokens when minimizing quantization error. 3) Certainty-Guided Quantization (CGQ) incorporates mask status and token scores as core weighting criteria for error compensation, enabling PTQ to better align with the unique weight distribution of DLLMs. Experiments show that DLLMQuant achieves significant performance gains (e.g., over 10-point accuracy improvement on GSM8K for LLADA under 4-bit quantization) while enhancing efficiency.", "authors": "XUCHEN , Dawei Yang, Zhixuan Chen", "icml_url": "https://icml.cc/virtual/2026/poster/62533", "is_oral": false, "is_spotlight": false, "poster_id": "62533", "presentation_type": "regular", "related_events": "", "title": "DLLMQuant: A Post-Training Quantization Framework Tailored for Diffusion-Based Large Language Models", "sequence": 2060, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 488, "LLM adaptation & fine-tuning": 342, "Robotics, VLA & diffusion policy": 32}, "raw_topic_score": 488, "selection_score": 488, "matched_terms": "post-training, large language model, llm, language model", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Knowledge distillation improves large language model (LLM) reasoning by compressing the knowledge of a teacher LLM to train smaller LLMs. On-policy distillation advances this approach by having the student sample its own trajectories while a teacher LLM provides dense token-level supervision, addressing the distribution mismatch between training and inference in off-policy distillation methods. However, on-policy distillation typically requires a separate, often larger, teacher LLM and does not explicitly leverage ground-truth solutions available in reasoning datasets. Inspired by the intuition that a sufficiently capable LLM can rationalize external privileged reasoning traces and teach its weaker self (i.e., the version without access to privileged information), we introduce On-Policy Self-Distillation (OPSD), a framework where a single model acts as both teacher and student by conditioning on different contexts. The teacher policy conditions on privileged information (e.g., verified reasoning traces) while the student policy sees only the question; training minimizes the per-token divergence between these distributions over the student's own rollouts. We demonstrate the efficacy of our method on multiple mathematical reasoning benchmarks, achieving 4-8× token efficiency compared to reinforcement learning methods such as GRPO and superior performance over off-policy distillation methods.", "authors": "Siyan Zhao, Zhihui Xie, Mengchen Liu, Jing Huang, Guan Pang, Feiyu Chen, Aditya Grover", "icml_url": "https://icml.cc/virtual/2026/poster/64784", "is_oral": false, "is_spotlight": false, "poster_id": "64784", "presentation_type": "regular", "related_events": "", "title": "Self-Distilled Reasoner: On-Policy Self-Distillation for Large Language Models", "sequence": 4308, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 448, "LLM adaptation & fine-tuning": 196, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 448, "selection_score": 448, "matched_terms": "grpo, large language model, llm, language model, reasoning, on-policy", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Biomedical regression tasks require predicting continuous targets from heterogeneous and unstructured evidence. While Large Language Models (LLMs) provide a robust interface for reasoning over mixed modalities, they are inherently limited by their discrete tokenization and cross-entropy objectives, which lack awareness of numerical proximity. To bridge this gap, we present \\textbf{SPR-RAFT}, a parameter-efficient and regression-aware framework that adapts frozen LLMs for high-precision regression. SPR-RAFT introduces a dual-module architecture: a learnable soft prompt that conditions the LLM to route numerical reasoning into a specific latent state, and a lightweight \\texttt{[REG]}-anchored head for numerical reasoning consolidation. Crucially, we align these two modalities via a hybrid objective that combines distribution-based text generation with representation-based robust regression. This ensures the model remains both semantically coherent and numerically calibrated. With only $\\sim$0.04\\% trainable parameters, SPR-RAFT consistently outperforms prompting strategies, standard fine-tuning, and non-LLM baselines across diverse biomedical benchmarks, including clinical trial duration, biological age estimation, and molecular property prediction.", "authors": "Yuanlin Yang, Chenhui Li, Xuhao Guo, ANQI ZHANG, Hoi Leong Lee, Haodong Liu", "icml_url": "https://icml.cc/virtual/2026/poster/63748", "is_oral": false, "is_spotlight": false, "poster_id": "63748", "presentation_type": "regular", "related_events": "", "title": "SPR-RAFT: Parameter-Efficient Regression-Aware Fine-Tuning for Biomedical LLM Regression", "sequence": 3273, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 158, "LLM adaptation & fine-tuning": 438, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 438, "selection_score": 438, "matched_terms": "fine-tuning, parameter-efficient, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Agentic Web is an emerging paradigm where autonomous agents help users use online information. As the paradigm develops, content providers are also deploying agents to manage their data and serve it through controlled interfaces. This shift moves information access from centralized retrieval to decentralized coordination. To study this setting, we introduce AgentWebBench, a benchmark that evaluates how well a user agent synthesizes answers by interacting with website-specific content agents. We evaluate four tasks that cover common web information needs, spanning ranked retrieval (web search, web recommendation) and open-ended synthesis (question answering, deep research). Across seven advanced LLMs and three coordination strategies, multi-agent coordination generally lags behind centralized retrieval as expected, because user agent cannot directly access the corpus, but the gap shrinks with model scale and can even outperform centralized retrieval on question answering. This benchmark also enables us to study properties of the emerging paradigm of the digital world. We find that decentralized access concentrates traffic toward a small set of websites, test time scaling improves both interaction reliability and task performance, and strong results require sufficient interactions guided by careful planning. Finally, our failure analysis suggests that user agents need better planning and answer synthesis, while content agents need more reliable retrieval and evidence quality. Code, data, and APIs will be released online.", "authors": "Shanshan Zhong, Kate Shen, Chenyan Xiong", "icml_url": "https://icml.cc/virtual/2026/poster/63068", "is_oral": false, "is_spotlight": false, "poster_id": "63068", "presentation_type": "regular", "related_events": "", "title": "AgentWebBench: Benchmarking Multi-Agent Coordination in Agentic Web", "sequence": 2593, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 38, "Multi-agent RL, games & coordination": 408, "LLM post-training, RLHF & agents": 254, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 408, "selection_score": 408, "matched_terms": "multi-agent, decentralized, coordination", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Reinforcement Learning from Human Feedback (RLHF) is critical for aligning Large Language Models (LLMs) with human preferences. However, its efficacy is often compromised by the inherent inconsistency and subjectivity of human annotations. Existing preference optimization frameworks, such as Direct Preference Optimization (DPO), typically treat ambiguous pairs with high annotator disagreement identically to those with unanimous consensus, forcing models to overfit to inconsistent supervision signals and leading to suboptimal alignment. In this work, we propose $\\textit{Reliability-Guided Preference Optimization}$ (RGPO), a robust framework designed to mitigate the impact of inconsistent human feedback. RGPO estimates annotator reliability and infers latent ground truth labels from noisy human feedback to identify robust preferences. Furthermore, we introduce a reliability-aware consistency optimization that dynamically modulates the training objective based on the consensus level of annotations, ensuring the model prioritizes high-consensus supervision signals. Extensive experiments on LLM alignment benchmarks demonstrate that RGPO effectively reduces inconsistency and noise in training data and achieves superior performance compared to widely adopted RLHF baselines.", "authors": "Jingyi Huang, Ruohan Zong, Yujun Feng, Liran Ma, Lanyu Shang, Yang Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/66787", "is_oral": false, "is_spotlight": false, "poster_id": "66787", "presentation_type": "regular", "related_events": "", "title": "Reliability-Aware LLM Alignment from Inconsistent Human Feedback", "sequence": 6305, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 408, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 408, "selection_score": 408, "matched_terms": "rlhf, preference optimization, dpo, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Fine-tuning large language models (LLMs) can lead to unintended out-of-distribution generalization. Standard approaches to this problem rely on modifying the training data, for example by adding data that better specify the intended generalization. However, this is not always practical. We introduce Concept Ablation Fine-Tuning (CAFT), a technique that leverages interpretability tools to control how LLMs generalize from fine-tuning, without needing to modify the training data or otherwise use data from the target distribution. Given a set of directions in an LLM's latent space corresponding to undesired concepts, CAFT works by ablating these concepts with linear projections during fine-tuning, steering the model away from unintended generalizations. We successfully apply CAFT to three fine-tuning tasks, including emergent misalignment, a phenomenon where LLMs fine-tuned on a narrow task generalize to give egregiously misaligned responses to general questions. Without any changes to the fine-tuning data, CAFT reduces misaligned responses by 10x without degrading performance on the training distribution. Overall, CAFT represents a novel approach for steering LLM generalization without modifying training data.", "authors": "Helena Casademunt, Caden Juang, Adam Karvonen, Samuel Marks, Senthooran Rajamanoharan, Neel Nanda", "icml_url": "https://icml.cc/virtual/2026/poster/60571", "is_oral": false, "is_spotlight": false, "poster_id": "60571", "presentation_type": "regular", "related_events": "", "title": "Steering Out-of-Distribution Generalization with Concept Ablation Fine-Tuning", "sequence": 100, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 120, "LLM adaptation & fine-tuning": 404, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 404, "selection_score": 404, "matched_terms": "fine-tuning, large language model, language model, llm", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "LLM-based multi-agent embodied planning remains impractical due to prohibitively high execution latency. We identify failed actions as the dominant bottleneck, stemming from two core challenges: inaccurate state tracking under partial observability and inefficient coordination that produces redundant or conflicting actions. We introduce Mosaic, a runtime-efficient multi-agent planning framework that addresses both challenges. Mosaic maintains accurate yet lightweight state tracking through agent-centric semantic memory that stores objects in relative coordinates, enabling geometric transformations and coordination. It ensures efficient coordination through Integer Linear Programming that allocates actions at every planning step, enforcing physical feasibility and inter-agent coordination constraints. Across AI2-THOR and search-and-rescue benchmarks, Mosaic achieves 27–32% faster execution, 30–33% fewer LLM calls, 25–31% fewer steps, and 4–10% points higher success rates. These results demonstrate that efficient memory and constraint-guided coordination are critical for scalable, low-latency multi-agent planning.", "authors": "Kunjal Panchal, Saayan Mitra, Sunav Choudhary, Victor Bursztyn, Somdeb Sarkhel, Hui Guan", "icml_url": "https://icml.cc/virtual/2026/poster/62291", "is_oral": false, "is_spotlight": false, "poster_id": "62291", "presentation_type": "regular", "related_events": "", "title": "Mosaic: Runtime-Efficient Multi-Agent Embodied Planning", "sequence": 1818, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 84, "Multi-agent RL, games & coordination": 402, "LLM post-training, RLHF & agents": 108, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 112}, "raw_topic_score": 402, "selection_score": 402, "matched_terms": "multi-agent, coordination", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) is a cornerstone of post-training for large reasoning models, yet widely used algorithms such as Group Relative Policy Optimization (GRPO) often exhibit \\textbf{diversity collapse}. We provide a geometric diagnosis by formalizing GRPO as a dynamical flow on the probability simplex. Under a mode-based coarse-graining of rollouts, we show that GRPO induces a \\textbf{collision field} over correct modes, monotonically  pushing towards simplex vertices  and thus yielding a \\textbf{winner-take-all} regime. To address this systematically, we introduce \\textbf{G$^2$RPO (Geometric GRPO)}, which reshapes RLVR via principled \\textbf{vector-field editing}. Concretely, we intervene at the advantage level by adding granularity bonuses inversely proportional to mode probabilities, encouraging underrepresented correct modes. The bonus has a natural geometric interpretation, and  its potential performance side effects can be mitigated, thereby avoiding the usual accuracy--diversity trade-off. In experiments with 7B and 14B models trained on a math reasoning task and evaluated on \\textbf{AIME 2024/2025}, GRPO loses up to \\textbf{57\\%} of active correct modes. In contrast, G$^{2}$RPO increases active correct-mode coverage by \\textbf{172\\%--205\\%}, reduces concentration on any single correct mode, prevents the late-stage \\emph{entropy crash}, and improves \\texttt{pass@1} by \\textbf{+1.4} to \\textbf{+7.9} points relative to GRPO. Overall, diversity is not merely a regularizer but a \\textbf{geometric property} to be controlled to improve the model without trapping it in a single dominant strategy.", "authors": "Ali Rad, Khashayar Filom, Darioush Keivan, Peyman Mohajerin Esfahani, Ehsan Kamalinejad", "icml_url": "https://icml.cc/virtual/2026/poster/61763", "is_oral": false, "is_spotlight": false, "poster_id": "61763", "presentation_type": "regular", "related_events": "", "title": "G$^2$RPO: Geometric GRPO; Escaping LLM's Reasoning Rut to Break  Accuracy--Entropy Trade-off", "sequence": 1291, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 66, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 390, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 390, "selection_score": 390, "matched_terms": "grpo, post-training, verifiable reward, llm, reasoning", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Large language model (LLM) agents increasingly rely on external tools such as search engines to solve complex, multi-step problems, yet their rollouts are structurally heterogeneous: variations in tool-call number, placement, and outcomes induce distinct behaviors and reward distributions. As a result, policy gradient methods with a single global baseline suffer from cross-stratum bias , an \"apples-to-oranges\" comparison that distorts credit assignment and impedes exploration. To address this issue, we propose Stratified GRPO . Its core component, Stratified Advantage Normalization (SAN), partitions trajectories into homogeneous strata based on structural properties and computes advantages locally within each stratum, ensuring comparisons only among true peers. We show that SAN eliminates cross-stratum bias, yields conditionally unbiased unit-variance estimates within strata, and preserves the global unbiasedness and unit-variance properties of standard normalization, resulting in a more reliable learning signal. To improve robustness in finite-sample regimes, we further linearly blend SAN with the global estimator. Experiments on factual QA and deep-research agent benchmarks demonstrate that Stratified GRPO consistently outperforms GRPO by up to 12.6 points, achieving higher training rewards, improved training stability, and more effective search policies. These results establish stratification as a principled remedy for structural heterogeneity in RL for LLM search agents.", "authors": "Mingkang Zhu, Xi Chen, Bei Yu, Hengshuang Zhao, Jiaya Jia", "icml_url": "https://icml.cc/virtual/2026/poster/63159", "is_oral": false, "is_spotlight": false, "poster_id": "63159", "presentation_type": "regular", "related_events": "", "title": "Stratified GRPO: Handling Structural Heterogeneity in Reinforcement Learning of LLM Search Agents", "sequence": 2684, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 122, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 386, "LLM adaptation & fine-tuning": 136, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 386, "selection_score": 386, "matched_terms": "grpo, policy gradient, large language model, llm, language model, agent, agents", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Aligning large language models (LLMs) to serve users with heterogeneous and potentially conflicting preferences is a central challenge for personalized and trustworthy AI. We formalize an ideal notion of *universal alignment* through *test-time scaling*: for each prompt, the model produces $k\\ge 1$ candidate responses and a user selects their preferred one. We introduce *$(k,f(k))$-robust alignment*, which requires the $k$-output model to have win rate $f(k)$ against any other single-output model, and *asymptotic universal alignment (U-alignment)*, which requires $f(k)\\to 1$ as $k\\to\\infty$. Our main result characterizes the optimal convergence rate: there exists a family of *single-output* policies whose $k$-sample product policies achieve U-alignment at rate $f(k)=\\frac{k}{k+1}$, and no method can achieve a faster rate in general.   We show that popular post-training methods, including Nash learning from human feedback (NLHF), can fundamentally underutilize the benefits of test-time scaling. Even though NLHF is optimal for $k=1$, sampling from the resulting (often deterministic) policy cannot guarantee win rates above $\\tfrac{1}{2}$ except for an arbitrarily small slack. This stems from a lack of output diversity: existing alignment methods can collapse to a single majority-preferred response, making additional samples redundant. In contrast, our approach preserves output diversity and achieves the optimal test-time scaling rate. In particular, we propose a family of symmetric *multi-player alignment games* and prove that any symmetric Nash equilibrium policy of the $(k+1)$-player alignment game achieves the optimal $(k,\\frac{k}{k+1})$-robust alignment. Finally, we provide theoretical convergence guarantees for self-play learning dynamics in these games and extend the framework to opponents that also generate multiple responses.", "authors": "Yang Cai, Weiqiang Zheng", "icml_url": "https://icml.cc/virtual/2026/poster/66584", "is_oral": false, "is_spotlight": false, "poster_id": "66584", "presentation_type": "regular", "related_events": "", "title": "Asymptotic Universal Alignment: A New Alignment Framework via Test-Time Scaling", "sequence": 6103, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 208, "LLM post-training, RLHF & agents": 380, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 380, "selection_score": 380, "matched_terms": "post-training, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "LoRA and its variants have attracted considerable attention because of their abilities to tune a negligible number of parameters while achieving comparable downstream performance. This success is largely attributed to the intrinsic low-rank structure of model parameter spaces, which allows LoRA to train two projection matrices to project weights into a low-dimensional subspace and then map them back. However, it does not consider how to explore this low-rank subspace sufficiently and may lose the expression ability accordingly. Moreover, when using LoRA to tune convolution layers, a flatten operation is required to convert tensors into matrices. We argue that this will degrade the model's performance. In this paper, we address this issue from a general parameter sub-space perspective: we present a unified **L**anguage **A**nd **V**ision **A**daption finetuning framework (called **LAVA**). Specifically, we verify the existence of low-rank subspaces in convolution layers empirically and propose to parameterize the increment of both convolution kernels and matrices as sum of learnable rank-1 components. To improve training stability, we analyze the optimization dynamics of LoRA and incorporate orthogonal regularization into our parameterization, for which we give theoretical proof that it will help reduce the variance of the gradient. We conduct various experiments on different downstreaming tasks to validate LAVA's superiority. For example, when tuning LLaMA2-7b for commonsense tasks, the performance of our LAVA is **+1.9\\%** higher than that of LoRA. For metric depth estimation tasks, LAVA only tunes $\\sim$1.5\\% of Depth-Anything (335.3M), and achieves **+3.5\\%** $\\delta_1$ accuracy against that of LoRA and **+5.6\\%** $\\delta_1$ accuracy against that of SVDiff.", "authors": "Daorui Ding, Fanhua Shang, Tiancan Feng, Junkang Liu, Hongying Liu", "icml_url": "https://icml.cc/virtual/2026/poster/60725", "is_oral": false, "is_spotlight": false, "poster_id": "60725", "presentation_type": "regular", "related_events": "", "title": "LAVA: A Unified Framework for Finetuning Language and Vision Models", "sequence": 254, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 12, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 364, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 364, "selection_score": 364, "matched_terms": "finetuning, lora", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Large Language Models (LLMs) are rarely static and are frequently updated in practice. A growing body of alignment research has shown that models initially deemed ``aligned'' can exhibit misaligned behavior after fine-tuning, such as forgetting jailbreak safety features or re-surfacing knowledge that was intended to be forgotten. These works typically assume that the initial model is aligned based on static black-box evaluation, i.e., the absence of undesired responses to a fixed set of queries. In contrast, we formalize model alignment in both the static and post-update settings and uncover a fundamental limitation of black-box evaluation. We theoretically show that, due to overparameterization, static alignment provides no guarantee of post-update alignment for \\emph{any} update dataset. Moreover, we prove that static black-box probing cannot distinguish a model that is genuinely post-update robust from one that conceals an arbitrary amount of adversarial behavior, which can be activated by even a single benign gradient update. We further validate these findings empirically in LLMs across three core alignment domains: privacy, jailbreak safety, and behavioral honesty. We demonstrate the existence of LLMs that pass all standard black-box alignment tests, yet become severely misaligned after a single benign update. Finally, we show that the capacity to hide such latent adversarial behavior increases with model scale, confirming our theoretical prediction that post-update misalignment grows with the number of parameters. Together, our results highlight the inadequacy of static evaluation protocols and emphasize the urgent need for post-update--robust alignment evaluation.", "authors": "Yavuz Faruk Bakman, Duygu Nur Yaldiz, Eleni Triantafillou, Peter Kairouz, Salman Avestimehr, Sai Praneeth Reddy Karimireddy", "icml_url": "https://icml.cc/virtual/2026/poster/64533", "is_oral": false, "is_spotlight": false, "poster_id": "64533", "presentation_type": "regular", "related_events": "", "title": "Hair-Trigger Alignment:  Black-Box Evaluation Cannot Guarantee Post-Update Alignment", "sequence": 4057, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 352, "LLM adaptation & fine-tuning": 104, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 352, "selection_score": 352, "matched_terms": "alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Group Relative Policy Optimization (GRPO) is effective for training language models on complex reasoning.  However, since the objective is defined relative to a group of sampled trajectories,  extended deliberation can create more chances to realize relative gains,  leading to inefficient reasoning and overthinking, and complicating the trade-off between correctness and rollout efficiency. Controlling this behavior is difficult in practice, considering  (i) Length penalties are hard to calibrate because longer rollouts may reflect harder problems that require longer reasoning,  penalizing tokens risks truncating useful reasoning along with redundant continuation;  and (ii) supervision that directly indicates when to continue or stop is typically unavailable beyond final answer correctness. We propose Weakly Supervised GRPO (WS-GRPO), which improves rollout efficiency by converting terminal rewards into correctness-aware guidance over partial trajectories. Unlike global length penalties that are hard to calibrate, WS-GRPO trains a preference model from outcome-only correctness to produce prefix-level signals that indicate when additional continuation is beneficial. Thus, WS-GRPO supplies outcome-derived continue/stop guidance, reducing redundant deliberation while maintaining accuracy. We provide theoretical results and empirically show on reasoning benchmarks that WS-GRPO substantially reduces rollout length while remaining competitive with GRPO baselines.", "authors": "Gagan Mundada, Zihan Huang, Rohan Surana, Sheldon Yu, Jennifer Zhang, Xintong Li, Tong Yu, Lina Yao, Jingbo Shang, Julian McAuley, Junda Wu", "icml_url": "https://icml.cc/virtual/2026/poster/64686", "is_oral": false, "is_spotlight": false, "poster_id": "64686", "presentation_type": "regular", "related_events": "", "title": "WS-GRPO: Weakly-Supervised Group-Relative Policy Optimization for Rollout-Efficient Reasoning", "sequence": 4210, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 102, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 352, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 352, "selection_score": 352, "matched_terms": "grpo, language model, reasoning", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "As LLM-based agents are increasingly deployed in real-world workflows, existing agent benchmarks---often built on idealized, noise-free assumptions---fall short of characterizing agents' robustness under imperfect user instructions and unreliable tool feedback. To address this gap, we introduce **AgentNoiseBench**, a systematic evaluation framework for *interactive noise robustness* in LLM agents. AgentNoiseBench models two primary noise sources: *user-side instruction noise* arising from ambiguity and variability in human requests, and *tool-side result noise* caused by failures, partial outputs, and erroneous or distracting tool responses. The benchmark covers two representative agentic settings: (i) *multi-step tool use* with DeepSearch-style retrieval agents on multi-hop QA tasks, and (ii) *multi-turn user--agent interaction* via adaptations of $\\tau^{2}$-Bench and VitaBench to support controlled noise injection. We further provide a modular noise injection pipeline with controllable location and intensity, together with multi-dimensional metrics that go beyond final success to capture degradation trends, decision instability, and compute overhead. Evaluating 25 tool-using models across reasoning and non-reasoning families, we find that tool-side noise generally induces substantially larger performance degradation and trajectory drift than user-side noise, and that some strong reasoning models exhibit a \"reasoning trap\", spending markedly more tokens and steps under corrupted tool feedback while still making confident errors. Overall, AgentNoiseBench provides a practical testbed for diagnosing failure modes and advancing robust agent design for real deployments.", "authors": "Ruipeng Wang, Yuxin Chen, Yukai Wang, Chang Wu, Junfeng Fang, Xiaodong Cai, Qi GU, Hui Su, An Zhang, Xiang Wang, Xunliang Cai, Tat-Seng Chua", "icml_url": "https://icml.cc/virtual/2026/poster/64355", "is_oral": false, "is_spotlight": false, "poster_id": "64355", "presentation_type": "regular", "related_events": "", "title": "AgentNoiseBench: Benchmarking Robustness of Tool-Using LLM Agents Under Noisy Condition", "sequence": 3880, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 28, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 350, "LLM adaptation & fine-tuning": 78, "Robotics, VLA & diffusion policy": 40}, "raw_topic_score": 350, "selection_score": 350, "matched_terms": "llm, reasoning, agent, agents", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Direct Preference Optimization (DPO) has become the dominant approach for aligning large language models with human preferences. However, standard DPO treats all preference pairs uniformly, overlooking the heterogeneous nature of the learning problem: some samples demand sophisticated semantic understanding of the prompt, while others require nuanced discrimination between similar responses. We argue that these two objectives should be disentangled during training. Through gradient analysis, we identify a layer-wise localization phenomenon where semantic complexity predominantly drives lower-layer updates while preference uncertainty modulates upper layers. Building on this insight, we propose Gradient-Guided Disentangled DPO (GDO-DPO), a curriculum framework that independently regulates learning pace along each dimension based on layer-specific gradient stability. Experiments on UltraFeedback and HH-RLHF demonstrate consistent improvements, with GDO-DPO outperforming DPO by 4.1\\% on AlpacaEval 2.0 and showing particularly strong gains on reasoning-intensive tasks.", "authors": "Mengyang Li, Shuang Liu, Zhong Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/62166", "is_oral": false, "is_spotlight": false, "poster_id": "62166", "presentation_type": "regular", "related_events": "", "title": "Layer-wise Gradient Disentanglement: Decoupling Semantics and Preferences in Direct Preference Optimization", "sequence": 1693, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 350, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 350, "selection_score": 350, "matched_terms": "rlhf, preference optimization, dpo, large language model, language model, reasoning", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Diffusion models are increasingly used as powerful conditional generators, yet real deployments often involve multiple target distributions arising from different tasks, e.g., diverse prompt domains in text-to-image generation, or multiple environments in robotics with diffusion policies. This naturally leads to a multi-objective learning (MOL) problem. A key challenge is that achieving good Pareto trade-offs can require a generalist model class with substantially larger capacity than what suffices for solving any individual task, thereby increasing statistical cost since sample complexity typically scales with the model complexity. To reconcile this, we develop a principled MOL framework for diffusion models with limited data: a semi-supervised regime where paired (labeled) samples are scarce, but (unlabeled) condition data are abundant.  We propose a two-stage training procedure that first fits lightweight specialist models from limited paired data, and then distills them into a generalist model by generating pseudo-samples. We establish generalization bounds showing that the required number of paired samples only depends on the complexity of the specialist model classes. We further extend the theory to diffusion policies for sequential decision making to account for distribution shift in on-policy rollouts. Extensive experiments on robotic control tasks are conducted to verify our theoretical results.", "authors": "Ziheng Cheng, Yixiao Huang, Hanlin Zhu, Haoran Geng, Somayeh Sojoudi, Jitendra Malik, Pieter Abbeel, Xin Guo", "icml_url": "https://icml.cc/virtual/2026/poster/65165", "is_oral": false, "is_spotlight": false, "poster_id": "65165", "presentation_type": "regular", "related_events": "", "title": "Multi-Objective Learning for Diffusion Models: A Statistical Theory under Semi-Supervised Learning", "sequence": 4689, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 28, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 342}, "raw_topic_score": 342, "selection_score": 342, "matched_terms": "diffusion policies, robot, robotic, robotics, control, diffusion", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "LLM agents are increasingly deployed in long-horizon, complex environments to solve challenging problems, but this expansion exposes them to long-horizon attacks that exploit multi-turn user–agent–environment interactions to achieve objectives infeasible in single-turn settings. To measure agent vulnerabilities to such risks, we present AgentLAB, the first benchmark dedicated to evaluating LLM agent susceptibility to adaptive, long-horizon attacks. Currently, AgentLAB supports five novel attack types including intent hijacking, tool chaining, task injection, objective drifting, and memory poisoning, spanning 28 realistic agentic environments, and 644 security test cases. Leveraging AgentLAB, we evaluate representative LLM agents and find that they remain highly susceptible to long-horizon attacks; moreover, defenses designed for single-turn interactions fail to reliably mitigate long-horizon threats. We anticipate that AgentLAB will serve as a valuable benchmark for tracking progress on securing LLM agents in practical settings.", "authors": "Tanqiu Jiang, Yuhui Wang, Jiacheng Liang, Ting Wang", "icml_url": "https://icml.cc/virtual/2026/poster/65640", "is_oral": false, "is_spotlight": false, "poster_id": "65640", "presentation_type": "regular", "related_events": "", "title": "AgentLAB: Benchmarking LLM Agents against Long-Horizon Attacks", "sequence": 5163, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 328, "LLM adaptation & fine-tuning": 106, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 328, "selection_score": 328, "matched_terms": "llm, agent, agents", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Post-training Large Vision-and-Language Models (LVLMs) typically involves Supervised Fine-Tuning (SFT) for knowledge injection or Reinforcement Learning with Verifiable Rewards (RLVR) for performance enhancement. However, SFT often leads to sub-optimal performance, while RLVR remains constrained by the model's internal knowledge base. While a sequential SFT $\\rightarrow$ RLVR pipeline can be used, it introduces significant computational overhead and suffers from catastrophic forgetting. To address these limitations, we propose ViSurf (\\textbf{Vi}sual \\textbf{Su}pervised-and-\\textbf{R}einforcement \\textbf{F}ine-Tuning), a unified, single-stage paradigm that integrates the strengths of both SFT and RLVR. By analyzing their training objectives, we establish a unified framework that injects ground-truth labels directly into RLVR rollouts, facilitating simultaneous external supervision and internal reinforcement. Furthermore, we introduce three novel reward control strategies to ensure training stability and optimization. Extensive experiments demonstrate that ViSurf consistently outperforms standalone SFT, RLVR, and the traditional two-stage pipeline across diverse benchmarks. In-depth analysis corroborates these findings, validating the derivation and design principles of ViSurf. Our code, data and models will be publicly available.", "authors": "Yuqi Liu, Liangyu Chen, Jiazhen Liu, Mingkang Zhu, Zhisheng Zhong, Bei Yu, Jiaya Jia", "icml_url": "https://icml.cc/virtual/2026/poster/65393", "is_oral": false, "is_spotlight": false, "poster_id": "65393", "presentation_type": "regular", "related_events": "", "title": "ViSurf: Visual Supervised-and-Reinforcement Fine-Tuning for Large Vision-and-Language Models", "sequence": 4917, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 44, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 112, "LLM adaptation & fine-tuning": 328, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 328, "selection_score": 328, "matched_terms": "fine-tuning, reinforcement fine-tuning, language model", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Post-training with explicit reasoning traces is common to improve the reasoning capabilities of Multimodal Large Language Models (MLLMs). However, acquiring high-quality reasoning traces is often costly and time-consuming. Hence, the self-improvement paradigm has emerged, enabling MLLMs to self-generate reasoning traces for training without external supervision. Despite its effectiveness, we reveal two shortcomings in the self-improvement training of MLLMs: 1) data imbalance, where simple samples are over-trained, but the challenging yet crucial samples are under-trained; 2) language prior bias, where MLLMs overly rely on linguistic priors while neglecting the visual cues. To this end, we propose VISTA, a VIsion-aware Self-improvement Training framework for enhancing the multimodal Reasoning of MLLMs. Specifically, VISTA first introduces a prefix resampling strategy to reuse the partial correct reasoning traces for efficient data collection, and then designs a vision-aware attention score to quantify the model’s focus on visual information. Extensive experiments show that VISTA can be applied to various post-training scenarios, i.e., supervised fine-tuning and preference learning, and effectively enhances the multimodal reasoning performance across various MLLMs and tasks, e.g., bringing up to +13.66% average performance gains for Qwen2.5-VL-3B-Instruct.", "authors": "Qihuang Zhong, Liang Ding, Wenjie Xuan, Juhua Liu, Bo Du, Dacheng Tao", "icml_url": "https://icml.cc/virtual/2026/poster/66575", "is_oral": false, "is_spotlight": false, "poster_id": "66575", "presentation_type": "regular", "related_events": "", "title": "Learn to Think: Improving Multimodal Reasoning through Vision-Aware Self-Improvement Training", "sequence": 6094, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 326, "LLM adaptation & fine-tuning": 146, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 326, "selection_score": 326, "matched_terms": "preference learning, post-training, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Instruction tuning (IT) is a central mechanism for aligning large language models (LLMs) with user intent. In practice, randomly shuffling the training set is a simple yet surprisingly strong baseline. However, it overlooks latent structure, such as domain and reasoning depth, and thus interleaves heterogeneous objectives, which can induce gradient conflicts and diminish effective optimization progress. To this end, we propose EP-Order, an embedding-proximity-based data-ordering paradigm for IT of LLMs. Unlike previous paradigms that derive order from per-example scores, EP-Order explicitly accounts for inter-sample correlations by operating in representation space. EP-Order trains a warm-up model on a small subset of data (e.g., 10%), embeds all training samples for clustering, and ranks these clusters according to embedding proximity. To handle sharp gradient changes at cluster transitions and alleviate catastrophic forgetting under cluster-based training, we introduce mixed regions that interleave samples from the previous, current, and next clusters, thereby stabilizing learning. We evaluate EP-Order on seven popular multimodal LLM benchmarks and demonstrate that it is both more effective and more efficient than competing data ordering paradigms. We expand the application of EP-Order to a hybrid thinking text-only scenario, where think and no-think samples induce substantial optimization conflict, and evaluate with three benchmarks. EP-Order obtains nearly consistent improvements over random mixing. These results highlight embedding-proximity-based ordering as a promising direction for complex, high-conflict training data in IT.", "authors": "Yiwen Ye, Boyuan Jiang, Xiaobin Hu, Shengzhi Wang, Xiaozhong Ji, Jinghao Lin, Deli Yu, Jiale Chen, kai wu, Haihua Yang, Yong Xia", "icml_url": "https://icml.cc/virtual/2026/poster/62875", "is_oral": false, "is_spotlight": false, "poster_id": "62875", "presentation_type": "regular", "related_events": "", "title": "Group-wise Data Ordering: Enhancing Instruction Tuning of Large Language Models via Embedding Proximity", "sequence": 2401, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 172, "LLM adaptation & fine-tuning": 314, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 314, "selection_score": 314, "matched_terms": "instruction tuning, large language model, language model, llm", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Linear bandits traditionally prioritize regret minimization, often overlooking statistical inference of the underlying parameter as a critical objective. In high-stakes settings such as healthcare, precise parameter estimation is indispensable, as it provides fundamental insights into system mechanisms and ensures robust decision-making under covariate shift. We investigate the tripartite balance between regret, inference, and safety, deriving a fundamental minimax lower bound that characterizes the Pareto-optimal frontier of these competing goals. We then propose SERMiSC, a novel algorithm that achieves the optimal trade-off by matching this lower bound while maintaining a near-constant $\\tilde{O}(1)$ safety risk. Empirical results demonstrate that SERMiSC effectively navigates the Pareto frontier and outperforms various baselines, thereby validating our theoretical analysis.", "authors": "Yuming Shao, Zhixuan Fang", "icml_url": "https://icml.cc/virtual/2026/poster/62237", "is_oral": false, "is_spotlight": false, "poster_id": "62237", "presentation_type": "regular", "related_events": "", "title": "The Pareto-optimal Trade-off between Regret and Statistical Inference in Linear Stochastic Bandits under Safety Constraints", "sequence": 1764, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 308, "RL & control": 40, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 24, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 308, "selection_score": 308, "matched_terms": "bandit, bandits, linear bandit, regret", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}], "namedChecks": [{"requested_title": "Maximum Likelihood Reinforcement Learning", "status": "found and included in itinerary", "source_url": "https://arxiv.org/abs/2602.02710", "matched_title": "Maximum Likelihood Reinforcement Learning", "poster_id": "65332", "poster_session": "Wed, Jul 8, 2026 10:30 KST", "location": "HALL A #2006", "type": "oral+spotlight", "authors": "Fahim Tajwar, Guanning Zeng, Yueer Zhou, Yuda Song, Daman Arora, Yiding Jiang, Jeff Schneider, Russ Salakhutdinov, Haiwen Feng, Andrea Zanette", "abstract": "Maximum likelihood is fundamental to supervised learning but it cannot be directly applied in correctness-based problems with non-differentiable sampling. In these settings, reinforcement learning (RL) is typically used to maximize expected reward. We show that for binary correctness tasks, expected-reward RL is a first-order approximation of the maximum likelihood objective, yielding vanishing learning signal on low-success inputs. We introduce **Maximum Likelihood Reinforcement Learning (MaxRL)**, a compute-indexed family of sampling-based objectives derived from a pass@k expansion of the likelihood, which interpolates between standard RL and exact maximum likelihood as compute increases. MaxRL admits a simple unbiased policy-gradient estimator whose optimized objective improves with additional compute. Across multiple domains, MaxRL consistently outperforms standard RL and GRPO, achieving higher $pass@1$ and substantially improved $pass@k$."}, {"requested_title": "Provably Efficient Regularized Online RLHF with Generalized Bilinear Preferences", "matched_title": "Regularized Online RLHF with Generalized Bilinear Preferences", "status": "not found in local ICML main-conference poster data; kept as external reading", "authors": "Junghyun Lee, Minju Hong, Kwang-Sung Jun, Chulhee Yun, Se-Young Yun", "source_url": "https://arxiv.org/abs/2602.23116", "abstract": "Contextual online RLHF with generalized bilinear preferences, strongly convex regularizers, and regret guarantees for greedy sampling and explore-then-commit."}, {"requested_title": "Coverage Improvement and Fast Convergence of On-policy Preference Learning", "status": "found and included in itinerary", "source_url": "https://arxiv.org/abs/2601.08421", "matched_title": "Coverage Improvement and Fast Convergence of On-policy Preference Learning", "poster_id": "61253", "poster_session": "Wed, Jul 8, 2026 17:00 KST", "location": "HALL A #4514", "type": "poster", "authors": "Juno Kim, Jihun Yun, Jason Lee, Kwang-Sung Jun", "abstract": "On-policy preference learning algorithms for language model alignment such as online direct policy optimization (DPO) can significantly outperform their offline counterparts. We provide a theoretical explanation for this phenomenon by analyzing how the sampling policy's coverage evolves throughout on-policy training. We propose and rigorously justify the \\emph{coverage improvement principle}: with sufficient batch size, each update moves into a region around the target where coverage is uniformly better, making subsequent data increasingly informative and enabling rapid convergence. In the contextual bandit setting with Bradley-Terry preferences and linear softmax policy class, we show that on-policy DPO converges exponentially in the number of iterations for batch size exceeding a generalized coverage threshold. In contrast, any learner restricted to offline samples from the initial policy suffers a slower minimax rate, leading to a sharp separation in total sample complexity. Motivated by this analysis, we further propose a simple hybrid sampler based on a novel \\emph{preferential} G-optimal design, which removes dependence on coverage and guarantees convergence in just two rounds. Finally, we develop principled on-policy schemes for reward distillation in the general function class setting, and show faster noiseless rates under an alternative deviation-based notion of coverage."}, {"requested_title": "Efficient Algorithms for Contextual Apple Tasting with Log-Loss", "status": "not found in local ICML main-conference poster data or public search under this exact title", "source_url": "", "abstract": ""}]}</script>
  <script>
    const data = JSON.parse(document.getElementById('paperData').textContent);
    const app = document.getElementById('app');
    const sessionNav = document.getElementById('sessionNav');
    const searchInput = document.getElementById('search');
    const topicFilter = document.getElementById('topicFilter');
    const typeFilter = document.getElementById('typeFilter');

    const topicClass = topic => {
      if (topic.startsWith('Award')) return 'award';
      if (topic.startsWith('Core')) return 'core';
      if (topic.startsWith('RL')) return 'rl';
      if (topic.startsWith('Multi-agent')) return 'multi';
      if (topic.startsWith('LLM adaptation')) return 'adapt';
