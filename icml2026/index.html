ts by grounding LLMs in embodied actions with a tight perception-execution loop. We instantiate EmbodiedAct within MATLAB and evaluate it on complex engineering design and scientific modeling tasks. Extensive experiments show that EmbodiedAct significantly outperforms existing baselines, achieving SOTA performance by ensuring satisfactory reliability and stability in long-horizon simulations and enhanced accuracy in scientific modeling.", "authors": "Bo Zhang, Jinfeng Zhou, Yuxuan Chen, Jianing Yin, Minlie Huang, Hongning Wang", "icml_url": "https://icml.cc/virtual/2026/poster/62124", "is_oral": false, "is_spotlight": false, "poster_id": "62124", "presentation_type": "regular", "related_events": "", "title": "Grounding LLMs in Scientific Discovery via Embodied Actions", "sequence": 1651, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 150, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 224}, "raw_topic_score": 224, "selection_score": 224, "matched_terms": "embodied", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #1912", "poster_number": 1912, "poster_band": "#1000-#1999"}, {"abstract": "Low-Rank Adaptation (LoRA) has become the de facto paradigm for parameter-efficient fine-tuning, with its effectiveness critically influenced by rank allocation across modules. However, existing approaches face a fundamental dilemma: uniform allocation ignores module heterogeneity, while adaptive methods introduce expensive training overhead or lack reusability across configurations. We propose \\textbf{CSPLoRA} (Confidence-guided Structural Planning for LoRA), a decoupled framework that reweights probe samples by prediction uncertainty to obtain higher-fidelity module importance estimates. The key insight is that hard samples---those the model struggles with---provide more informative gradient signals for identifying critical modules than easy samples. Combined with scale-invariant allocation, our method produces reusable structural priors that transfer across different rank budgets and LoRA backends, enabling \"probe once, deploy everywhere.\" Experiments on GLUE, commonsense reasoning, and arithmetic tasks show that CSPLoRA consistently improves over uniform LoRA (+1.25 points on LLaMA-2-7B commonsense reasoning) while maintaining comparable parameters, with the same structure transferring directly to other LoRA variants.", "authors": "Huiming Ding, Xiaochen Li, Jianhui Ma, Xu An, Yihui Yang, Zhenyu Tan", "icml_url": "https://icml.cc/virtual/2026/poster/63489", "is_oral": false, "is_spotlight": false, "poster_id": "63489", "presentation_type": "regular", "related_events": "", "title": "CSPLoRA: Confidence-Guided Structure Planning for Low-Rank Adaptation", "sequence": 3014, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 48, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 696, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 696, "selection_score": 696, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2110", "poster_number": 2110, "poster_band": "#2000-#2999"}, {"abstract": "Large Language Models(LLMs) have revolutionized text generation and multimodal perception, but their capabilities in 3D content generation remain underexplored. Existing methods compromise by producing either low-resolution meshes or coarse structural proxies, failing to capture fine-grained geometry natively. In this paper, we propose CG-MLLM, a novel Multi-modal Large Language Model (MLLM) capable of 3D captioning and high-resolution 3D generation in a single framework.   Leveraging the Mixture-of-Transformer architecture, CG-MLLM decouples disparate modeling needs, where the Token-level Autoregressive (TokenAR) Transformer handles token-level content, and the Block-level Autoregressive (BlockAR) Transformer handles block-level content. By integrating a pre-trained vision-language backbone with a specialized 3D VAE latent space, CG-MLLM facilitates long-context interactions between standard tokens and spatial blocks within a single integrated architecture.    Experimental results show that CG-MLLM significantly outperforms existing MLLMs in generating high-fidelity 3D objects, effectively bringing high-resolution 3D content creation into the mainstream LLM paradigm.", "authors": "Junming Huang, Chi Wang, Letian Li, Guangkai Xu, Donglin Huang, Hao Chen, Qiang Dai, Weiwei Xu", "icml_url": "https://icml.cc/virtual/2026/poster/63909", "is_oral": false, "is_spotlight": false, "poster_id": "63909", "presentation_type": "regular", "related_events": "", "title": "CG-MLLM: Captioning and Generating 3D content via Multi-modal Large Language Models", "sequence": 3434, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 304, "LLM adaptation & fine-tuning": 294, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 304, "selection_score": 304, "matched_terms": "large language model, llm, language model", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2112", "poster_number": 2112, "poster_band": "#2000-#2999"}, {"abstract": "Existing benchmarks for conversational AI agents simulate *single-control* environments, where only the AI agent can use tools to interact with the world, while the user remains a passive information provider. This differs from real-world scenarios like technical support, where users need to actively participate in modifying the state of the (shared) world. In order to address this gap, we introduce $\\tau^2$-bench, with four key contributions:   1. A novel **Telecom dual-control domain** modeled as a Dec-POMDP, where both agent and user make use of tools to act in a shared, dynamic environment that tests both agent coordination and communication, 2. A **compositional task generator** that programmatically creates diverse, verifiable tasks from atomic components, ensuring domain coverage and controlled complexity, 3. A **reliable user simulator** tightly coupled with the environment, whose behavior is constrained by tools and observable states, improving simulation fidelity, 4. **fine-grained analysis of agent performance** through multiple ablations including separating errors arising from reasoning vs communication/coordination.  In particular, our experiments show significant performance drops when agents shift from no-user to dual-control, highlighting the challenges of guiding users. Overall, $\\tau^2$-bench provides a controlled testbed for agents that must both reason effectively and guide user actions.", "authors": "Victor Barres, Honghua Dong, Soham Ray, Xujie Si, Karthik Narasimhan", "icml_url": "https://icml.cc/virtual/2026/poster/64377", "is_oral": true, "is_spotlight": true, "poster_id": "64377", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6B Agentic Systems", "title": "$\\tau^2$-Bench: Evaluating Conversational Agents in a Dual-Control Environment", "sequence": 3902, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 170, "Multi-agent RL, games & coordination": 334, "LLM post-training, RLHF & agents": 170, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 96}, "raw_topic_score": 334, "selection_score": 774, "matched_terms": "dec-pomdp, coordination, dual-control", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2207", "poster_number": 2207, "poster_band": "#2000-#2999"}, {"abstract": "Diffusion models trained on different, non-overlapping subsets of a dataset often produce strikingly similar outputs when given the same noise seed. We trace this consistency to a simple linear effect: the shared Gaussian statistics across splits already predict much of the generated images. To formalize this, we develop a random matrix theory (RMT) framework that quantifies how finite datasets shape the expectation and variance of the learned denoiser and sampling map in the linear setting. For expectations, sampling variability acts as a renormalization of the noise level through a self-consistent relation $\\sigma^2\\to\\kappa(\\sigma^2)$, explaining why limited data overshrink low-variance directions and pull samples toward the dataset mean. For fluctuations, our variance formulas reveal three key factors behind cross-split disagreement: \\textit{anisotropy} across eigenmodes, \\textit{inhomogeneity} across inputs, and overall scaling with dataset size. Extending deterministic-equivalence tools to fractional matrix powers further allows us to analyze entire sampling trajectories. The theory sharply predicts the behavior of linear diffusion models, and we validate its predictions on UNet and DiT architectures in their non-memorization regime, identifying where and how samples deviates across training data split. This provides a principled baseline for reproducibility in diffusion training, linking spectral properties of data to the stability of generative outputs.", "authors": "Binxu Wang, Jacob A Zavatone-Veth, Cengiz Pehlevan", "icml_url": "https://icml.cc/virtual/2026/poster/62241", "is_oral": true, "is_spotlight": true, "poster_id": "62241", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6G Theory: Transformers & GNNs", "title": "A Random Matrix Perspective on the Consistency of Diffusion Models", "sequence": 1768, "award": "Outstanding Paper Honorable Mention", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 48}, "raw_topic_score": 48, "selection_score": 288, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper Honorable Mention", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2503", "poster_number": 2503, "poster_band": "#2000-#2999"}, {"abstract": "This paper tackles the challenging problem of developing a proactive copyright protection mechanism that cuts off unauthorized use of diffusion generative models. Existing studies largely fall into post-hoc attribution (e.g., watermarking and fingerprinting) or degradation-only defenses, which offer only indirect and limited preventive effect. We therefore propose GoodDiffusion, inspired by backdoor mechanisms, to enforce model-level use-time control by internalizing authorization into the generative process through a selectively permissive, otherwise closed behavior. Specifically, GoodDiffusion preserves high-quality generation for authorized queries carrying valid signatures, yet refuses to generate for unauthorized inputs. We further empirically show that naive static-signature designs (like conventional backdoor injection) are fundamentally fragile, since a surrogate signature can be efficiently recovered via gradient-based optimization. To strengthen security, we introduce a Learnable Signature Network (LSN) that assigns sample-specific signatures conditioned on each input. This breaks the universality of signatures and prevents a surrogate from transferring across inputs. Extensive experiments validate that GoodDiffusion effectively blocks unauthorized use while maintaining strong generation quality for authorized users.", "authors": "Shixi Qin, zhiyong yang, Shilong Bao, Zitai Wang, Qianqian Xu, Qingming Huang", "icml_url": "https://icml.cc/virtual/2026/poster/60784", "is_oral": true, "is_spotlight": true, "poster_id": "60784", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6F Social Impacts: GenAI & Video", "title": "GoodDiffusion: Proactive Copyright Protection for Diffusion Generative Models via Learnable Sample-specific Signatures", "sequence": 313, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 92}, "raw_topic_score": 92, "selection_score": 182, "matched_terms": "control, diffusion", "selection_reasons": "oral", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2800", "poster_number": 2800, "poster_band": "#2000-#2999"}, {"abstract": "By integrating Chain-of-Thought (CoT) reasoning, Vision-Language-Action (VLA) models have demonstrated strong capabilities in robotic manipulation, particularly by improving generalization and interpretability. However, the security of CoT-based reasoning mechanisms remains largely unexplored. In this paper, we show that Chain-of-Thought (CoT) reasoning introduces a novel attack vector for targeted control hijacking—for example, causing a robot to mistakenly deliver a knife to a person instead of an apple—without modifying the user’s instruction. We first provide empirical evidence that CoT strongly governs action generation, even when it is semantically misaligned with the input instructions. Building on this observation, we propose TRAP , the first targeted adversarial attack framework for CoT-reasoning VLA models. TRAP uses an adversarial patch (e.g., a coaster placed on the table) to corrupt intermediate CoT reasoning and hijack the VLA’s output. By optimizing the CoT adversarial loss, TRAP induces specific and adversary-defined behaviors. Extensive evaluations across 3 mainstreaming VLA architectures and 3 CoT reasoning paradigms validate the effectiveness of TRAP . Notably, we implemented the patch by printing it on paper in a real-world setting. Our findings highlight the urgent need to secure CoT reasoning in VLA systems.", "authors": "Zhengxian Huang, Wenjun Zhu, Haoxuan Qiu, Xiaoyu Ji, Wenyuan Xu", "icml_url": "https://icml.cc/virtual/2026/poster/60529", "is_oral": false, "is_spotlight": false, "poster_id": "60529", "presentation_type": "regular", "related_events": "", "title": "TRAP: Hijacking VLA CoT-Reasoning via Adversarial Patches", "sequence": 58, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 12, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 100, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 484}, "raw_topic_score": 484, "selection_score": 484, "matched_terms": "vision-language-action, vla, robot, robotic, manipulation, control", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2808", "poster_number": 2808, "poster_band": "#2000-#2999"}, {"abstract": "Large Language Models (LLMs) are increasingly employed as automated judges for evaluating generative models. However, their known stylistic biases, such as a preference for verbosity or specific sentence structures, present an underexplored security vulnerability. In this work, we introduce BITE (BIas exploraTion and Exploitation), a black-box adversarial framework that learns semantics-preserving edits to mislead the judgment and artificially inflate judged scores. We cast the selection of stylistic edits as a contextual bandit problem and use a LinUCB policy to adaptively choose edits that maximize the judge’s score without access to model parameters or gradients. Theoretically, we prove a formal regret guarantee for our BITE, demonstrating its ability to efficiently learn to manipulate a judge in the realistic setting of model misspecification. Empirically, we test BITE across a diverse range of LLM judges and tasks, including both pointwise and pairwise comparisons on chatbot leaderboards and AI-reviewer benchmarks. BITE achieves an attack success rate (>!65%) and raises scores by (+1)–(2) on a 9-point scale, while maintaining semantic equivalence. We further uncover model-specific \"vulnerability fingerprints\": judges differ in sensitivity to sentiment, register, and structural cues (e.g., headers), limiting cross-model transferability. Finally, we evaluate stealthiness and show that BITE evades standard style-control and simple detection baselines. Our findings expose a fundamental weakness in the LLM-as-a-judge paradigm and motivate robust, attack-aware evaluation, e.g., style normalization, randomized prompting, and adversarial training of judges.", "authors": "XIANGLIN YANG, Bryan Hooi, Gelei Deng, Tianwei Zhang, Jin Song Dong", "icml_url": "https://icml.cc/virtual/2026/poster/66038", "is_oral": false, "is_spotlight": false, "poster_id": "66038", "presentation_type": "regular", "related_events": "", "title": "Turning Bias into Bugs: Bandit-Guided Style Manipulation Attacks on LLM Judges", "sequence": 5561, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 164, "RL & control": 34, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 114, "LLM adaptation & fine-tuning": 158, "Robotics, VLA & diffusion policy": 102}, "raw_topic_score": 164, "selection_score": 164, "matched_terms": "bandit, contextual bandit, regret", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2810", "poster_number": 2810, "poster_band": "#2000-#2999"}, {"abstract": "Crowdsourced fact-checking systems have been widely adopted by major social media companies such as X, Meta, Tiktok, and Google with the aim of combating misinformation at scale without relying on centralized editorial control. These systems have been developed around a common underlying algorithm: a bridging mechanism—based on matrix factorization—that surfaces notes indicating misinformation only when they receive support from diverse ideological groups rather than simple majority support. Although this algorithm is designed to be robust against traditional brigading, we demonstrate an attack showing that coordinated users can strategically fabricate diverse agreement in the system’s latent space to manipulate the scoring algorithm. We validate this attack on real-world production data and find that a surprisingly large number of notes’ scores can potentially be manipulated with a small number (\u003c 10) of coordinated votes, raising the risk that adversaries could surface arbitrary notes on these social media platforms. We complement these findings with a theoretical analysis of voting strategies that surface arbitrary notes, revealing counterintuitive properties of the system: for instance, rating a note as “Not Helpful” can increase its helpfulness score. Finally, we develop a cost model quantifying manipulation effort and discuss potential mitigations. Following a responsible disclosure process, X's Community Notes team acknowledged this attack and has deployed mitigations based on our findings. We hope this work spurs further research into the robustness of crowdsourced fact-checking systems and, more broadly, bridging-based consensus mechanisms.", "authors": "Nikil Selvam, Jay Baxter, Sophie Hilgard, Brad Miller, Keith Coleman, Ellen Vitercik, Sanmi Koyejo", "icml_url": "https://icml.cc/virtual/2026/poster/64544", "is_oral": false, "is_spotlight": false, "poster_id": "64544", "presentation_type": "regular", "related_events": "", "title": "Gaming Consensus: Coordinated Manipulation in Crowdsourced Fact-Checking", "sequence": 4068, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 132}, "raw_topic_score": 132, "selection_score": 132, "matched_terms": "manipulation, control", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #2900", "poster_number": 2900, "poster_band": "#2000-#2999"}, {"abstract": "LLM-based multi-agent systems excel at planning, tool use, and role coordination, but their openness and interaction complexity also expose them to jailbreak and adversarial collaboration. Existing defenses fall into two lines: (i) self-verification that asks each agent to pre-filter unsafe instructions before execution, and (ii) external guard modules that police behaviors. The former often underperforms because a standalone agent lacks sufficient capacity to detect cross-agent unsafe chains and delegation-induced risks; the latter increases system overhead and creates a single-point-of-failure—once compromised, system-wide safety collapses, and adding more guards worsens cost and complexity. To solve these challenges, we propose AdvEvo-MARL, a co-evolutionary multi-agent reinforcement learning framework that internalizes safety into task agents. Rather than relying on external guards, AdvEvo-MARL jointly optimizes attackers (which synthesize evolving jailbreak prompts) and defenders (task agents trained to both accomplish their duties and resist attacks) in adversarial learning environments. To stabilize learning and foster cooperation, we introduce a public baseline for advantage estimation: agents within the same functional group share a group-level mean-return baseline, enabling lower-variance updates and stronger intra-group coordination. Across representative attack scenarios, AdvEvo-MARL consistently keeps attack-success rate (ASR) below 20\\%, whereas baselines reach up to 38.33\\%, while preserving or even improving task accuracy (up to +3.67\\%). These results show that safety and utility can be jointly improved without relying on extra guard agents or added system overhead.", "authors": "Zhenyu Pan, Yiting Zhang, Zhuo Liu, Yolo Tang, Zeliang Zhang, Haozheng Luo, Chenwei Xu, Yuwei Han, Jianshu Zhang, Dennis Wu, Hong-Yu Chen, Haoran Lu, Haoyang Fang, Manling Li, Chenliang Xu, Philip Yu, Han Liu", "icml_url": "https://icml.cc/virtual/2026/poster/66275", "is_oral": false, "is_spotlight": false, "poster_id": "66275", "presentation_type": "regular", "related_events": "", "title": "AdvEvo-MARL: Shaping Internalized Safety through Adversarial Co-Evolution in Multi-Agent Reinforcement Learning", "sequence": 5797, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 132, "Multi-agent RL, games & coordination": 926, "LLM post-training, RLHF & agents": 350, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 926, "selection_score": 926, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, collaboration, coordination", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3001", "poster_number": 3001, "poster_band": "#3000-#3999"}, {"abstract": "Concept erasure has emerged as a promising approach to mitigate undesired or unsafe content in diffusion models, yet existing methods still face significant limitations. While training-based methods are effective, their high computational cost limits scalability. Editing-based methods are more efficient and deployment-friendly, yet they struggle to simultaneously achieve precise concept erasure and preserve overall generative capacity. We identify this core limitation of the editing-based methods as reliance on additive parameter updates. Our empirical analysis reveals that concept semantics primarily depend on neuron direction rather than neuron magnitude , while overall generative capacity relies on the angular geometry of neurons. As additive updates inherently entangle direction, magnitude, and angular geometry, they inevitably introduce unintended interference between concept erasure and overall generation performance. To address this, we propose Orthogonal Concept Erasure (OCE) , which reformulates editing-based erasure as multiplicative parameter updates from a geometric perspective. Specifically, OCE applies layer-wise orthogonal transformations derived from a closed-form solution to the parameters, enabling precise concept erasure while preserving the neuron magnitude and angular geometry. Furthermore, to address conflicting constraints in multi-concept erasure, OCE introduces a subspace-level objective with structured subspace manipulation, yielding a more effective and scalable erasure. Extensive experiments on single- and multi-concept erasure demonstrate that OCE outperforms existing methods in concept erasure and non-target preservation, erasing up to 100 concepts in 4.3 s.", "authors": "Yuhao Sun, Lingyun Yu, Hao-Xiang Xu, Fengyuan Miao, Zhuoer Xu, Hongtao Xie", "icml_url": "https://icml.cc/virtual/2026/poster/63634", "is_oral": true, "is_spotlight": true, "poster_id": "63634", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6F Social Impacts: GenAI & Video", "title": "Orthogonal Concept Erasure for Diffusion Models", "sequence": 3159, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 62}, "raw_topic_score": 62, "selection_score": 152, "matched_terms": "manipulation, diffusion", "selection_reasons": "oral", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3007", "poster_number": 3007, "poster_band": "#3000-#3999"}, {"poster_id": "67084", "title": "Position: AI/ML Deepfake Research is Misaligned with AI Generated Non-Consensual Intimate Imagery (AIG-NCII)", "authors": "Qiwei Li, Wells Lucas Santo, Sarita Schoenebeck, Eric Gilbert", "abstract": "AI-generated non-consensual intimate imagery (AIG-NCII) is not adequately addressed in AI/ML literature regarding AI-generated media, commonly referred to as \"deepfakes\". While research on deepfakes currently focuses on its epistemic harms—or harms relating to truth and authenticity—this is misaligned with the dominant reality of generative AI abuse involving sexualized imagery. We conduct a landscape analysis of highly-cited works to demonstrate that technical interventions addressing deepfakes almost entirely ignore AIG-NCII, limiting the research ecosystem to authenticity detection tools. In this position paper, we argue that existing interventions address viewer-centric epistemic harms, such as fraud or scams, but ignore subject-centric dignity harms, such as AIG-NCII. We illustrate that knowing an image is synthetic does not mitigate harms to subjects and may, in some cases, even exacerbate them. We conclude by offering recommendations to realign the field, including updating threat models to consider subject-centered harms and addressing AIG-NCII in AI safety research. Finally, we caution that researchers should only engage in this high-risk domain if they implement safety guardrails for both subjects and researchers and establish partnerships with domain experts in sexual violence prevention.", "presentation_type": "position", "is_oral": true, "is_spotlight": false, "icml_url": "https://icml.cc/virtual/2026/poster/67084", "related_events": "Oral presentation: Oral 6F Social Impacts: GenAI & Video", "sequence": "", "award": "Outstanding Position Paper Honorable Mention", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 0, "selection_score": 240, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Position Paper Honorable Mention", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3008", "poster_number": 3008, "poster_band": "#3000-#3999"}, {"abstract": "Pretraining corpora contain extensive discourse about AI systems, yet the causal influence of this discourse on downstream alignment remains poorly understood. If prevailing descriptions of AI behaviour are predominantly negative, LLMs may internalise corresponding behavioural priors, giving rise to self-fulfilling misalignment. This paper provides the first controlled study of this hypothesis by pretraining 6.9B-parameter LLMs with varying amounts of (mis)alignment discourse. We find that discussion of AI contributes to misalignment. Upsampling synthetic training documents about AI misalignment leads to a notable increase in misaligned behaviour. Conversely, upsampling documents about aligned behaviour reduces misalignment scores from 45% to 9%. We consider this evidence of self-fulfilling alignment. These effects are dampened, but persist through post-training. Our findings establish the study of how pretraining data shapes alignment priors, or alignment pretraining, as a complement to post-training. We recommend practitioners pretrain for alignment as well as capabilities.", "authors": "Cameron Tice, Puria Radmard, Samuel Ratnam, Andy Kim, David Africa, Kyle O'Brien", "icml_url": "https://icml.cc/virtual/2026/poster/65894", "is_oral": false, "is_spotlight": true, "poster_id": "65894", "presentation_type": "spotlight", "related_events": "", "title": "Alignment Pretraining: AI Discourse Causes Self-Fulfilling (Mis)alignment", "sequence": 5417, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 420, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 420, "selection_score": 465, "matched_terms": "post-training, alignment, llm", "selection_reasons": "spotlight", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3205", "poster_number": 3205, "poster_band": "#3000-#3999"}, {"abstract": "Reinforcement learning (RL) has achieved remarkable success across complex decision-making tasks, especially with the advent of deep neural networks. However, the resulting models are often opaque, making their deployment in safety-critical domains challenging. Explainable AI aims to address this issue, but most specific efforts for deep RL remain limited either to post-hoc explanation methods or to imitation learning and distillation procedures. These latter approaches rely on pre-trained black-box agents and are typically restricted to environments with discrete action spaces, limiting their scalability and interpretability. In this paper, we introduce ProtoSAC, a novel deep RL architecture that integrates a prototype-based actor into the Soft Actor-Critic (SAC) algorithm, enabling intrinsic interpretability in continuous action spaces. Our method learns a set of prototypes that represent interpretable state clusters, each associated with a Gaussian action distribution. Actions are generated as a similarity-weighted mixture over these prototypes, providing transparent decision-making without sacrificing performance. We evaluate ProtoSAC on continuous action-space environments and show that it matches the performance of the original SAC while offering enhanced interpretability.", "authors": "Andrea Marzo, Alessio Ragno, Roberto Capobianco", "icml_url": "https://icml.cc/virtual/2026/poster/62377", "is_oral": false, "is_spotlight": false, "poster_id": "62377", "presentation_type": "regular", "related_events": "", "title": "This State Looks Like That: Self-Interpretable Reinforcement Learning Agents using Prototype Soft Actor-Critic", "sequence": 1904, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 200, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 128, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 22}, "raw_topic_score": 200, "selection_score": 200, "matched_terms": "reinforcement learning, actor-critic", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3300", "poster_number": 3300, "poster_band": "#3000-#3999"}, {"abstract": "We study equilibrium pricing in oligopolistic data markets with budget-constrained buyers (e.g., ML companies purchasing data to improve model accuracy) and strategic data sellers. Sellers compete by setting prices for their datasets, giving rise to a pricing game whose pure Nash equilibria correspond to equilibrium prices. While equilibrium prices are guaranteed for rivalrous goods via competitive equilibrium, we show that the non-rivalry of data fundamentally alters this picture: an exact Nash equilibrium need not exist, and in fact no 1.364-approximate equilibrium exists under uniform pricing. We therefore investigate relaxed equilibrium notions. Allowing sellers to use beyond-uniform pricing—specifically, piecewise-linear convex pricing functions—guarantees approximate stability within a constant factor: there exists a pricing profile in which no seller can improve revenue by a factor of two by deviating to any uniform price (a 2-approximate Nash equilibrium). Finally, our simulations demonstrate fast convergence and empirical approximation guarantees that outperform the worst-case bound of 2.", "authors": "Bhaskar Ray Chaudhury, Jugal Garg, Eklavya Sharma, Jiaxin Song", "icml_url": "https://icml.cc/virtual/2026/poster/63852", "is_oral": true, "is_spotlight": true, "poster_id": "63852", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6E Game Theory & Big Tech", "title": "Equilibrium Pricing in Oligopolistic Data Markets", "sequence": 3377, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 498, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 498, "selection_score": 938, "matched_terms": "game, nash, equilibrium, oligopolistic", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3503", "poster_number": 3503, "poster_band": "#3000-#3999"}, {"abstract": "Post-training adaptation has become the central paradigm for leveraging large language models (LLMs) in recommendation.  While recent preference optimization methods, such as Direct Preference Optimization (DPO), enhance pairwise preference discrimination, they remain vulnerable to \\emph{reward hacking}: models exploit imperfections in reward signals, leading to inflated training metrics without genuine recommendation gains. We analyze this issue from a gradient perspective and formalize the concept of the  \\emph{$\\varepsilon$-insensitive region} region, where pairwise updates exert little influence on the ordering between positives and unsampled negatives. Under the Bradley–Terry model, we further show that these regions can occupy a substantial fraction of the preference space, inevitably leading to misaligned rankings. To address this issue, we propose Simulated Preference Optimization for Reward-hacking mitigation using Pseudo-negatives (SIRIUS).  Our framework introduces pseudo-negative samples to enrich contrastive signals and reduce the prevalence of $\\varepsilon$-insensitive regions. Extensive experiments on three public benchmarks show that \\our{} consistently improves ranking quality and effectively mitigates reward hacking, providing both theoretical and practical insights for advancing LLM-based recommendation.  Our code is available at \\url{https://anonymous.4open.science/r/C557-id}", "authors": "Heyu Chen, Junkang Wu, Guoqing Hu, Kexin Huang, Xiang Wang, Jiancan Wu", "icml_url": "https://icml.cc/virtual/2026/poster/66384", "is_oral": false, "is_spotlight": false, "poster_id": "66384", "presentation_type": "regular", "related_events": "", "title": "Mitigating Reward Hacking in LLM-based Recommendation: A Preference Optimization Approach", "sequence": 5904, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 362, "LLM adaptation & fine-tuning": 106, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 362, "selection_score": 362, "matched_terms": "preference optimization, dpo, post-training, large language model, llm, language model", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3603", "poster_number": 3603, "poster_band": "#3000-#3999"}, {"abstract": "Low-Rank Adaptation (LoRA) has gained popularity as a fine-tuning approach for Large Language Models (LLMs) due to its low resource requirements and good performance. While numerous studies have investigated improving LoRA serving efficiency by serving multiple LoRAs concurrently, existing methods assume that a wide range of LoRA adapters are available for serving. In our work, we conduct extensive empirical studies to show that current LoRA training paradigms do not efficiently utilize hardware resources and incur high overhead to obtain a performant LoRA adapter. Leveraging these insights, we propose PLoRA, which automatically orchestrates concurrent LoRA fine-tuning jobs under given hardware and model constraints and develops performant kernels to improve training efficiency. Across a range of LLMs and LoRA configurations, PLoRA improves training throughput by up to 12.8x and reduces the overall fine-tuning makespan by up to 7.52x compared to existing approaches.", "authors": "Minghao Yan, Zhuang Wang, Zhen Jia, Shivaram Venkataraman, Yida Wang", "icml_url": "https://icml.cc/virtual/2026/poster/62013", "is_oral": false, "is_spotlight": false, "poster_id": "62013", "presentation_type": "regular", "related_events": "", "title": "PLoRA: Efficient Concurrent LoRA Training for Large Language Models", "sequence": 1540, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 148, "LLM adaptation & fine-tuning": 976, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 976, "selection_score": 976, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapter, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3700", "poster_number": 3700, "poster_band": "#3000-#3999"}, {"abstract": "Federated fine-tuning presents a promising avenue for adapting Large Language Models (LLMs) to downstream tasks while preserving data privacy. However, the prohibitive computational and communication overhead of LLM adaptation inhibits its deployment on resource-constrained edge devices. In this paper, we propose SmartFed, a resource-efficient framework that circumvents expensive training from scratch by intelligently reusing knowledge embedded in existing LoRA modules. To fully exploit this potential and ensure scalability, we introduce the Mixture of Rank-Wise Experts (MoRE). MoRE decomposes LoRA modules into fine-grained rank-level experts, which are selectively activated based on input semantics and resource budgets. Furthermore, to optimize resource utilization, we propose Elastic Expert Quota Allocation (EEQA), a strategy that adaptively distributes expert capacity across parameter matrices based on their contribution to model performance. Extensive evaluations across multiple benchmarks demonstrate that SmartFed significantly outperforms state-of-the-art methods in both model performance and training efficiency.", "authors": "Yebo Wu, Jingguang Li, Zhijiang Guo, Li Li", "icml_url": "https://icml.cc/virtual/2026/poster/65026", "is_oral": false, "is_spotlight": true, "poster_id": "65026", "presentation_type": "spotlight", "related_events": "", "title": "Don't Reinvent the Wheel, Just Realign the Spokes: Resource-Efficient Federated Fine-Tuning via Rank-Wise Expert Assembly", "sequence": 4550, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 58, "LLM adaptation & fine-tuning": 562, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 562, "selection_score": 847, "matched_terms": "llm adaptation, fine-tuning, lora, federated fine-tuning, adapt, large language model, language model, llm", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3900", "poster_number": 3900, "poster_band": "#3000-#3999"}, {"abstract": "Entropic optimal transport (EOT) via Sinkhorn iterations is widely used in modern machine learning, yet GPU solvers remain inefficient at scale. Tensorized implementations suffer quadratic HBM traffic from dense $n\\times m$ interactions, while existing online backends avoid storing dense matrices but still rely on generic tiled map-reduce reduction kernels with limited fusion.  We present **FlashSinkhorn**, an IO-aware EOT solver for squared Euclidean cost that rewrites stabilized log-domain Sinkhorn updates as row-wise LogSumExp reductions of biased dot-product scores, the same normalization as transformer attention. This enables FlashAttention-style fusion and tiling: fused Triton kernels stream tiles through on-chip SRAM and update dual potentials in a single pass, substantially reducing HBM IO per iteration while retaining linear-memory operations. We further provide streaming kernels for transport application, enabling scalable first- and second-order optimization. On A100 GPUs, FlashSinkhorn achieves up to $32\\times$ forward-pass and $161\\times$ end-to-end speedups over state-of-the-art online baselines on point-cloud OT, improves scalability on OT-based downstream tasks.", "authors": "Felix X.-F. Ye, Xingjie Li, An Yu, Ming-Ching Chang, LINSONG CHU, Davis Wertheimer", "icml_url": "https://icml.cc/virtual/2026/poster/63564", "is_oral": true, "is_spotlight": true, "poster_id": "63564", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6D Scalability, Software, Hardware", "title": "FlashSinkhorn: IO-Aware Entropic Optimal Transport on GPU", "sequence": 3089, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 12, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 12, "selection_score": 102, "matched_terms": "streaming", "selection_reasons": "oral", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #3910", "poster_number": 3910, "poster_band": "#3000-#3999"}, {"abstract": "Ultrafast online learning is essential for high-frequency systems, such as controls for quantum computing and nuclear fusion, where adaptation must occur on sub-microsecond timescales. Meeting these requirements demands low-latency, fixed-precision computation under strict memory constraints, a regime in which conventional Multi-Layer Perceptrons (MLPs) are both inefficient and numerically unstable. We identify key properties of Kolmogorov-Arnold Networks (KANs) that align with these constraints. Specifically, we show that: (i) KAN updates exploiting B-spline locality are sparse, enabling superior on-chip resource scaling, and (ii) KANs are inherently robust to fixed-point quantization. By implementing fixed-point online training on Field-Programmable Gate Arrays (FPGAs), a representative platform for on-chip computation, we demonstrate that KAN-based online learners are significantly more efficient and expressive than MLPs across a range of low-latency and resource-constrained tasks. To our knowledge, this work is the first to demonstrate model-free online learning at sub-microsecond latencies.", "authors": "Duc Hoang, Aarush Gupta, Philip Harris", "icml_url": "https://icml.cc/virtual/2026/poster/65081", "is_oral": false, "is_spotlight": false, "poster_id": "65081", "presentation_type": "regular", "related_events": "", "title": "Ultrafast On-Chip Online Learning via Spline Locality in Kolmogorov–Arnold Networks", "sequence": 4605, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 150, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 150, "selection_score": 150, "matched_terms": "online learning", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #4207", "poster_number": 4207, "poster_band": "#4000-#4999"}, {"abstract": "Pre-trained models with parameter-efficient fine-tuning have shown strong effectiveness in Class-Incremental Learning (CIL), which seeks to balance model plasticity and stability. In this context, orthogonality constraints can significantly enhance model stability, yet their reliance on subspace inevitably compromises model plasticity over long tasks. To address this, we propose Gradient-Recycling Low-Rank Adaptation (GR-LoRA), which reconciles stability and plasticity by recycling the gradients discarded in orthogonal projection. Specifically, GR-LoRA recycles post-decomposition non-orthogonal gradient components into task-specific lightweight modules and selects optimal module via entropy to improve plasticity, while incorporating local and global mismatch suppression to preserve stability by synthesizing out-of-distribution representations across all tasks. Theoretical analysis confirms that this recycling strategy preserves stability and improves plasticity. Experimental results from multiple CIL benchmarks verify the effectiveness and general applicability of GR-LoRA.", "authors": "Yipeng Lin, Fengqiang Wan, Yang Yang", "icml_url": "https://icml.cc/virtual/2026/poster/64527", "is_oral": false, "is_spotlight": true, "poster_id": "64527", "presentation_type": "spotlight", "related_events": "", "title": "GR-LoRA: Gradient-Recycling Low-Rank Adaptation for Class-Incremental Learning", "sequence": 4051, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 536, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 536, "selection_score": 581, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt", "selection_reasons": "spotlight", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #4309", "poster_number": 4309, "poster_band": "#4000-#4999"}, {"abstract": "We study infinite-horizon discounted Markov decision processes (DMDPs) under a generative model. Motivated by the Algorithms with Advice framework (Mitzenmacher and Vassilvitskii, 2022), we propose a novel framework to investigate how black-box predictions of the transition matrix can enhance sample efficiency in solving DMDPs and improve sample complexity bounds. We focus on DMDPs with $N$ state–action pairs and discount factor $\\gamma$. We first provide an impossibility result showing that, in the presence of predictions with unknown accuracy, no sampling policy can compute an $\\epsilon$-optimal policy with a sample complexity better than $\\tilde{O}((1-\\gamma)^{-3} N \\epsilon^{-2})$, which matches the state-of-the-art minimax sample complexity bound without prediction. In complement, we design an algorithm based on minimax optimization techniques that leverages predictions of the transition matrix without requiring knowledge of the prediction error. Our algorithm achieves a sample complexity bound that depends on the prediction error and is uniformly better than $\\tilde{O}((1-\\gamma)^{-4} N \\epsilon^{-2})$, the previous best result derived from convex optimization methods. In some cases, our bound even improves upon the state-of-the-art $\\tilde{O}((1-\\gamma)^{-3} N \\epsilon^{-2})$, despite not having access to the prediction quality.", "authors": "Lixing Lyu, Jiashuo Jiang, Wang Chi Cheung", "icml_url": "https://icml.cc/virtual/2026/poster/66749", "is_oral": false, "is_spotlight": false, "poster_id": "66749", "presentation_type": "regular", "related_events": "", "title": "Efficiently Solving Discounted MDPs via Predictions with Unknown Prediction Errors", "sequence": 6267, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 210, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 210, "selection_score": 210, "matched_terms": "markov decision, mdp", "selection_reasons": "", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #4501", "poster_number": 4501, "poster_band": "#4000-#4999"}, {"abstract": "We examine the interplay between ordinal, preference-based solution concepts in games and the outcomes of payoff-driven learning dynamics, asking to what extent the combinatorial data of a game—its preference graph—can predict the long-run behavior of no-regret dynamics such as follow-the-regularized-leader (FTRL). In one direction, we show that the skeleton of every dynamically stable set, i.e., the set of pure profiles it contains, must be preferentially stable , that is, closed under pure profitable deviations. We then ask the converse question: when are preferences sufficient to describe long-run behavior? For subgames —subsets of pure profiles obtained by restricting players’ action sets—preferences are enough to fully characterize asymptotic stability. Beyond subgames however, we construct a three-player counterexample with a preferentially stable set whose span is dynamically unstable , thus establishing that preferences are not sufficient to describe dynamically stable behavior in general. To restore stability, we introduce the notion of leaklessness , a measure of aggregate payoff drift away from a set of pure profiles, and use it to identify a payoff-based condition under which the span of a set of pure profiles remains stable and attracting, thereby setting forth a natural cardinal guarantee of dynamic stability.", "authors": "Omar Abbadi, Rida Laraki, Panayotis Mertikopoulos", "icml_url": "https://icml.cc/virtual/2026/poster/66240", "is_oral": true, "is_spotlight": true, "poster_id": "66240", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6E Game Theory & Big Tech", "title": "What Preferences Can—and Cannot—Predict in Multi-Agent Online Learning", "sequence": 5762, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 98, "RL & control": 8, "Multi-agent RL, games & coordination": 490, "LLM post-training, RLHF & agents": 30, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 490, "selection_score": 690, "matched_terms": "multi-agent, game, games, multi-agent online learning", "selection_reasons": "oral, oral robotics / multi-agent RL focus", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #4503", "poster_number": 4503, "poster_band": "#4000-#4999"}, {"abstract": "We study the existence and computation of Nash equilibria in concave games where the players' admissible strategies are subject to shared coupling constraints. Under playerwise concavity of constraints, we prove existence of Nash equilibria. Our proof leverages topological fixed point theory and novel structural insights into the contractibility of feasible sets, and relaxes strong assumptions for existence in prior work. Having established existence, we address the question of whether in the presence of coupling constraints, playerwise independent learning dynamics have convergence guarantees. We address this positively for the class of potential games by designing a convergent algorithm. To account for the possibly nonconvex feasible region, we employ a log barrier regularized gradient ascent with adaptive stepsizes.  Starting from an initial feasible strategy profile and under exact gradient feedback, the proposed method converges to an $\\epsilon$-approximate constrained Nash equilibrium within $\\mathcal{O}(\\epsilon^{-3})$ iterations.", "authors": "Philip Jordan, Maryam Kamgarpour", "icml_url": "https://icml.cc/virtual/2026/poster/65678", "is_oral": true, "is_spotlight": true, "poster_id": "65678", "presentation_type": "oral", "related_events": "Oral presentation: Oral 6E Game Theory & Big Tech", "title": "Nash Equilibria in Games with Playerwise Concave Coupling Constraints: Existence and Computation", "sequence": 5201, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 512, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 512, "selection_score": 952, "matched_terms": "game, games, nash, equilibrium, potential games", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Thu, Jul 9, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Thu, Jul 9, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-09T01:00:00-07:00", "location": "HALL A #4507", "poster_number": 4507, "poster_band": "#4000-#4999"}]}], "noTime": [{"abstract": "Federated Learning (FL) enables collaborative training across distributed clients while preserving data privacy. However, fine-tuning large-scale pre-trained models in FL is hindered by resource constraints and communication costs. Although introducing parameter-efficient fine-tuning strategies such as Low-Rank Adaptation (LoRA) effectively reduces trainable parameters, this low-rank constraint exacerbates noise sensitivity, leading to overfitting and aggregation bias. Existing robust federated fine-tuning methods rely on additional proxy data and treat low-rank adapters as generic weight vectors. In this paper, we investigate the structural properties of LoRA and reveal a robustness asymmetry. The down-projection matrix $A$ extracts stable general features, whereas the up-projection matrix $B$ is highly susceptible to fitting noise patterns. Based on this finding, we propose Federated Decoupled LoRA (FDLoRA), which employs a dual-branch mechanism to decouple robust feature learning from noise modeling and mitigates noise interference through noisy branch negative learning. During federated aggregation, we establish global consensus through aggregating $B$ while preserving local feature alignment in $A$. Extensive experiments demonstrate that FDLoRA outperforms existing state-of-the-art methods across various noisy federated scenarios. Our code and models will be released.", "authors": "Xiuwen Fang, Xuliang Yang, Mang Ye", "icml_url": "https://icml.cc/virtual/2026/poster/62682", "is_oral": false, "is_spotlight": false, "poster_id": "62682", "presentation_type": "regular", "related_events": "", "title": "Decoupled Low-Rank Adaptation for Robust Federated Fine-Tuning", "sequence": 2208, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 902, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 902, "selection_score": 902, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapter, federated fine-tuning, adapt", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Motivated by the recency effect in online learning, we study algorithms for single-pass \\emph{sliding-window streaming multi-armed bandits (MABs)} in this paper. In this setting, we are given $n$ arms with unknown sub-Gaussian reward distributions and a parameter $W$. The arms arrive in a single-pass stream, and only the most recent $W$ arms are considered valid. The algorithm is required to perform pure exploration and regret minimization with \\emph{limited memory}, \\textcolor{red}{defined as the number of stored arms}. The model is a natural extension of the streaming multi-armed bandits model (without the sliding window) that has been extensively studied in recent years. We provide a comprehensive analysis of both the pure exploration and regret minimization problems with the model.  For pure exploration, we prove that finding the best arm is hard with sublinear memory while finding an \\emph{approximate} best arm admits an efficient algorithm. For regret minimization, we explore a new notion of regret and give sharp memory-regret trade-offs for any single-pass algorithms. We complement our theoretical results with experiments, demonstrating the trade-offs between sample, regret, and memory.", "authors": "Vladimir Braverman, Chen Wang, Liudeng Wang, Samson Zhou", "icml_url": "https://icml.cc/virtual/2026/poster/61941", "is_oral": false, "is_spotlight": false, "poster_id": "61941", "presentation_type": "regular", "related_events": "", "title": "Online Learning with Recency: Algorithms for Sliding-window Streaming Multi-armed Bandits", "sequence": 1468, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 630, "RL & control": 84, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 114, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 630, "selection_score": 870, "matched_terms": "online learning, streaming, bandit, bandits, pure exploration, best arm, regret", "selection_reasons": "user-named / must include", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Robots in dynamic, human-centric environments must follow language instructions while maintaining real-time reactive control. Vision-language-action (VLA) models offer a promising framework, but they assume temporally aligned reasoning and control, despite semantic inference being inherently delayed relative to real-time action. We introduce Think-in-Control (TIC)-VLA, a latency-aware framework that explicitly models delayed semantic reasoning during action generation. TIC-VLA defines a delayed semantic-control interface that conditions action generation on delayed vision-language semantic states and explicit latency metadata, in addition to current observations. We further propose a latency-consistent training pipeline that injects reasoning inference delays during imitation learning and online reinforcement learning, aligning training with asynchronous deployment. To support realistic evaluation, we present DynaNav, a physics-accurate, photo-realistic simulation suite for language-guided navigation in dynamic environments. Extensive experiments in simulation and on a real robot show that TIC-VLA consistently outperforms prior VLA models while maintaining robust real-time control under multi-second reasoning latency. Code, data, and benchmarks will be released for reproducibility.", "authors": "Zhiyu Huang, Yun Zhang, Johnson Liu, Rui Song, Chen Tang, Jiaqi Ma", "icml_url": "https://icml.cc/virtual/2026/poster/65809", "is_oral": false, "is_spotlight": false, "poster_id": "65809", "presentation_type": "regular", "related_events": "", "title": "TIC-VLA: A Think-in-Control Vision-Language-Action Model for Robot Navigation in Dynamic Environments", "sequence": 5332, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 142, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 40, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 828}, "raw_topic_score": 828, "selection_score": 828, "matched_terms": "vision-language-action, vla, robot, navigation, imitation learning, control", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Recent work has explored optimizing LLM collaboration through Multi-Agent Reinforcement Learning (MARL). However, most MARL fine-tuning approaches rely on predefined execution protocols, which often require centralized execution. Decentralized LLM collaboration is more appealing in practice, as agents can run inference in parallel with flexible deployments. Also, current approaches use Monte Carlo methods for fine-tuning, which suffer from high variance and thus require more samples to train effectively. Actor-critic methods are prevalent in MARL for dealing with these issues, so we developed Multi-Agent Actor-Critic (MAAC) methods to optimize decentralized LLM collaboration. In this paper, we analyze when and why these MAAC methods are beneficial. We propose 2 MAAC approaches, CoLLM-CC with a Centralized Critic and CoLLM-DC with Decentralized Critics. Our experiments across writing, coding, and game-playing domains show that Monte Carlo methods and CoLLM-DC can achieve performance comparable to CoLLM-CC in short-horizon and dense-reward settings. However, they both underperform CoLLM-CC on long-horizon or sparse-reward tasks, where Monte Carlo methods require substantially more samples and CoLLM-DC struggles to converge.", "authors": "Shuo Liu, Tianle Chen, Ryan Amiri, Christopher Amato", "icml_url": "https://icml.cc/virtual/2026/poster/62068", "is_oral": false, "is_spotlight": false, "poster_id": "62068", "presentation_type": "regular", "related_events": "", "title": "Learning Decentralized LLM Collaboration with Multi-Agent Actor Critic", "sequence": 1595, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 70, "Multi-agent RL, games & coordination": 824, "LLM post-training, RLHF & agents": 282, "LLM adaptation & fine-tuning": 236, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 824, "selection_score": 824, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, decentralized, collaboration, game", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "The diversity of robot embodiments and action spaces makes it challenging to build robot world models that generalize across different embodiments. We introduce a Latent Action Conditioned Robot World Model (LAC-WM), which operates within a learned unified latent action space shared across diverse embodiments. We show how this unified action space improves the world model’s performance when adapted to previously unseen robot embodiments. We compare LAC-WM to a baseline model, Explicit Action Conditioned World Model (EAC-WM) conditioned on explicit motion labels. Our results show that conditioning on explicit labels creates disjoint action spaces across embodiments, limiting downstream task performance when adapting to new robots. We evaluate both models on a dexterous manipulation task. The latent action-conditioned model LAC-WM achieves up to a 46.7% improvement in performance over EAC-WM. Crucially, the unified latent action space allows LAC-WM’s downstream performance to scale positively with the number of embodiments used during pretraining. In contrast, the disjoint action space in EAC-WM leads to decreased performance as the number of pretraining embodiments increases. These results highlights the importance of a unified action space for efficient cross-embodiment learning, addressing a key challenge in robotics.", "authors": "Huang Huang, Sriram Yenamandra, Arjun Majumdar, Elie Aljalbout, Tushar Nagarajan, Jimmy Yang, Akshara Rai, Michael Rabbat, Li Fei-Fei, Jiajun Wu, Tingfan Wu, Franziska Meier", "icml_url": "https://icml.cc/virtual/2026/poster/63978", "is_oral": false, "is_spotlight": false, "poster_id": "63978", "presentation_type": "regular", "related_events": "", "title": "Cross-Embodiment Robot Foundation World Models with Latent Actions", "sequence": 3503, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 760}, "raw_topic_score": 760, "selection_score": 760, "matched_terms": "robot, robotic, robotics, manipulation, latent action, world model", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Contextual bandits serve as a foundational framework for sequential decision-making in domains like recommendation systems, IoT device management, and conversational AI, yet classical models overlook a critical practical constraint: acquiring extra observations incurs non-trivial costs, creating an unaddressed trade-off between information gain and expenditure. To fill this gap, we study contextual bandits with paid observations, where the learner actively chooses which actions to observe (at a specified cost) in each round, with the goal of minimizing total regret that combines learning losses and cumulative observation costs. We first design a near-optimal algorithm for adversarial environments, proving it achieves a regret rate significantly higher than that of cost-free contextual bandits—even for small observation costs—thus quantifying how paid observations reshape learning complexity. We then uncover a critical phase-transition phenomenon when incorporating free observation budgets: below a threshold budget, free observations only reduce total costs without changing the underlying regret rate, while above this threshold, they drastically improve learning efficiency, lowering the regret rate to match that of cost-free settings. To leverage this phenomenon, we develop a meta-controller that adaptively switches strategies based on the available budget, ensuring near-optimal performance across both low- and high-budget regimes. Furthermore, to address practical challenges like infinite policy spaces and computational inefficiency, we propose an oracle-efficient algorithm under a function approximation framework, which leverages an online regression oracle to maintain strong performance for stochastic losses. Our results also shed light on the scenarios about switching costs, budgeted constraints, model misspecification and the trade-offs involved in knapsack problems. Finally, we conduct numerical experiments to validate our theoretical findings and demonstrate practical efficiency. Key words: Contextual bandit, paid observation, function approximation, phase transition.", "authors": "Xueping Gong, Jiheng Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/63917", "is_oral": false, "is_spotlight": false, "poster_id": "63917", "presentation_type": "regular", "related_events": "", "title": "The Cost of Information: Phase Transitions in Contextual Bandits with Paid Observations", "sequence": 3442, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 704, "RL & control": 46, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 24, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 704, "selection_score": 704, "matched_terms": "bandit, bandits, contextual bandit, regret", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Linear bandits have long been a central topic in online learning, with applications ranging from recommendation systems to adaptive clinical trials. Their general learnability has been established when the objective is to minimise the inner product between a cost parameter and the decision variable. While this is highly general, this reliance on an inner product structure belies the name of \\emph{linear} bandits, and fails to account for problems such as Optimal Transport. Using the Kantorovich formulation of Optimal Transport as an example, this article shows that an inner product structure is \\emph{not} necessary to achieve efficient learning in linear bandits. We propose a refinement of the classical OFUL algorithm that operates by embedding the action set into a Hilbertian subspace, where confidence sets can be built via least-squares estimation. Actions are then constrained to this subspace by penalising optimism. The analysis is completed by leveraging convergence results from penalised (entropic) transport to the Kantorovich problem. Up to this approximation term, the resulting algorithm achieves the same trajectorial regret upper bounds as the OFUL algorithm, which we turn into worst-case regret using functional regression techniques. Its regret interpolates between $\\tilde{\\mathcal O}(\\sqrt{T})$ and ${\\mathcal O}(T)$, depending on the regularity of the cost function, and recovers the parametric rate $\\tilde{\\mathcal O}(\\sqrt{dT})$ in finite-dimensional settings.", "authors": "Lorenzo Croissant", "icml_url": "https://icml.cc/virtual/2026/poster/61000", "is_oral": false, "is_spotlight": false, "poster_id": "61000", "presentation_type": "regular", "related_events": "", "title": "Linear Bandits beyond Inner Product Spaces, the case of Bandit Optimal Transport", "sequence": 528, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 694, "RL & control": 24, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 694, "selection_score": 694, "matched_terms": "online learning, bandit, bandits, linear bandit, regret", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "Decentralized multi-agent reinforcement learning  faces a persistent exploration–coordination tension: intrinsic rewards promote exploration under sparse feedback, yet effective cooperation requires agents’ behaviors to remain consistent over a limited communication graph. Existing methods often combine exploration bonuses and coordination regularizers with fixed-weight schedules, making them hard to tune and prone to either fragmented conventions or premature behavioral collapse. We propose the IEC (Isomorphic Exploration-Consensus) framework that couples exploration and coordination through a single constrained objective: maximize task return augmented with two complementary exploration signals, dynamics-based information gain and state-coverage novelty, while constraining graph-induced policy disagreement via a spectral smoothness penalty on neighboring agents, which can be interpreted as a Dirichlet-energy regularizer on the communication graph. IEC optimizes the resulting Lagrangian with a lightweight primal–dual update that adapts the consensus multiplier from observed constraint violations, yielding an automatic shift from diverse exploration to stable cooperative conventions. Across three distinct benchmarks, IEC achieves superior performance.", "authors": "Jiajun Wu, Xuefeng Du, Yuduo Zheng, Fengqi Li", "icml_url": "https://icml.cc/virtual/2026/poster/65199", "is_oral": false, "is_spotlight": false, "poster_id": "65199", "presentation_type": "regular", "related_events": "", "title": "IEC: When Information-Driven Exploration Meets Spectral Consensus via Primal–Dual Reward Regularization in Decentralized Multi-Agent RL", "sequence": 4723, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 150, "Multi-agent RL, games & coordination": 664, "LLM post-training, RLHF & agents": 124, "LLM adaptation & fine-tuning": 388, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 664, "selection_score": 664, "matched_terms": "multi-agent reinforcement learning, multi-agent rl, multi-agent, decentralized, coordination, cooperative", "selection_reasons": "", "icml_time": "", "kst_start": "", "timezone_from_page": "", "date_label": "", "time_sort_key": "9999-12-31T23:59:00+00:00", "location": "", "poster_number": 99999, "poster_band": "Poster number not listed"}, {"abstract": "As large language models (LLMs) continue to scale in size, the computational overhead has become a major bottleneck for task-specific fine-tuning. While low-rank adaptation (LoRA) effectively curtails this cost by confining the weight updates to a low-dimensional subspace, such a restriction can hinder effectiveness and slow convergence. This contribution deals with these limitations by accumulating progressively a high-rank weight update from consecutive low-rank increments. Specifically, the per update optimal low-rank matrix is identified to minimize the loss function and closely approximate full fine-tuning. To endow efficient and seamless optimization without restarting, this optimal choice is formed by appropriately scaling the columns of the original low-rank matrix. Rigorous performance guarantees reveal that the optimal scaling can be found analytically. Extensive numerical tests with popular LLMs scaling up to 12 billion parameters demonstrate a consistent performance gain and fast convergence relative to state-of-the-art LoRA variants on diverse tasks including natural language understanding, commonsense reasoning, and mathematical problem solving.", "authors": "Yilang Zhang, Xiaodong Yang, Yiwei Cai, Georgios B. Giannakis", "icml_url": "https://icml.cc/virtual/2026/poster/63892", "is_oral": false, "is_spotlight": false, "poster_id": "63892", "presentation_type": "regular", "related_events": "", "title": "ScaLoRA: Optimally Scaled Low-Rank Adaptation for Efficient High-Rank Fine-Tuning", "sequence": 3417, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 68, "LLM adaptation & fine-tuning": 648, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 64
