n reward. We further introduce  a bridge function that recovers the conditional mean reward without explicitly modeling  the MNAR mechanism, and estimate it via a min-max procedure to avoid double sampling.  Building upon these identification results, we propose an Fitted-Q-Evaluation-style estimator that  propagates the recovered rewards while allowing target policies to depend on past  missingness indicators. Finally, we establish consistency and finite-sample error bounds for our OPE estimator, and show through simulations the strong performance of our method compared to existing benchmarks.", "authors": "Ziheng Wei, Rui Miao, Annie Qu", "icml_url": "https://icml.cc/virtual/2026/poster/60871", "is_oral": false, "is_spotlight": false, "poster_id": "60871", "presentation_type": "regular", "related_events": "", "title": "Off-Policy Evaluation for Missingness-Aware Policies in MDPs with Rewards Missing Not at Random", "sequence": 400, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 178, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 178, "selection_score": 178, "matched_terms": "reinforcement learning, offline reinforcement, markov decision, mdp", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #209", "poster_number": 209, "poster_band": "#0000-#0999"}, {"abstract": "Despite the success of reinforcement learning from human feedback (RLHF) in aligning language models, current reward modeling heavily relies on explicit preference data with high collection costs. In this work, we study implicit reward modeling---learning reward models from implicit human feedback---which offers a cost-effective alternative. We identify two fundamental challenges in implicit reward modeling: (1) Implicit preference data lacks definitive negative samples, which makes standard positive-negative classification methods inapplicable;  (2) Implicit preference data suffers from user preference bias, where different responses have different propensities to elicit user feedback actions, which exacerbates the difficulty of distinguishing definitive negative samples.   To address these challenges, we propose ImplicitRM, which aims to learn unbiased reward models from implicit preference data. ImplicitRM stratifies training samples into four latent groups via a stratification model. Building on this, it derives a learning objective through likelihood maximization, which we prove is theoretically unbiased, effectively resolving both challenges. Experiments demonstrate that ImplicitRM learns accurate reward models across implicit preference datasets. Code is available at https://anonymous.4open.science/r/ImplicitRM-5FB3.", "authors": "Eric Wang, Haocheng Yang, Licheng Pan, Lei Shen, Xiaoxi Li, Yinuo Wang, Zhichao Chen, Yuan Lu, Haoxuan Li, Zhouchen Lin", "icml_url": "https://icml.cc/virtual/2026/poster/61820", "is_oral": false, "is_spotlight": false, "poster_id": "61820", "presentation_type": "regular", "related_events": "", "title": "Unbiased Reward Modeling from Implicit Preference", "sequence": 1348, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 414, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 414, "selection_score": 414, "matched_terms": "rlhf, reward model, reward modeling, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #305", "poster_number": 305, "poster_band": "#0000-#0999"}, {"abstract": "Long-tailed multi-label text classification is often treated as a data scarcity problem, addressed by re-sampling or fixed re-weighting. We argue that a central failure mode is \\textit{dominant coalition capture}: frequent labels, amplified by spurious co-occurrences, form dominant coalitions that dominate shared representations and gradient allocation during optimization. As a result, rare labels are learned via superficial shortcuts, yielding brittle generalization under distribution shifts. We propose \\textbf{NBCG}, a Nash-Bargained Causal Game that reformulates multi-label learning as a cooperative bargaining process among label coalitions. NBCG first leverages Neural Structural Equation Models to learn a directed dependency structure, inducing causally coherent coalitions---rather than random partitions---and coalition-specific communication masks. We then optimize a Nash bargaining objective over coalition utilities relative to an adaptive disagreement point, which serves as a principled credit-allocation mechanism: it adaptively prioritizes under-served coalitions while maintaining a Pareto-efficient trade-off among all players.", "authors": "Jing Yang, Jusheng Zhang, Keze Wang", "icml_url": "https://icml.cc/virtual/2026/poster/62154", "is_oral": false, "is_spotlight": false, "poster_id": "62154", "presentation_type": "regular", "related_events": "", "title": "NBCG: Nash-Bargained Causal Game for Long-Tailed Multi-Label NLP", "sequence": 1681, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 0, "Multi-agent RL, games & coordination": 302, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 16, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 302, "selection_score": 302, "matched_terms": "cooperative, game, nash", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #308", "poster_number": 308, "poster_band": "#0000-#0999"}, {"abstract": "Continual learning is a long-standing challenge in robot policy learning, where a policy must acquire new skills over time without catastrophically forgetting previously learned ones. While prior work has extensively studied continual learning in relatively small behavior cloning (BC) policy models trained from scratch, its behavior in modern large-scale pretrained Vision-Language-Action (VLA) models remains underexplored. In this work, we find that pretrained VLAs are remarkably resistant to forgetting compared with smaller policy models trained from scratch. Simple Experience Replay (ER) works surprisingly well on VLAs, sometimes achieving zero forgetting even with a small replay data size. Our analysis reveals that pretraining plays a critical role in downstream continual learning performance: large pretrained models mitigate forgetting with a small replay buffer size while maintaining strong forward learning capabilities. Furthermore, we find that VLAs can retain relevant knowledge from prior tasks despite performance degradation during learning new tasks. This knowledge retention enables rapid recovery of seemingly forgotten skills through finetuning. Together, these insights imply that large-scale pretraining fundamentally changes the dynamics of continual learning, enabling models to continually acquire new skills over time with simple replay.", "authors": "Huihan Liu, Changyeon Kim, Bo Liu, Minghuan Liu, Yuke Zhu", "icml_url": "https://icml.cc/virtual/2026/poster/63561", "is_oral": true, "is_spotlight": true, "poster_id": "63561", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4B Robotics: Vision-Language-Action Models", "title": "Pretrained Vision-Language-Action Models are Surprisingly Resistant to Forgetting in Continual Learning", "sequence": 3086, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 34, "Robotics, VLA & diffusion policy": 414}, "raw_topic_score": 414, "selection_score": 854, "matched_terms": "vision-language-action, vla, robot, robot policy, behavior cloning", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #408", "poster_number": 408, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning has emerged as a principled post-training paradigm for Temporal Video Grounding (TVG) due to its on-policy optimization, yet existing GRPO-based methods remain fundamentally constrained by sparse reward signals and substantial computational overhead. We propose Video-OPD, an efficient post-training framework for TVG inspired by recent advances in on-policy distillation. Video-OPD optimizes trajectories sampled directly from the current policy, thereby preserving alignment between training and inference distributions, while a frontier teacher supplies dense, token-level supervision via a reverse KL divergence objective. This formulation preserves the on-policy property critical for mitigating distributional shift, while converting sparse, episode-level feedback into fine-grained, step-wise learning signals. Building on Video-OPD, we introduce Teacher-Validated Disagreement Focusing (TVDF), a lightweight training curriculum that iteratively prioritizes trajectories that are both teacher-reliable and maximally informative for the student, thereby improving training efficiency. Empirical results demonstrate that Video-OPD consistently outperforms GRPO while achieving substantially faster convergence and lower computational cost, establishing on-policy distillation as an effective alternative to conventional reinforcement learning for TVG.", "authors": "Jiaze Li, Hao Yin, Haoran Xu, Boshen Xu, Wenhui Tan, Zewen He, Jianzhong Ju, Zhenbo Luo, Jian Luan", "icml_url": "https://icml.cc/virtual/2026/poster/63325", "is_oral": false, "is_spotlight": false, "poster_id": "63325", "presentation_type": "regular", "related_events": "", "title": "Video-OPD: Efficient Post-Training of Multimodal Large Language Models for Temporal Video Grounding via On-Policy Distillation", "sequence": 2850, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 82, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 538, "LLM adaptation & fine-tuning": 84, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 538, "selection_score": 538, "matched_terms": "grpo, post-training, alignment, large language model, language model, on-policy", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #409", "poster_number": 409, "poster_band": "#0000-#0999"}, {"abstract": "We propose Parameterized Diffusion Policy (PDP), a framework that learns a diffusion policy parameterized in a smooth continuous space. By structuring a latent manifold such that distances between latents' values reflect the semantic similarity of physical trajectories, we transform diffusion from a mechanism of stochastic diversity into a precise tool for behavior steering. Our approach also enables smooth interpolation between known strategies and efficient generalization to novel constraints without the need to update policy weights. We demonstrate that PDP significantly improves adaptation performance on complex multimodal benchmarks in both simulation and real-robot hardware compared to regular diffusion policy, particularly in scenarios requiring the discovery of novel behaviors.", "authors": "Renhao Zhang, Haotian Fu, Mingxi Jia, George Konidaris, Yilun Du, Bruno C. da Silva", "icml_url": "https://icml.cc/virtual/2026/poster/62938", "is_oral": false, "is_spotlight": false, "poster_id": "62938", "presentation_type": "regular", "related_events": "", "title": "From Noise to Control: Parameterized Diffusion Policies", "sequence": 2463, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 42, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 458}, "raw_topic_score": 458, "selection_score": 698, "matched_terms": "diffusion policy, diffusion policies, robot, control, diffusion", "selection_reasons": "user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #411", "poster_number": 411, "poster_band": "#0000-#0999"}, {"abstract": "Time series forecasting under non-stationarity faces a fundamental tension between capturing stable representations and adapting to distribution shifts. Existing methods implicitly rely on static historical assumptions, leading to a critical failure mode we term  Phase Amnesia, where models become blind to the evolving global context. To resolve this, we formalize non-stationary dynamics through three physical hypotheses: Wold decomposition, dynamical phase evolution, and heteroscedastic manifold generation. These principles inspire PULSE, a physics-informed, plug-and-play framework adopting a Disentangle--Evolve--Simulate design philosophy. Specifically, PULSE utilizes phase-anchored disentanglement to resolve optimization interference caused by dominant trends, employs a Phase Router to actively generate future trajectories, and introduces Statistic-Aware Mixup (SAM) to ensure robustness against out-of-distribution volatility. Empirically, PULSE enables a simple MLP backbone to consistently outperform state-of-the-art Transformers across 12 real-world benchmarks. This validates that a correct physics-informed inductive bias is far more critical than raw architectural complexity for non-stationary forecasting.", "authors": "Yangyou Liu, Zezhi Shao, Xinyu Chen, Hu Chen, Fei Wang, Yuankai Wu", "icml_url": "https://icml.cc/virtual/2026/poster/64838", "is_oral": false, "is_spotlight": false, "poster_id": "64838", "presentation_type": "regular", "related_events": "", "title": "PULSE: Generative Phase Evolution for Non-Stationary Time Series Forecasting", "sequence": 4362, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 176, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 176, "selection_score": 176, "matched_terms": "non-stationary, distribution shift", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #506", "poster_number": 506, "poster_band": "#0000-#0999"}, {"abstract": "Recent progress in large-scale robotic datasets and vision-language models (VLMs) has advanced research on vision-language-action (VLA) models.  However, existing VLA models still face two fundamental challenges: (\\textit{i}) producing precise low-level actions from high-dimensional observations, (\\textit{ii}) bridging domain gaps across heterogeneous data sources, including diverse robot embodiments and human demonstrations. Existing methods often encode latent variables from either visual dynamics or robotic actions to guide policy learning, but they fail to fully exploit the complementary multi-modal knowledge present in large-scale, heterogeneous datasets. In this work, we present \\textbf{XR-1}, a novel framework for versatile and scalable VLA learning across diverse robots, tasks, and environments. At its core, XR-1 introduces the \\emph{Unified Vision-Motion Codes (UVMC)}, a discrete latent representation learned via a dual-branch VQ-VAE that jointly encodes visual dynamics and robotic motion.  UVMC addresses these challenges by (\\textit{i}) serving as an intermediate representation between the observations and actions, and  (\\textit{ii}) aligning multimodal dynamic information from heterogeneous data sources to capture complementary knowledge. To effectively exploit UVMC, we propose a \\emph{three-stage training paradigm}: (\\textit{i}) self-supervised UVMC learning, (\\textit{ii}) UVMC-guided pretraining on large-scale cross-embodiment robotic datasets, and (\\textit{iii}) task-specific post-training.  We validate XR-1 through extensive real-world experiments with more than 12,000 rollouts on six different robot embodiments, spanning over 120 diverse manipulation tasks. XR-1 consistently outperforms state-of-the-art baselines such as $\\pi_0$ and GR00T-N1.5 while demonstrating strong generalization to novel objects, background variations, distractors, and illumination changes. Our project is at \\href{https://xr-1-vla.github.io/}{https://xr-1-vla.github.io/}, and our code will be open-sourced.", "authors": "Shichao Fan, Kun Wu, Yinuo Zhao, Xinhua Wang, Di Wu, Fei Liao, Ning Liu, Yixue Zhang, Zhen Zhao, Zhiyuan Xu, Meng Li, Qingjie Liu, Shanghang Zhang, Min Wan, Jian Tang", "icml_url": "https://icml.cc/virtual/2026/poster/64826", "is_oral": true, "is_spotlight": true, "poster_id": "64826", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4B Robotics: Vision-Language-Action Models", "title": "XR-1: Towards Versatile Vision-Language-Action Models via Learning Unified Vision-Motion Representations", "sequence": 4350, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 48, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 742}, "raw_topic_score": 742, "selection_score": 942, "matched_terms": "vision-language-action, vla, robot, robotic, manipulation", "selection_reasons": "oral, oral robotics / multi-agent RL focus", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #602", "poster_number": 602, "poster_band": "#0000-#0999"}, {"abstract": "Trajectory world models play a crucial role in robotic dynamics learning, planning, and control. While recent works have explored trajectory world models for diverse robotic systems, they struggle to scale to a large number of distinct system dynamics and overlook domain knowledge of physical structures. To address these limitations, we introduce WestWorld , a kno W ledge- E ncoded S calable T rajectory World model for diverse robotic systems. To tackle the scalability challenge, we propose a novel system-aware Mixture-of-Experts (Sys-MoE) that dynamically combines and routes specialized experts for different robotic systems via a learnable system embedding. To further enhance zero-shot generalization, we incorporate domain knowledge of robot physical structures by introducing a structural embedding that aligns trajectory representations with morphological information. After pretraining on 89 complex environments spanning diverse morphologies across both simulation and real-world settings, WestWorld achieves significant improvements over competitive baselines in zero- and few-shot trajectory prediction. Additionally, it shows strong scalability across a wide range of robotic environments and significantly improves performance on downstream model-based control for different robots. Finally, we deploy our model on a real-world Unitree Go1, where it demonstrates stable locomotion performance ( see our demo on the website ).", "authors": "Yuchen Wang, Jiangtao Kong, Sizhe Wei, Xiaochang Li, Haohong Lin, Hongjue Zhao, Tianyi Zhou, Lu Gan, Huajie Shao", "icml_url": "https://icml.cc/virtual/2026/poster/61703", "is_oral": false, "is_spotlight": true, "poster_id": "61703", "presentation_type": "spotlight", "related_events": "", "title": "WestWorld: A Knowledge-Encoded Scalable Trajectory World Model for Diverse Robotic Systems", "sequence": 1231, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 40, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 840}, "raw_topic_score": 840, "selection_score": 885, "matched_terms": "robot, robotic, world model, trajectory, control", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #700", "poster_number": 700, "poster_band": "#0000-#0999"}, {"abstract": "Unmanned aerial vehicle (UAV) autopilot systems typically comprise navigation and flight-control modules, and their effective scheduling is critical to achieving high flight performance. However, most existing UAV platforms adopt a split architecture in which navigation and flight control are deployed on separate hardware devices. This separation restricts system-wide observability and prevents holistic scheduling and optimization across the entire autopilot pipeline. Moreover, autonomous flight performance emerges from implicit, cross-coupled, and accumulated interactions among multiple factors, rendering traditional model-based or heuristic scheduling approaches ineffective. To address these challenges, we propose UAV$^2$, a unified and adaptive scheduling framework for UAV autopilot systems with reinforcement learning, targeting flight performance optimization. UAV$^2$ integrates navigation and flight control onto a single onboard computing platform and operating system, formulates the scheduling problem as a partially observable Markov decision process, and learns scheduling policies from runtime execution feedback. The proposed approach is trained and evaluated in a hardware-in-the-loop simulation environment. Experimental results demonstrate that the learned scheduling policy consistently outperforms fixed-rate scheduling strategies in terms of flight robustness and tracking performance.", "authors": "Zeying Li, shuai zhao, Chaowen Wu, Boyang Li, Kai Huang", "icml_url": "https://icml.cc/virtual/2026/poster/66262", "is_oral": false, "is_spotlight": false, "poster_id": "66262", "presentation_type": "regular", "related_events": "", "title": "UAV$^2$: A Unified and Adaptive Scheduling Framework for UAV Autopilot System with Reinforcement Learning", "sequence": 5784, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 192, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 32, "Robotics, VLA & diffusion policy": 96}, "raw_topic_score": 192, "selection_score": 192, "matched_terms": "reinforcement learning, markov decision, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #704", "poster_number": 704, "poster_band": "#0000-#0999"}, {"abstract": "Vision-Language-Action (VLA) models often suffer from performance degradation under distribution shifts, as they struggle to learn generalized behavior representations across varying environments. While existing approaches attempt to construct behavior representations through action-centric latent variables, they are often limited by short-horizon temporal fragmentation and static execution-alignment, leading to inconsistent behaviors in complex scenarios. To address these limitations, we propose \\textbf{BehaviorVLA}, a framework that facilitates robust manipulation through the learning of a temporally coherent behavioral representations. Our approach features two symmetric components: (1) the \\textbf{Visuomotor Behavior Encoder (VBE)}, which utilizes a causal Mamba-based architecture to aggregate long-horizon trajectory information into a unified behavior representation; and (2) the \\textbf{Phase-conditioned Behavior Decoder (PBD)}, which decodes this representation into precise actions by dynamically aligning task-level priors with real-time execution progress. Experiments on RoboTwin 2.0, LIBERO, and CALVIN demonstrate state-of-the-art success rates of 58\\%, 98\\%, and 4.36 (Avg. Len), respectively. Notably, in real-world sim-to-real transfer, BehaviorVLA matches the performance of OpenVLA-OFT using only 50\\% of the demonstration data, showcasing its superior data efficiency and generalization.", "authors": "Bing Hu, Zaijing Li, Rui Shao, Junda Chen, April Hua Liu, Wei-Shi Zheng, Liqiang Nie", "icml_url": "https://icml.cc/virtual/2026/poster/66596", "is_oral": true, "is_spotlight": true, "poster_id": "66596", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4B Robotics: Vision-Language-Action Models", "title": "From Abstraction to Instantiation: Learning Behavioral Representation for Vision-Language-Action Model", "sequence": 6115, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 16, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 570}, "raw_topic_score": 570, "selection_score": 1010, "matched_terms": "vision-language-action, vla, robot, manipulation, visuomotor, behavioral representation, trajectory", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #802", "poster_number": 802, "poster_band": "#0000-#0999"}, {"abstract": "Latent actions serve as an intermediate representation that enables consistent modeling of vision-language-action (VLA) models across heterogeneous datasets. However, approaches to supervising VLAs with latent actions are fragmented and lack a systematic comparison. This work structures the study of latent action supervision from two perspectives: (i) regularizing the trajectory via image-based latent actions, and (ii) unifying the target space with action-based latent actions. Under a unified VLA baseline, we instantiate and compare four representative integration strategies. Our results reveal a formulation-task correspondence: image-based latent actions benefit long-horizon reasoning, whereas action-based latent actions excel at complex motor coordination. Furthermore, we find that directly supervising the VLM with discrete latent action tokens yields the most effective performance. Finally, our experiments offer initial insights into the benefits of latent action supervision in mixed-data, suggesting a promising direction for VLA training.", "authors": "Yihan Lin, Haoyang Li, Yang Li, Haitao Shen, Yihan Zhao, Chao Shao, Jing Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/63621", "is_oral": true, "is_spotlight": true, "poster_id": "63621", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4B Robotics: Vision-Language-Action Models", "title": "From Pixels to Tokens: A Systematic Study of Latent Action Supervision for Vision-Language-Action Models", "sequence": 3146, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 30, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 752}, "raw_topic_score": 752, "selection_score": 1192, "matched_terms": "vision-language-action, vla, latent action, trajectory", "selection_reasons": "oral, oral robotics / multi-agent RL focus, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #803", "poster_number": 803, "poster_band": "#0000-#0999"}, {"abstract": "While Vision-Language-Action (VLA) models hold promise in embodied intelligence, their large parameter counts lead to substantial inference latency that hinders real-time manipulation, motivating parameter sparsification. However, as the environment evolves during VLA execution, the optimal sparsity patterns change accordingly. Static pruning lacks the adaptability required for environment dynamics, whereas fixed-interval dynamic layer pruning suffers from coarse granularity and high retraining overheads. To bridge this gap, we propose **EcoVLA**, a training-free, plug-and-play adaptive pruning framework that supports orthogonal combination with existing VLA acceleration methods. EcoVLA comprises two components: **E**nvironment-aware **A**daptive **P**runing (**EAP**) and **I**nterleaved **I**nference **O**rchestration (**$I^2O$**). EAP is a lightweight adaptive channel pruning method that incorporates the temporal consistency of the physical environment to update sparsity patterns. $I^2O$ leverages the FLOPs bubbles inherent in VLA inference to schedule the pruning method in parallel, ensuring negligible impact on latency. Evaluated on diverse VLA models and benchmarks, EcoVLA delivers state-of-the-art performance, achieving up to 1.60$\\times$ speedup with only a 0.4% drop in success rate, and further reaches 2.18$\\times$ speedup with only a 0.5% degradation when combined with token pruning. We further validate the effectiveness of EcoVLA on real-world robots.", "authors": "Yuting Huang, Leilei Ding, Zhipeng Tang, Zenghuan Zhu, Jiajun Deng, Xinrui Lin, Shuo Liu, Haojie Ren, Jianmin Ji, Yanyong Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/66030", "is_oral": false, "is_spotlight": true, "poster_id": "66030", "presentation_type": "spotlight", "related_events": "", "title": "EcoVLA: Environment-Aware Adaptive Pruning with Interleaved Inference Orchestration for Vision-Language-Action Models", "sequence": 5553, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 48, "Robotics, VLA & diffusion policy": 720}, "raw_topic_score": 720, "selection_score": 765, "matched_terms": "vision-language-action, vla, robot, embodied, manipulation", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #903", "poster_number": 903, "poster_band": "#0000-#0999"}, {"abstract": "While Vision-Language-Action (VLA) models have achieved remarkable success in ground-based embodied intelligence, their application to Aerial Manipulation Systems (AMS) remains a largely unexplored frontier. The inherent characteristics of AMS, including floating-base dynamics, strong coupling between the UAV and the manipulator, and the multi-step, long-horizon nature of operational tasks, pose severe challenges to existing VLA paradigms designed for static or 2D mobile bases. To bridge this gap, we propose AIR-VLA, the first VLA benchmark specifically tailored for aerial manipulation. We construct a physics-based simulation environment and release a high-quality multimodal dataset comprising 3000 manually teleoperated demonstrations, covering base manipulation, object & spatial understanding, semantic reasoning, and long-horizon planning. Leveraging this platform, we systematically evaluate mainstream VLA models and state-of-the-art VLM models. Our experiments not only validate the feasibility of transferring VLA paradigms to aerial systems but also, through multi-dimensional metrics tailored to aerial tasks, reveal the capabilities and boundaries of current models regarding UAV mobility, manipulator control, and high-level planning. AIR-VLA establishes a standardized testbed and data foundation for future research in general-purpose aerial robotics. The resource of AIR-VLA will be available at https://anonymous.4open.science/r/AIR-VLA-dataset-B5CC/.", "authors": "Jianli Sun, Bin Tian, Qiyao Zhang, Chengxiang Li, Zihan Song, Zhiyong Cui, Yisheng Lv, Yonglin Tian", "icml_url": "https://icml.cc/virtual/2026/poster/64411", "is_oral": false, "is_spotlight": false, "poster_id": "64411", "presentation_type": "regular", "related_events": "", "title": "AIR-VLA: Vision-Language-Action Systems for Aerial Manipulation", "sequence": 3936, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 38, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 950}, "raw_topic_score": 950, "selection_score": 950, "matched_terms": "vision-language-action, vla, robot, robotic, robotics, embodied, manipulation, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #913", "poster_number": 913, "poster_band": "#0000-#0999"}, {"abstract": "Modeling complex dynamics from observational data is fundamental to scientific discovery and artificial intelligence. However, existing approaches ranging from Neural ODEs to diffusion models are often plagued by the entanglement of static state representations and instantaneous motion, leading to accumulated errors and off-manifold hallucinations where predicted trajectories violate intrinsic geometric constraints. To address this, we propose Geometric Flow Grounding, a unified framework that enforces dynamic evolution strictly along the tangent bundle of the learned data manifold via a differentiable Neural Tangent Projection Layer. By geometrically decoupling state representation from tangential dynamics, our method generalizes across diverse data regimes. In the context of scientific discovery, we demonstrate that the projection layer eliminates numerical aliasing in sparse dynamical systems and recovers interpretable gene regulatory motifs from single-cell data by disentangling states from developmental velocities. Bridging to trustworthy AI, we further repurpose the geometric projection residual as a zero-shot metric for deepfake video detection, identifying generative inconsistencies against the implicit flow of pre-trained world models. Our results establish manifold-constrained projection as a universal operator for both discovering natural laws and verifying synthetic content.", "authors": "Chang Yu, Yuxuan Luo, Yixuan Du, Yuqing Zhou, Siyuan Li, Jingbo Zhou, jiawei jiang, Zhen Lei, Stan Z Li", "icml_url": "https://icml.cc/virtual/2026/poster/64932", "is_oral": true, "is_spotlight": true, "poster_id": "64932", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4E AI for Science: Dynamical Systems and Processes", "title": "Geometric Flow Grounding: A Unified Manifold Decoupling Framework for Dynamics Discovery and Verification", "sequence": 4456, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 30}, "raw_topic_score": 30, "selection_score": 360, "matched_terms": "world model, diffusion", "selection_reasons": "oral, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #1001", "poster_number": 1001, "poster_band": "#1000-#1999"}, {"abstract": "Multi-step retrosynthesis planning is a fundamental challenge in organic chemistry, defined by its enormous search space. Existing methods typically formulate it as a Markov Decision Process (MDP)  with a fixed choice of transition model (i.e., a single-step retrosynthesis model), and focus on improving how to search through better policies and value functions.  However, how the transition space itself is navigated remains largely unexplored. This limitation is particularly urgent given our observation of pronounced skill disparity among single-step prediction models: different models exhibit substantially different performance across molecule states.  Motivated by this observation, we introduce RetrOrchestrator, an LLM-powered agent that explicitly accounts for model skill disparity by reframing retrosynthesis planning as a Partially Observable Markov Decision Process (POMDP).  By regarding each single-step prediction model as a tool, we further propose a scaffold-aware reinforcement learning algorithm to optimize navigation policy within the transition space.  As a result, RetrOrchestrator jointly searches which molecule to expand and which single-step model to apply for the molecule at the current step. Empirically, RetrOrchestrator significantly outperforms static baselines on the Retro*-190 benchmark, achieving a state-of-the-art 94.21\\% success rate as well as a Pareto front in both wallclock time and number of model queries.", "authors": "Liao Chang, Luotian Yuan, Yiping Ke, Ying Wei", "icml_url": "https://icml.cc/virtual/2026/poster/61540", "is_oral": false, "is_spotlight": false, "poster_id": "61540", "presentation_type": "regular", "related_events": "", "title": "RetrOrchestrator: A Multi-Step Retrosynthesis Agent Dynamically Orchestrating Single-Step Transition Models", "sequence": 1068, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 202, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 54, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 20}, "raw_topic_score": 202, "selection_score": 202, "matched_terms": "reinforcement learning, markov decision, mdp, pomdp, planning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #1401", "poster_number": 1401, "poster_band": "#1000-#1999"}, {"abstract": "Despite the fast progress in neural operator learning, long-sequence modeling still is a standing challenge whereby latent states have been introduced with techniques well derived.  Diverging from existing methods that treat latent states as transient variables or decoupled representations, CoEvol-NO introduces a {persistent state} to establish a {co-evolutionary framework}, where the latent state and mesh sequence are updated jointly and bidirectionally. Inspired by classical numerical methods, we model the layer-wise state evolution as a {Predictor-Corrector (PC)} process. Specifically, a Predictor'' generates a tentative target, followed by a Corrector'' that refines the persistent state via an {error-driven update mechanism}. Furthermore, our theoretical analysis reveals that the widely used \\textit{direct substitution} and \\textit{residual update} paradigms are essentially {first-order approximations} of this error-driven correction under different loss assumptions. We theoretically prove that CoEvol-NO achieves strict {linear time complexity}. Extensive experiments on five standard benchmarks and two large-scale industrial design tasks demonstrate that CoEvol-NO consistently achieves {state-of-the-art (SOTA)} performance.", "authors": "Jianqiao Zeng, Ruocheng Wang, Yanzhi Liu, Hao Xiong, Junchi Yan", "icml_url": "https://icml.cc/virtual/2026/poster/61526", "is_oral": true, "is_spotlight": true, "poster_id": "61526", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4E AI for Science: Dynamical Systems and Processes", "title": "CoEvol-NO: State and Coordinate Co-Evolution with an Error-Driven Predictor-Corrector Paradigm for Neural Operator Transformer", "sequence": 1054, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 0, "selection_score": 90, "matched_terms": "", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #1600", "poster_number": 1600, "poster_band": "#1000-#1999"}, {"abstract": "Entropy serves as a critical metric for measuring the diversity of outputs generated by large language models (LLMs), providing valuable insights into their exploration capabilities. While recent studies increasingly focus on monitoring and adjusting entropy to better balance exploration and exploitation in reinforcement fine-tuning (RFT), a principled understanding of entropy dynamics during this process is yet to be thoroughly investigated. In this paper, we establish a theoretical framework for analyzing the entropy dynamics during the RFT process, which begins with a discriminant expression that quantifies entropy change under a single logit update. This foundation enables the derivation of a first-order expression for entropy change, which can be further extended to the update formula of Group Relative Policy Optimization (GRPO). The corollaries and insights drawn from the theoretical analysis inspire the design of entropy control methods, and also offer a unified lens for interpreting various entropy-based methods in existing studies. We provide empirical evidence to support the main conclusions of our analysis and demonstrate the effectiveness of the derived entropy-discriminator clipping methods. This study yields novel insights into RFT training dynamics, providing theoretical support and practical strategies for optimizing the exploration-exploitation balance during LLM fine-tuning.", "authors": "Shumin Wang, Yuexiang Xie, Wenhao Zhang, Yuchang Sun, Yanxi Chen, Yaliang Li, Yanyong Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/63897", "is_oral": false, "is_spotlight": false, "poster_id": "63897", "presentation_type": "regular", "related_events": "", "title": "On the Entropy Dynamics in Reinforcement Fine-Tuning of Large Language Models", "sequence": 3422, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 72, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 174, "LLM adaptation & fine-tuning": 616, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 616, "selection_score": 616, "matched_terms": "fine-tuning, reinforcement fine-tuning, lora, large language model, language model, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2107", "poster_number": 2107, "poster_band": "#2000-#2999"}, {"abstract": "The collective intelligence of Large Language Model (LLM)-based Multi-Agent Systems (MAS) is fundamentally governed by the underlying communication graph. However, discovering task-adaptive structures within this combinatorial search space remains a significant challenge. Existing methods, ranging from heuristic pruning to autoregressive generation, often lack a unified theoretical framework to guide the self-organization of agents into efficient teams. In this paper, we bridge non-equilibrium thermodynamics and generative modeling to formalize multi-agent graph generation as an energy minimization process. Specifically, we frame the emergence of efficient collaboration as a thermodynamic \"cooling\" process, where initially stochastic interactions converge to a low-energy, structured equilibrium.  To implement this, We propose MAGE (Multi-Agent Communication Graph Generation), a score-based diffusion framework that constructs communication graphs by navigating the energy landscape via iterative denoising and first-order gradient guidance. Extensive experiments on representative benchmarks demonstrate that MAGE achieves state-of-the-art performance. Furthermore, qualitative analysis reveals that the generated graphs mirroring the functional specialization of human organizations, validating our thermodynamic hypothesis.", "authors": "GuanHao Zhao, Wenbo Lu, Cheng Cheng, Zhenya Huang, Wei Song, Zhiding Liu, Runze Wu, Enhong Chen", "icml_url": "https://icml.cc/virtual/2026/poster/61913", "is_oral": false, "is_spotlight": false, "poster_id": "61913", "presentation_type": "regular", "related_events": "", "title": "Navigating the Energy Landscape of Collaboration: Multi-Agent Communication Graph Generation via Score-Based Diffusion", "sequence": 1440, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 408, "LLM post-training, RLHF & agents": 124, "LLM adaptation & fine-tuning": 50, "Robotics, VLA & diffusion policy": 32}, "raw_topic_score": 408, "selection_score": 408, "matched_terms": "multi-agent, collaboration, equilibrium", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2112", "poster_number": 2112, "poster_band": "#2000-#2999"}, {"abstract": "RL-based post-training with GRPO is widely used to improve large language models on individual reasoning tasks. However, real-world deployment requires reliable performance across diverse tasks. A straightforward multi-task adaptation of GRPO often leads to imbalanced outcomes, with some tasks dominating optimization while others stagnate. Moreover, tasks can vary widely in how frequently prompts yield zero advantages (and thus zero gradients), which further distorts their effective contribution to the optimization signal. To address these issues, we propose a novel Multi-Task GRPO (MT-GRPO) algorithm that (i) dynamically adapts task weights to explicitly optimize worst-task performance and promote balanced progress across tasks, and (ii) introduces a ratio-preserving sampler to ensure task-wise policy gradients reflect the adapted weights. Experiments on both 3-task and 9-task settings show that MT-GRPO consistently outperforms baselines in worst-task accuracy. In particular, MT-GRPO achieves 16–28\\% and 6\\% absolute improvement on worst-task performance over standard GRPO and DAPO, respectively, while maintaining competitive average accuracy. Moreover, MT-GRPO requires 50\\% fewer training steps to reach 50\\% worst-task accuracy in the 3-task setting, demonstrating substantially improved efficiency in achieving reliable performance across tasks.", "authors": "Shyam Sundhar Ramesh, Xiaotong Ji, Matthieu Zimmer, Sangwoong Yoon, Zhiyong Wang, Haitham Bou Ammar, Aurelien Lucchi, Ilija Bogunovic", "icml_url": "https://icml.cc/virtual/2026/poster/60544", "is_oral": false, "is_spotlight": false, "poster_id": "60544", "presentation_type": "regular", "related_events": "", "title": "Multi-Task GRPO: Reliable LLM Reasoning Across Tasks", "sequence": 73, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 20, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 454, "LLM adaptation & fine-tuning": 94, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 454, "selection_score": 454, "matched_terms": "grpo, post-training, policy gradient, large language model, llm, language model, reasoning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2114", "poster_number": 2114, "poster_band": "#2000-#2999"}, {"abstract": "Multi-Agent Systems (MAS) built on Large Language Models (LLMs) often exhibit high variance in their reasoning trajectories.  Process verification, which evaluates intermediate steps in trajectories, has shown promise in general reasoning settings, and has been suggested as a potential tool for guiding coordination of MAS; however, its actual effectiveness in MAS remains unclear. To fill this gap, we present MAS-ProVe, a systematic empirical study of process verification for multi-agent systems (MAS). Our study spans three verification paradigms (LLM-as-a-Judge, reward models, and process reward models), evaluated across two levels of verification granularity (agent-level and iteration-level). We further examine five representative verifiers and four context management strategies, and conduct experiments over six diverse MAS frameworks on multiple reasoning benchmarks. We find that process-level verification does not consistently improve performance and frequently exhibits high variance, highlighting the difficulty of reliably evaluating partial multi-agent trajectories. Among the methods studied, LLM-as-a-Judge generally outperforms reward-based approaches, with trained judges surpassing general-purpose LLMs. We further observe a small performance gap between LLMs acting as judges and as single agents, and identify a context-length-performance trade-off in verification. Overall, our results suggest that effective and robust process verification for MAS remains an open challenge, requiring further advances beyond current paradigms.", "authors": "Vishal Venkataramani, Haizhou Shi, Zixuan Ke, Austin Xu, Xiaoxiao He, Yingbo Zhou, Semih Yavuz, Hao Wang, Shafiq Joty", "icml_url": "https://icml.cc/virtual/2026/poster/63666", "is_oral": false, "is_spotlight": false, "poster_id": "63666", "presentation_type": "regular", "related_events": "", "title": "MAS-ProVe: Understanding the Process Verification of Multi-Agent Systems", "sequence": 3191, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 282, "LLM post-training, RLHF & agents": 268, "LLM adaptation & fine-tuning": 98, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 282, "selection_score": 282, "matched_terms": "multi-agent, coordination", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2210", "poster_number": 2210, "poster_band": "#2000-#2999"}, {"abstract": "Personalized federated LoRA fine tuning has become a key approach to addressing data heterogeneity in distributed fine tuning of large language models (LLMs). Existing methods typically assume homogeneous personalization needs across clients, relying on dual LoRA or personalized calibration schemes. However, they fail to account for the heterogeneity of local personalization requirements and the conflicting optimization objectives in dual LoRA, limiting scalability and performance. To address this, we propose Het-CPFLoRA, a customizable heterogeneous  federated LoRA fine tuning algorithm inspired by the decoupling properties of LoRA parameters. We employ a single adapter fine tuning scheme to mitigate conflicts between personalized and generalized optimization, decouple LoRA into generalized and personalized subspaces for local customization, and use SVD compression to integrate cross client generalized knowledge. During inference, we introduce an OOD oriented dynamic mechanism to adjust the weighting between personalized and generalized decoupling knowledge, improving performance on user data. Extensive experiments on two public benchmark datasets show that Het-CPFLoRA outperforms state of the art methods in both personalization and generalization across heterogeneous scenarios. The code will be released as an open-source project.", "authors": "xin tong, Baojiang cui", "icml_url": "https://icml.cc/virtual/2026/poster/66545", "is_oral": false, "is_spotlight": false, "poster_id": "66545", "presentation_type": "regular", "related_events": "", "title": "Heterogeneous Customizable Personalized Federated  Fine-Tuning Approach for Large Language Models", "sequence": 6064, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 134, "LLM adaptation & fine-tuning": 852, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 852, "selection_score": 852, "matched_terms": "fine-tuning, fine tuning, lora, adapter, federated fine-tuning, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2306", "poster_number": 2306, "poster_band": "#2000-#2999"}, {"abstract": "A reliable reward model is essential for aligning large language models (LLMs) with human preferences through reinforcement learning from human feedback (RLHF). However, standard reward models are susceptible to spurious features that are not causally related to human labels. This can lead to reward hacking , where high predicted reward does not translate into better behavior. In this work, we address this problem from a causal perspective by proposing a factored representation learning framework that decomposes the model’s contextual embedding into (1) causal factors that are sufficient for reward prediction and (2) non-causal factors that capture reward-irrelevant attributes such as length or sycophantic bias. The reward head is then constrained to depend only on the causal component. In addition, we introduce an adversarial head trained to predict reward from the non-causal factors, while applying gradient reversal to discourage them from encoding reward-relevant information. Experiments on both mathematical and dialogue tasks demonstrate that our method learns more robust reward models and consistently improves downstream RLHF performance over state-of-the-art baselines. Analyses on length and sycophantic bias further validate the effectiveness of our method in mitigating reward hacking behaviors.", "authors": "Yupei Yang, Lin Yang, Wanxi Deng, Lin Qu, Fan Feng, Biwei Huang, Shikui Tu, Lei Xu", "icml_url": "https://icml.cc/virtual/2026/poster/65508", "is_oral": false, "is_spotlight": false, "poster_id": "65508", "presentation_type": "regular", "related_events": "", "title": "Factored Causal Representation Learning for Robust Reward Modeling in RLHF", "sequence": 5032, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 470, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 470, "selection_score": 470, "matched_terms": "rlhf, reward model, reward modeling, large language model, llm, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2413", "poster_number": 2413, "poster_band": "#2000-#2999"}, {"abstract": "Post-training endows pretrained LLMs with a variety of desirable skills, such as instruction-following, reasoning, and others. However, these post-trained LLMs only encode knowledge up to a cut-off date, necessitating continual adaptation. Unfortunately, existing solutions cannot effectively learn new knowledge from adaptation document corpora and simultaneously mitigate the forgetting of earlier learned capabilities. To address this, we introduce Distillation via Split Contexts (DiSC), a simple context-distillation based approach for continual knowledge adaptation. DiSC derives student and teacher distributions by conditioning on distinct segments of the training example and minimizes the KL divergence between them for the common tokens. This insight allows us to efficiently apply context-distillation without requiring explicit generation steps during training. We run experiments on three post-trained models and two adaptation domains. Compared to prior finetuning and distillation methods for continual adaptation, DiSC consistently reports the best trade-off between learning new knowledge and mitigating forgetting of previously learned skills like instruction-following and reasoning, or factual knowledge.", "authors": "Shankar Padmanabhan, Mustafa Omer Gul, Tanya Goyal", "icml_url": "https://icml.cc/virtual/2026/poster/64365", "is_oral": false, "is_spotlight": true, "poster_id": "64365", "presentation_type": "spotlight", "related_events": "", "title": "Context Distillation Retains Post-Training Capabilities in Continually Trained LMs", "sequence": 3890, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 192, "LLM adaptation & fine-tuning": 316, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 316, "selection_score": 601, "matched_terms": "continual adaptation, continually trained, finetuning, adapt, llm", "selection_reasons": "spotlight, user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2511", "poster_number": 2511, "poster_band": "#2000-#2999"}, {"abstract": "Quantization followed by parameter-efficient fine-tuning has emerged as a promising paradigm for downstream adaptation under tight GPU memory constraints. However, this sequential pipeline fails to leverage the intricate interaction between quantization bit-width and LoRA rank. Specifically, a carefully optimized quantization allocation with low quantization error does not always translate to strong fine-tuning performance, and  different bit-width and rank configurations can lead to significantly varying outcomes under the same memory budget. To address this limitation, we propose AutoQRA, a joint optimization framework that simultaneously optimizes the bit-width and LoRA rank configuration for each layer during the mixed quantized fine-tuning process. To tackle the challenges posed by the large discrete search space and the high evaluation cost associated with frequent fine-tuning iterations, AutoQRA decomposes the optimization process into two stages. First, it first conducts a global multi-fidelity evolutionary search, where the initial population is warm-started by injecting layer-wise importance priors. This stage employs specific operators and a performance model to efficiently screen candidate configurations. Second, trust-region Bayesian optimization is applied to locally refine promising regions of the search space and identify optimal configurations under the given memory budget. This approach enables active compensation for quantization noise in specific layers during training. Experiments show that AutoQRA achieves performance close to full-precision fine-tuning with a memory footprint comparable to uniform 4-bit methods.", "authors": "Changhai Zhou, Shiyang Zhang, Yuhua Zhou, Qian Qiao, Jun Gao, Cheng Jin, KAIZHOU QIN, Weizhong Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/65383", "is_oral": false, "is_spotlight": false, "poster_id": "65383", "presentation_type": "regular", "related_events": "", "title": "AutoQRA: Joint Optimization of Mixed-Precision Quantization and Low-rank Adapters for Efficient LLM Fine-Tuning", "sequence": 4907, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 42, "LLM adaptation & fine-tuning": 542, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 542, "selection_score": 542, "matched_terms": "fine-tuning, parameter-efficient, lora, adapter, adapt, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #2604", "poster_number": 2604, "poster_band": "#2000-#2999"}, {"abstract": "Ensuring the safety of language models (LMs) while maintaining their usefulness remains a critical challenge in AI alignment. Current approaches rely on sequential adversarial training: generating adversarial prompts and fine-tuning LMs to defend against them. We introduce a different paradigm: framing safety alignment as a non-zero-sum game between an Attacker LM and a Defender LM trained jointly via online reinforcement learning. Each LM continuously adapts to the other's evolving strategies, driving iterative improvement. Our method uses a preference-based reward signal derived from pairwise comparisons instead of point-wise scores, providing more robust supervision and potentially reducing reward hacking. Our RL recipe, AdvGame, shifts the Pareto frontier of safety and utility, yielding a Defender LM that is simultaneously more helpful and more resilient to adversarial attacks. In addition, the resulting Attacker LM converges into a strong, general-purpose red-teaming agent that can be directly deployed to probe arbitrary target models.", "authors": "Anselm Paulus, Ilia Kulikov, Brandon Amos, REMI MUNOS, Ivan Evtimov, Kamalika Chaudhuri, Arman Zharmagambetov", "icml_url": "https://icml.cc/virtual/2026/poster/65610", "is_oral": false, "is_spotlight": true, "poster_id": "65610", "presentation_type": "spotlight", "related_events": "", "title": "Safety Alignment of LMs via Non-cooperative Games", "sequence": 5133, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 248, "LLM post-training, RLHF & agents": 122, "LLM adaptation & fine-tuning": 54, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 248, "selection_score": 293, "matched_terms": "cooperative, game, games", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3003", "poster_number": 3003, "poster_band": "#3000-#3999"}, {"abstract": "We consider the problem of sampling compositional and discrete objects from a given unnormalized posterior distribution.  Notably, recent studies have shown that this problem can be efficiently solved by learning a deterministic Markov Decision Process (MDP) that progressively builds each object in proportion to the posterior. In this work, however, we demonstrate that the Markovian assumption can both hamper signal propagation during training and catastrophically reduce the learned sampler's expressivity due to state aliasing.  To address these issues, we propose lifting the MDP with a learnable latent dynamics that allows the underlying policy to depend on the entire past trajectory---and not only on the current state.  In view of this, we refer to the resulting method as \\emph{path-dependent discrete amortized inference}.  Importantly, we provably extend existing learning algorithms for amortized samplers to our setting.  In experiments on standard benchmark problems, we also show that our approach often leads to faster learning convergence and improved state space exploration relatively to prior techniques.", "authors": "Tiago Silva, Esmeralda S. Whitammer, Salem Lahlou", "icml_url": "https://icml.cc/virtual/2026/poster/60879", "is_oral": true, "is_spotlight": true, "poster_id": "60879", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4G Time Series Modeling & Sampling", "title": "Path-dependent Discrete Amortized Inference", "sequence": 408, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 102, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 16}, "raw_topic_score": 102, "selection_score": 192, "matched_terms": "markov decision, mdp, exploration", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3200", "poster_number": 3200, "poster_band": "#3000-#3999"}, {"abstract": "Reinforcement Learning from Human Feedback (RLHF) is the standard method to align Large Language Models (LLMs) with human preferences. In this work, we introduce alignment tampering, a potential vulnerability where the LLM undergoing alignment influences the preference dataset, causing RLHF to amplify undesired behaviors. This arises from core limitations of RLHF: (1) preference datasets are constructed from the LLM's own outputs, allowing it to influence them, and (2) pairwise comparisons only indicate which response is better, not why. These limitations can be exploited to cause alignment tampering. For example, if an LLM generates biased responses with higher quality, annotators will prefer them based on quality. However, preference labels do not distinguish whether the preference stems from quality or bias, and the resulting reward model inherits this limitation. Optimizing such rewards through reinforcement learning or best-of-N sampling can amplify misaligned biases. Our experiments demonstrate amplification across diverse biases: from simple keyword bias to propaganda (e.g., sexism), brand promotion, and instrumental goal-seeking behaviors. We propose a detection method, while mitigation remains challenging. Existing techniques for robust RLHF fail to fully resolve alignment tampering without sacrificing response quality. These findings reveal structural vulnerabilities of current RLHF and emphasize the need to prevent this vulnerability.", "authors": "Dongyoon Hahm, Dylan Hadfield-Menell, Kimin Lee", "icml_url": "https://icml.cc/virtual/2026/poster/61418", "is_oral": false, "is_spotlight": false, "poster_id": "61418", "presentation_type": "regular", "related_events": "", "title": "Alignment Tampering: How Reinforcement Learning from Human Feedback Is Exploited to Optimize Misaligned Biases", "sequence": 946, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 172, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 460, "LLM adaptation & fine-tuning": 84, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 460, "selection_score": 460, "matched_terms": "rlhf, reward model, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3206", "poster_number": 3206, "poster_band": "#3000-#3999"}, {"poster_id": "67118", "title": "Position: The Alignment Community is Unintentionally Building a Censor’s Toolkit", "authors": "Sarah Ball, Phil Hackemann", "abstract": "This position paper argues that modern alignment methods – originally designed to prevent harmful output – are dual-use technologies that may easily be misused by malicious actors for censorship and manipulation. By mapping current alignment techniques to the possibility and actual cases of misuse, we show that the quest for a ''perfectly aligned'' model inadvertently also provides malicious actors with an ever-improving tool for informational dominance. We need to discuss this dual-use potential now , as its risk is exacerbated by rapid user adoption of AI as information provider and a political landscape that increasingly shifts towards authoritarianism. We conclude by urging the community to consider the intentional misuse of safety mechanisms and propose mitigation strategies to safeguard against this dual-use potential.", "presentation_type": "position", "is_oral": true, "is_spotlight": false, "icml_url": "https://icml.cc/virtual/2026/poster/67118", "related_events": "Oral presentation: Oral 4C LLM Alignment & Reliability", "sequence": "", "award": "Outstanding Position Paper", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 100, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 30}, "raw_topic_score": 100, "selection_score": 340, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Position Paper", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3215", "poster_number": 3215, "poster_band": "#3000-#3999"}, {"abstract": "Constraint-based causal discovery is widely used for learning causal structures, but heavy reliance on conditional independence (CI) testing makes it computationally expensive in high-dimensional settings. To mitigate this limitation, many divide-and-conquer frameworks have been proposed, but most assume causal sufficiency, i.e., no latent variables. In this paper, we show that divide-and-conquer strategies can be theoretically generalized beyond causal sufficiency to settings with latent variables.  Specifically, we propose a recursive decomposition framework, termed DiCoLa, that enables divide-and-conquer causal discovery in the presence of latent variables. It recursively decomposes the global learning task into smaller subproblems and integrates their solutions through a principled reconstruction step to recover the global structure. We theoretically establish the soundness and completeness of the proposed framework. Extensive experiments on synthetic data demonstrate that our approach significantly improves computational efficiency across a range of causal discovery algorithms, while experiments on a real-world dataset further illustrate its practical effectiveness.", "authors": "Zheng Li, Feng Xie, Shenglan Nie, Xichen Guo, Ruxin Wang, Hao Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/62126", "is_oral": true, "is_spotlight": true, "poster_id": "62126", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4D Causal & Probabilistic Modeling", "title": "A Recursive Decomposition Framework for Causal Structure Learning in the Presence of Latent Variables", "sequence": 1653, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 0, "selection_score": 90, "matched_terms": "", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3511", "poster_number": 3511, "poster_band": "#3000-#3999"}, {"abstract": "Fine-tuning large language models (LLMs) to align with human preferences has driven the success of systems such as Gemini and ChatGPT.  However, approaches like Reinforcement Learning from Human Feedback (RLHF) remain computationally expensive and complex.  Direct Preference Optimization (DPO) offers a simpler alternative but has limitations such as inconsistent ranking accuracy, high dependence on expensive GPU resources, and sensitive hyperparameter tuning.  We propose the Convex Optimization for Alignment and Preference Learning Algorithm (COALA): a novel lightweight strategy with strong theoretical guarantees. By leveraging the convex optimization reformulation of neural networks, COALA eliminates the need for a reference model and obtains significant reduction in both training time and VRAM consumption, thus enabling efficient training on a single GPU.  Experiments across three datasets—including a 23,228-sample synthetic Educational Feedback dataset—and five models (including LLaMA-8B) demonstrate COALA's competitive performance and efficiency in utilizing as little as ${\\approx}17.6$% of DPO's total TFLOPS. COALA exhibits stable, monotonically increasing rewards and reaches peak margins in significantly less time than traditional methods such as DPO and ORPO.  To the best of our knowledge, this is the first time convex optimization has been effectively applied to preference fine-tuning of LLMs.", "authors": "Miria Feng, Mert Pilanci", "icml_url": "https://icml.cc/virtual/2026/poster/64291", "is_oral": false, "is_spotlight": false, "poster_id": "64291", "presentation_type": "regular", "related_events": "", "title": "Convex Optimization for Alignment and Preference Learning on a Single GPU", "sequence": 3816, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 30, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 440, "LLM adaptation & fine-tuning": 124, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 440, "selection_score": 440, "matched_terms": "rlhf, preference learning, preference optimization, dpo, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3701", "poster_number": 3701, "poster_band": "#3000-#3999"}, {"abstract": "Planning collaboration strategies for multi-agent embodied systems remains a core challenge for LLM-based planners, which often fail to capture the physical and coordination constraints of realworld environments. To address this, we present EvoCF, an agentic memory-driven evolutionary counterfactual planning framework for discovering improved multi-agent collaboration strategies through counterfactual plan generation and evaluation. First, we propose a symbolic constraint inductor that induces reusable symbolic constraints from failures, forming an evolving rule library. Then, we propose an evolutionary counterfactual plan generator that systematically explores semantically consistent plan variants through rule-conditioned mutations, enabling robust collaboration strategies beyond short-sighted one-shot LLM plans. Finally, we design an agentic memory-grounded evaluator that ranks candidate plans using retrieval-augmented evidence, producing interpretable, constraint-aware selections. Across multi-agent embodied simulation benchmarks, EvoCF consistently discovers more robust and executable plans compared to baseline approaches. Our results demonstrate that grounding multi-agent planning in agentic memory and counterfactual reasoning significantly enhances both effectiveness and robustness.", "authors": "Haotian Chi, Zeyu Feng, Xingrui Yu, Linbo Luo, Yew Soon ONG, Ivor Tsang, Hechang Chen, Yi Chang, Haiyan Yin", "icml_url": "https://icml.cc/virtual/2026/poster/65198", "is_oral": false, "is_spotlight": false, "poster_id": "65198", "presentation_type": "regular", "related_events": "", "title": "EvoCF: Multi-Agent Collaboration via Agentic Memory-Driven Evolutionary Counterfactual Planning", "sequence": 4722, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 72, "Multi-agent RL, games & coordination": 716, "LLM post-training, RLHF & agents": 168, "LLM adaptation & fine-tuning": 28, "Robotics, VLA & diffusion policy": 56}, "raw_topic_score": 716, "selection_score": 716, "matched_terms": "multi-agent, collaboration, coordination, multi-agent collaboration", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #3814", "poster_number": 3814, "poster_band": "#3000-#3999"}, {"abstract": "Dataset bias often leads deep learning models to exploit spurious correlations instead of task-relevant signals. We introduce the Standard Anti-Causal Model (SAM), a unifying causal framework that characterizes bias mechanisms and yields a conditional independence criterion for causal stability. Building on this theory, we propose DISCO$_m$ and sDISCO, efficient and scalable estimators of conditional distance correlation that enable independence regularization in black-box models. Across six diverse datasets, our methods consistently outperform or are competitive in existing bias mitigation approaches, while requiring fewer hyperparameters and scaling seamlessly to multi-bias scenario
