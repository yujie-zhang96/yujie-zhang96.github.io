s. This work bridges causal theory and practical deep learning, providing both a principled foundation and effective tools for robust prediction.", "authors": "Emre Kavak, Tom Nuno Wolf, Christian Wachinger", "icml_url": "https://icml.cc/virtual/2026/poster/63808", "is_oral": true, "is_spotlight": true, "poster_id": "63808", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4D Causal & Probabilistic Modeling", "title": "DISCO: Mitigating Bias in Deep Learning with Conditional Distance Correlation", "sequence": 3333, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 0, "selection_score": 90, "matched_terms": "", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #4309", "poster_number": 4309, "poster_band": "#4000-#4999"}, {"abstract": "We present algorithms for diffusion model sampling which obtain $\\delta$-error in $\\mathrm{polylog}(1/\\delta)$ steps, given access to $\\widetilde O(\\delta)$-accurate score estimates in $L^2$. This is an exponential improvement over all previous results. Specifically, under minimal data assumptions, the complexity is $\\widetilde O(d\\mathrm{polylog}(1/\\delta))$ where $d$ is the dimension of the data; under a non-uniform $L$-Lipschitz condition, the complexity is $\\widetilde O(\\sqrt{dL}\\mathrm{polylog}(1/\\delta))$; and if the data distribution has intrinsic dimension $d_\\star$, then the complexity reduces to $\\widetilde O(d_\\star\\mathrm{polylog}(1/\\delta))$. Our approach also yields the first $\\mathrm{polylog}(1/\\delta)$ complexity sampler for general log-concave distributions using only gradient evaluations.", "authors": "Fan Chen, Sinho Chewi, Constantinos Daskalakis, Alexander Rakhlin", "icml_url": "https://icml.cc/virtual/2026/poster/65132", "is_oral": true, "is_spotlight": true, "poster_id": "65132", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4F Learning Theory", "title": "High-accuracy sampling for diffusion models and log-concave distributions", "sequence": 4656, "award": "Outstanding Paper", "primary_topic": "Award / highlighted", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 32}, "raw_topic_score": 32, "selection_score": 302, "matched_terms": "ICML 2026 award", "selection_reasons": "oral, Outstanding Paper", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #4508", "poster_number": 4508, "poster_band": "#4000-#4999"}, {"abstract": "On-policy preference learning algorithms for language model alignment such as online direct policy optimization (DPO) can significantly outperform their offline counterparts. We provide a theoretical explanation for this phenomenon by analyzing how the sampling policy's coverage evolves throughout on-policy training. We propose and rigorously justify the \\emph{coverage improvement principle}: with sufficient batch size, each update moves into a region around the target where coverage is uniformly better, making subsequent data increasingly informative and enabling rapid convergence. In the contextual bandit setting with Bradley-Terry preferences and linear softmax policy class, we show that on-policy DPO converges exponentially in the number of iterations for batch size exceeding a generalized coverage threshold. In contrast, any learner restricted to offline samples from the initial policy suffers a slower minimax rate, leading to a sharp separation in total sample complexity. Motivated by this analysis, we further propose a simple hybrid sampler based on a novel \\emph{preferential} G-optimal design, which removes dependence on coverage and guarantees convergence in just two rounds. Finally, we develop principled on-policy schemes for reward distillation in the general function class setting, and show faster noiseless rates under an alternative deviation-based notion of coverage.", "authors": "Juno Kim, Jihun Yun, Jason Lee, Kwang-Sung Jun", "icml_url": "https://icml.cc/virtual/2026/poster/61253", "is_oral": false, "is_spotlight": false, "poster_id": "61253", "presentation_type": "regular", "related_events": "", "title": "Coverage Improvement and Fast Convergence of On-policy Preference Learning", "sequence": 781, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 72, "RL & control": 22, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 462, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 462, "selection_score": 702, "matched_terms": "preference learning, direct policy optimization, dpo, alignment, language model, on-policy", "selection_reasons": "user-named / must include", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #4514", "poster_number": 4514, "poster_band": "#4000-#4999"}, {"abstract": "Normative theories allow one to elicit key parts of a ML algorithm from first principles, which is crucial at a time of championed scrutiny for ML work. Direct Preference Optimization (DPO) cleverly bypasses reward modeling by making an explicit link with a specific normative model of human choice. Our paper elevates this connection to the full generality of DPO's normative framework. Getting there requires reworking social choice theory's textbook path for a better RLHF/ML fit. It elevates the connection to a remarkably broad viewpoint on preference optimization, considering the current panorama of DPO follow-ups. It also unveils unexpected riches for ML, chief among which the support for non-convex losses, the fact that any compliant ML analytical choice can be embedded with any human choice model, and a normative framework's umbrella wide enough to safeguard DPO's extensions (margins, length correction, ...). A toy experiment ``far away'' from the DPO crowd is given.", "authors": "Wenxuan Zhou, Shujian Zhang, brice magdalou, John Lambert, Ehsan Amid, Richard Nock, Andrew Hard", "icml_url": "https://icml.cc/virtual/2026/poster/62171", "is_oral": true, "is_spotlight": true, "poster_id": "62171", "presentation_type": "oral", "related_events": "Oral presentation: Oral 4F Learning Theory", "title": "DPO Unchained: Your Training Algorithm is Secretly Disentangled in Human Choice Theory (and Its Loss' Convexity is Dispensable)", "sequence": 1698, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 334, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 334, "selection_score": 424, "matched_terms": "rlhf, preference optimization, dpo, reward model, reward modeling", "selection_reasons": "oral", "icml_time": "Wed, Jul 8, 2026 • 1:00 AM – 2:45 AM PDT", "kst_start": "Wed, Jul 8, 2026 17:00 KST", "timezone_from_page": "PDT", "date_label": "Wed, Jul 8", "time_sort_key": "2026-07-08T01:00:00-07:00", "location": "HALL A #4618", "poster_number": 4618, "poster_band": "#4000-#4999"}]}, {"slot": "2026-07-08T18:30:00-07:00", "label": "Thu, Jul 9, 2026 10:30 KST", "icmlTime": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "count": 39, "rows": [{"abstract": "Agents that can reason and plan in the real world must be able to predict the consequences of their actions. World models possess this capability but require action annotations that can be complex to obtain at scale. Latent action models address this issue by learning an action space from videos alone. Our work studies the training of latent action world models on in-the-wild videos, expanding the scope of existing works that focus on simple robotics simulations, video games, or manipulation data. While diverse videos enable modeling richer actions, they introduce challenges of environmental noise and lack of a common embodiment across videos. To address these, we carefully study the design and evaluation of latent actions. We find that constrained continuous latent actions are better suited for complex in-the-wild videos, compared to vector quantization. For example, actions specific to in-the-wild videos such as humans entering the room, can be modeled and then transferred across videos. However, in the absence of a common embodiment, learned latent actions are localized in space, relative to the camera. Nonetheless, we are able to train a controller that maps known actions to latent ones, allowing us to use latent actions as a universal interface to solve planning tasks on par with action-conditioned baselines.", "authors": "Quentin Garrido, Tushar Nagarajan, Basile Terver, Nicolas Ballas, Yann LeCun, Michael Rabbat", "icml_url": "https://icml.cc/virtual/2026/poster/65056", "is_oral": false, "is_spotlight": false, "poster_id": "65056", "presentation_type": "regular", "related_events": "", "title": "Learning Latent Action World Models In The Wild", "sequence": 4580, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 26, "Multi-agent RL, games & coordination": 44, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 556}, "raw_topic_score": 556, "selection_score": 556, "matched_terms": "robot, robotic, robotics, manipulation, latent action, world model, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #111", "poster_number": 111, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement Learning from Human Feedback (RLHF) has become a cornerstone technique for post-training large language models. While most existing approaches rely on the reverse KL-regularization, recent empirical studies have begun exploring alternative divergences (e.g., forward KL, chi-squared) as regularizers in RLHF. However, a unified theoretical understanding of general $f$-divergence regularization remains under-explored. To fill this gap, this work develops a comprehensive theoretical framework for online RLHF with an $f$-divergence regularized objective. Rather than treating each divergence in isolation, we adopt a holistic perspective across the entire class and propose two algorithms based on distinct sampling principles. The first extends the classical optimism principle with a carefully designed exploration bonus, while the second introduces a new method that exploits the sensitivity of the optimal policy to reward perturbations under $f$-divergence regularization. Theoretical analysis shows that $O(\\log T)$ regret and $O(1/T)$ sub-optimality gap are achievable, establishing provable efficiency of both algorithms and, to the best of our knowledge, the first performance bounds for online RLHF under general $f$-divergence regularization.", "authors": "Di Wu, Chengshuai Shi, Jing Yang, Cong Shen", "icml_url": "https://icml.cc/virtual/2026/poster/63348", "is_oral": false, "is_spotlight": false, "poster_id": "63348", "presentation_type": "regular", "related_events": "", "title": "$f$-Divergence Regularized RLHF: Two Tales of Sampling and Unified Analyses", "sequence": 2873, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 8, "RL & control": 106, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 360, "LLM adaptation & fine-tuning": 66, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 360, "selection_score": 360, "matched_terms": "rlhf, post-training, large language model, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #116", "poster_number": 116, "poster_band": "#0000-#0999"}, {"abstract": "Learning stationary policies in infinite-horizon general-sum Markov games (MGs) remains a fundamental open problem in Multi-Agent Reinforcement Learning (MARL). While stationary strategies are preferred for their practicality, computing stationary forms of classic game-theoretic equilibria is computationally intractable—a stark contrast to the comparative ease of solving single-agent RL or zero-sum games. To bridge this gap, we study Risk-averse Quantal response Equilibria (RQE), a solution concept rooted in behavioral game theory that incorporates risk aversion and bounded rationality. We demonstrate that RQE possesses strong regularity conditions that make it uniquely amenable to learning in MGs. We propose a novel two-timescale Actor-Critic algorithm characterized by a fast-timescale actor and a slow-timescale critic. Leveraging the regularity of RQE, we prove that this approach achieves global convergence with finite-sample guarantees. We empirically validate our algorithm in several environments to demonstrate superior convergence properties compared to risk-neutral baselines.", "authors": "Yizhou Zhang, Eric Mazumdar", "icml_url": "https://icml.cc/virtual/2026/poster/64418", "is_oral": false, "is_spotlight": true, "poster_id": "64418", "presentation_type": "spotlight", "related_events": "", "title": "Provably Convergent Actor-Critic in Risk-averse MARL", "sequence": 3942, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 110, "Multi-agent RL, games & coordination": 476, "LLM post-training, RLHF & agents": 64, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 476, "selection_score": 521, "matched_terms": "multi-agent reinforcement learning, marl, multi-agent, game, games", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #118", "poster_number": 118, "poster_band": "#0000-#0999"}, {"abstract": "Reverse Kullback–Leibler (KL) divergence-based regularization with respect to a fixed reference policy is widely used in modern reinforcement learning to preserve the desired traits of the reference policy and sometimes to promote exploration (using uniform reference policy, known as entropy regularization). Beyond serving as a mere anchor, the reference policy can also be interpreted as encoding prior knowledge about good actions in the environment. In the context of alignment, recent game-theoretic approaches have leveraged KL regularization with pretrained language models as reference policies, achieving notable empirical success in self-play methods. Despite these advances, the theoretical benefits of KL regularization in game-theoretic settings remain poorly understood. In this work, we develop and analyze algorithms that provably achieve improved sample efficiency under KL regularization. We study both two-player zero-sum Matrix games and Markov games: for Matrix games, we propose OMG, an algorithm based on best response sampling with optimistic bonuses, and extend this idea to Markov games through the algorithm SOMG, which also uses best response sampling and a novel concept of superoptimistic bonuses. Both algorithms achieve a logarithmic regret in $T$ that scales inversely with the KL regularization strength $\\beta$  in addition to the traditional $\\widetilde{\\mathcal{O}}(\\sqrt{T})$ regret without the $\\beta^{-1}$ dependence.", "authors": "Anupam Nayak, Tong Yang, Osman Yagan, Gauri Joshi, Yuejie Chi", "icml_url": "https://icml.cc/virtual/2026/poster/65122", "is_oral": false, "is_spotlight": false, "poster_id": "65122", "presentation_type": "regular", "related_events": "", "title": "Achieving Logarithmic Regret in KL-Regularized Zero-Sum Markov Games", "sequence": 4646, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 40, "RL & control": 82, "Multi-agent RL, games & coordination": 352, "LLM post-training, RLHF & agents": 32, "LLM adaptation & fine-tuning": 50, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 352, "selection_score": 352, "matched_terms": "game, games", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #119", "poster_number": 119, "poster_band": "#0000-#0999"}, {"abstract": "Offline Reinforcement Learning (RL) relies on static datasets and often enforces conservative constraints to mitigate out-of-distribution errors, but this inevitably gives rise to learning dataset biases and limited behavioral generalization. Recent Data Augmentation (DA) methods leverage generative models to enrich offline data, yet they mainly operate within a single rollout paradigm and tend to preserve the original trajectory-level connectivity of the dataset. As a result, such methods often introduce local variations and fail to recover connections between distinct behavior patterns. In this paper, we propose Bidirectional Trajectory Diffusion (BiTrajDiff), a novel DA framework that explicitly addresses this limitation. BiTrajDiff decomposes trajectory synthesis into two independent diffusion processes that generate forward-future and backward-history segments conditioned on shared intermediate anchor states. By stitching the generated segments at these anchors, BiTrajDiff can synthesize trajectories that bridge disconnected behavior patterns and recover global trajectory-level connectivity absent from the original data. Extensive experiments on the D4RL benchmark demonstrate that BiTrajDiff consistently outperforms advanced DA methods across a range of offline RL backbones.", "authors": "Yunpeng Qing, Yixiao Chi, Shuo Chen, Shunyu Liu, Kexuan Zhou, Sixu Lin, Litao Liu, Changqing Zou", "icml_url": "https://icml.cc/virtual/2026/poster/63499", "is_oral": false, "is_spotlight": false, "poster_id": "63499", "presentation_type": "regular", "related_events": "", "title": "BiTrajDiff: Bidirectional Trajectory Generation with Diffusion Models for Offline Reinforcement Learning", "sequence": 3024, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 260, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 152}, "raw_topic_score": 260, "selection_score": 260, "matched_terms": "reinforcement learning, offline rl, offline reinforcement", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #202", "poster_number": 202, "poster_band": "#0000-#0999"}, {"abstract": "Reinforcement learning often produces high-frequency oscillatory control signals that undermine the safety and stability required for physical deployment. Explicit action chunking addresses this by predicting fixed-horizon trajectories but increases the policy output dimension to R^hd, leading to optimization difficulties and incompatibility with standard step-wise interaction. To overcome these challenges, this paper proposes Dual-Window Smoothing (DWS), an implicit action chunking framework for smooth continuous control. Unlike explicit methods, DWS enforces temporal coherence without expanding the action space. It uses a dual-window design: an execution window that ensures physical smoothness through deterministic modulation, and a value window that aligns temporal-difference targets over the horizon to correct critic bias caused by open-loop execution. DWS also includes a lightweight actor-side temporal regularizer based on first-order action differences to promote global continuity. This design effectively bridges the gap between temporal abstraction and reactive step-wise control. Experiments on benchmarks including the DeepMind Control Suite and industrial energy management tasks with vector states show that DWS outperforms state-of-the-art (SOTA) baselines such as LipsNet++ and SmODE. In complex vision-based autonomous driving tasks, DWS achieves smoother control, safer behavior with reduced jitter, and attains a 100% success rate.", "authors": "Bosun Liang, Shuo Pei, Zirui Chen, Chuanzhi Fan, Chen Sun, Yuankai Wu, Huachun Tan, Yong Wang", "icml_url": "https://icml.cc/virtual/2026/poster/62846", "is_oral": false, "is_spotlight": false, "poster_id": "62846", "presentation_type": "regular", "related_events": "", "title": "Implicit Action Chunking for Smooth Continuous Control", "sequence": 2372, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 246, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 96}, "raw_topic_score": 246, "selection_score": 246, "matched_terms": "reinforcement learning, continuous control, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #210", "poster_number": 210, "poster_band": "#0000-#0999"}, {"abstract": "Post-training LLMs with RLHF and preference optimization methods (e.g., DPO, IPO) has greatly improved alignment, yet these approaches assume a single objective. In reality, humans express multiple, often conflicting objectives, such as helpfulness and harmlessness, with no natural scalarization. We study the multi-objective preference alignment problem, where a policy must balance several objectives simultaneously. We propose Multi-Objective Preference Optimization (MOPO), a constrained KL-regularized framework that maximizes a primary objective while enforcing lower bounds on secondary objectives via tunable safety thresholds. MOPO operates directly on pairwise preferences without point-wise rewards, and admits simple closed-form iterative updates. Empirically, MOPO recovers Pareto-optimal policies on synthetic benchmarks and, when fine-tuned on human-preference data, yields multi-billion parameter models that achieve higher rewards and Pareto-dominate baselines, with stable and robust optimization dynamics.", "authors": "Akhil Agnihotri, Rahul Jain, Deepak Ramachandran, Zheng Wen", "icml_url": "https://icml.cc/virtual/2026/poster/65773", "is_oral": false, "is_spotlight": false, "poster_id": "65773", "presentation_type": "regular", "related_events": "", "title": "Multi-Objective Preference Optimization: Improving Human Alignment of Generative Models", "sequence": 5296, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 384, "LLM adaptation & fine-tuning": 14, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 384, "selection_score": 384, "matched_terms": "rlhf, preference optimization, dpo, post-training, alignment, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #212", "poster_number": 212, "poster_band": "#0000-#0999"}, {"abstract": "Masked discrete diffusion models have improved steadily, but still lag behind autoregressive (AR) models in quality, require fixed-length generation, and cannot exploit key-value (KV) caching. Block Diffusion partially bridges diffusion and AR by unmasking left-to-right token blocks, but sacrifices infilling flexibility and KV caching within blocks. Our key insight is that interpolating generation orderings between autoregression and fully-random decoding, rather than committing to a fixed block length, offers a better interpolation between diffusion and AR. We present a new class of language models, Set Diffusion, comprised of 1) a tighter likelihood bound induced by an order-informed noise process and 2) a causal diffusion architecture that enables KV caching under stochastic token orderings. We bias the noise process toward left-to-right generation, rather than enforcing a strict block factorization, such that tokens can be decoded in sliding-window sets for faster inference and greater flexibility for any-order decoding. Set Diffusion achieves better speed-quality tradeoffs on mathematical reasoning, summarization, and unconditional generation compared to prior diffusion language models while offering stronger infilling performance than Block Diffusion.", "authors": "Marianne Arriola, Volodymyr Kuleshov", "icml_url": "https://icml.cc/virtual/2026/poster/61135", "is_oral": false, "is_spotlight": false, "poster_id": "61135", "presentation_type": "regular", "related_events": "", "title": "Set Diffusion: Interpolating Token Orderings between Autoregression and Diffusion for Fast and Flexible Decoding", "sequence": 663, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 34, "LLM adaptation & fine-tuning": 24, "Robotics, VLA & diffusion policy": 120}, "raw_topic_score": 120, "selection_score": 120, "matched_terms": "diffusion", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #303", "poster_number": 303, "poster_band": "#0000-#0999"}, {"abstract": "Non-stationary time series forecasting is challenged by evolving distribution shifts that static models struggle to capture. While Mixture-of-Experts (MoE) architectures offer a promising paradigm for decoupling complex drift patterns, existing approaches are limited by fixed expert pools and memoryless routing, hampering their ability to adapt to abrupt regime shifts. To address this, we propose Dynamic TMoE , a framework that unifies architectural evolution with temporal continuity during learning phase. By detecting distribution shifts via Maximum Mean Discrepancy (MMD), we dynamically instantiate heterogeneous experts and prune redundant ones to optimize capacity. Additionally, a temporal memory router leverages recurrent states and an anomaly repository to ensure stable, context-aware expert selection without requiring test-time updates. Experiments on nine benchmarks demonstrate state-of-the-art performance, reducing MSE by 10.4\\% and MAE by 7.8\\%. Code is available at https://anonymous.4open.science/r/Dynamic-TMoE.", "authors": "Jiawen Zhu, Shuhan Liu, Di Weng, Yingcai Wu", "icml_url": "https://icml.cc/virtual/2026/poster/64808", "is_oral": false, "is_spotlight": false, "poster_id": "64808", "presentation_type": "regular", "related_events": "", "title": "Dynamic TMoE: A Drift-Aware Dynamic Mixture of Experts Framework for Non-Stationary Time Series Forecasting", "sequence": 4332, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 160, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 8, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 160, "selection_score": 160, "matched_terms": "non-stationary, distribution shift", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #504", "poster_number": 504, "poster_band": "#0000-#0999"}, {"abstract": "Proactive Recommender Systems (PRSs) aim to guide user preference shift toward target items by generating paths of intermediate recommendations. Reinforcement learning (RL) provides a principled framework for optimizing such sequential decision tasks. Based on path rewards, RL can naturally jointly optimize short-term acceptance and long-term guidance effectiveness. However, naively applying policy gradients to PRS results in deficient gradient estimation. It has been observed that length-dependent bias causes gradients to favor path extension over deeper exploration, while weighting each step by path-level reward leads to high gradient variance. To rectify these two deficiencies, we propose an effective RL framework $\\textbf{ProRL}$ with two novel mechanisms for proactive recommendation. First, Stepwise Reward Centering subtracts expected rewards to neutralize length-dependent bias, ensuring that path extension yields zero expected gradient signal. Second, Position-Specific Advantage Estimation leverages the reward decomposition structure to compute step-dependent baselines, reducing gradient variance. Together, these mechanisms yield policy gradients that precisely target path quality. Our experiments on three real-world datasets demonstrate that ProRL significantly outperforms state-of-the-art PRSs. Our codes are available at https://anonymous.4open.science/r/ProRL-D56DHM.", "authors": "Hongru Hou, Tiehua Mei, Denghui Geng, Jinhui Huang, Ao Xu, Hengrui Chen, Jiaqing Liang, Deqing Yang", "icml_url": "https://icml.cc/virtual/2026/poster/61903", "is_oral": false, "is_spotlight": false, "poster_id": "61903", "presentation_type": "regular", "related_events": "", "title": "ProRL: Effective Reinforcement Learning for Proactive Recommendation via Rectified Policy Gradient Estimation", "sequence": 1430, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 232, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 100, "LLM adaptation & fine-tuning": 38, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 232, "selection_score": 232, "matched_terms": "reinforcement learning, policy gradient, exploration", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1004", "poster_number": 1004, "poster_band": "#1000-#1999"}, {"abstract": "Multi-Agent Reinforcement Learning (MARL) has been widely applied to automated aircraft conflict resolution due to its strong capability for cooperative control and distributed decision-making. However, existing approaches typically assume a fixed number of aircraft and neglect the unique characteristics of air traffic control instructions. This structural misalignment between model architectures and domain requirements leads to severe deficiencies in perception scalability and action stability across scenarios of varying scales. To address these challenges, we propose Structural-Aligned Reinforcement Learning (SARL), which aims to bridge the gap between perception and action. First, the Physically Encoded Relational Graph (PERG) effectively resolves the fixed input dimensionality issue by incorporating physical inductive biases into a graph attention mechanism. Second, we design the Sparse Cognitive Mixture-of-Experts (SC-MoE) to enhance decision stability. In addition, we introduce a Kinematic Kafety Shield (KSS) based on aviation rules, which not only improves inference-time safety but also effectively guides the model to generate semantically meaningful actions that comply with aviation standards. Simulation experiment results demonstrate that SARL significantly outperforms existing reinforcement learning baselines across diverse scenarios in terms of both success rate and operational efficiency.", "authors": "Binhao Gu, jinjun cai, Weihuang Zheng, Jiaxing Li, Hui Ding, Youyong Kong", "icml_url": "https://icml.cc/virtual/2026/poster/62482", "is_oral": false, "is_spotlight": false, "poster_id": "62482", "presentation_type": "regular", "related_events": "", "title": "SARL: Structure-Aligned Reinforcement Learning for Bridging the Perception-Action Gap in Airspace", "sequence": 2009, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 208, "Multi-agent RL, games & coordination": 194, "LLM post-training, RLHF & agents": 98, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 24}, "raw_topic_score": 208, "selection_score": 208, "matched_terms": "reinforcement learning, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1006", "poster_number": 1006, "poster_band": "#1000-#1999"}, {"abstract": "We dream of a future where point clouds from all domains can come together to shape a single model that benefits them all. Toward this goal, we present Utonia, a first step toward training a single self-supervised point transformer encoder across heterogeneous domains, spanning remote sensing, outdoor LiDAR, indoor RGB-D sequences, object-centric CAD models, and point clouds lifted from RGB-only videos. Despite their distinct sensing geometries, densities, and priors, Utonia learns a consistent representation space that transfers across domains. This unification improves perception capability while revealing intriguing emergent behaviors that arise only when domains are trained jointly. Beyond perception, we observe that Utonia representations can also benefit embodied and multimodal reasoning: conditioning vision-language-action policies on Utonia features improves robotic manipulation, and integrating them into vision-language models yields gains on spatial reasoning. We hope Utonia can serve as a step toward foundation models for sparse 3D data, and support downstream applications in AR/VR, robotics, and autonomous driving.", "authors": "Yujia Zhang, Xiaoyang Wu, Yunhan Yang, Xianzhe Fan, Han Li, Yuechen Zhang, Zehao Huang, Naiyan Wang, Hengshuang Zhao", "icml_url": "https://icml.cc/virtual/2026/poster/62613", "is_oral": false, "is_spotlight": false, "poster_id": "62613", "presentation_type": "regular", "related_events": "", "title": "Utonia: Toward One Encoder for All Point Clouds", "sequence": 2139, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 32, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 264}, "raw_topic_score": 264, "selection_score": 264, "matched_terms": "vision-language-action, robot, robotic, robotics, embodied, manipulation", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1112", "poster_number": 1112, "poster_band": "#1000-#1999"}, {"abstract": "Vision-Language-Action (VLA) models have shown strong potential for robotic manipulation, yet adapting pretrained models to novel tasks typically relies on substantial task-specific demonstrations, limiting scalability.   Current VLA methods mostly focus on action imitation, which ignores the richer structure contained in trajectories. In contrast, motion dynamics governing how actions evolve over time are more informative and transferable, making them better suited for few-shot adaptation.   Motivated by this idea, we propose DynVLA, a few-shot adaptation system that reformulates VLA learning from action imitation to trajectory-level motion dynamics modeling.   Specifically, we propose Motion Dynamics Mechanism (MDM), which distills latent physical regimes from trajectories via flow-matching inversion, yielding compact representations that capture dynamics.   We further design Dynamics-Constrained Modeling (DCM). DCM projects these inferred representations onto a Dynamics Bank, which stores prior motion knowledge pretrained from diverse demonstrations. By grounding action generation in these learned priors, the system enables interpolating between existing action paradigms to represent novel dynamics modes.   Experiments on 13 real-world tasks demonstrate that DynVLA outperforms existing SOTA systems by 19\\% in average success rate with only 10-20 demonstrations, highlighting its adaptation capabilities in real-world scenes.", "authors": "Sibo He, Weiying Xie, Daixun Li, Junhao Zhong, Jiayun Tian, Yunke Wang, Leyuan Fang, Gang He, Yunsong Li", "icml_url": "https://icml.cc/virtual/2026/poster/65344", "is_oral": false, "is_spotlight": false, "poster_id": "65344", "presentation_type": "regular", "related_events": "", "title": "Motion Dynamics Learning for Few-Shot Embodied Adaptation", "sequence": 4868, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 56, "Robotics, VLA & diffusion policy": 428}, "raw_topic_score": 428, "selection_score": 428, "matched_terms": "vision-language-action, vla, robot, robotic, embodied, manipulation, trajectory", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1301", "poster_number": 1301, "poster_band": "#1000-#1999"}, {"abstract": "Continuous prediction in complex environments is critical for Unmanned Aerial Vehicle (UAV). However, the existing Vision-Language Navigation (VLN) models follows the dead-reckoning, which iteratively predicts the next waypoint and updates its position, thereby constructing the complete trajectory. Then, such stepwise manner will inevitably lead to accumulated errors of position over time, resulting in misalignment between internal belief and objective coordinates, which is known as ``state drift'' and ultimately compromises the subsequent trajectory prediction. Drawing inspiration from classical control theory, we propose to correct for errors by formulating the continuous prediction as a recursive Bayesian state estimation problem. In this paper, we design NeuroKalman, a novel framework that decouples navigation into two complementary processes: a Prior Prediction, based on motion dynamic,s and a Likelihood Correction, from historical observation. We first mathematically associate Kernel Density Estimation of the measurement likelihood with the attention-based retrieval mechanism, which then allows the system to rectify the latent representation using retrieved historical anchors without gradient updates. Comprehensive experiments on TravelUAV benchmark demonstrate that, with only 10\\% of the full training data fine-tuning, our method clearly outperforms strong baselines and regulates drift accumulation.", "authors": "Yin Tang, Jiawei Ma, Jinrui Zhang, Alex Jinpeng Wang, Deyu Zhang", "icml_url": "https://icml.cc/virtual/2026/poster/63906", "is_oral": false, "is_spotlight": false, "poster_id": "63906", "presentation_type": "regular", "related_events": "", "title": "Mitigating Error Accumulation in Continuous Navigation via Memory-Augmented Kalman Filtering", "sequence": 3431, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 20, "LLM adaptation & fine-tuning": 34, "Robotics, VLA & diffusion policy": 144}, "raw_topic_score": 144, "selection_score": 144, "matched_terms": "navigation, trajectory, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1302", "poster_number": 1302, "poster_band": "#1000-#1999"}, {"abstract": "We argue that long-term forecasting requires learning local Jacobians with explicit spectral structure, going beyond simple conditional mean matching. Our method, \\textsc{Fern}, invokes Brenier's theorem to directly parameterize the Jacobian as a symmetric positive semi-definite (SPD) factorization, treating forecasting as the optimal transport of probability mass from a fixed Gaussian source to data-dependent ellipsoids. This formulation reduces the computational cost of eigen-decomposition from cubic to linear time while providing interpretable, geometry-aware projections. To rigorously evaluate robustness, we introduce a synthetic benchmark with controlled non-stationary shocks alongside new metrics like Effective Prediction Time (EPT). \\textsc{Fern} demonstrates exceptional stability, outperforming baselines like DLinear and Koopa by over two orders of magnitude (up to $790\\times$) on nonstationary settings where standard benchmarks fail to expose model brittleness.", "authors": "Qilin Wang", "icml_url": "https://icml.cc/virtual/2026/poster/65519", "is_oral": false, "is_spotlight": false, "poster_id": "65519", "presentation_type": "regular", "related_events": "", "title": "Ellipsoidal Time Series Forecasting", "sequence": 5043, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 64, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 64, "selection_score": 64, "matched_terms": "non-stationary, nonstationary", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1402", "poster_number": 1402, "poster_band": "#1000-#1999"}, {"abstract": "The natural world is richly structured over space and time. Much of this structure arises from the interplay between spatial geometry and motion. However, most existing world models ignore this structure, leading to an inability to generalize in dynamic environments. In this work, we show that enforcing equivariance between an agent's representations and the world's dynamics necessarily induces an efficient, structured memory. Concretely, we introduce Flow Equivariant World Modeling, a framework in which both self-motion and external object motion are unified as one-parameter Lie-group ``flows'' acting on a latent world memory; and models are built to be equivariant with respect to these transformations. On 2D and 3D partially observed video world modeling benchmarks, we demonstrate that Flow Equivariant World Models significantly outperform comparable state-of-the-art diffusion-based and memory-augmented world modeling architectures in their ability to track and predict the locations of moving objects over long horizons. Project page: https://anonflowm.github.io/", "authors": "Hansen Lillemark, Benhao Huang, Fangneng Zhan, Yilun Du, T. Anderson Keller", "icml_url": "https://icml.cc/virtual/2026/poster/62119", "is_oral": false, "is_spotlight": false, "poster_id": "62119", "presentation_type": "regular", "related_events": "", "title": "Flow Equivariant World Models: Structured Memory for Dynamic Environments", "sequence": 1646, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 10, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 184}, "raw_topic_score": 184, "selection_score": 184, "matched_terms": "world model, diffusion", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1814", "poster_number": 1814, "poster_band": "#1000-#1999"}, {"abstract": "Recent progress in multi-turn reinforcement learning (RL) has significantly improved reasoning LLMs' performances on complex interactive tasks.  Despite advances in stabilization techniques such as fine-grained credit assignment and trajectory filtering, instability remains pervasive and often leads to training collapse. We argue that this instability stems from inefficient exploration in multi-turn settings, where policies continue to generate low-information actions that neither reduce uncertainty nor advance task progress. To address this issue, we propose Token- and Turn-level Policy Optimization (T$^2$PO), an uncertainty-aware framework that explicitly controls exploration at fine-grained levels. At the token level, T$^2$PO monitors uncertainty dynamics and triggers a thinking intervention once  the marginal uncertainty change falls below a threshold.  At the turn level, T$^2$PO identifies interactions with negligible exploration progress and dynamically resamples such turns to avoid wasted rollouts.  We evaluate T$^2$PO in diverse environments, including WebShop, ALFWorld, and Search QA, demonstrating substantial gains in training stability and performance improvements with better exploration efficiency. Code is available at https://anonymous.4open.science/r/T2PO-ICML-3C21.", "authors": "Haixin Wang, Hejie Cui, Chenwei Zhang, Xin Liu, Shuowei Jin, Shijie Geng, Xinyang Zhang, Nasser Zalmout, Zhenyu Shi, Yizhou Sun", "icml_url": "https://icml.cc/virtual/2026/poster/63090", "is_oral": false, "is_spotlight": true, "poster_id": "63090", "presentation_type": "spotlight", "related_events": "", "title": "T$^2$PO: Uncertainty-Guided Exploration Control for Stable Multi-Turn Agentic Reinforcement Learning", "sequence": 2615, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 282, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 54, "LLM adaptation & fine-tuning": 280, "Robotics, VLA & diffusion policy": 64}, "raw_topic_score": 282, "selection_score": 327, "matched_terms": "reinforcement learning, policy optimization, control, exploration", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #1905", "poster_number": 1905, "poster_band": "#1000-#1999"}, {"abstract": "Given the recent rapid progress of LLM agents like Claude Code or Codex CLI for software engineering, an important next question is whether they can automate AI research itself. In this paper, we study post-training , which is the critical step that turns base LLMs into useful assistants. We introduce PostTrainBench to benchmark how well LLM agents can perform post-training autonomously under bounded compute constraints (10 hours on one H100 GPU). We task frontier agents (e.g., Claude Code with Opus 4.5) to optimize the performance of a base LLM on a particular benchmark (e.g., Qwen3-4B on AIME). Importantly, we do not provide any predefined strategies to the agents and instead give them full autonomy to find necessary information on the web, run experiments, and curate data. We find that frontier agents make substantial progress but generally lag behind instruction-tuned LLMs from leading providers: 21.5% for the best agent vs. 51.1% for official instruction-tuned models. However, agents can exceed instruction-tuned models in targeted scenarios: GPT-5.1 Codex Max achieves 89% on BFCL with Gemma-3-4B vs. 67% for the official model. Additionally, we document concerning behaviors related to reward hacking, such as training on test data or downloading pre-existing instruction-tuned models, and unauthorized usage of API keys for synthetic data generation. Overall, we expect PostTrainBench to serve as an important benchmark for tracking both capabilities and risks of AI R&D automation.", "authors": "Ben Rank, Hardik Bhatnagar, Ameya Pandurang Prabhu, Shira Eisenberg, Karina Nguyen, Matthias Bethge, Maksym Andriushchenko", "icml_url": "https://icml.cc/virtual/2026/poster/63667", "is_oral": false, "is_spotlight": false, "poster_id": "63667", "presentation_type": "regular", "related_events": "", "title": "PostTrainBench: Can LLM Agents Automate LLM Post-Training?", "sequence": 3192, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 524, "LLM adaptation & fine-tuning": 154, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 524, "selection_score": 524, "matched_terms": "post-training, llm, agent, agents", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2007", "poster_number": 2007, "poster_band": "#2000-#2999"}, {"abstract": "The emergence of large language model (LLM)-based agents has significantly advanced the development of autonomous machine learning (ML) engineering. However, the dominant prompt-based paradigm exhibits limitations: smaller models lack the capacity to learn from execution trajectories for generalization, while large proprietary models incur high computational overhead, restricting accessibility and scalability. Focusing on this, for the first time, we explore the paradigm of learning-based agentic ML, where an LLM agent learns through interactive experimentation on ML tasks using online reinforcement learning (RL). To realize this, we propose a novel agentic ML training framework with three key components: (1) exploration-enriched fine-tuning, which enables LLM agents to generate diverse actions for enhanced RL exploration; (2) step-wise RL, which enables training on a single action step, accelerating experience collection and improving training efficiency; (3) an agentic ML-specific reward module, which unifies varied ML feedback signals into consistent rewards for RL optimization. Leveraging this framework, we train ML-Agent, driven by a 7B-sized Qwen-2.5 LLM for autonomous ML. Despite training on only 9 ML tasks, our 7B-sized ML-Agent achieves comparable performance to agents using much larger proprietary LLMs (e.g., GPT-5) but at significantly lower computational cost, demonstrating strong performance and cross-task generalization.", "authors": "Zexi Liu, Jingyi Chai, Xinyu Zhu, shuo tang, Rui Ye, Weiyu Ma, Bo Zhang, LEI BAI, Siheng Chen", "icml_url": "https://icml.cc/virtual/2026/poster/62020", "is_oral": false, "is_spotlight": false, "poster_id": "62020", "presentation_type": "regular", "related_events": "", "title": "ML-Agent: Reinforcing LLM Agents for Autonomous Machine Learning Engineering", "sequence": 1547, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 54, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 352, "LLM adaptation & fine-tuning": 250, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 352, "selection_score": 352, "matched_terms": "large language model, llm, language model, agent, agents", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2102", "poster_number": 2102, "poster_band": "#2000-#2999"}, {"abstract": "Multi-agent systems (MAS) extend large language models (LLMs) from independent single-model reasoning to coordinative system-level intelligence. While existing LLM agents depend on text-based mediation for reasoning and communication, we take a step forward by enabling models to collaborate directly within the continuous latent space. We introduce LatentMAS, an end-to-end training-free framework that enables pure latent collaboration among LLM agents. In LatentMAS, each agent first performs auto-regressive latent thoughts generation through last-layer hidden embeddings instead of text. Then, a shared latent working memory preserves and transfers each agent's internal representations and latent thoughts, ensuring lossless information exchange without re-encoding. We provide detailed theoretical analyses showing that LatentMAS achieves higher expressiveness and lossless information preservation with lower overall complexity than standard text-based MAS. In addition, empirical evaluations across 9 comprehensive benchmarks spanning math and science reasoning, commonsense understanding, and code generation show that LatentMAS outperforms advanced single agents and text-based MAS baselines, achieving up to 14.6\\% higher accuracy, reducing output token usage by 70.8\\%-83.7\\%, and providing 4$\\times$-4.3$\\times$ faster end-to-end inference. These results demonstrate that our new latent collaboration framework enhances system-level reasoning quality while providing consistent efficiency gains.", "authors": "Jiaru Zou, Xiyuan Yang, Ruizhong Qiu, Gaotang Li, Katherine Tieu, Pan Lu, Ke Shen, Hanghang Tong, Yejin Choi, Jingrui He, James Zou, Mengdi Wang, Ling Yang", "icml_url": "https://icml.cc/virtual/2026/poster/61180", "is_oral": false, "is_spotlight": true, "poster_id": "61180", "presentation_type": "spotlight", "related_events": "", "title": "Latent Collaboration in Multi-Agent Systems", "sequence": 708, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 308, "LLM post-training, RLHF & agents": 232, "LLM adaptation & fine-tuning": 70, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 308, "selection_score": 353, "matched_terms": "multi-agent, collaboration", "selection_reasons": "spotlight", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2105", "poster_number": 2105, "poster_band": "#2000-#2999"}, {"abstract": "Standard reward models typically predict scalar scores that fail to capture the multifaceted nature of response quality in non-verifiable domains, such as creative writing or open-ended instruction following. To address this limitation, we propose Rubric-ARM, a framework that jointly optimizes a rubric generator and a judge using reinforcement learning from preference feedback. Unlike existing methods that rely on static rubrics or disjoint training pipelines, our approach treats rubric generation as a latent action learned to maximize judgment accuracy. We introduce an alternating optimization strategy to mitigate the non-stationarity of simultaneous updates, providing theoretical analysis that demonstrates how this schedule reduces gradient variance during training. Extensive experiments show that Rubric-ARM achieves state-of-the-art performance among baselines on multiple benchmarks and significantly improves downstream policy alignment in both offline and online reinforcement learning settings.", "authors": "Ran Xu, Tianci Liu, Zihan Dong, Tony Yu, Ilgee Hong, Carl Yang, Linjun Zhang, Tuo Zhao, Haoyu Wang", "icml_url": "https://icml.cc/virtual/2026/poster/66465", "is_oral": false, "is_spotlight": false, "poster_id": "66465", "presentation_type": "regular", "related_events": "", "title": "Alternating Reinforcement Learning for Rubric-Based Reward Modeling in Non-Verifiable LLM Post-Training", "sequence": 5985, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 150, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 338, "LLM adaptation & fine-tuning": 42, "Robotics, VLA & diffusion policy": 34}, "raw_topic_score": 338, "selection_score": 338, "matched_terms": "post-training, reward model, reward modeling, alignment, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2312", "poster_number": 2312, "poster_band": "#2000-#2999"}, {"abstract": "Generative posterior sampling using diffusion models has emerged as a dominant paradigm for solving inverse problems in imaging, which usually consists of three main components: data consistency (DC) guidance, classifier-free guidance (CFG) and stochasticity. While prior arts have focused on how to develop each or all components, less attention has given to how to schedule them, leading to heuristically fixed or partially adjusted suboptimal schedules. In this work, we argue that the interactions among all three components in terms of scheduling are crucial for significantly improved performance in solving inverse problems in imaging. Our analysis shows that aggressive CFG early in sampling conflict with DC guidance, while stochasticity brings the trajectory back to higher-probability regions. Based on these findings, we propose Triadic Dynamics Aware Posterior Sampling (TriPS), which reformulates posterior sampling as a time-varying control problem and optimizes schedules following a triadic trend of decreasing DC and stochasticity scales alongside increasing CFG scale. TriPS achieves this through two strategies: template-based search over functional priors for reliable baseline schedules, and Group Relative Policy Optimization (GRPO)-based reinforcement learning for more flexible temporal curves. Experiments demonstrate TriPS outperforms state-of-the-art baselines in data fidelity and perceptual realism.", "authors": "Junseo Bang, Dong Ju Mun, Hoigi Seo, Seongmin Hong, Se Young Chun", "icml_url": "https://icml.cc/virtual/2026/poster/64566", "is_oral": false, "is_spotlight": false, "poster_id": "64566", "presentation_type": "regular", "related_events": "", "title": "Triadic Dynamics Aware Diffusion Posterior Sampling for Inverse Problems: Optimizing Guidance and Stochasticity Schedules", "sequence": 4090, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 210, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 26, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 60}, "raw_topic_score": 210, "selection_score": 210, "matched_terms": "reinforcement learning, policy optimization, posterior sampling, control", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2508", "poster_number": 2508, "poster_band": "#2000-#2999"}, {"abstract": "Foundation models have revolutionized AI, but adapting them efficiently for multimodal tasks, particularly in dual-stream architectures composed of unimodal encoders, such as DINO and BERT, remains a significant challenge. Parameter-Efficient Fine-Tuning (PEFT) methods like Low-Rank Adaptation (LoRA) enable lightweight adaptation, yet they operate in isolation within each modality, limiting their ability in capturing cross-modal interactions. In this paper, we take a step in bridging this gap with Cross-Modal Low-Rank Adaptation (CoLA), a novel PEFT framework that extends LoRA by introducing a dedicated inter-modal adaptation pathway alongside the standard intra-modal one. This dual-path design enables CoLA to adapt unimodal foundation models to multimodal tasks effectively, without interference between modality-specific and cross-modal learning. We evaluate CoLA across a range of vision-language (RefCOCO, RefCOCO+, RefCOCOg) and audio-visual (AVE, AVS) benchmarks, where it consistently outperforms LORA, achieving a relative gain of around 3% and 2%, respectively, while maintaining parameter efficiency. Notably, CoLA enables the first multi-task PEFT framework for visual grounding, bridging a key gap in efficient multimodal adaptation.", "authors": "Wish Suharitdamrong, Tony Alex, Muhammad Awais, Sara Atito", "icml_url": "https://icml.cc/virtual/2026/poster/65985", "is_oral": false, "is_spotlight": false, "poster_id": "65985", "presentation_type": "regular", "related_events": "", "title": "CoLA: Cross-Modal Low-rank Adaptation for Multimodal Downstream Tasks", "sequence": 5508, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 520, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 520, "selection_score": 520, "matched_terms": "fine-tuning, parameter-efficient, lora, low-rank adaptation, adapt", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2802", "poster_number": 2802, "poster_band": "#2000-#2999"}, {"abstract": "Mobile Graphical User Interface (GUI) World Models (WMs) offer a promising path for improving mobile GUI agent performance at train- and inference-time. However, current approaches face a critical trade-off: text-based WMs sacrifice visual fidelity, while the inability of visual WMs in precise text rendering led to their reliance on slow, complex pipelines dependent on numerous external models. We propose a novel paradigm: visual world modeling via renderable code generation, where a single Vision-Language Model (VLM) predicts the next GUI state as executable web code that renders to pixels, rather than generating pixels directly. This combines the strengths of both approaches: VLMs retain their linguistic priors for precise text rendering while their pre-training on structured web code enables high-fidelity visual generation. We introduce gWorld (8B, 32B), the first open-weight visual mobile GUI WMs built on this paradigm, along with a data generation framework (gWorld) that automatically synthesizes code-based training data. In extensive evaluation across 4 in- and 2 out-of-distribution benchmarks, gWorld sets a new pareto frontier in accuracy versus model size, outperforming 8 frontier open-weight models over 50.25x larger. Further analyses show that (1) scaling training data via gWorld yields meaningful gains, (2) each component of our pipeline improves data quality, and (3) stronger world modeling improves downstream mobile GUI policy performance.", "authors": "Woosung (Reiss) Koh, Sungjun Han, Segyu Lee, Se-Young Yun, Jay Shin", "icml_url": "https://icml.cc/virtual/2026/poster/63186", "is_oral": false, "is_spotlight": false, "poster_id": "63186", "presentation_type": "regular", "related_events": "", "title": "Generative Visual Code Mobile World Models", "sequence": 2711, "award": "", "primary_topic": "Robotics, VLA & diffusion policy", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 22, "LLM adaptation & fine-tuning": 12, "Robotics, VLA & diffusion policy": 132}, "raw_topic_score": 132, "selection_score": 132, "matched_terms": "world model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #2904", "poster_number": 2904, "poster_band": "#2000-#2999"}, {"abstract": "Calibration aligns a model's predictive uncertainty with the frequencies of its empirical outcomes and is important toward understanding and trusting reported probabilities. Recent work shows that enforcing calibration at the level of individual predictors can substantially improve ensemble performance, with mixture-of-calibrated-experts (MoCE) models showing strong empirical improvements in particular. However, the conditions under which calibration helps MoCE are not well understood. In this work, we study MoCE models from a distributional robustness perspective, focusing on how routing mechanisms interact with expert-level calibration. We show that for hard routing, expert calibration is sufficient to ensure calibration of the overall model under a broad class of distribution shifts but is insufficient for calibrating a soft-routed model. We characterize the conditions that must hold for a soft-routed MoCE to be calibrated, and we discuss how reframing calibration as a distributionally robust objective helps recover robustness guarantees for soft-routed mixtures.", "authors": "Gina Wong, Drew Prinster, Suchi Saria, Rama Chellappa, Anqi Liu", "icml_url": "https://icml.cc/virtual/2026/poster/64664", "is_oral": false, "is_spotlight": false, "poster_id": "64664", "presentation_type": "regular", "related_events": "", "title": "Toward Calibrated Mixture-of-Experts Under Distribution Shift", "sequence": 4188, "award": "", "primary_topic": "Core online learning & bandits", "topic_scores": {"Core online learning & bandits": 64, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 0, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 64, "selection_score": 64, "matched_terms": "distribution shift", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3204", "poster_number": 3204, "poster_band": "#3000-#3999"}, {"abstract": "In many multi-agent systems, agents interact repeatedly and are expected to settle into equilibrium behavior over time. Yet in practice, behavior often drifts, and detecting such deviations in real time remains an open challenge. We introduce a sequential testing framework that monitors whether observed play in repeated games is consistent with equilibrium, without assuming a fixed sample size. Our approach builds on the e-value framework for safe anytime-valid inference: by “betting” against equilibrium, we construct a test supermartingale that accumulates evidence whenever observed payoffs systematically violate equilibrium conditions. This yields a statistically sound, interpretable measure of departure from equilibrium that can be monitored online. We also leverage Benjamini-Hochberg-type procedures to increase detection power in large games while rigorously controlling the false discovery rate. Our framework unifies the treatment of Nash, correlated, and coarse correlated equilibria, offering finite-time guarantees and a detailed analysis of detection times. Moreover, we extend our method to stochastic games, broadening its applicability beyond repeated-play settings.", "authors": "Etienne Gauthier, Francis Bach, Michael Jordan", "icml_url": "https://icml.cc/virtual/2026/poster/62338", "is_oral": false, "is_spotlight": false, "poster_id": "62338", "presentation_type": "regular", "related_events": "", "title": "Betting on Equilibrium: Monitoring Strategic Behavior in Multi-Agent Systems", "sequence": 1865, "award": "", "primary_topic": "Multi-agent RL, games & coordination", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 514, "LLM post-training, RLHF & agents": 60, "LLM adaptation & fine-tuning": 0, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 514, "selection_score": 514, "matched_terms": "multi-agent, game, games, nash, equilibrium", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3210", "poster_number": 3210, "poster_band": "#3000-#3999"}, {"abstract": "Preference alignment is a crucial post-training step for large language models (LLMs) to ensure their outputs align with human values. However, post-training on real human preference data raises privacy concerns, as these datasets often contain sensitive user prompts and human judgments. To address this, we propose DPPrefSyn , a novel algorithm for generating differentially private (DP) synthetic preference data to enable privacy-preserving preference alignment. DPPrefSyn is a principled framework grounded in the Bradley–Terry preference model and the intrinsic geometric structure of pairwise human preference data. It first learns an underlying preference model from private data with formal differential privacy guarantees, and then leverages the learned model together with public prompts to synthesize high-quality preference data. It exploits the shared linear structure of per-cluster reward models to effectively capture heterogeneous human preferences in private datasets, and leverages DP Principal Component Analysis (DP-PCA) to improve learning accuracy. Extensive experimental results demonstrate that DPPrefSyn achieves competitive alignment performance under strong DP guarantees. These findings highlight the potential of synthetic preference data as a practical alternative for privacy-preserving preference alignment across a broad range of applications. To the best of our knowledge, this is the first work to generate DP synthetic preference data for LLM alignment.", "authors": "Fengyu Gao, Jing Yang", "icml_url": "https://icml.cc/virtual/2026/poster/65512", "is_oral": false, "is_spotlight": false, "poster_id": "65512", "presentation_type": "regular", "related_events": "", "title": "Differentially Private Preference Data Synthesis for Large Language Model Alignment", "sequence": 5036, "award": "", "primary_topic": "LLM post-training, RLHF & agents", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 404, "LLM adaptation & fine-tuning": 140, "Robotics, VLA & diffusion policy": 0}, "raw_topic_score": 404, "selection_score": 404, "matched_terms": "post-training, reward model, alignment, large language model, llm, language model", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3301", "poster_number": 3301, "poster_band": "#3000-#3999"}, {"abstract": "Associative memory has long underpinned the design of sequential models. Beyond recall, humans reason by projecting future states and selecting goal-directed actions , a capability that modern language models increasingly require but do not natively encode. While prior work uses reinforcement learning or test-time training, planning remains external to the model architecture. We formulate reasoning as optimal control and introduce the Test-Time Control (TTC) layer, which performs finite-horizon LQR planning over latent states at inference time, enabling planning before prediction . To ensure scalability, we derive a hardware-efficient LQR solver based on a symplectic formulation and implement it as a fused CUDA kernel, enabling parallel execution with minimal overhead.  Integrated as an adapter into pretrained LLMs, TTC layers improve mathematical reasoning performance by up to +27.8 on MATH-500 and 2-3x Pass@8 improvements on AMC and AIME, demonstrating that embedding optimal control as an architectural component provides an effective and scalable mechanism for reasoning beyond test-time training.", "authors": "Peihao Wang, Shan Yang, Xijun Wang, Tesi Xiao, Xin Liu, Changlong Yu, Yu Lou, Pan Li, Zhangyang “Atlas” Wang, Ming Lin, Rene Vidal", "icml_url": "https://icml.cc/virtual/2026/poster/64217", "is_oral": false, "is_spotlight": false, "poster_id": "64217", "presentation_type": "regular", "related_events": "", "title": "Beyond Test-Time Training: Learning to Reason via Hardware-Efficient Optimal Control", "sequence": 3742, "award": "", "primary_topic": "RL & control", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 270, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 56, "LLM adaptation & fine-tuning": 60, "Robotics, VLA & diffusion policy": 72}, "raw_topic_score": 270, "selection_score": 270, "matched_terms": "reinforcement learning, optimal control, control, planning", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3611", "poster_number": 3611, "poster_band": "#3000-#3999"}, {"abstract": "Fine-tuning Large Language Models (LLMs) with Low-Rank Adaptation (LoRA) offers a resource-efficient way to personalize or specialize. However, LoRA is highly sensitive to hyperparameter choices, and performing an exhaustive hyperparameter search remains computationally intensive. To address these challenges, we propose a framework that integrates the domain knowledge of pre-trained LLMs into the Bayesian Optimization (BO) process to efficiently search for LoRA hyperparameters. To leverage pre-trained LLMs' knowledge, our approach repurposes them as a discrete-to-continuous mapping module to link hyperparameters and their domain knowledge to a continuous vector space, where BO is conducted. We design and control the mapping via language prompting, providing a domain-aware textual prompt that describes the relationships among hyperparameters and their respective roles. This allows us to explicitly inject domain knowledge about LoRA into the LLM in natural language. We also introduce an additional learnable token to capture residual information that is difficult to describe linguistically in the prompt. This aids BO to sample more high-performing hyperparameters. In addition, by leveraging the strong correlation observed between the performance obtained from full and subset training datasets in LoRA training regimes, we introduce proxy training and evaluation using a data subset. This significantly improves the efficiency of our method. We demonstrate that our hyperparameter, discovered with only about 30 iterations, achieves more than 20% performance improvement over standard hyperparameters found from about 45,000 combinations. Code will be released.", "authors": "Baek Seong-Eun, Lee Jung-Mok, Kim Sung-Bin, Tae-Hyun Oh", "icml_url": "https://icml.cc/virtual/2026/poster/64828", "is_oral": false, "is_spotlight": false, "poster_id": "64828", "presentation_type": "regular", "related_events": "", "title": "A Language-Guided Bayesian Optimization for Efficient LoRA Hyperparameter Search", "sequence": 4352, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 14, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 86, "LLM adaptation & fine-tuning": 480, "Robotics, VLA & diffusion policy": 12}, "raw_topic_score": 480, "selection_score": 480, "matched_terms": "fine-tuning, lora, low-rank adaptation, adapt, large language model, language model, llm", "selection_reasons": "", "icml_time": "Wed, Jul 8, 2026 • 6:30 PM – 8:15 PM PDT", "kst_start": "Thu, Jul 9, 2026 10:30 KST", "timezone_from_page": "PDT", "date_label": "Thu, Jul 9", "time_sort_key": "2026-07-08T18:30:00-07:00", "location": "HALL A #3808", "poster_number": 3808, "poster_band": "#3000-#3999"}, {"abstract": "Zeroth-Order (ZO) optimization has emerged as a promising solution for fine-tuning LLMs under strict memory constraints, as it avoids the prohibitive memory cost of storing activations for backpropagation. However, existing ZO methods typically employ isotropic perturbations, neglecting the rich structural information available during the forward pass. In this paper, we identify a crucial link between gradient formation and activation structure: the gradient of a linear layer is confined to the subspace spanned by its input activations. Leveraging this insight, we propose Activation-Guided Zeroth-Order optimization (AGZO). Unlike prior methods, AGZO extracts a compact, activation-informed subspace on the fly during the forward pass and restricts perturbations to this low-rank subspace. We provide a theoretical framework showing that AGZO optimizes a subspace-smoothed objective and provably yields update directions with higher cosine similarity to the true gradient than isotropic baselines. Empirically, we evaluate AGZO on Qwen3 and Pangu models across various benchmarks. AGZO consistently outperforms state-of-the-art ZO baselines and significantly narrows the performance gap with first-order fine-tuning, while maintaining almost the same peak memory footprint as other ZO methods.", "authors": "Wei LIN, Yining Jiang, Qingyu Song, Qiao Xiang, Hong Xu", "icml_url": "https://icml.cc/virtual/2026/poster/60499", "is_oral": false, "is_spotlight": false, "poster_id": "60499", "presentation_type": "regular", "related_events": "", "title": "AGZO: Activation-Guided Zeroth-Order Optimization for LLM Fine-Tuning", "sequence": 28, "award": "", "primary_topic": "LLM adaptation & fine-tuning", "topic_scores": {"Core online learning & bandits": 0, "RL & control": 0, "Multi-agent RL, games & coordination": 0, "LLM post-training, RLHF & agents": 56, "LLM adaptation & fine-tuning": 346, "Robotics, VLA
